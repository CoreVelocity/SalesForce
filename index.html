function perfLeaderboard(rows) {
  const c = card('Leaderboard', 'Ranked by the composite score. Click a heading to re-sort — anything without a number sinks to the bottom either way.');
  const key = VIEW.perfSort || 'score';
  const dir = VIEW.perfDir === 'asc' ? 1 : -1;
  const col = PERF_COLS.find(x => x.k === key) || PERF_COLS[2];
  const blank = v => v == null || v === '' || (typeof v === 'number' && !isFinite(v));
  const sorted = rows.slice().sort((a, z) => {
    const av = col.v(a), zv = col.v(z);
    if (blank(av) && blank(zv)) return 0;
    if (blank(av)) return 1;
    if (blank(zv)) return -1;
    return col.txt ? String(av).localeCompare(String(zv)) * dir : (av - zv) * dir;
  });
  const tb = el('table', { class: 'dt' });
  const hr = el('tr');
  PERF_COLS.forEach(x => hr.appendChild(el('th', {
    class: (x.txt ? '' : 'num') + (key === x.k ? ' sorted' : ''),
    style: 'cursor:pointer', text: x.l + (key === x.k ? (dir === 1 ? ' ▲' : ' ▼') : ''),
    onclick: () => { if (VIEW.perfSort === x.k) VIEW.perfDir = VIEW.perfDir === 'asc' ? 'desc' : 'asc';
      else { VIEW.perfSort = x.k; VIEW.perfDir = x.txt ? 'asc' : 'desc'; } render(); } })));
  tb.appendChild(el('thead', {}, [hr]));
  const body = el('tbody');
  sorted.forEach((p, i) => {
    const tr = el('tr');
    tr.appendChild(el('td', { html: `<span class="rank${i < 3 ? ' m' + (i+1) : ''}">${i+1}</span> ` +
      `<b>${esc(p.name)}</b>` }));
    tr.appendChild(el('td', { class: 'cellsub', text: p.region }));
    tr.appendChild(el('td', { class: 'num ' + scoreTag(p.score), text: p.score == null ? '—' : p.score }));
    tr.appendChild(el('td', { class: 'num ' + attTag(p.attain), text: pctOrDash(p.attain) }));
    tr.appendChild(el('td', { class: 'num ' + accTag(p.accuracy), text: pctOrDash(p.accuracy) }));
    tr.appendChild(el('td', { class: 'num ' + varTag(p.variance), text: signedPct(p.variance) }));
    tr.appendChild(el('td', { class: 'num ' + covTag(p.coverage), text: ratioOrDash(p.coverage) }));
    tr.appendChild(el('td', { class: 'num', text: p.demo.total }));
    tr.appendChild(el('td', { class: 'num ' + demoTag(p.demo.convRate), text: pctOrDash(p.demo.convRate) }));
    tr.appendChild(el('td', { class: 'num', text: money(p.pipeline, { dash: false }) }));
    tr.appendChild(el('td', { class: 'num', text: money(p.closed, { dash: false }) }));
    body.appendChild(tr);
  });
  tb.appendChild(body);
  const w = el('div', { style: 'overflow-x:auto' }); w.appendChild(tb);
  c.body.appendChild(w);
  return c.node;
}

/* One rep in view: their standing, with the rest of the team anonymised —
   the tracker's rule, so a rep sees where they are without seeing

function perfStanding(all, me) {
  const c = card('Where you stand', 'Ranked by the composite score across the team');
  const ranked = all.slice().sort((a, z) => (z.score == null ? -1 : z.score) - (a.score == null ? -1 : a.score));

  const meta = el('div', { class: 'mt' });
  [['Your score', me.score == null ? '—' : me.score, scoreTag(me.score)],
   ['Best on the team', scores.length ? Math.max.apply(null, scores) : '—', ''],
   ['Team average', avg == null ? '—' : avg, '']].forEach(([k, v, cls]) =>
    meta.appendChild(el('div', {}, [ el('span', { text: k }), el('b', { class: cls, text: String(v) }) ])));
  strip.appendChild(meta);
  c.body.appendChild(strip);

  const tb = el('table', { class: 'dt' });
  tb.appendChild(el('thead', {}, [ el('tr', {}, [
    el('th', { text: 'Rank' }), el('th', { text: 'Rep' }),
    el('th', { class: 'num', text: 'Score' }), el('th', { class: 'num', text: 'Goal %' })
  ]) ]));
  const body = el('tbody');
  ranked.forEach((p, i) => {
    const mine = p.id === me.id;
    const tr = el('tr', { style: mine ? 'background:var(--accent-soft)' : '' });
    tr.appendChild(el('td', { html: `<span class="rank${i < 3 ? ' m' + (i+1) : ''}">${i+1}</span>` }));
    tr.appendChild(el('td', { html: mine ? `<b>${esc(p.name)} (you)</b>` : '<span style="color:var(--ink-3)">Team member</span>' }));
    tr.appendChild(el('td', { class: 'num ' + (mine ? scoreTag(p.score) : ''),
      text: mine ? (p.score == null ? '—' : String(p.score)) : '•••' }));
    tr.appendChild(el('td', { class: 'num ' + (mine ? attTag(p.attain) : ''),
      text: mine ? pctOrDash(p.attain) : '•••' }));
    body.appendChild(tr);
  });
  tb.appendChild(body);
  c.body.appendChild(tb);
  return c.node;
}

/* ================================================================
   REP PERFORMANCE REPORT (PDF)

   The tracker's report, rebuilt on this tool's data. Same shape:
   a KPI grid, a month-by-month table, a weighted 200-point rubric
   with a performance band, and a 30-day improvement plan against
   minimum expectations.

   The tracker asked for four numbers by hand every time — outreach,
   contacts built, deals added, quotes shared — because they lived in
   HubSpot. All four are in this tool, so all four are read, not typed.
   The only thing still asked for is the join date, because nothing
   else knows it.

   It prints rather than rasterising through html2canvas: the PDF comes
   out as real text you can select, search and copy, at whatever DPI the
   printer driver wants, with no third-party library to load.
   ================================================================ */

const PIP_DEFAULT = { demos: 8, estimates: 4, contacts: 40, coverage: null };
function pipTargets() {
  const c = (DB.config && DB.config.pip) || {};
  const n = (v, d) => (v === '' || v == null || !isFinite(Number(v))) ? d : Number(v);
  return {
    demos:     n(c.demos, PIP_DEFAULT.demos),          // per month
    estimates: n(c.estimates, PIP_DEFAULT.estimates),  // per week
    contacts:  n(c.contacts, PIP_DEFAULT.contacts),    // per month
    coverage:  n(c.coverage, thresholds('coverage').good)
  };
}

const joinDateOf = id => {
  const o = DB.owners.find(x => x.id === String(id));
  return (o && o.joinDate) || '';
};
function tenureText(iso) {
  if (!iso) return 'not recorded';
  const d = new Date(iso); if (isNaN(d)) return 'not recorded';
  const now = new Date();
  let m = (now.getFullYear() - d.getFullYear()) * 12 + (now.getMonth() - d.getMonth());
  if (now.getDate() < d.getDate()) m--;
  if (m < 0) m = 0;
  const y = Math.floor(m / 12), mo = m % 12;
  return (y ? `${y} yr${y > 1 ? 's' : ''} ` : '') + `${mo} mo · since ` +
    d.toLocaleDateString('en-GB', { month: 'short', year: 'numeric' });
}

/* The four the tracker had to be told. Every one of them is a question
   this tool can already answer about a rep in a period. */
function repActivity(id, b) {
  const inB = v => v && (b.grain === 'all' || inPeriod(String(v).slice(0, 10), b));
  const mine = live('deals').filter(d => String(d.ownerId) === String(id));
  const dealsAdded = mine.filter(d => inB(d.createdAt)).length;
  const estimates  = mine.filter(d => (d.items || []).length && inB(d.createdAt)).length;
  const contacts   = live('contacts').filter(c => String(c.ownerId) === String(id) && inB(c.createdAt)).length;
  const acts       = DB.activities.filter(a => !a._del && String(a.ownerId) === String(id) && inB(a.at)).length;
  const tasksDone  = live('tasks').filter(t => String(t.ownerId) === String(id) &&
    t.status === 'done' && inB(t.doneAt || t.dueDate)).length;
  return { dealsAdded, estimates, contacts, touches: acts + tasksDone };
}

/* Month-by-month rows for the period, so a quarter reads as three months. */
function repMonths(id, b) {
  if (b.grain === 'all') return [];
  const out = [];
  let k = monthKey(b.from);
  const last = monthKey(b.to);
  for (let i = 0; i < 60; i++) {
    const mb = Object.assign(mBounds(k + '-01'), { grain: 'month' });
    const o = DB.owners.find(x => x.id === String(id));
    out.push(Object.assign({ key: k, label: mb.label }, computeRepPerf(o, mb)));
    if (k === last) break;
    k = monthShift(k, 1);
  }
  return out;
}

const BANDS = [
  [.90, 'Exceeding',              '#0b7a3b'],
  [.75, 'Achievable',             '#16833f'],
  [.60, 'Towards achievement',    '#9a6b00'],
  [.40, 'Moderate performance',   '#b1531a'],
  [0,   'Low performance',        '#b3261e']
];
const bandOf = pct => (BANDS.find(x => pct >= x[0]) || BANDS[BANDS.length - 1]);

/* The weighted rubric — the tracker's weights, out of 200. */
function repRubric(p, act, monthsN) {
  const t = pipTargets();
  const covT = t.coverage || 4;
  const demoTarget = Math.max(1, monthsN * PERF_DEMO_TARGET_PER_MONTH);
  const dealTarget = Math.max(1, monthsN * PERF_DEMO_TARGET_PER_MONTH);
  const g = p.goal || 0;
  const cur = n => CFG.currency + ' ' + money(n, { dash: false });
  const comps = [
    ['Demos achieved', 10,
      Math.min(1, p.demo.total / demoTarget), `${p.demo.total} of ${demoTarget} target`],
    ['Demo → sale conversion', 25,
      p.demo.convRate != null ? p.demo.convRate : 0,
      p.demo.convRate != null ? `${Math.round(p.demo.convRate * 100)}% of ${p.demo.converted + p.demo.lost} decided` : 'no decided demos'],
    [`Pipeline coverage (≥ ${covT}×)`, 50,
      p.coverage != null ? Math.min(1, p.coverage / covT) : 0,
      p.coverage != null ? p.coverage.toFixed(2) + '×' : 'no target set'],
    [`Total pipeline (${covT}× the target)`, 20,
      g > 0 ? Math.min(1, p.pipeline / (covT * g)) : 0,
      g > 0 ? `${cur(p.pipeline)} of ${cur(covT * g)}` : 'no target set'],
    ['Deals closed (vs target)', 50,
      p.attain != null ? Math.min(1, p.attain) : 0,
      g > 0 ? `${cur(p.closed)} of ${cur(g)}` : 'no target set'],
    ['Deals generated', 20,
      Math.min(1, act.dealsAdded / dealTarget), `${act.dealsAdded} of ${dealTarget} target`],
    ['Forecast accuracy', 25,
      p.accuracy != null ? p.accuracy : 0,
      p.accuracy != null ? Math.round(p.accuracy * 100) + '%' : 'nothing to compare']
  ];
  const total = comps.reduce((s, c) => s + c[2] * c[1], 0);
  const max = comps.reduce((s, c) => s + c[1], 0);
  return { comps, total, max, band: bandOf(total / max), scorable: g > 0 };
}

/* -------------------------------------------------------- the document */
const RPT_ESC = s => esc(String(s == null ? '' : s));
function reportSection(p, b, act, months) {
  const t = pipTargets();
  const cur = n => CFG.currency + ' ' + money(n, { dash: false });
  const curC = n => CFG.currency + ' ' + money(n, { compact: true, dash: false });
  const rub = repRubric(p, act, Math.max(1, perfMonthSpan(b)));
  const pctT = v => v == null ? '—' : Math.round(v * 100) + '%';
  const sgn  = v => v == null ? '—' : (v >= 0 ? '+' : '') + Math.round(v * 100) + '%';
  const covT = t.coverage || 4;

  const kpi = (l, v, s, colour) =>
    `<div class="k"><div class="kl">${RPT_ESC(l)}</div>` +
    `<div class="kv"${colour ? ` style="color:${colour}"` : ''}>${RPT_ESC(v)}</div>` +
    `<div class="ks">${RPT_ESC(s)}</div></div>`;
  const ok = '#0b7a3b', bad = '#b3261e';

  const kpis = [
    kpi('Demos achieved', p.demo.total, `${p.demo.converted} converted · ${p.demo.pending} pending`),
    kpi('Demo → sale', pctT(p.demo.convRate), 'of decided demos'),
    kpi('Pipeline coverage', p.coverage == null ? '—' : p.coverage.toFixed(2) + '×', `target ${covT}×`,
      p.coverage == null ? null : p.coverage >= covT ? ok : bad),
    kpi('Open pipeline', curC(p.pipeline), `${p.openCount} deals closing in period`),
    kpi('Closed won', curC(p.closed), `${p.wonCount} deal${p.wonCount === 1 ? '' : 's'}`),
    kpi('Goal attainment', pctT(p.attain), p.goal ? `of ${curC(p.goal)}` : 'no target set',
      p.attain == null ? null : p.attain >= 1 ? ok : null),
    kpi('Deals generated', act.dealsAdded, 'created in period'),
    kpi('Estimates built', act.estimates, 'deals with a priced estimate'),
    kpi('Contacts added', act.contacts, 'new people on the book'),
    kpi('Activity logged', act.touches, 'notes, changes and completed tasks'),
    kpi('Forecast accuracy', pctT(p.accuracy), `${curC(p.forecast)} weighted vs ${curC(p.closed)}`),
    kpi('Commit variance', sgn(p.variance), p.commit ? `against ${curC(p.commit)} committed` : 'nothing committed',
      p.variance == null ? null : p.variance >= 0 ? ok : bad)
  ].join('');

  const monthRows = months.length ? months.map(m =>
    `<tr><td>${RPT_ESC(m.label)}</td>` +
    `<td class="n">${m.goal ? RPT_ESC(cur(m.goal)) : '—'}</td>` +
    `<td class="n">${RPT_ESC(cur(m.closed))}</td>` +
    `<td class="n">${m.attain == null ? '—' : Math.round(m.attain * 100) + '%'}</td>` +
    `<td class="n">${RPT_ESC(cur(m.pipeline))}</td>` +
    `<td class="n">${m.demo.total}</td>` +
    `<td class="n" style="font-weight:700;color:${m.coverage == null ? '#5b6474'
      : m.coverage >= covT ? ok : m.coverage >= thresholds('coverage').warn ? '#9a6b00' : bad}">` +
      `${m.coverage == null ? '—' : m.coverage.toFixed(2) + '×'}</td></tr>`).join('')
    : `<tr><td colspan="7" style="color:#5b6474">A month-by-month breakdown needs a bounded period — pick a month, quarter or year rather than All time.</td></tr>`;

  const rubRows = rub.comps.map(c =>
    `<tr><td>${RPT_ESC(c[0])}</td><td class="c">${c[1]}</td>` +
    `<td class="n" style="color:#3d4654">${RPT_ESC(c[3])}</td>` +
    `<td class="n" style="font-weight:700">${(c[2] * c[1]).toFixed(1)}</td></tr>`).join('');

  /* The 30-day plan: minimum expectations against the pace actually run. */
  const mn = Math.max(1, perfMonthSpan(b)), weeks = mn * 4.345;
  const rows = [
    ['Demos run', `≥ ${t.demos} / month`, (p.demo.total / mn).toFixed(1) + ' / month', p.demo.total / mn >= t.demos],
    ['Pipeline coverage', `≥ ${covT}× target`, p.coverage == null ? '—' : p.coverage.toFixed(2) + '×',
      p.coverage != null && p.coverage >= covT],
    ['Estimates built', `≥ ${t.estimates} / week`, (act.estimates / weeks).toFixed(1) + ' / week', act.estimates / weeks >= t.estimates],
    ['New contacts', `≥ ${t.contacts} / month`, Math.round(act.contacts / mn) + ' / month', act.contacts / mn >= t.contacts]
  ];
  const pipRows = rows.map(r =>
    `<tr><td style="font-weight:600">${RPT_ESC(r[0])}</td><td style="color:#3d4654">${RPT_ESC(r[1])}</td>` +

  const basis = p.targetBasis && p.targetBasis.basis === 'derived'

    : p.goal ? '' : `No target is set for ${b.label}, so attainment, coverage and 120 of the 200 points cannot be scored.`;

  return `<section class="rep">

    <thead><tr><th>Month</th><th class="n">Target</th><th class="n">Closed won</th><th class="n">Goal %</th>
      <th class="n">Pipeline</th><th class="n">Demos</th><th class="n">Coverage</th></tr></thead>
    <tbody>${monthRows}</tbody>
  </table>

  <div class="band">
    <div class="chip" style="background:${rub.band[2]}">${RPT_ESC(rub.band[1])}</div>
    <div class="bs">Weighted score <b>${rub.total.toFixed(0)} / ${rub.max}</b> (${Math.round(rub.total / rub.max * 100)}%)
      ${rub.scorable ? '' : '<em> — incomplete without a target</em>'}</div>
  </div>

  <h2>How this is evaluated</h2>
  <table class="sm">
    <colgroup><col style="width:32%"><col style="width:11%"><col style="width:43%"><col style="width:14%"></colgroup>
    <thead><tr><th>Criterion</th><th class="c">Weight</th><th class="n">Actual</th><th class="n">Points</th></tr></thead>
    <tbody>${rubRows}</tbody>
    <tfoot><tr><td>Total</td><td class="c">${rub.max}</td><td></td><td class="n">${rub.total.toFixed(0)}</td></tr></tfoot>
  </table>
  <p class="fine"><b>Bands:</b> Low performance below 40% · Moderate 40–60% · Towards achievement 60–75% ·
    Achievable 75–90% · Exceeding 90% and above.<br>
    <b>Method:</b> each criterion earns its weight × how close the rep is to target, capped at 100%.
    Coverage and total pipeline are measured against ${covT}× the target, which is the figure set in Settings;
    demos and deals generated against ${PERF_DEMO_TARGET_PER_MONTH} per month in the period; conversion,
    forecast accuracy and deals closed against their own 100%.</p>

  <div class="pagebreak"></div>

  <h2 class="warn">30-day improvement plan</h2>
  <p class="fine">Minimum expectations for the next 30 days, against the pace run in ${RPT_ESC(b.label)}.
    ${behind ? `<b>${behind} area${behind === 1 ? ' is' : 's are'} below</b> and ${behind === 1 ? 'is' : 'are'} the priority.` : 'Every area is on track.'}
    Review on <b>${RPT_ESC(review)}</b>.</p>
  <table>
    <colgroup><col style="width:28%"><col style="width:28%"><col style="width:24%"><col style="width:20%"></colgroup>
    <thead class="w"><tr><th>Area</th><th>30-day expectation</th><th class="n">Current pace</th><th class="n">Status</th></tr></thead>
    <tbody>${pipRows}</tbody>
  </table>
  <div class="sign">
    <div><span>Rep</span><i></i></div>
    <div><span>Manager</span><i></i></div>
    <div><span>Date</span><i></i></div>
  </div>
  <footer class="rf">CoreV Sales CRM v${RPT_ESC(CFG.version)} · ${RPT_ESC(p.name)} · ${RPT_ESC(b.label)}</footer>
</section>`;
}

/* ----------------------------------------------------------- the action */
function perfReport(rows, b) {
  if (!rows.length) return toast('Nobody to report on', 'err');
  const missing = rows.filter(p => !joinDateOf(p.id));
  const build = () => {
    const docs = rows.map(p => {
      const act = repActivity(p.id, b);
      return reportSection(p, b, act, repMonths(p.id, b));
    }).join('\n');
    printDoc(`<!doctype html><html><head><meta charset="utf-8">` +
      `<title>Performance report — ${RPT_ESC(rows.length === 1 ? rows[0].name : 'the team')} — ${RPT_ESC(b.label)}</title>` +
      `<style>${REPORT_CSS}</style></head><body>${docs}</body></html>`);
  };
  /* The join date is the one thing the tool cannot work out, and tenure on a
     performance report matters — three months in is not the same as three
     years. Asked once, then kept on the person's record. */
  if (missing.length && canWrite()) return askJoinDates(missing, build);
  build();
}

function askJoinDates(people, then) {
  const wrap = el('div', {});
  wrap.appendChild(el('p', { style: 'margin:0 0 var(--sp-3);line-height:1.6;color:var(--ink-2)', html:
    `Everything else on the report is read out of the tool. The one thing it cannot work out is when ` +
    `${people.length === 1 ? 'this person' : 'these people'} joined, and tenure belongs on a performance ` +
    `report — three months in is not the same as three years. Set ${people.length === 1 ? 'it' : 'them'} ` +
    `once and ${people.length === 1 ? 'it stays' : 'they stay'} on the record.` }));
  const ins = people.map(p => {
    const i = el('input', { class: 'inp', type: 'date', max: TODAY() });
    wrap.appendChild(fld(p.name, i));
    return { id: p.id, input: i };
  });
  modal('When did they join CoreV?', wrap, [
    el('button', { class: 'btn', text: 'Skip — leave tenure blank', onclick: () => { closeAll(); then(); } }),
    el('button', { class: 'btn primary', text: 'Save and generate', onclick: () => {
      batch(() => ins.forEach(x => {
        if (!x.input.value) return;
        const o = DB.owners.find(y => y.id === x.id);
        if (o) { o.joinDate = x.input.value; }
      }));
      touch('config');
      closeAll(); then();
    } })
  ]);
}

/* A hidden frame, printed. The browser's own PDF writer keeps the text as
   text — selectable, searchable and sharp — where a canvas rasteriser would
   hand over a blurry picture of it. */
function printDoc(html) {
  const old = document.getElementById('printframe');
  if (old) old.remove();
  const f = el('iframe', { id: 'printframe', 'aria-hidden': 'true',
    style: 'position:fixed;right:0;bottom:0;width:0;height:0;border:0;opacity:0' });
  document.body.appendChild(f);
  const d = f.contentWindow.document;
  d.open(); d.write(html); d.close();
  const go = () => {
    try { f.contentWindow.focus(); f.contentWindow.print(); }
    catch (e) { toast('The browser would not open the print dialog', 'err'); }
    setTimeout(() => { const n = document.getElementById('printframe'); if (n) n.remove(); }, 60000);
  };
  if (d.readyState === 'complete') setTimeout(go, 120);
  else f.onload = () => setTimeout(go, 120);
  toast('Choose “Save as PDF” in the print dialog', 'ok');
}
/* ================================================================
   MARKETING LEADS   (migrated from the tracker's Follow-up Engine)

   A lead arrives — typed, pasted, or pulled from the agency's Google
   Sheet — is routed to a rep by where it is, and gets a seven-step
   twelve-day cadence written for it. The rep tunes any step with
   Claude, sends it from their own WhatsApp, and moves the lead along
   New → Contacted → Engaged → Demo booked → Won / Lost.

   What is different here, deliberately:
     · every lead becomes a CRM contact the moment it lands, so nothing
       is ever only in this list;
     · it becomes a deal when it reaches Demo booked or Won, so the
       pipeline and the forecast do not fill with untouched leads;
     · no media library — images in a synced file is what put this
       tool over the browser storage limit once already.
   ================================================================ */

const leadFirst = n => String(n || '').trim().split(/\s+/)[0] || 'there';
function leadFill(tpl, l) {
  return String(tpl || '')
    .replace(/\{name\}/g, leadFirst(l.name))
    .replace(/\{company\}/g, l.company || 'your business');
}
function leadTouches(l) {
  return LEAD_CADENCE.map(c => {
    const b2b = l.type === 'B2B';
    const t = { key: c.key, day: c.day, when: c.when, channel: c.channel, purpose: c.purpose,
      status: 'pending', message: leadFill(b2b ? c.b2b : c.b2c, l) };
    if (c.channel === 'Email') t.subject = leadFill(b2b ? c.subjectB2b : c.subjectB2c, l);
    return t;
  });
}

/* ---------------------------------------------------- routing */
const EMIRATE_RULES = [
  ['Abu Dhabi', /\b(abu\s*dhabi|abudhabi|auh|al\s*ain|yas|saadiyat|mussafah|musaffah|khalifa city|reem island|mbz|mohammed bin zayed|al raha|shakhbout|bani yas|al shamkha|madinat zayed|ruwais|liwa)\b/],
  ['Dubai',     /\b(dubai|dxb|jumeirah|marina|deira|bur dubai|business bay|jbr|downtown|al barsha|tecom|jvc|jlt|silicon oasis|mirdif|karama|satwa|al quoz|dubai hills|palm jumeirah|international city|discovery gardens|motor city|arabian ranches|damac|emaar)\b/]
];
function leadRegionOf(text) {
  const t = ' ' + String(text || '').toLowerCase() + ' ';
  const hit = EMIRATE_RULES.find(([, re]) => re.test(t));
  return hit ? hit[0] : '';
}
/* Round-robin inside the region, so a batch of thirty does not all land
   on one person. The counter lives in config so it carries across reps. */
function leadNextRep(region) {
  const people = activeOwners().filter(o => ownerRegion(o.id) === region);
  if (!people.length) return '';
  DB.config.leadRot = DB.config.leadRot || {};
  const n = Number(DB.config.leadRot[region] || 0);
  DB.config.leadRot[region] = (n + 1) % people.length;
  return people[n % people.length].id;
}
function leadAutoAssign(l) {
  const region = l.region || leadRegionOf([l.emirate, l.address, l.note, l.company].filter(Boolean).join(' '));
  l.region = region || '';
  if (!region) { l.routeNeeded = true; return ''; }
  const rep = leadNextRep(region);
  if (!rep) { l.routeNeeded = true; return ''; }
  l.assignee = rep; l.autoAssigned = true; l.routeNeeded = false;
  l.assignedAt = new Date().toISOString();
  return rep;
}

/* ---------------------------------------------------- identity & dedupe */
const leadDigits = s => String(s || '').replace(/\D/g, '');
function leadKey(l) {
  const e = String(l.email || '').trim().toLowerCase();
  if (e) return 'e:' + e;
  const p = leadDigits(l.phone);
  if (p.length >= 7) return 'p:' + p.slice(-9);
  return 'n:' + String(l.name || '').trim().toLowerCase() + '|' + String(l.company || '').trim().toLowerCase();
}
const leadIndex = () => { const m = new Map(); live('leads').forEach(l => m.set(leadKey(l), l)); return m; };

/* ---------------------------------------------------- the CRM link
   Every lead becomes a contact straight away, tagged so the contact book
   can still be read as the worked book. It becomes a deal only once it
   reaches Demo booked or Won, so the pipeline is not filled with leads
   nobody has spoken to. */
function leadToContact(l) {
  if (l.contactId && getCt(l.contactId)) return getCt(l.contactId);
  const mail = String(l.email || '').trim().toLowerCase();
  const ph = leadDigits(l.phone).slice(-9);
  let c = mail ? live('contacts').find(x => String(x.email || '').toLowerCase() === mail) : null;
  if (!c && ph) c = live('contacts').find(x => leadDigits(x.phone).slice(-9) === ph && ph.length >= 7);
  let co = null;
  if (l.type === 'B2B' && l.company) {
    co = live('companies').find(x => String(x.name || '').toLowerCase() === String(l.company).toLowerCase());
    if (!co) co = upsert('companies', { name: l.company, createdAt: TODAY(),
      ownerId: l.assignee || currentOwnerId(), source: 'Marketing lead' });
  }
  const parts = String(l.name || '').trim().split(/\s+/);
  const rec = Object.assign({}, c || {}, {
    firstName: (c && c.firstName) || parts[0] || l.name || '',
    lastName:  (c && c.lastName)  || parts.slice(1).join(' '),
    email: l.email || (c && c.email) || null,
    phone: l.phone || (c && c.phone) || null,
    companyId: co ? co.id : (c && c.companyId) || null,
    ownerId: l.assignee || (c && c.ownerId) || currentOwnerId(),
    createdAt: (c && c.createdAt) || TODAY(),
    isLead: true, leadSource: l.source || 'Marketing lead'
  });
  const saved = upsert('contacts', rec);
  l.contactId = saved.id;
  if (co) l.companyId = co.id;
  return saved;
}
function leadToDeal(l) {
  if (l.dealId && getDl(l.dealId)) return getDl(l.dealId);
  const c = leadToContact(l);
  const openFirst = openStages()[0] || stage();
  const d = upsert('deals', {
    name: l.company || l.name || 'Marketing lead',
    companyId: l.companyId || (c && c.companyId) || null,
    contactIds: c ? [c.id] : [],
    stageId: openFirst.id, amount: null, currency: CFG.currency,
    closeDate: addDays(TODAY(), 30), createdAt: TODAY(),
    ownerId: l.assignee || currentOwnerId(),
    dealType: l.type === 'B2B' ? 'Commercial' : 'Consumer',
    source: l.source || 'Marketing lead',
    nextStep: 'From marketing lead — ' + (l.stage || 'Demo booked')
  });
  l.dealId = d.id;
  logAct({ dealId: d.id, ownerId: d.ownerId, kind: 'open',
    html: `Created from the marketing lead <b>${esc(l.name || '')}</b>` });
  return d;
}

/* ---------------------------------------------------- create / save */
function leadSave(l) { l.updatedAt = new Date().toISOString(); return upsert('leads', l); }
const getLead = id => live('leads').find(l => l.id === String(id));

function leadCreate(p, opt) {
  const o = opt || {};
  const l = {
    createdAt: new Date().toISOString(), updatedAt: new Date().toISOString(),
    stage: 'New', owner: currentOwnerId(),
    name: p.name || '', company: p.company || '', type: p.type === 'B2B' ? 'B2B' : 'B2C',
    language: p.language === 'Arabic' ? 'Arabic' : 'English',
    phone: p.phone || '', email: p.email || '', address: p.address || '',
    emirate: p.emirate || '', region: p.region || '',
    source: p.source || 'Manual', note: p.note || '', assignee: p.assignee || '',
    updates: []
  };
  if (!l.assignee) leadAutoAssign(l); else { l.region = l.region || leadRegionOf(l.address || l.note); l.routeNeeded = false; }
  l.touches = leadTouches(l);
  const saved = leadSave(l);
  /* every lead is a contact from the moment it lands */
  try { leadToContact(saved); leadSave(saved); } catch (e) { console.error(e); }
  if (!o.quiet && saved.assignee && saved.assignee !== currentOwnerId()) leadNotify(saved, 'assigned');
  return saved;
}
function leadSetStage(id, stg) {
  const l = getLead(id); if (!l) return;
  const was = l.stage;
  l.stage = stg;
  if (stg === 'Lost' && !l.lostReason) { leadAskLost(l); return; }
  if (stg !== 'Lost') l.lostReason = null;
  if (LEAD_DEAL_AT.includes(stg)) { try { leadToDeal(l); } catch (e) { console.error(e); } }
  if (stg === 'Engaged' && !l.engagedAt) l.engagedAt = new Date().toISOString();
  leadSave(l); render();
  toast(`${l.name || 'Lead'} → ${stg}` + (l.dealId && !LEAD_DEAL_AT.includes(was) && LEAD_DEAL_AT.includes(stg)
    ? ' · a deal is now in the pipeline' : ''), 'ok');
}
function leadAskLost(l) {
  const sel = el('select', { class: 'inp' });
  MLEAD_LOST.forEach(r => sel.appendChild(el('option', { value: r, text: r })));
  const note = el('textarea', { class: 'inp', rows: 2, placeholder: 'Anything worth knowing next time' });
  modal('Why was it lost?', el('div', {}, [ fld('Reason', sel), fld('Note', note) ]), [
    el('button', { class: 'btn', text: 'Cancel', onclick: () => { l.stage = 'Contacted'; closeAll(); render(); } }),
    el('button', { class: 'btn primary', text: 'Save', onclick: () => {
      l.lostReason = sel.value;
      if (note.value.trim()) leadAddUpdate(l, 'Lost — ' + sel.value + ': ' + note.value.trim(), true);
      leadSave(l); closeAll(); render(); toast('Marked lost', '');
    } })
  ]);
}
function leadAddUpdate(l, text, silent) {
  if (!text || !String(text).trim()) return;
  l.updates = Array.isArray(l.updates) ? l.updates : [];
  l.updates.push({ id: uid('U'), at: new Date().toISOString(),
    by: (AUTH.user && AUTH.user.name) || ownerName(currentOwnerId()) || 'local', text: String(text).trim() });
  if (!silent) { leadSave(l); render(); }
}
function leadNotify(l, kind) {
  /* Two channels, because a rep who is not in the tool today will not see an
     activity entry: the log for when they are here, and an email for when
     they are not. The email is skipped when you assign a lead to yourself. */
  logAct({ ownerId: l.assignee, kind: 'note',
    html: `Marketing lead <b>${esc(l.name || '')}</b> ${kind === 'assigned' ? 'was assigned to you' : kind}` +
      (l.region ? ` · ${esc(l.region)}` : '') });
  if (kind !== 'assigned' || !leadMailAuto()) return;
  if (!l.assignee || String(l.assignee) === currentOwnerId()) return;
  if (SYNC.mode !== 'onedrive') return;            // not signed in — nothing to send with
  leadEmailRep(l.id, { quiet: true }).catch(() => {});
}

/* ================================================================
   CLAUDE — message tuning and smart parsing
   The key is shared with the team, as the tracker did it. It is set by
   an admin only, never shown back once saved, and it lives in the same
   config document the team already shares. Be clear-eyed about what
   that means: it is in every rep's browser, so treat it as a key that
   can leak and rotate it when somebody leaves.
   ================================================================ */
const aiKey   = () => String((DB.config && DB.config.aiKey) || '').trim();
const aiModel = () => String((DB.config && DB.config.aiModel) || '').trim() || 'claude-sonnet-4-6';
const aiReady = () => !!aiKey();

async function claudeText(prompt, maxTokens) {
  const key = aiKey();
  if (!key) throw new Error('No Anthropic key is set — an admin adds it in Settings.');
  const r = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'x-api-key': key,
      'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' },
    body: JSON.stringify({ model: aiModel(), max_tokens: maxTokens || 1024,
      messages: [{ role: 'user', content: prompt }] })
  });
  const data = await r.json().catch(() => ({}));
  if (data.error) throw new Error(data.error.message || 'Anthropic returned an error');
  if (!r.ok) throw new Error('Anthropic returned ' + r.status);
  const text = (data.content || []).map(b => b.type === 'text' ? b.text : '').join('').trim();
  if (!text) throw new Error('Empty response');
  return text;
}

let LEAD_AI_BUSY = null;

async function leadHeadsUp(id) {

async function leadTune(id, key) {
  const l = getLead(id); if (!l) return;
  const t = (l.touches || []).find(x => x.key === key); if (!t) return;
  if (!aiReady()) return toast('No Anthropic key is set — an admin adds it in Settings', 'err');
  LEAD_AI_BUSY = id + ':' + key; render();

    'You help a sales rep at OxeFit (premium connected fitness systems, sold across the GCC and Middle East, based in the UAE).\n' +
    `Write a single ${t.channel} message for this lead. Return ONLY the message text — no preamble, no quotation marks, no notes.\n` +
    `Write it in ${l.language}. Keep it warm, concise, human and professional.\n` +
    (isEmail ? 'Start with one line "Subject: ..." then a blank line then the body.' : 'No subject line — this is a chat message.') + '\n\n' +
    `Lead: name=${l.name}; type=${l.type}; company=${l.company || 'n/a'}; source=${l.source || 'unknown'}; ` +
    `notes=${l.note || 'none'}; stage=${l.stage}.\n` +
    (l.brief ? `Rep brief on this lead — tailor the tone and angle to it, do not contradict it: ${l.brief}\n` : '') +
    `Goal of this message: ${t.purpose}.\nCurrent draft: ${JSON.stringify(t.message)}`;
  try {
    let text = await claudeText(prompt, 1024);
    if (isEmail && /^subject:/i.test(text)) {
      const nl = text.indexOf('\n');
      t.subject = text.slice(0, nl < 0 ? undefined : nl).replace(/^subject:\s*/i, '').trim();
      text = nl < 0 ? '' : text.slice(nl + 1).trim();
    }
    t.message = text; t.tunedAt = new Date().toISOString();
    leadSave(l);
  } catch (e) { toast('Claude: ' + String(e.message || e).slice(0, 110), 'err'); }

async function leadParseSmart(raw) {
  const prompt = 'You are parsing a sales lead list for OxeFit. Extract EVERY lead. Return ONLY a JSON array — no prose, no markdown, no code fences.\n' +
    'Each item: {"name":string,"type":"B2C" or "B2B","company":string,"phone":string,"email":string,"address":string,"source":string,"note":string,"language":"English" or "Arabic"}.\n' +
    'Rules: individuals and home buyers are B2C. Gyms, hotels, studios, clinics, companies, corporate wellness and resellers are B2B — put the business in company. ' +
    'A missing field is an empty string. If unsure, B2C. Default the language to English unless the text is clearly Arabic. Keep notes short.\n\nLIST:\n' + raw;
  let text = await claudeText(prompt, 8192);
  text = text.replace(/^```(json)?/i, '').replace(/```$/, '').trim();
  const arr = JSON.parse(text);
  if (!Array.isArray(arr)) throw new Error('Unexpected response');
  return arr.map(leadNormalise).filter(l => l.name);
}

/* The parser that needs no key: columns, or one lead per line. */
function leadParsePlain(raw) {
  const out = [];
  String(raw || '').split(/\n\s*\n/).forEach(block => {
    const lines = block.split(/\r?\n/).map(s => s.trim()).filter(Boolean);
    if (!lines.length) return;
    const delim = lines[0].indexOf('\t') >= 0 ? '\t' : ',';
    let head = null, start = 0;
    if (/name/i.test(lines[0]) && lines[0].split(delim).length > 1) {
      head = lines[0].split(delim).map(h => h.trim().toLowerCase()); start = 1;
    }
    for (let i = start; i < lines.length; i++) {
      const cells = splitCsvLine(lines[i], delim);
      let o;
      if (head) { o = {}; head.forEach((h, n) => { o[h] = cells[n] || ''; });
        o = { name: o.name || o['full name'] || o['lead name'], type: o.type, company: o.company || o.business,
          phone: o.phone || o.mobile || o['phone number'], email: o.email || o['e-mail'],
          address: o.address || o.location || o.area || o.city, source: o.source || o.channel,
          note: o.note || o.notes || o.message || o.comments, language: o.language }; }
      else o = { name: cells[0], type: cells[1], phone: cells[2], email: cells[3],
        company: cells[4], source: cells[5], note: cells.slice(6).join(' ') };
      if (o && o.name) out.push(leadNormalise(o));
    }
  });
  return out;
}
/* A CSV cell can hold a quoted comma — a plain split loses the rest of the row. */
function splitCsvLine(line, delim) {
  if (delim === '\t') return line.split('\t').map(c => c.trim());
  const out = []; let cur = '', q = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (q) { if (ch === '"' && line[i + 1] === '"') { cur += '"'; i++; }
             else if (ch === '"') q = false; else cur += ch; }
    else if (ch === '"') q = true;
    else if (ch === ',') { out.push(cur.trim()); cur = ''; }
    else cur += ch;
  }
  out.push(cur.trim());
  return out;
}
/* Long phone numbers come out of spreadsheets as 9.71501E+11. */
function expandSci(s) {
  const m = String(s || '').trim().match(/^([+-]?)(\d+)(?:\.(\d+))?[eE]\+?(\d+)$/);
  if (!m) return String(s || '');
  const digits = m[2] + (m[3] || ''), point = m[2].length + parseInt(m[4], 10);
  return (m[1] === '-' ? '-' : '') +
    (point >= digits.length ? digits + '0'.repeat(point - digits.length) : digits.slice(0, point));
}
function leadNormalise(o) {
  o = o || {};
  const blob = [o.note, o.phone, o.email, o.address, o.source, o.company].filter(Boolean).join('\n');
  let type = String(o.type || '').trim().toUpperCase();
  if (type !== 'B2B' && type !== 'B2C') {
    const stated = String(o.type || '').toLowerCase();
    if (/business|commercial|corporate|company|trade|wholesale|dealer/.test(stated)) type = 'B2B';
    else if (/consumer|home|residential|individual|personal|retail/.test(stated)) type = 'B2C';
    else {
      /* A business named in the company column is strong evidence. The same
         word in a note is weak: "villa gym" and "a gym for my home" are homes,
         and reading them as businesses put them in front of the wrong rep with
         the wrong opening line. So the home words can outvote the trade words. */
      const co = String(o.company || '').toLowerCase();
      const txt = (String(o.note || '') + ' ' + String(o.name || '')).toLowerCase();
      const BIZ = /gym|hotel|studio|clinic|spa|resort|academy|fitness cent|wellness|club|centre|center|hospital|university|school|\bllc\b|l\.l\.c|\bfz\b|trading|group|company/;
      const HOME = /\b(home|house|villa|apartment|apt|flat|residen\w*|personal|myself|my own|family)\b/;
      let score = 0;
      if (co.trim()) score += 2;
      if (BIZ.test(co)) score += 2;
      if (/\bb2b\b|corporate|reseller|wholesale|distributor|franchise|multiple locations|our members|our clients/.test(txt)) score += 3;
      if (BIZ.test(txt)) score += 1;
      if (HOME.test(txt)) score -= 3;
      type = score > 0 ? 'B2B' : 'B2C';
    }
  }
  const mail = (String(o.email || '') + ' ' + blob).match(/[\w.+-]+@[\w-]+\.[\w.]{2,}/);
  const rawPhone = expandSci(o.phone || '');
  let phone = leadDigits(rawPhone);
  if (!phone || phone.length < 7) { const m = blob.match(/\+?\d[\d\s()-]{6,}/); if (m) phone = leadDigits(expandSci(m[0])); }
  if (phone && phone.length >= 9 && !phone.startsWith('971') && phone.startsWith('0')) phone = '971' + phone.slice(1);
  const address = String(o.address || '').trim();
  return { name: String(o.name || '').trim(), type, company: String(o.company || '').trim(),
    phone: phone ? '+' + phone : '', email: mail ? mail[0].toLowerCase() : '',
    address, emirate: '', region: leadRegionOf([address, o.note, o.company].filter(Boolean).join(' ')),
    source: String(o.source || '').trim(), note: String(o.note || '').trim(),
    language: /arabic|عرب/i.test(String(o.language || '')) ? 'Arabic' : 'English' };
}

function leadWhatsApp(id, key) {
  const l = getLead(id); if (!l) return;

    text += '\n\n— ' + rep + ', CoreV · OxeFit';

  const a = el('a', { href: url, target: '_blank', rel: 'noopener' });

  render();

function leadCopy(id, key) {
  const l = getLead(id); const t = l && (l.touches || []).find(x => x.key === key);
  if (!t) return;
  const text = (t.subject ? t.subject + '\n\n' : '') + (t.message || '');

}
function leadStepStatus(id, key, status) {
  const l = getLead(id); const t = l && (l.touches || []).find(x => x.key === key);
  if (!t) return;
  t.status = status; if (status === 'sent' && !t.sentAt) t.sentAt = new Date().toISOString();
  leadSave(l); render();
}
/* They answered. That is the moment the clock on "time to engage" stops, and
   it is worth one click rather than three. */
function leadReplied(id, key) {
  const l = getLead(id); if (!l) return;
  const t = (l.touches || []).find(x => x.key === key);
  if (t) { t.status = 'sent'; t.repliedAt = new Date().toISOString(); if (!t.sentAt) t.sentAt = t.repliedAt; }
  if (!l.engagedAt) l.engagedAt = new Date().toISOString();
  if (['New', 'Contacted'].includes(l.stage)) l.stage = 'Engaged';
  leadSave(l); render();
  toast('Marked as replied' + (l.stage === 'Engaged' ? ' · moved to Engaged' : ''), 'ok');
}

/* ================================================================
   GOOGLE SHEET FEED
   The sheet is published to the web as CSV (File → Share → Publish to
   web → CSV) and read straight over https. No Google sign-in, no OAuth
   app, and it works the same for every rep. The trade-off is real and
   is stated in Settings: anyone holding that URL can read the sheet,
   so it must carry lead data and nothing else.
   ================================================================ */
const sheetUrl  = () => String((DB.config && DB.config.leadSheetUrl) || '').trim();
const sheetAuto = () => !!(DB.config && DB.config.leadSheetAuto);
const sheetLast = () => (DB.config && DB.config.leadSheetAt) || '';

function sheetCsvUrl(u) {
  const s = String(u || '').trim();
  if (!s) return '';
  /* A published link already ends in output=csv. A normal /edit link can be
     turned into one, which is what people paste by mistake. */
  if (/output=csv/i.test(s)) return s;
  const m = s.match(/\/spreadsheets\/d\/(?:e\/)?([\w-]+)/);
  if (m) {
    const gid = (s.match(/[#&?]gid=(\d+)/) || [])[1] || '0';
    return /\/d\/e\//.test(s)
      ? s.replace(/\/pubhtml.*$/, '/pub?output=csv&gid=' + gid).replace(/\/edit.*$/, '/pub?output=csv&gid=' + gid)
      : `https://docs.google.com/spreadsheets/d/${m[1]}/export?format=csv&gid=${gid}`;
  }
  return s;
}
let SHEET_BUSY = false;
async function sheetSync(opt) {
  const o = opt || {};
  const url = sheetCsvUrl(sheetUrl());
  if (!url) { if (!o.quiet) toast('No sheet is connected — add the published CSV link in Settings', 'err'); return { added: 0 }; }
  if (SHEET_BUSY) return { added: 0 };
  SHEET_BUSY = true;
  if (!o.quiet) toast('Reading the sheet…');
  try {
    const r = await fetch(url, { cache: 'no-store', redirect: 'follow' });
    if (!r.ok) throw new Error('The sheet returned ' + r.status +
      (r.status === 404 ? ' — check the link is the published CSV, not the edit link' : ''));
    const text = await r.text();
    if (/<html/i.test(text.slice(0, 200))) throw new Error(
      'That link returned a web page, not CSV. In the sheet use File → Share → Publish to web → comma-separated values.');
    const parsed = leadParsePlain(text);
    if (!parsed.length) throw new Error('No rows with a name in them. The first row should be the column headings.');
    const seen = leadIndex(), fresh = [], dup = new Set();
    parsed.forEach(p => { const k = leadKey(p); if (!k || seen.has(k) || dup.has(k)) return; dup.add(k); fresh.push(p); });
    let added = 0, routed = 0;
    if (fresh.length) batch(() => { fresh.forEach(p => {
      const l = leadCreate(Object.assign({}, p, { source: p.source || 'Agency sheet' }), { quiet: true });
      added++; if (l.assignee) routed++;
    }); });
    DB.config.leadSheetAt = new Date().toISOString();
    DB.config.leadSheetCount = parsed.length;
    touch('config');
    if (!o.quiet || added) toast(added
      ? `${added} new lead${added === 1 ? '' : 's'} from the sheet · ${routed} routed automatically` +
        (added - routed ? ` · ${added - routed} need a rep` : '')
      : `Up to date — all ${parsed.length} rows are already here`, 'ok');
    render();
    return { added, routed, rows: parsed.length };
  } catch (e) {
    DB.config.leadSheetErr = String(e.message || e);
    if (!o.quiet) toast('Sheet: ' + String(e.message || e).slice(0, 130), 'err');
    return { added: 0, error: String(e.message || e) };
  } finally { SHEET_BUSY = false; }
}
/* Poll while the tool is open, if it is switched on. */

/* ================================================================
   THE COLD DRIP
   A lead that has gone through all seven steps without answering is not
   dead — it is just not now. Marking it cold appends three more touches,
   spread much wider, that re-open the conversation without nagging.
   ================================================================ */
const LEAD_COLD_STEPS = [
  { key:'c1', day:'Day 20', when:'20 days in', channel:'WhatsApp', offsetMin:28800,
    purpose:'Re-open with something new rather than another chase',
    b2c:"Hi {name}, we've just had the new OxeFit setup in the showroom — completely different to see it in person. If you're ever passing Business Bay, come and try it, no appointment needed.",
    b2b:"Hi {name}, we've had a few facilities like {company} add OxeFit since we last spoke, and the member numbers have been interesting. Happy to share what they're seeing if it's useful." },
  { key:'c2', day:'Day 30', when:'a month in', channel:'WhatsApp', offsetMin:43200,
    purpose:'One genuinely useful thing, asking for nothing',
    b2c:"{name}, sharing this in case it's handy — a short piece on how people are fitting a full setup into a spare room: [link]. No reply needed.",
    b2b:"{name}, thought this might be worth a look — how a studio restructured its floor around one OxeFit and what it did to bookings: [link]. No reply needed." },
  { key:'c3', day:'Day 45', when:'six weeks in', channel:'WhatsApp', offsetMin:64800,
    purpose:'Ask once whether the timing has changed',
    b2c:"Hi {name}, has anything changed on the home setup? Happy to pick it up whenever the timing's right — or to leave you be, just say the word.",
    b2b:"Hi {name}, has the timing shifted at all for {company}? Glad to pick this up whenever it suits, or to leave it — either is fine." }
];
function leadMarkCold(id) {
  const l = getLead(id); if (!l) return;
  if (l.cold) {
    l.cold = false;
    l.touches = (l.touches || []).filter(t => !/^c\d$/.test(t.key));
    leadSave(l); render(); return toast('Cold drip removed', '');
  }
  l.cold = true; l.coldAt = new Date().toISOString();
  const b2b = l.type === 'B2B';
  const have = new Set((l.touches || []).map(t => t.key));
  LEAD_COLD_STEPS.forEach(c => {
    if (have.has(c.key)) return;
    l.touches.push({ key: c.key, day: c.day, when: c.when, channel: c.channel,
      purpose: c.purpose, status: 'pending', cold: true,
      message: leadFill(b2b ? c.b2b : c.b2c, l) });
  });
  leadAddUpdate(l, 'Marked cold — three re-engagement touches added after Day 12', true);
  leadSave(l); render();
  toast('Cold — a re-engagement drip now follows Day 12', 'ok');
}

/* ================================================================
   WHEN EACH STEP IS DUE, AND HOW LATE IT IS
   Every offset is measured from the moment the lead arrived, which is how
   the cadence is written: "within 5 minutes", "next day", "3 days in".
   ================================================================ */
const LEAD_ALL_STEPS = () => LEAD_CADENCE.concat(LEAD_COLD_STEPS);
function leadStepDue(l, key) {
  const born = Date.parse(l && l.createdAt) || null;
  if (!born) return null;
  const c = LEAD_ALL_STEPS().find(x => x.key === key);
  return c ? new Date(born + c.offsetMin * 60000) : null;
}
function leadNextStep(l) {
  return (l.touches || []).find(t => t.status === 'pending') || null;
}
function leadNextDue(l) {
  const t = leadNextStep(l);
  return t ? leadStepDue(l, t.key) : null;
}
/* "Due now" means the next step's moment has passed and nobody has done it.
   Won and Lost leads are finished, so they are never due. */
function leadIsDue(l) {
  if (!LEAD_ACTIVE(l)) return false;
  const d = leadNextDue(l);
  return !!(d && d.getTime() <= Date.now());
}
const LEAD_ACTIVE = l => !['Won', 'Lost'].includes(l.stage);
const leadSentCount = l => (l.touches || []).filter(t => t.status === 'sent').length;
const leadLastSentAt = l => (l.touches || []).reduce((m, t) =>
  t.waAt && (!m || t.waAt > m) ? t.waAt : (t.sentAt && (!m || t.sentAt > m) ? t.sentAt : m), null);

/* How long it took to get a reply, and how long we have been waiting. */
function leadEngagedMs(l) {
  if (!l.engagedAt || !l.createdAt) return null;
  const v = Date.parse(l.engagedAt) - Date.parse(l.createdAt);
  return v >= 0 ? v : null;
}
function leadAwaitingMs(l) {
  if (l.engagedAt || !LEAD_ACTIVE(l)) return null;
  const from = leadLastSentAt(l);
  return from ? Date.now() - Date.parse(from) : null;
}
/* Awaiting engagement: a message has gone out and nothing has come back. */
const leadAwaiting = l => LEAD_ACTIVE(l) && !l.engagedAt && leadSentCount(l) > 0;
function fdur(ms) {
  if (ms == null || isNaN(ms)) return '';
  const m = Math.round(ms / 60000);
  if (m < 60) return m + ' min';
  const h = Math.floor(m / 60), rm = m % 60;
  if (h < 24) return h + 'h' + (rm ? ' ' + rm + 'm' : '');
  const d = Math.floor(h / 24), rh = h % 24;
  return d + 'd' + (rh ? ' ' + rh + 'h' : '');
}

/* ================================================================
   RE-CONNECTION
   A lead that said "not now" but did not say no. Tagging it puts a date on
   it so it comes back up instead of being quietly forgotten.
   ================================================================ */
function leadReconnect(id, when) {
  const l = getLead(id); if (!l) return;
  l.reconnect = true; l.reconnectBy = when || addDays(TODAY(), 30);
  leadAddUpdate(l, 'Tagged for re-connection by ' + fdate(l.reconnectBy), true);
  leadSave(l); render();
}
function leadReconnectClear(id) {
  const l = getLead(id); if (!l) return;
  l.reconnect = false; l.reconnectBy = null; leadSave(l); render();
}
const leadReconnectDue = l => !!(l.reconnect && l.reconnectBy && dnum(l.reconnectBy) <= dnum(TODAY()));

/* ================================================================
   REMINDERS
   Each pending step becomes a task in the rep's own task list, on the day
   the cadence says it is due. Tasks are what reps already look at every
   morning, they sync with everything else, and they survive this browser —
   which an in-page timer would not.
   ================================================================ */
function leadRemind(id, opt) {
  const o = opt || {};
  const l = getLead(id); if (!l) return { made: 0 };
  const rep = l.assignee || currentOwnerId();
  const existing = new Set(live('tasks').map(t => t.leadStep).filter(Boolean));
  let made = 0, skipped = 0;
  batch(() => (l.touches || []).forEach(t => {
    if (t.status !== 'pending') return;
    const due = leadStepDue(l, t.key);
    if (!due) return;
    const stamp = l.id + ':' + t.key;
    if (existing.has(stamp)) { skipped++; return; }
    upsert('tasks', {
      title: `${t.day} · ${t.channel} ${l.name || 'lead'}` + (l.company ? ` (${l.company})` : ''),
      dueDate: due.toISOString().slice(0, 10),
      type: t.channel === 'Email' ? 'email' : 'call',
      priority: l.priority ? 'high' : 'medium',
      ownerId: rep, createdAt: TODAY(),
      note: t.purpose + (l.phone ? '\n' + l.phone : '') + '\n\n' + String(t.message || '').slice(0, 400),
      leadStep: stamp, leadId: l.id
    });
    made++;
  }));
  if (made) { l.remindedAt = new Date().toISOString(); leadSave(l); }
  if (!o.quiet) {
    render();
    toast(made ? `${made} reminder${made === 1 ? '' : 's'} added to ${ownerName(rep)}'s tasks`
      : (skipped ? 'Already set — the reminders are in Tasks' : 'No steps left to remind about'),
      made ? 'ok' : '');
  }
  return { made, skipped };
}
function leadRemindersFor(l) { return live('tasks').filter(t => t.leadId === l.id && !t.done); }

/* ================================================================
   EMAILING THE REP
   A lead landing in the tool is no use if nobody is told. This sends the
   rep the lead and a link straight to it — and falls back to opening it in
   their mail app when Graph cannot send, which is better than silence.
   ================================================================ */
function leadLink(l) {
  return location.origin + location.pathname + '#leads?l=' + encodeURIComponent(l.id);
}
function leadMailBody(l) {
  const rows = [
    ['Name', l.name], ['Type', l.type], ['Company', l.company],
    ['Phone', l.phone], ['Email', l.email], ['Area', l.address || l.region],
    ['Source', l.source], ['Stage', l.stage], ['Note', l.note]
  ].filter(([, v]) => v);
  return '<p>A marketing lead has been assigned to you.</p><table cellpadding="6" style="border-collapse:collapse">' +
    rows.map(([k, v]) => `<tr><td style="color:#667;white-space:nowrap">${esc(k)}</td><td><b>${esc(v)}</b></td></tr>`).join('') +
    `</table><p>The first message is due within five minutes of it arriving — the follow-up is already written for you.</p>` +
    `<p><a href="${esc(leadLink(l))}">Open the lead in the CRM</a></p>`;
}
function leadMailText(l) {
  return [`Lead: ${l.name || ''}`, l.company && 'Company: ' + l.company, l.phone && 'Phone: ' + l.phone,
    l.email && 'Email: ' + l.email, l.address && 'Area: ' + l.address, l.source && 'Source: ' + l.source,
    l.note && 'Note: ' + l.note, '', leadLink(l)].filter(Boolean).join('\n');
}
async function leadEmailRep(id, opt) {
  const o = opt || {};
  const l = getLead(id); if (!l) return false;
  const rep = DB.owners.find(x => x.id === String(l.assignee));
  const to = rep && String(rep.email || '').trim();
  if (!to) {
    if (!o.quiet) toast(rep ? `No email address on ${rep.name} — add it in Settings → Sales team`
      : 'This lead has no rep yet', 'err');
    return false;
  }
  const subject = `New lead: ${l.name || 'unnamed'}` + (l.company ? ' · ' + l.company : '') +
    (l.region ? ' · ' + l.region : '');
  try {
    await graphSendMail([to], subject, leadMailBody(l));
    l.mailedAt = new Date().toISOString(); l.mailedTo = to; leadSave(l);
    if (!o.quiet) { render(); toast('Emailed ' + rep.name, 'ok'); }
    return true;
  } catch (e) {
    if (o.quiet) return false;
    mailtoFallback(to, subject, leadMailText(l));

  }
}
const leadMailAuto = () => (DB.config || {}).leadMailAuto !== false;

/* ================================================================
   PULLING THE DETAILS OUT OF A NOTE
   Leads arrive as a sentence more often than as fields. This reads the
   phone, the email and the area out of whatever was typed, without needing
   a key — it is the same reader the import uses.
   ================================================================ */
function leadExtract(id) {
  const l = getLead(id); if (!l) return;
  const blob = [l.note, l.brief, l.address].filter(Boolean).join('\n');
  if (!blob.trim()) return toast('Nothing in the notes to read', 'err');
  const got = leadNormalise({ name: l.name, note: blob, phone: l.phone, email: l.email,
    address: l.address, company: l.company, type: l.type });
  const filled = [];
  if (!l.phone && got.phone) { l.phone = got.phone; filled.push('phone'); }
  if (!l.email && got.email) { l.email = got.email; filled.push('email'); }
  if (!l.region && got.region) { l.region = got.region; filled.push('region'); }
  if (!l.emirate && got.region) { l.emirate = got.region; }
  if (!filled.length) return toast('Nothing new found — the fields already have what the note says', '');
  if (l.region && !l.assignee) leadAutoAssign(l);
  if (l.contactId) { const c = getCt(l.contactId);
    if (c) { c.phone = c.phone || l.phone || null; c.email = c.email || l.email || null; upsert('contacts', c); } }
  leadSave(l); render();
  toast('Filled in ' + filled.join(', ') + ' from the notes', 'ok');
}

/* ================================================================
   SHOWROOMS
   Sending the address is the single most common thing a rep types by hand.

const SHOWROOMS_DEFAULT = {

  'Abu Dhabi': { name: 'Abu Dhabi showroom', address: 'The Club, Abu Dhabi',
    map: 'https://maps.google.com/?q=The+Club+Abu+Dhabi' }
};
const showrooms = () => Object.assign({}, SHOWROOMS_DEFAULT, (DB.config || {}).showrooms || {});
function showroomText(key) {
  const s = showrooms()[key];
  return s ? `\n\n📍 ${s.name}\n${s.address}\n${s.map}` : '';
}

/* ================================================================
   DUPLICATES
   Two rows for the same person is what an agency sheet and a walk-in log
   do to you. They are grouped by the same key the import dedupes on.
   ================================================================ */
function leadDupes(rows) {
  const by = new Map();
  rows.forEach(l => { const k = leadKey(l); if (!k) return; (by.get(k) || by.set(k, []).get(k)).push(l); });
  const out = [];
  by.forEach((group, k) => { if (group.length > 1) out.push({ key: k, rows:
    group.slice().sort((a, z) => String(a.createdAt || '').localeCompare(String(z.createdAt || ''))) }); });
  /* Same name, no phone and no email to tell them apart. */
  const byName = new Map();
  rows.forEach(l => {
    if (leadKey(l).charAt(0) !== 'n') return;
    const n = String(l.name || '').trim().toLowerCase(); if (!n) return;
    (byName.get(n) || byName.set(n, []).get(n)).push(l);
  });
  byName.forEach((group, n) => { if (group.length > 1 && !out.some(g => g.rows.includes(group[0])))
    out.push({ key: 'name:' + n, rows: group, weak: true }); });
  return out.sort((a, z) => z.rows.length - a.rows.length);
}
/* Keep the oldest — it holds the history — and fold everything the others
   learned into it before they go. */
function leadMerge(group) {
  const keep = group[0], rest = group.slice(1);
  batch(() => {
    rest.forEach(o => {
      ['company', 'phone', 'email', 'address', 'emirate', 'source', 'note', 'brief'].forEach(k => {
        if (!keep[k] && o[k]) keep[k] = o[k];
      });
      if (!keep.assignee && o.assignee) keep.assignee = o.assignee;
      if (o.priority) keep.priority = true;
      (o.updates || []).forEach(u => { keep.updates = keep.updates || []; keep.updates.push(u); });
      (o.touches || []).forEach(t => {
        const mine = (keep.touches || []).find(x => x.key === t.key);
        if (mine && mine.status === 'pending' && t.status !== 'pending') {
          mine.status = t.status; mine.waAt = mine.waAt || t.waAt; mine.sentAt = mine.sentAt || t.sentAt;
        }
      });
      if (!keep.engagedAt && o.engagedAt) keep.engagedAt = o.engagedAt;
      /* The furthest-along stage wins, so merging never walks a lead backwards. */
      if (MLEAD_STAGES.indexOf(o.stage) > MLEAD_STAGES.indexOf(keep.stage) &&
          !['Lost'].includes(o.stage)) keep.stage = o.stage;
      if (o.contactId && o.contactId !== keep.contactId) {
        const c = getCt(o.contactId); if (c && c.isLead && !c.dealIds) remove('contacts', c.id);
      }
      remove('leads', o.id);
    });
    keep.updates = (keep.updates || []).sort((a, z) => String(a.at).localeCompare(String(z.at)));
    leadAddUpdate(keep, `Merged ${rest.length} duplicate${rest.length === 1 ? '' : 's'} into this lead`, true);
    leadSave(keep);
  });
  render();
  toast(`Merged ${rest.length} duplicate${rest.length === 1 ? '' : 's'}`, 'ok');
}
/* ================================================================
   MARKETING LEADS — the screens
   ================================================================ */

const LEAD_TAG = { 'New':'', 'Contacted':'info', 'Engaged':'info', 'Demo booked':'good',
  'Won':'good', 'Lost':'bad', 'Referral':'warn' };

const LEAD_TABS = [['summary','Summary'],['active','All active leads'],['lost','Lost'],['dupes','Duplicates']];
const leadUniq = a => Array.from(new Set(a));

function viewLeads(root) {
  if (VIEW.leadOpen) { const l = getLead(VIEW.leadOpen); if (l) return leadDetail(root, l); VIEW.leadOpen = null; }
  const all = leadScope();
  const tab = VIEW.leadTab = VIEW.leadTab || 'summary';

  root.appendChild(viewHead(null, [
    sheetUrl() ? el('button', { class: 'btn', html: ico('sync',14) + ' Sync the sheet',
      title: 'Read the agency sheet now', onclick: () => sheetSync() }) : null,
    el('button', { class: 'btn', html: ico('dl',14) + ' Export', onclick: () => exportLeads(all) }),
    isReadOnly() ? null : el('button', { class: 'btn', html: ico('clip',14) + ' Import a list',
      onclick: leadImportModal }),
    isReadOnly() ? null : el('button', { class: 'btn', html: ico('link',14) + ' From the Sales Tracker',
      title: 'Read the marketing leads straight out of the tracker\u2019s OneDrive folder', onclick: migOpen }),
    isReadOnly() ? null : el('button', { class: 'btn primary', html: ico('plus',14) + ' New lead',
      onclick: () => leadEdit(null) })
  ]));

  /* ---- the tabs ---- */
  const lostAll = all.filter(l => l.stage === 'Lost');
  const dupes = leadDupes(all).length;
  const tabs = el('div', { class: 'leadtabs' });
  LEAD_TABS.forEach(([v, label]) => {
    const n = v === 'lost' ? lostAll.length : v === 'dupes' ? dupes : 0;
    tabs.appendChild(el('button', { class: 'lt' + (tab === v ? ' on' : '') + (v === 'lost' ? ' bad' : ''),
      text: label + (n ? ` (${n})` : ''),
      onclick: () => { VIEW.leadTab = v; render(); } }));
  });
  root.appendChild(tabs);

  if (tab === 'summary') return viewLeadSummary(root, all);
  if (tab === 'dupes')   return viewLeadDupes(root, all);

  /* ---- active and lost share one filter bar and one list ---- */
  const lost = tab === 'lost';
  const base = lost ? lostAll : all.filter(LEAD_ACTIVE);
  const f = VIEW.leadFilter = VIEW.leadFilter || {};
  root.appendChild(leadFilterBar(f, base, lost));

  let rows = base.slice();
  if (f.stage)   rows = rows.filter(l => l.stage === f.stage);
  if (f.not)     rows = rows.filter(l => l.stage !== f.not);
  if (f.region)  rows = rows.filter(l => (f.region === '__none' ? !l.region : l.region === f.region));
  if (f.type)    rows = rows.filter(l => l.type === f.type);
  if (f.rep)     rows = rows.filter(l => f.rep === '__none' ? !l.assignee : String(l.assignee) === f.rep);
  if (f.recon === 'yes')  rows = rows.filter(l => l.reconnect);
  if (f.recon === 'due')  rows = rows.filter(leadReconnectDue);
  if (f.recon === 'no')   rows = rows.filter(l => !l.reconnect);
  if (f.flag === 'due')       rows = rows.filter(leadIsDue);
  if (f.flag === 'awaiting')  rows = rows.filter(leadAwaiting);
  if (f.flag === 'priority')  rows = rows.filter(l => l.priority);
  if (f.flag === 'cold')      rows = rows.filter(l => l.cold);
  if (f.q) { const q = f.q.toLowerCase();
    rows = rows.filter(l => [l.name, l.company, l.phone, l.email, l.note, l.source, l.address]
      .some(v => String(v || '').toLowerCase().includes(q))); }

  /* Overdue first, then priority, then whatever moved most recently — the
     order a rep would put their own day in. */
  rows.sort((a, z) =>
    (leadIsDue(z) ? 1 : 0) - (leadIsDue(a) ? 1 : 0) ||
    (z.priority ? 1 : 0) - (a.priority ? 1 : 0) ||
    String(z.updatedAt || z.createdAt || '').localeCompare(String(a.updatedAt || a.createdAt || '')));

  if (!lost) {
    const needRep = base.filter(l => !l.assignee).length;
    if (needRep && !isReadOnly() && f.rep !== '__none') {

      n.appendChild(el('span', { class: 'ic', html: ico('warn',18) }));
      n.appendChild(el('div', { style: 'flex:1;line-height:1.5', html:
        `<b>${needRep} lead${needRep === 1 ? '' : 's'} could not be routed</b><div class="sub">` +
        'Nothing in the address or the note said which emirate, so nobody was picked.</div>' }));
      n.appendChild(el('button', { class: 'btn sm', text: 'Show only these',
        onclick: () => { VIEW.leadFilter = { rep: '__none' }; render(); } }));
      root.appendChild(n);
    }
  }

  const c = card(lost ? 'Lost leads' : 'Active leads',
    `${rows.length} of ${base.length}` + (lost ? ' · with the reason on each' : ' · anything overdue first'));
  if (!rows.length) {
    c.body.appendChild(el('div', { class: 'empty', html: ico('user',34) +
      '<h4>Nothing here</h4><p>' + (base.length ? 'No lead matches these filters.'
        : lost ? 'Nothing has been marked lost.'
        : 'Connect the agency sheet in Settings, import a list, or add one by hand.') + '</p>' }));
  } else {
    const list = el('div', { class: 'leadlist' });
    rows.slice(0, 300).forEach(l => list.appendChild(leadRow(l)));
    c.body.appendChild(list);
    if (rows.length > 300) c.body.appendChild(el('p', { class: 'sub', style: 'margin:var(--sp-3) 0 0',
      text: `Showing the first 300 of ${rows.length}. Narrow it with the filters above.` }));
  }
  root.appendChild(c.node);
}

/* One bar, both tabs. The two lists want the same questions asked of them —
   which rep, which emirate, which status — so they get the same controls. */
function leadFilterBar(f, base, lost) {
  const bar = el('div', { class: 'leadfilters' });

  q.addEventListener('input', debounce(e => { f.q = e.target.value; render(); }, 250));

    v => { f.stage = v || null; render(); }, 150));
