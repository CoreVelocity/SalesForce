    selected: demoNorm(d.outcome) === x.v || null })));
  const notes = el('textarea', { class: 'inp', rows: 2, value: d.notes || '',
    placeholder: 'Anything the rep needs to know before walking in' });

  modal(isNew ? 'Log a demo' : 'Edit demo', el('div', {}, [
    el('div', { class: 'field-row' }, [ fld('Date *', date), fld('Type', type) ]),
    fld('Rep who ran it *', own),
    fld('Supporting reps', sup.node, 'Everyone ticked here is credited with the demo as well.'),
    fld('Client *', client, 'The name as the team says it. Link the company below if it is already in the CRM.'),
    fld('Company', cp.node),
    el('div', { class: 'field-row' }, [ fld('Product shown', prod), fld('Location', loc) ]),
    fld('Outcome', out),
    fld('Notes', notes)
  ]), [
    el('button', { class: 'btn', text: 'Cancel', onclick: closeAll }),
    el('button', { class: 'btn primary', text: isNew ? 'Log it' : 'Save', onclick: () => {
      if (!date.value) { date.focus(); return toast('A date is required', 'err'); }
      if (!own.value) { own.focus(); return toast('Pick the rep who ran it', 'err'); }
      const co = cp.get();
      if (!client.value.trim() && !co) { client.focus(); return toast('A client name or a company is required', 'err'); }
      const rec = Object.assign({}, d, {
        date: date.value, ownerId: own.value, supportIds: sup.get().filter(x => x !== own.value),
        client: client.value.trim() || null, companyId: co || null,
        type: type.value, product: prod.value || null, location: loc.value.trim() || null,
        outcome: out.value, notes: notes.value.trim() || null,
        createdAt: d.createdAt || new Date().toISOString()
      });
      const saved = upsert('demos', rec);
      logAct({ dealId: saved.dealId || null, ownerId: saved.ownerId, kind: 'note',
        html: `${isNew ? 'Logged' : 'Updated'} a <b>${esc(saved.type || 'demo')}</b> demo for <b>${esc(demoClient(saved))}</b>` });
      closeAll(); render(); toast(isNew ? 'Demo logged' : 'Saved', 'ok');
    } })
  ]);
}

function exportDemos(rows) {
  const cols = [
    { h: 'Date', f: d => d.date || '' },
    { h: 'Week', f: d => demoWeekLabel(d.date) },
    { h: 'Rep', f: d => ownerName(d.ownerId) },
    { h: 'Supporting reps', f: d => demoSupport(d).map(ownerName).join(' / ') },
    { h: 'Client', f: d => demoClient(d) },
    { h: 'Company', f: d => (getCo(d.companyId) || {}).name || '' },
    { h: 'Type', f: d => d.type || '' },
    { h: 'Product', f: d => d.product || '' },
    { h: 'Location', f: d => d.location || '' },
    { h: 'Outcome', f: d => demoNorm(d.outcome) },
    { h: 'Deal', f: d => (getDl(d.dealId) || {}).name || '' },
    { h: 'Deal stage', f: d => d.dealId && getDl(d.dealId) ? stage(getDl(d.dealId).stageId).label : '' },
    { h: 'Updates', f: d => (d.updates || []).map(u => u.text).join(' | ') },
    { h: 'Notes', f: d => d.notes || '' }
  ];
  if (!rows.length) return toast('Nothing to export', 'err');
  download('corev-demos.csv', toCSV(rows, cols), 'text/csv');
  toast(`${rows.length} demos exported`, 'ok');
}
/* ================================================================
   DEMO REQUESTS — the event / on-site request queue from the tracker.

   A rep asks for a demo or an event; the office or an admin approves or
   declines it; an approved request becomes a logged demo without anyone
   retyping the client, the date or the devices. A rep sees and edits
   their own while it is still pending, and everyone with write access
   can raise one.
   ================================================================ */

const REQ_KINDS  = ['On-site demo', 'Event'];
const REQ_EVENTS = ['Pilot', 'Client activation', 'Event', 'Conditional POC'];
const REQ_STATUS = [
  { v: 'Pending',  tag: 'warn' },
  { v: 'Approved', tag: 'good' },
  { v: 'Declined', tag: 'bad' },
  { v: 'Done',     tag: '' }
];
const REQ_AUDIENCE = ['Members', 'Athletes', 'Clinicians', 'Hotel guests', 'Corporate', 'Press', 'VIP / Government'];
const reqStatus = r => (r && r.status) || 'Pending';
const reqTag = r => (REQ_STATUS.find(s => s.v === reqStatus(r)) || REQ_STATUS[0]).tag;
const reqIsMine = r => String(r.ownerId) === String(currentOwnerId());
/* a rep owns their request only while it is still pending */
const reqCanEdit = r => canManageDemos() ||
  (!isReadOnly() && reqIsMine(r) && reqStatus(r) === 'Pending');
const reqVisible = r => canManageDemos() || isReadOnly() || reqIsMine(r);

function reqScope() {
  return live('demoRequests')
    .filter(reqVisible)
    .filter(r => !VIEW.reqStatus || reqStatus(r) === VIEW.reqStatus)
    .filter(r => VIEW.rep === 'all' || String(r.ownerId) === VIEW.rep)
    .sort((a, z) => String(z.createdAt || '').localeCompare(String(a.createdAt || '')));
}

function viewRequests(root) {
  const rows = reqScope();
  const all = live('demoRequests').filter(reqVisible);

  root.appendChild(viewHead(null, [
    el('button', { class: 'btn', html: ico('dl',14) + ' Export', onclick: () => exportRequests(rows) }),
    isReadOnly() ? null : el('button', { class: 'btn primary', html: ico('plus',14) + ' Raise a request',
      onclick: () => editRequest(null) })
  ]));

  const pending = all.filter(r => reqStatus(r) === 'Pending');
  const t = el('div', { class: 'tiles' });
  t.appendChild(tile('Waiting on a decision', String(pending.length), { icon: 'cal',
    foot: pending.length ? `oldest raised ${fdate((pending.map(r => r.createdAt).sort()[0] || '').slice(0,10))}` : 'nothing outstanding',
    onclick: () => { VIEW.reqStatus = 'Pending'; render(); } }));
  t.appendChild(tile('Approved', String(all.filter(r => reqStatus(r) === 'Approved').length),
    { icon: 'check', foot: 'ready to run' }));
  t.appendChild(tile('Declined', String(all.filter(r => reqStatus(r) === 'Declined').length),
    { icon: 'x', foot: 'not going ahead' }));
  t.appendChild(tile('Committed spend', money(sum(all.filter(r => reqStatus(r) === 'Approved'), r => r.cost)),
    { cur: true, icon: 'bolt', foot: 'expected cost of approved requests' }));
  root.appendChild(t);

  if (canManageDemos() && pending.length) {
    const n = el('div', { class: 'alert', style: 'margin-bottom:var(--sp-3)' });
    n.appendChild(el('span', { class: 'ic', html: ico('warn',18) }));
    n.appendChild(el('div', { style: 'flex:1;min-width:0;line-height:1.5', html:
      `<b>${pending.length} request${pending.length === 1 ? '' : 's'} waiting on you</b>` +
      `<div class="sub">${esc(pending.slice(0,4).map(r => `${r.client} (${ownerName(r.ownerId)})`).join(', '))}${
        pending.length > 4 ? ` and ${pending.length - 4} more` : ''}</div>` }));
    root.appendChild(n);
  }

  root.appendChild(filterBar([
    selectFilter('Status', VIEW.reqStatus || '',
      [['', 'Every status']].concat(REQ_STATUS.map(s => [s.v, s.v])),
      v => { VIEW.reqStatus = v || null; render(); }, 150),
    VIEW.reqStatus ? el('button', { class: 'btn sm ghost', text: 'Clear',
      onclick: () => { VIEW.reqStatus = null; render(); } }) : null
  ]));

  if (!rows.length) {
    root.appendChild(el('div', { class: 'empty', html: ico('cal',34) +
      '<h4>No requests here</h4><p>' + (isReadOnly() ? 'Nothing has been raised yet.'
        : 'Raise one when a client wants a demo on their site, or when an event needs devices and people.') + '</p>' }));
    return;
  }

  const list = el('div', { class: 'reqlist' });
  rows.forEach(r => list.appendChild(requestCard(r)));
  root.appendChild(list);
}

function requestCard(r) {
  const n = el('div', { class: 'reqcard' + (reqStatus(r) === 'Pending' ? ' pending' : '') });
  n.appendChild(el('header', {}, [
    el('div', { style: 'min-width:0;flex:1' }, [
      el('div', { class: 'nm', text: r.client || 'Unnamed' }),
      el('div', { class: 'rl', html: `${esc(r.kind || 'On-site demo')}${r.eventType ? ' · ' + esc(r.eventType) : ''} · raised by ${
        esc(ownerName(r.ownerId))}${r.createdAt ? ' · ' + esc(fdate(r.createdAt)) : ''}` })
    ]),
    el('span', { class: 'tag ' + reqTag(r), text: reqStatus(r) })
  ]));
  const b = el('div', { class: 'b' });
  const kv = el('dl', { class: 'kvs' });
  const add = (k, v) => { kv.appendChild(el('dt', { text: k })); kv.appendChild(el('dd', { html: v })); };
  add('When', `${esc(fdate(r.startDate))}${r.endDate && r.endDate !== r.startDate ? ' – ' + esc(fdate(r.endDate)) : ''}`);
  if (r.location) add('Location', esc(r.location));
  if ((r.devices || []).length) add('Devices', esc(r.devices.join(' + ')));
  if (r.cost) add('Expected cost', `${CFG.currency} ${money(r.cost, { dash: false })}`);
  if (r.participants) add('Participating', esc(r.participants));
  b.appendChild(kv);
  if (r.details) b.appendChild(el('p', { style: 'margin:0 0 var(--sp-3);line-height:1.6;color:var(--ink-2)', text: r.details }));

  if (r.kind === 'Event') {
    const ev = el('div', { class: 'reqev' });
    const cell = (k, v) => ev.appendChild(el('div', {}, [
      el('span', { class: 'k', text: k }), el('span', { class: 'v', html: v }) ]));
    if (r.organizer) cell('Organiser & host', esc(r.organizer));
    if (r.opHours)   cell('Operating hours', esc(r.opHours));
    if (r.footfall)  cell('Expected footfall', money(r.footfall, { dash: false }));
    if (r.contact)   cell('Primary contact', esc(r.contact));
    if ((r.audience || []).length) cell('Audience', r.audience.map(a => `<span class="tag">${esc(a)}</span>`).join(' '));
    cell('VIP attending', r.vip ? 'Yes' : 'No');
    cell('Media coverage', r.media ? 'Yes' : 'No');
    if (r.leads || r.revenueOpp) cell('Expected outcome',
      [r.leads ? `${r.leads} leads` : '', r.revenueOpp ? `${CFG.currency} ${money(r.revenueOpp, {dash:false})} potential` : '']
        .filter(Boolean).join(' · '));
    cell('Budget confirmed', r.budgetConfirmed
      ? 'Yes' + (r.budgetAmount ? ` · ${CFG.currency} ${money(r.budgetAmount, {dash:false})}` : '') : 'No');
    if (r.strategic) cell('Strategic value', esc(r.strategic));
    b.appendChild(ev);
  }
  if (r.plan) {
    b.appendChild(el('label', { class: 'fl', text: 'Project plan' }));
    b.appendChild(el('p', { style: 'margin:0 0 var(--sp-3);line-height:1.6;color:var(--ink-2)', text: r.plan }));
  }
  if (r.commercial) {
    b.appendChild(el('label', { class: 'fl', text: 'Path to commercial' }));
    b.appendChild(el('p', { style: 'margin:0 0 var(--sp-3);line-height:1.6;color:var(--ink-2)', text: r.commercial }));
  }
  if (r.decisionNote) b.appendChild(el('p', { class: 'sub', style: 'margin:0 0 var(--sp-3);line-height:1.55',
    html: `<b>${esc(reqStatus(r))}</b>${r.decidedBy ? ' by ' + esc(String(r.decidedBy).split('@')[0]) : ''}${
      r.decidedAt ? ' · ' + esc(fdate(r.decidedAt)) : ''} — ${esc(r.decisionNote)}` }));

  const foot = el('div', { style: 'display:flex;gap:var(--sp-2);flex-wrap:wrap;align-items:center' });
  if (canManageDemos() && reqStatus(r) === 'Pending') {
    foot.appendChild(el('button', { class: 'btn sm primary', html: ico('check',12) + ' Approve',
      onclick: () => decideRequest(r, 'Approved') }));
    foot.appendChild(el('button', { class: 'btn sm', style: 'color:var(--critical-ink)',
      html: ico('x',12) + ' Decline', onclick: () => decideRequest(r, 'Declined') }));
  }
  if (canManageDemos() && reqStatus(r) === 'Approved' && !r.demoId) {
    foot.appendChild(el('button', { class: 'btn sm primary', html: ico('board',12) + ' Log it as a demo',
      title: 'Carries the client, date, devices and people straight into the demo log',
      onclick: () => requestToDemo(r) }));
  }
  if (r.demoId && live('demos').some(d => d.id === r.demoId)) {
    foot.appendChild(el('button', { class: 'btn sm', html: ico('board',12) + ' Open the demo',
      onclick: () => openDemo(r.demoId) }));
  }
  foot.appendChild(el('div', { style: 'flex:1' }));
  if (reqCanEdit(r)) foot.appendChild(el('button', { class: 'btn sm ghost', html: ico('edit',12) + ' Edit',
    onclick: () => editRequest(r) }));
  if (canManageDemos() || (reqIsMine(r) && reqStatus(r) === 'Pending' && !isReadOnly()))
    foot.appendChild(el('button', { class: 'btn sm ghost', style: 'color:var(--critical-ink)',
      html: ico('trash',12), 'aria-label': 'Delete',
      onclick: () => confirmDo('Delete this request', `The ${r.kind || 'request'} for ${r.client} is removed for everyone.`,
        'Delete', () => { remove('demoRequests', r.id); render(); toast('Request deleted'); }) }));
  b.appendChild(foot);
  n.appendChild(b);
  return n;
}

function decideRequest(r, status) {
  const note = el('textarea', { class: 'inp', rows: 2,
    placeholder: status === 'Approved' ? 'Anything the rep should know — budget caveats, dates, who is coming.'
                                       : 'Why not, and what would change the answer.' });
  modal(`${status === 'Approved' ? 'Approve' : 'Decline'} — ${r.client}`, el('div', {}, [
    el('p', { style: 'margin:0 0 var(--sp-4);color:var(--ink-2);line-height:1.6', html:
      `${esc(ownerName(r.ownerId))} raised this ${esc((r.kind || 'request').toLowerCase())} for <b>${esc(r.client)}</b>` +
      `${r.startDate ? ` on <b>${esc(fdate(r.startDate))}</b>` : ''}${r.cost ? `, expected to cost <b>${CFG.currency} ${money(r.cost, {dash:false})}</b>` : ''}.` +
      (status === 'Approved' ? ' Approving it lets the office log it as a demo in one click.' : '') }),
    fld(status === 'Declined' ? 'Reason *' : 'Note', note)
  ]), [
    el('button', { class: 'btn', text: 'Cancel', onclick: closeAll }),
    el('button', { class: 'btn primary', text: status, onclick: () => {
      if (status === 'Declined' && !note.value.trim()) { note.focus(); return toast('A declined request needs a reason', 'err'); }
      r.status = status;
      r.decisionNote = note.value.trim() || null;
      r.decidedBy = (AUTH.user && AUTH.user.username) || 'local';
      r.decidedAt = new Date().toISOString();
      upsert('demoRequests', r);
      closeAll(); render(); toast(`Request ${status.toLowerCase()}`, status === 'Approved' ? 'ok' : '');
    } })
  ]);
}

/* An approved request already holds everything a demo needs, so it carries
   across rather than being typed a second time. */
function requestToDemo(r) {
  const date = el('input', { class: 'inp', type: 'date', value: (r.startDate || TODAY()).slice(0, 10) });
  const own = ownerSelect(r.ownerId, { emptyLabel: 'Pick the rep' });
  const type = el('select', { class: 'inp' });
  DEMO_TYPES.forEach(t => type.appendChild(el('option', { value: t, text: t,
    selected: (r.kind === 'Event' ? 'Trade Show' : 'On-site') === t || null })));
  modal('Log it as a demo', el('div', {}, [
    el('p', { style: 'margin:0 0 var(--sp-4);color:var(--ink-2);line-height:1.6', html:
      `<b>${esc(r.client)}</b> comes across with its date, devices and people. The outcome starts as pending — ` +
      'whoever runs it fills that in afterwards.' }),
    el('div', { class: 'field-row' }, [ fld('Date', date), fld('Type', type) ]),
    fld('Rep running it', own)
  ]), [
    el('button', { class: 'btn', text: 'Cancel', onclick: closeAll }),
    el('button', { class: 'btn primary', text: 'Log the demo', onclick: () => {
      const d = upsert('demos', {
        date: date.value, ownerId: own.value || r.ownerId, supportIds: [],
        client: r.client, companyId: r.companyId || null,
        type: type.value, product: (r.devices || []).join(' + ') || null,
        location: r.location || null, outcome: 'Pending',
        notes: [r.details, r.participants ? 'Participating: ' + r.participants : '']
          .filter(Boolean).join('\n'),
        requestId: r.id, createdAt: new Date().toISOString()
      });
      r.demoId = d.id; r.status = 'Done';
      upsert('demoRequests', r);
      closeAll(); render(); toast('Demo logged from the request', 'ok');
    } })
  ]);
}

function editRequest(r) {
  if (isReadOnly()) return toast('You have read-only access', 'err');
  const isNew = !r;
  if (r && !reqCanEdit(r)) return toast('That request has already been decided', 'err');
  r = r || { kind: 'On-site demo', status: 'Pending', devices: [], audience: [] };

  const kind = el('select', { class: 'inp', onchange: () => paintKind() });
  REQ_KINDS.forEach(k => kind.appendChild(el('option', { value: k, text: k, selected: r.kind === k || null })));
  const own = ownerSelect(r.ownerId || currentOwnerId(), { emptyLabel: 'Who is asking' });
  const client = el('input', { class: 'inp', value: r.client || '', placeholder: 'e.g. Emirates Wellness Group' });
  const cp = coPicker(r.companyId);
  const details = el('textarea', { class: 'inp', rows: 3, value: r.details || '',
    placeholder: 'The opportunity, the scope and what this is meant to achieve' });
  const start = el('input', { class: 'inp', type: 'date', value: (r.startDate || TODAY()).slice(0,10) });
  const end = el('input', { class: 'inp', type: 'date', value: (r.endDate || r.startDate || TODAY()).slice(0,10) });
  const loc = el('input', { class: 'inp', value: r.location || '', placeholder: 'Dubai, Abu Dhabi, outside the UAE…' });
  const commercial = el('input', { class: 'inp', value: r.commercial || '',
    placeholder: 'The deal or quote this leads to, or who owns the close' });
  const plan = el('textarea', { class: 'inp', rows: 3, value: r.plan || '',
    placeholder: 'Milestones, logistics, setup and teardown, dependencies' });
  const participants = el('input', { class: 'inp', value: r.participants || '',
    placeholder: 'e.g. Wafiq leading, Jawdat supporting, two client stakeholders' });
  const cost = el('input', { class: 'inp', type: 'number', min: '0', step: '100', value: r.cost || '' });
  const devs = el('div', { class: 'sigs' });
  const devSet = new Set(r.devices || []);
  unitLines().forEach(L => {
    const on = devSet.has(L);
    devs.appendChild(el('button', { class: 'sig' + (on ? ' on' : ''), text: L, 'aria-pressed': on ? 'true' : 'false',
      onclick: e => { const b = e.currentTarget;
        if (devSet.has(L)) devSet.delete(L); else devSet.add(L);
        b.classList.toggle('on', devSet.has(L)); b.setAttribute('aria-pressed', devSet.has(L) ? 'true' : 'false'); } }));
  });

  /* event-only */
  const evType = el('select', { class: 'inp' });
  REQ_EVENTS.forEach(x => evType.appendChild(el('option', { value: x, text: x, selected: r.eventType === x || null })));
  const organizer = el('input', { class: 'inp', value: r.organizer || '', placeholder: 'Who is running it, and who hosts' });
  const opHours = el('input', { class: 'inp', value: r.opHours || '', placeholder: 'e.g. 10:00–22:00, three days' });
  const footfall = el('input', { class: 'inp', type: 'number', min: '0', step: '100', value: r.footfall || '' });
  const contact = el('input', { class: 'inp', value: r.contact || '', placeholder: 'Name and role on the client side' });
  const aud = el('div', { class: 'sigs' });
  const audSet = new Set(r.audience || []);
  REQ_AUDIENCE.forEach(a => {
    const on = audSet.has(a);
    aud.appendChild(el('button', { class: 'sig' + (on ? ' on' : ''), text: a, 'aria-pressed': on ? 'true' : 'false',
      onclick: e => { const b = e.currentTarget;
        if (audSet.has(a)) audSet.delete(a); else audSet.add(a);
        b.classList.toggle('on', audSet.has(a)); b.setAttribute('aria-pressed', audSet.has(a) ? 'true' : 'false'); } }));
  });
  const vip = el('select', { class: 'inp' });
  const media = el('select', { class: 'inp' });
  const budget = el('select', { class: 'inp', onchange: () => { budgetAmt.parentElement.style.display = budget.value === '1' ? '' : 'none'; } });
  [['0','No'],['1','Yes']].forEach(([v, l]) => {
    vip.appendChild(el('option', { value: v, text: l, selected: String(r.vip ? 1 : 0) === v || null }));
    media.appendChild(el('option', { value: v, text: l, selected: String(r.media ? 1 : 0) === v || null }));
    budget.appendChild(el('option', { value: v, text: l, selected: String(r.budgetConfirmed ? 1 : 0) === v || null }));
  });
  const budgetAmt = el('input', { class: 'inp', type: 'number', min: '0', step: '1000', value: r.budgetAmount || '' });
  const leads = el('input', { class: 'inp', type: 'number', min: '0', step: '1', value: r.leads || '' });
  const revenue = el('input', { class: 'inp', type: 'number', min: '0', step: '1000', value: r.revenueOpp || '' });
  const strategic = el('input', { class: 'inp', value: r.strategic || '',
    placeholder: 'Relationships or positioning this opens up' });

  const evBox = el('div', { class: 'card', style: 'margin:var(--sp-3) 0 0;background:var(--surface-2)' }, [
    el('h3', { text: 'Event details' }),
    el('p', { class: 'sub', style: 'margin:4px 0 var(--sp-3)', text: 'Only asked for when the request is an event.' }),
    el('div', { class: 'field-row' }, [ fld('Event type', evType), fld('Operating hours', opHours) ]),
    fld('Organiser & host', organizer),
    el('div', { class: 'field-row' }, [ fld('Expected footfall', footfall), fld('Primary contact', contact) ]),
    fld('Audience', aud),
    el('div', { class: 'field-row' }, [ fld('VIP attending', vip), fld('Media coverage', media) ]),
    el('div', { class: 'field-row' }, [ fld('Expected leads', leads), fld(`Potential revenue (${CFG.currency})`, revenue) ]),
    fld('Strategic value', strategic),
    el('div', { class: 'field-row' }, [ fld('Budget confirmed', budget),
      fld(`Confirmed budget (${CFG.currency})`, budgetAmt) ])
  ]);
  function paintKind() { evBox.style.display = kind.value === 'Event' ? '' : 'none'; }
  paintKind();

  modal(isNew ? 'Raise a request' : 'Edit request', el('div', {}, [
    el('div', { class: 'field-row' }, [ fld('Request type', kind), fld('Raised by', own) ]),
    fld('Client *', client),
    fld('Company', cp.node),
    fld('Details *', details),
    el('div', { class: 'field-row' }, [ fld('Expected start *', start), fld('Expected end', end) ]),
    el('div', { class: 'field-row' }, [ fld('Location', loc), fld(`Expected cost (${CFG.currency})`, cost) ]),
    fld('Devices needed', devs),
    fld('Who will be participating', participants),
    fld('Path to commercial', commercial),
    fld('Project plan', plan),
    evBox
  ]), [
    el('button', { class: 'btn', text: 'Cancel', onclick: closeAll }),
    el('button', { class: 'btn primary', text: isNew ? 'Submit' : 'Save', onclick: () => {
      if (!client.value.trim()) { client.focus(); return toast('A client name is required', 'err'); }
      if (!details.value.trim()) { details.focus(); return toast('Say what the request is for', 'err'); }
      if (!start.value) { start.focus(); return toast('An expected start date is required', 'err'); }
      if (end.value && end.value < start.value) { end.focus(); return toast('The end date is before the start', 'err'); }
      const rec = Object.assign({}, r, {
        kind: kind.value, ownerId: own.value || currentOwnerId(),

/* ================================================================
   OUTLOOK IMPORT — the shared demo calendar.

   Every non-cancelled event on demo@core-velocity.com is a demo by
   convention, so nothing is keyword-matched. The organiser becomes the
   primary rep, internal attendees become supporting reps, the first
   external attendee names the client when the subject does not, and
   anything the convention missed is shown as a warning rather than
   quietly guessed. Nothing is written until the list is confirmed.
   ================================================================ */
const OUTLOOK_LOOKBACK = 14;
let OUTLOOK = { candidates: [], busy: false };

async function calendarToken() {
  if (!AUTH.msal || !AUTH.user) throw new Error('Sign in with your Microsoft account first.');
  const req = { scopes: CFG.calendarScopes, account: AUTH.msal.getActiveAccount() };
  try { return (await AUTH.msal.acquireTokenSilent(req)).accessToken; }
  catch (e) { return (await AUTH.msal.acquireTokenPopup(req)).accessToken; }
}
const repByEmail = mail => {
  const m = String(mail || '').toLowerCase();
  if (!m) return null;
  return DB.owners.find(o => (o.email || '').toLowerCase() === m) || null;
};
function outlookGuessType(loc) {
  const s = String(loc || '').toLowerCase();
  if (/teams|zoom|meet|virtual|online|webex/.test(s)) return 'Virtual';
  if (/showroom|office|hq|core[\s-]?velocity/.test(s)) return 'Showroom';
  if (/expo|trade ?show|conference|exhibition|gitex/.test(s)) return 'Trade Show';
  return 'On-site';
}
/* the booking convention is "<Client> — <Product>" */
function outlookParseSubject(subject) {
  const s = String(subject || '').replace(/^\s*(demo|oxefit)\s*[:\-–]\s*/i, '').trim();
  const parts = s.split(/\s+[—–\-|]\s+/);
  const out = { client: (parts[0] || '').trim(), product: null };
  const tail = (parts[1] || '').trim();
  if (tail) {
    const hit = demoProducts().find(p => p.toLowerCase() === tail.toLowerCase()) ||
                unitLines().find(L => new RegExp('\\b' + L + '\\b', 'i').test(tail));
    out.product = hit || null;
  }
  if (!out.product) {
    const hit = unitLines().filter(L => new RegExp('\\b' + L + '\\b', 'i').test(s));
    if (hit.length) out.product = hit.length > 1 ? hit.join(' + ') : hit[0];
  }
  return out;
}
function outlookMap(ev) {
  const startRaw = ev.start && ev.start.dateTime;
  const date = startRaw ? String(startRaw).slice(0, 10) : TODAY();
  let primary = repByEmail(ev.organizer && ev.organizer.emailAddress && ev.organizer.emailAddress.address);
  const support = [], external = [];
  (ev.attendees || []).forEach(a => {
    const em = a && a.emailAddress && a.emailAddress.address;
    if (!em) return;
    if (em.toLowerCase() === CFG.demoCalendar.toLowerCase()) return;
    const rep = repByEmail(em);
    if (rep) { if (!primary) primary = rep; else if (rep.id !== primary.id) support.push(rep.id); }
    else if (!/@core-velocity\.com$/i.test(em)) external.push(a.emailAddress);
  });
  const parsed = outlookParseSubject(ev.subject || '');
  let client = parsed.client;
  if (!client && external.length) client = external[0].name || (external[0].address || '').split('@')[0];
  const location = (ev.location && ev.location.displayName) || '';
  const co = client ? live('companies').find(c =>
    (c.name || '').toLowerCase() === client.toLowerCase()) : null;

  const warn = [];
  if (!primary) warn.push('The organiser is not a rep on the team list — pick one.');
  if (!client) warn.push('No client name in the subject. The convention is “Client — Product”.');
  if (!parsed.product) warn.push('No product in the subject.');
  const dupe = live('demos').find(d => d.calendarId === ev.id) ||
    live('demos').find(d => d.date === date && demoClient(d).toLowerCase() === String(client || '').toLowerCase());
  return { ev, id: ev.id, date, ownerId: primary ? primary.id : '', supportIds: support,
    client: client || '', companyId: co ? co.id : null, product: parsed.product,
    type: outlookGuessType(location), location, subject: ev.subject || '',
    warn, dupe: dupe || null, take: !dupe };
}
async function outlookFetch(days) {
  const tok = await calendarToken();
  const end = new Date(), start = new Date();
  start.setDate(start.getDate() - Math.max(1, Math.min(90, days || OUTLOOK_LOOKBACK)));
  const params = new URLSearchParams({
    startDateTime: start.toISOString(), endDateTime: end.toISOString(), '$top': '100',
    '$select': 'id,subject,bodyPreview,start,end,location,organizer,attendees,isCancelled',
    '$orderby': 'start/dateTime desc'
  });
  let url = `https://graph.microsoft.com/v1.0/users/${encodeURIComponent(CFG.demoCalendar)}/calendarView?${params}`;
  const out = [];
  while (url && out.length < 400) {
    const res = await fetch(url, { headers: { Authorization: 'Bearer ' + tok, Prefer: 'outlook.timezone="UTC"' } });
    if (!res.ok) {
      if (res.status === 403) throw new Error(
        `No access to the ${CFG.demoCalendar} calendar. It has to be shared with you at Reviewer level or better, and the app needs the Calendars.Read.Shared permission consented.`);
      if (res.status === 404) throw new Error(`No mailbox called ${CFG.demoCalendar}. Check the address in the code.`);
      throw new Error(`Microsoft Graph returned ${res.status}.`);
    }
    const j = await res.json();
    (j.value || []).forEach(e => { if (!e.isCancelled) out.push(e); });
    url = j['@odata.nextLink'] || null;
  }
  return out;
}

async function outlookImport() {
  if (!canManageDemos()) return toast('Only the office or an admin can import demos', 'err');
  if (OUTLOOK.busy) return;
  if (!AUTH.user) return toast('Sign in with Microsoft first — the calendar is read over your account', 'err');
  OUTLOOK.busy = true;
  toast('Reading the demo calendar…');
  try {
    const events = await outlookFetch(OUTLOOK_LOOKBACK);
    OUTLOOK.candidates = events.map(outlookMap);
    outlookPicker();
  } catch (e) {
    modal('The calendar could not be read', el('div', {}, [
      el('p', { style: 'margin:0;line-height:1.65;color:var(--ink-2)', text: String(e && e.message || e) }),
      el('p', { class: 'sub', style: 'margin:var(--sp-3) 0 0;line-height:1.55', html:
        `The import reads <b>${esc(CFG.demoCalendar)}</b> over Microsoft Graph and needs the ` +
        '<b>Calendars.Read.Shared</b> permission on the app registration, consented once by an administrator. ' +
        'Until then demos can still be logged by hand.' })
    ]), [ el('button', { class: 'btn primary', text: 'Close', onclick: closeAll }) ]);
  } finally { OUTLOOK.busy = false; }
}

function outlookPicker() {
  const list = el('div', { class: 'picklist', style: 'max-height:52vh' });
  const bar = el('div', { class: 'picksum' });
  const cands = OUTLOOK.candidates;
  function paint() {
    list.innerHTML = '';

      text: `Nothing on ${CFG.demoCalendar} in the last ${OUTLOOK_LOOKBACK} days.` }));

      row.appendChild(el('input', { type: 'checkbox', checked: c.take || null,

      const mid = el('div', { style: 'flex:1;min-width:0' });

      mid.appendChild(el('div', { class: 'sub', html:
        `${esc(fdate(c.date))} · ${esc(c.type)}${c.location ? ' · ' + esc(c.location) : ''}` +

        `${c.supportIds.length ? ' + ' + esc(c.supportIds.map(ownerName).join(', ')) : ''}` +
        `${c.product ? ' · ' + esc(c.product) : ''}` }));
      if (c.dupe) mid.appendChild(el('div', { class: 'sub', style: 'color:var(--warning)',

      c.warn.forEach(w => mid.appendChild(el('div', { class: 'sub', style: 'color:var(--warning)', text: w })));
      row.appendChild(mid);
      if (!c.ownerId) {
        const sel = ownerSelect('', { emptyLabel: 'Pick a rep',
          onchange: e => { c.ownerId = e.target.value; paint(); updateSum(); } });
        sel.style.width = '150px'; sel.style.flex = 'none';

      list.appendChild(row);

  }
  function updateSum() {
    const n = cands.filter(c => c.take).length;

    bar.innerHTML = `<b>${n}</b> of ${cands.length} selected` +

    const go = $('#olgo');

  }
  paint();
  modal(`Demos on ${CFG.demoCalendar}`, el('div', {}, [
    el('p', { style: 'margin:0 0 var(--sp-4);color:var(--ink-2);line-height:1.6', html:
      `The last ${OUTLOOK_LOOKBACK} days. Every event on this calendar is treated as a demo — that is the booking ` +
      'convention, so nothing is filtered by keyword. The organiser becomes the rep who ran it and internal ' +
      'attendees are credited as supporting. Nothing is written until you import.' }),
    bar, list
  ]), [
    el('button', { class: 'btn', text: 'Cancel', onclick: closeAll }),
    el('button', { class: 'btn primary', id: 'olgo', disabled: true, text: 'Import', onclick: () => {
      const take = cands.filter(c => c.take && c.ownerId);
      if (!take.length) return;
      batch(() => take.forEach(c => {
        upsert('demos', { date: c.date, ownerId: c.ownerId, supportIds: c.supportIds,
          client: c.client || c.subject, companyId: c.companyId, type: c.type,
          product: c.product, location: c.location || null, outcome: 'Pending',
          calendarId: c.id, createdAt: new Date().toISOString() });
      }));
      closeAll(); render();
      toast(`${take.length} demo${take.length === 1 ? '' : 's'} imported from the calendar`, 'ok');
    } })
  ], true);
  updateSum();
}

function editOwner(o) {
  const isNew = !o;
  o = o || { id: uid('O'), active: true, role: 'rep' };
  const nm = el('input', { class: 'inp', value: o.name || '' });
  const em = el('input', { class: 'inp', type: 'email', value: o.email || '', placeholder: 'name@core-velocity.com' });
  const rl = el('select', { class: 'inp' });
  ROLES.forEach(([v, l]) => rl.appendChild(el('option', { value: v, text: l,
    selected: (ROLE_MAP[o.role] || 'write') === v || null })));
  const rg = el('select', { class: 'inp' });
  rg.appendChild(el('option', { value: '', text: 'Not set' }));
  salesRegions().forEach(r => rg.appendChild(el('option', { value: r, text: r,
    selected: o.salesRegion === r || null })));
  const ac = el('select', { class: 'inp' });
  [['1','Active'],['0','Inactive']].forEach(([v,l]) =>
    ac.appendChild(el('option', { value: v, text: l, selected: String(o.active ? 1 : 0) === v || null })));
  const b = periodBounds();
  const tg = el('input', { class: 'inp', type: 'number',
    value: ((DB.config.targets || {})[o.id] || {})[b.label] || '' });
  modal(isNew ? 'Add person' : 'Edit ' + o.name, el('div', {}, [
    fld('Full name *', nm),
    fld('Microsoft email', em, 'Used to match the signed-in user to this record, so "New deal" defaults to the right owner.'),
    el('div', { class: 'field-row' }, [ fld('Role', rl), fld('Status', ac) ]),
    el('p', { class: 'sub', style: 'margin:-6px 0 var(--sp-4);line-height:1.55',
      html: ROLES.map(([v, l, d]) => `<b>${esc(l)}</b> — ${esc(d)}`).join('<br>') }),
    fld('Sales region', rg, 'Groups this person under Dubai, Abu Dhabi or International in the monthly review. Edit the list in the Sales regions card.'),
    fld(`Target for ${b.label} (${CFG.currency})`, tg,
      `Targets are stored against the period you are looking at — right now ${b.label}. Switch the period filter at the top and edit again to set another one.`)
  ]), [
    isNew ? null : el('button', { class: 'btn danger', html: ico('trash',14) + ' Remove',
      onclick: () => removePerson(o) }),
    el('div', { style: 'flex:1' }),
    el('button', { class: 'btn', text: 'Cancel', onclick: closeAll }),
    el('button', { class: 'btn primary', text: isNew ? 'Add' : 'Save', onclick: () => {
      if (!nm.value.trim()) { nm.focus(); return toast('A name is required', 'err'); }
      o.name = nm.value.trim(); o.email = em.value.trim() || null;
      /* Never let the last admin demote themselves out of Settings. */
      if (rl.value !== 'admin' && (ROLE_MAP[o.role] || '') === 'admin' &&
          !DB.owners.some(x => x.id !== o.id && (ROLE_MAP[x.role] || '') === 'admin' && x.active !== false)) {
        rl.focus(); return toast('This is the only admin — make someone else an admin first', 'err');
      }
      o.role = rl.value; o.active = ac.value === '1';
      o.salesRegion = rg.value || null;
      o.initials = initials(o.name);
      if (isNew) DB.owners.push(o);
      DB.config.targets = DB.config.targets || {};
      DB.config.targets[o.id] = DB.config.targets[o.id] || {};
      if (tg.value === '') delete DB.config.targets[o.id][b.label];
      else DB.config.targets[o.id][b.label] = Number(tg.value);
      DB.config._v = now(); touch('config');
      closeAll(); render(); toast(isNew ? 'Person added' : 'Saved', 'ok');
    } })
  ].filter(Boolean));
}

    const cs = collabsOf(d).filter(x => !set.has(String(x)));
    if (cs.length !== collabsOf(d).length) { d.collaboratorIds = cs; d.collaboratorId = null; touched = true; }
    if (touched) { upsert('deals', d); n++; }
  });
  ['contacts','companies','tasks'].forEach(shard => {
    live(shard).forEach(r => {
      if (!set.has(String(r.ownerId))) return;
      r.ownerId = toId; upsert(shard, r); n++;
    });
  });
  });
  return n;
}

const NORM = s => String(s || '').toLowerCase().replace(/[^a-z0-9]/g, '');
function pick(row, hdr, names) {
  for (const n of names) {
    const i = hdr.indexOf(NORM(n));
    if (i >= 0 && String(row[i]).trim() !== '') return String(row[i]).trim();
  }
  return null;
}
function importCSV(kind, rows) {
  if (rows.length < 2) throw new Error('that file has no data rows');
  const hdr = rows[0].map(NORM);
  const data = rows.slice(1);
  let added = 0, updated = 0;
  const numOf = v => { if (v == null) return null; const n = Number(String(v).replace(/[^0-9.\-]/g,'')); return isNaN(n) ? null : n; };
  const dateOf = v => {
    if (!v) return null;
    const s = String(v).trim();
    if (/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0,10);
    const d = new Date(s);
    return isNaN(d) ? null : d.toISOString().slice(0,10);
  };
  const ownerOf = v => {
    if (!v) return null;
    const s = String(v).trim().toLowerCase();
    const o = DB.owners.find(x => x.id === s || (x.email || '').toLowerCase() === s || x.name.toLowerCase() === s);
    return o ? o.id : null;
  };
  data.forEach(r => {
    if (kind === 'companies') {
      const hsid = pick(r, hdr, ['record id','hubspot id','companyid','id']);
      const name = pick(r, hdr, ['company name','name','company']);
      if (!name && !hsid) return;
      let c = (hsid && live('companies').find(x => x.hubspotId === hsid)) ||
              live('companies').find(x => NORM(x.name) === NORM(name));
      const patch = {
        name: name || (c && c.name), hubspotId: hsid || (c && c.hubspotId) || null,
        domain: pick(r, hdr, ['company domain name','domain','website']) || (c && c.domain) || null,
        phone: pick(r, hdr, ['phone number','phone']) || (c && c.phone) || null,
        city: pick(r, hdr, ['city']) || (c && c.city) || null,
        country: pick(r, hdr, ['country/region','country']) || (c && c.country) || null,
        industry: pick(r, hdr, ['industry']) || (c && c.industry) || null,
        lifecycleStage: pick(r, hdr, ['lifecycle stage','lifecyclestage']) || (c && c.lifecycleStage) || null,
        ownerId: ownerOf(pick(r, hdr, ['company owner','owner','hubspot owner id'])) || (c && c.ownerId) || null,
        createdAt: dateOf(pick(r, hdr, ['create date','created'])) || (c && c.createdAt) || TODAY()
      };
      if (c) { upsert('companies', Object.assign(c, patch)); updated++; }
      else { upsert('companies', patch); added++; }
    }
    if (kind === 'contacts') {
      const hsid = pick(r, hdr, ['record id','hubspot id','contactid','id']);
      const email = pick(r, hdr, ['email','email address']);
      const fn = pick(r, hdr, ['first name','firstname']);
      const ln = pick(r, hdr, ['last name','lastname']);
      const full = pick(r, hdr, ['name','full name','contact']) || [fn, ln].filter(Boolean).join(' ');
      if (!email && !full && !hsid) return;
      let c = (hsid && live('contacts').find(x => x.hubspotId === hsid)) ||
              (email && live('contacts').find(x => (x.email || '').toLowerCase() === email.toLowerCase()));
      const coName = pick(r, hdr, ['company name','associated company','company']);
      const co = coName ? live('companies').find(x => NORM(x.name) === NORM(coName)) : null;
      const patch = {
        hubspotId: hsid || (c && c.hubspotId) || null,
        firstName: fn || (c && c.firstName) || null, lastName: ln || (c && c.lastName) || null,
        fullName: full || (c && c.fullName) || email,
        email: email || (c && c.email) || null,
        phone: pick(r, hdr, ['phone number','phone','mobile phone number']) || (c && c.phone) || null,
        jobTitle: pick(r, hdr, ['job title','jobtitle','title']) || (c && c.jobTitle) || null,
        city: pick(r, hdr, ['city']) || (c && c.city) || null,
        country: pick(r, hdr, ['country/region','country']) || (c && c.country) || null,
        lifecycleStage: pick(r, hdr, ['lifecycle stage','lifecyclestage']) || (c && c.lifecycleStage) || null,
        leadStatus: pick(r, hdr, ['lead status','hs lead status']) || (c && c.leadStatus) || null,
        ownerId: ownerOf(pick(r, hdr, ['contact owner','owner','hubspot owner id'])) || (c && c.ownerId) || null,
        companyId: (co && co.id) || (c && c.companyId) || null,
        createdAt: dateOf(pick(r, hdr, ['create date','created'])) || (c && c.createdAt) || TODAY(),
        dealIds: (c && c.dealIds) || []
      };
      if (c) { upsert('contacts', Object.assign(c, patch)); updated++; }
      else { upsert('contacts', patch); added++; }
    }
    if (kind === 'deals') {
      const hsid = pick(r, hdr, ['record id','hubspot id','dealid','id']);
      const name = pick(r, hdr, ['deal name','name','deal']);
      if (!name && !hsid) return;
      let d = (hsid && live('deals').find(x => x.hubspotId === hsid)) ||
              live('deals').find(x => NORM(x.name) === NORM(name));
      const stLbl = pick(r, hdr, ['deal stage','stage','dealstage']);
      const st = stLbl ? (DB.stages.find(s => NORM(s.label) === NORM(stLbl)) ||
                          DB.stages.find(s => NORM(s.id) === NORM(stLbl))) : null;
      const coName = pick(r, hdr, ['associated company','company name','company']);
      const co = coName ? live('companies').find(x => NORM(x.name) === NORM(coName)) : null;
      const patch = {
        hubspotId: hsid || (d && d.hubspotId) || null,
        name: name || (d && d.name),
        stageId: (st && st.id) || (d && d.stageId) || (openStages()[0] || {}).id,
        amount: numOf(pick(r, hdr, ['amount','amount in company currency','deal amount','value'])) ?? (d ? d.amount : null),
        currency: CFG.currency,
        closeDate: dateOf(pick(r, hdr, ['close date','closedate'])) || (d && d.closeDate) || null,
        createdAt: dateOf(pick(r, hdr, ['create date','created'])) || (d && d.createdAt) || TODAY(),
        ownerId: ownerOf(pick(r, hdr, ['deal owner','owner','hubspot owner id'])) || (d && d.ownerId) || null,
        dealType: pick(r, hdr, ['deal type','dealtype','type']) || (d && d.dealType) || null,
        priority: (pick(r, hdr, ['priority']) || (d && d.priority) || '').toLowerCase() || null,
        lossReason: pick(r, hdr, ['closed lost reason','loss reason']) || (d && d.lossReason) || null,
        nextStep: pick(r, hdr, ['next step','next activity']) || (d && d.nextStep) || null,
        companyId: (co && co.id) || (d && d.companyId) || null,
        contactIds: (d && d.contactIds) || [], notes: (d && d.notes) || []
      };
      if (d) { upsert('deals', Object.assign(d, patch)); updated++; }
      else { upsert('deals', patch); added++; }
    }
  });
  reindex();
  return { added, updated };
}

/* Orders are renumbered from what is on screen before the swap, so a team that

function moveRep(region, id, dir) {
  const people = activeOwners().filter(o => ownerRegion(o.id) === region);
  const i = people.findIndex(o => String(o.id) === String(id)), j = i + dir;
  if (i < 0 || j < 0 || j >= people.length) return;
  people.splice(j, 0, people.splice(i, 1)[0]);

  DB.config._v = now(); touch('config');
  render();
}

    SYNC.err = null; renderSyncBadge();
  } catch (e) {
    modal('The folder could not be reached', el('div', {}, [
      el('p', { style: 'margin:0 0 var(--sp-4);line-height:1.65;color:var(--ink-2)', text: String(e.message || e) }),
      el('p', { class: 'sub', style: 'margin:0;line-height:1.65', html:
        `Two things have to be true. <b>One:</b> <span class="mono">${esc(driveRoot())}</span> exists in ` +
        `<span class="mono">${esc(driveOwner())}</span>'s OneDrive — the tool creates the missing parts itself if it ` +
        `can write there. <b>Two:</b> <span class="mono">${esc(String(driveRoot()).split('/')[0])}</span> is shared ` +
        'with the person signed in, with edit rights — "Can edit", not "Can view". Once shared it shows up under ' +
        'Shared with me, and the tool finds it either way.' })
    ]), [ el('button', { class: 'btn primary', text: 'Close', onclick: closeAll }) ]);
  }
}
function editDriveOwner() {
  const v = el('input', { class: 'inp', value: driveOwner() || '', placeholder: 'demo@core-velocity.com' });
  const f = el('input', { class: 'inp', value: driveRoot() || '', placeholder: 'OXEFIT/CoreVCRM' });
  modal('Where the data lives', el('div', {}, [
    el('p', { style: 'margin:0 0 var(--sp-4);line-height:1.65;color:var(--ink-2)', html:
      'Every copy of the tool reads and writes one folder in one account. Everyone signed in sees the same records ' +
      'because they are all pointed at the same place.' }),
    fld('Microsoft account', v,
      'Leave it blank and each person uses their own OneDrive instead — which means each person gets their own empty CRM.'),
    fld('Folder', f,

    el('p', { class: 'sub', style: 'margin:0;line-height:1.6', html:
      'Both are stored for this browser and shared with the team through the config file, so a rep signing in on a ' +

      'it does not move anything.' })
  ]), [
    el('button', { class: 'btn', text: 'Cancel', onclick: closeAll }),

    } })
  ]);
}
/* Everything this browser holds, written into the shared folder. The merge is
   per record, so this adds and updates — it never wipes what is already there. */
function pushEverything() {
  const n = REC_SHARDS.reduce((t, s) => t + live(s).length, 0);
  confirmDo('Push everything into the shared folder',
    `${n} records from this browser are written into ${driveRoot()}/ on ${DRIVE.name || driveOwner()}. ` +
    'Records already there are merged by last edit, not overwritten wholesale.',
    'Push', async () => {
      REC_SHARDS.forEach(s => SYNC.dirty.add(s));
      SYNC.dirty.add('config');
      await syncNow({ loud: true });
    });
}
/* ================================================================

   ================================================================ */
const VIEWS = {
  dashboard: viewDashboard, pipeline: viewPipeline, deals: viewDeals,

};

  dashboard: 'Executive Summary', pipeline: 'Sales pipeline', deals: 'Deals',
  companies: 'Companies', contacts: 'Contacts', tasks: 'Tasks & follow-ups',
  review: 'Sales Commitment', demos: 'Demo Tracker', requests: 'Demo Requests',
  monthly: 'Per Month Commit vs. Forecast',
  forecast: 'Forecast & analytics', settings: 'Settings'
};
let rendering = false;
function render() {
  if (rendering) return;
  rendering = true;
  try {
    const name = VIEWS[VIEW.name] ? VIEW.name : 'dashboard';
    VIEW.name = name;
    TASKMAP = null; dropActIndex();       // per-render memos: taskMap(), lastActAt()
    $('#vtitle').textContent = TITLES[name];
    const root = $('#view');
    const scroll = root.scrollTop;
    root.innerHTML = '';
    renderNav();
    renderTopControls();

    catch (e) {
      console.error(e);
      root.appendChild(el('div', { class: 'card', style: 'border-color:var(--critical)' }, [
        el('h3', { text: 'This view hit an error' }),

        el('button', { class: 'btn', text: 'Back to dashboard', onclick: () => go('dashboard') })
      ]));

/* ---------------------------------------------------------- theme */
function setTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  DB.config.theme = t;
  try { localStorage.setItem(CFG.cacheKey + '.theme', t); } catch (e) {}
  if ($('#app').classList.contains('on')) render();
}

/* ------------------------------------------------------------ boot */
/* The shell used to be unveiled BEFORE the first sync, so everything between
   sign-in and the first render was a white page with the static "Dashboard"
   title on it — no nav, no counts, no explanation. At this team's data size
   that is many seconds of looking at nothing, which reads as a broken tool.
   Nobody should ever see the shell empty. */
function bootSplash(msg, sub) {
  const root = $('#view'); if (!root) return;
  $('#vtitle').textContent = 'Starting up';   // not the stale "Dashboard" in the markup
  root.innerHTML = '';
  root.appendChild(el('div', { class: 'card bootsplash' }, [
    el('div', { class: 'spin' }),
    el('h3', { text: msg }),
    el('p', { class: 'sub', text: sub || '' })
  ]));
}
async function boot() {
  $('#gate').style.display = 'none';
  $('#app').classList.add('on');

  const cached = loadLocal();
  if (SYNC.mode === 'onedrive') {
    if (cached) { VIEW.name = (location.hash.replace('#','') || 'dashboard'); render(); }
    else bootSplash('Loading the team\'s CRM…',
      `Reading ${driveRoot()} on ${driveOwner() || 'OneDrive'}. The first load pulls everything down, so it takes a few seconds.`);
    await syncNow({ quiet: true });
  }
  /* Nothing anywhere yet → the seed file shipped beside this page. But only
     when we actually KNOW it is empty: a rep whose sync failed used to get a
     local copy of the migration seed and a CRM that looked fine while being
     disconnected from the team's. Now a failed read shows the error instead. */
  const emptyHere = !live('deals').length && !live('companies').length && !live('contacts').length;
  if (emptyHere && (SYNC.mode !== 'onedrive' || SYNC.loaded)) {
    const ok = await trySeedFile();
    if (!ok) firstRun();
  }
  if (!DB.stages.length) { DB.stages = DEFAULT_STAGES.slice(); rebuildStages(); }
  if (!DB.lossReasons || !DB.lossReasons.length) DB.lossReasons = DEFAULT_LOSS.slice();
  if (!DB.owners.length && AUTH.user) {
    DB.owners = [{ id: uid('O'), name: AUTH.user.name || AUTH.user.username, email: AUTH.user.username,
      active: true, role: 'admin', initials: initials(AUTH.user.name || AUTH.user.username) }];
    touch('config');
  }
  reindex(); rebuildStages();
  runMigrations();
  VIEW.name = (location.hash.replace('#','') || 'dashboard');
  render();
  if (SYNC.mode === 'onedrive' && SYNC.dirty.size) scheduleSync();
}
/* One-shot data migrations, safe to run on every load. */
function runMigrations() {
  return sysWrite(() => batch(() => runMigrationsInner()));
}
function runMigrationsInner() {
  // single collaborator -> list
  let c = 0;
  DB.deals.forEach(d => {
    if (d._del) return;
    if (!Array.isArray(d.collaboratorIds)) {
      d.collaboratorIds = d.collaboratorId ? [String(d.collaboratorId)] : [];
      if (d.collaboratorId) { d.collaboratorId = null; c++; }
    }
  });
  if (c) SYNC.dirty.add('deals');
  // the running order the team asked for, applied once and only into a blank
  const teamFix = migrateTeamOrder();
  if (teamFix.changed) console.log(`Sales regions set on ${teamFix.changed} people`);
  // roles: rep / manager / viewer -> write / write / read, and exactly one admin
  const roleFix = migrateRoles();
  if (roleFix.changed) console.log(`Roles normalised on ${roleFix.changed} people` +
    (roleFix.admin ? `; sole admin is ${roleFix.admin}` : ''));
  // HubSpot lead statuses -> the four stages
  const lead = migrateLeadStatus();
  if (lead.changed) {
    console.log(`Lead status migrated on ${lead.changed} contacts` +
      (lead.unmapped ? `, ${lead.unmapped} left unmapped for review` : ''));
  }
  if (c || lead.changed || roleFix.changed || teamFix.changed) { saveLocal(); scheduleSync(); }
}
/* The regions and the running order inside them, as the team runs the meeting.
   This only ever fires into a blank — the moment anybody has a region, whatever
   is in the file is the team's own arrangement and is left alone, so moving
   someone in Settings is never undone by a reload. People not named here keep
   no region and show under "No region set" rather than being guessed at. */
const TEAM_LAYOUT = [
  ['Dubai',      ['Fatima', 'Milena']],
  ['Abu Dhabi',  ['Wafiq', 'Jawdat']],
  ['Management', ['Ahmed', 'Kamal', 'Sami']]
];
function migrateTeamOrder() {
  const people = DB.owners.filter(o => !o._del);
  if (!people.length) return { changed: 0 };
  if (people.some(o => o.salesRegion)) return { changed: 0 };       // already arranged
  const first = o => String(o.name || '').trim().split(/\s+/)[0].toLowerCase();
  let changed = 0;
  TEAM_LAYOUT.forEach(([region, names]) => {
    names.forEach((n, i) => {
      const hits = people.filter(o => first(o) === n.toLowerCase());
      if (hits.length !== 1) return;                                 // ambiguous or absent — skip
      hits[0].salesRegion = region;
      hits[0].order = i;
      changed++;
    });
  });
  if (changed) {
    DB.config.salesRegions = TEAM_LAYOUT.map(t => t[0]);
    DB.config._v = now();
    SYNC.dirty.add('config');
  }
  return { changed };
}

/* One admin, everyone else a writer unless they were already read-only.
   Whoever is signed in and already an admin keeps it; failing that the
   longest-standing admin does. Changing it afterwards is two clicks in
   Settings, and this only ever runs while there is more than one. */
function migrateRoles() {
  const people = DB.owners.filter(o => !o._del);
  if (!people.length) return { changed: 0 };
  let changed = 0;
  people.forEach(o => {
    const want = ROLE_MAP[o.role] || 'write';
    if (o.role !== want) { o.role = want; changed++; }
  });
  const admins = people.filter(o => o.role === 'admin');
  let keep = null;
  if (admins.length > 1) {
    const me = meOwner();
    keep = (me && me.role === 'admin') ? me : admins.slice().sort((a, b) =>
      String(a.id).localeCompare(String(b.id)))[0];
    admins.forEach(o => { if (o !== keep) { o.role = 'write'; changed++; } });
  } else if (!admins.length) {
    keep = (meOwner() && meOwner().active !== false ? meOwner() : null) ||
           people.find(o => o.active !== false) || people[0];
    if (keep) { keep.role = 'admin'; changed++; }
  } else keep = admins[0];
  if (changed) SYNC.dirty.add('config');
  return { changed, admin: keep ? keep.name : null };
}
const DEFAULT_STAGES = [
  { id: 'bd',       label: 'Business Development',       probability: .10, kind: 'open', order: 1 },
  { id: 'cold',     label: 'Cold Lead',                  probability: .05, kind: 'open', order: 2 },
  { id: 'referral', label: 'Channels & Referrals',       probability: .05, kind: 'open', order: 3 },
  { id: 'discover', label: 'Discovery & Identify',       probability: .20, kind: 'open', order: 4 },
  { id: 'demo',     label: 'Qualified & Demo Completed', probability: .40, kind: 'open', order: 5 },
  { id: 'proposal', label: 'Proposal Submitted',         probability: .60, kind: 'open', order: 6 },
  { id: 'commit',   label: 'Committed',                  probability: .90, kind: 'open', order: 7 },
  { id: 'won',      label: 'Closed Won',                 probability: 1,   kind: 'won',  order: 8 },
  { id: 'lost',     label: 'Closed Lost',                probability: 0,   kind: 'lost', order: 9 }
];
const DEFAULT_LOSS = ['Price too high','No budget','Lost to competitor','No response',
  'Timing / postponed','Not a fit','Chose alternative solution','Project cancelled','Unqualified','Other'];

async function trySeedFile() {
  try {
    const r = await fetch('corev-crm-seed.json', { cache: 'no-store' });
    if (!r.ok) return false;
    const seed = await r.json();
    if (!seed || !Array.isArray(seed.deals)) return false;
    applySeed(seed);
    toast(`Loaded ${seed.deals.length} deals, ${(seed.companies||[]).length} companies and ${(seed.contacts||[]).length} contacts from the migration file`, 'ok');
    return true;
  } catch (e) { return false; }
}
function firstRun() {
  DB.stages = DEFAULT_STAGES.slice();
  DB.lossReasons = DEFAULT_LOSS.slice();
  rebuildStages();
  setTimeout(() => {
    modal('Welcome to CoreV CRM', el('div', {}, [
      el('p', { style: 'margin:0 0 var(--sp-4);line-height:1.65;color:var(--ink-2)',
        html: 'There is no data here yet. You can bring your HubSpot records in, or start from scratch — the CoreV sales stages are already set up.' }),
      el('div', { class: 'card' }, [
        el('h3', { text: 'Bring data in' }),
        el('p', { class: 'sub', style: 'margin:6px 0 12px',
          text: 'Import the migration backup, or a HubSpot CSV export of companies, contacts and deals.' }),
        el('button', { class: 'btn primary', text: 'Open import', onclick: () => { closeAll(); importDialog(); } })
      ]),
      el('div', { class: 'card', style: 'margin-top:var(--sp-3)' }, [
        el('h3', { text: 'Start clean' }),
        el('p', { class: 'sub', style: 'margin:6px 0 12px',
          text: 'Add your team in Settings, then create your first deal.' }),
        el('button', { class: 'btn', text: 'Go to Settings', onclick: () => { closeAll(); go('settings'); } })
      ])
    ]));
  }, 400);
}

const RAILKEY = CFG.cacheKey + '.rail';
function setRail(on) {

}

try { if (localStorage.getItem(RAILKEY) === '1') $('#app').classList.add('rail'); } catch (e) {}

/* restore theme before anything paints */

/* an existing MSAL session signs in silently */
(async () => {
  try {
    if (!localStorage.getItem('msal.account.keys')) return;
    if (!(await loadMsal())) return;
    AUTH.msal = new msal.PublicClientApplication({
      auth: { clientId: CFG.clientId, authority: CFG.authority, redirectUri: location.href.split('#')[0].split('?')[0] },
      cache: { cacheLocation: 'localStorage' }
    });
    await AUTH.msal.initialize();
    const acct = AUTH.msal.getAllAccounts()[0];
    if (!acct) return;
    AUTH.msal.setActiveAccount(acct);
    AUTH.user = acct;
    await getToken();
    SYNC.mode = 'onedrive';
    boot();
  } catch (e) { /* fall through to the sign-in gate */ }
})();
