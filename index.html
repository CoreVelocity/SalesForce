   owner record never got a role — otherwise the link in the mail lands on a
   list that does not contain the request it was sent about. */
const isApprover = () => {
  const me = String((AUTH.user && AUTH.user.username) || '').toLowerCase();
  const who = String((DB.config && DB.config.approver) || CFG.approver || '').toLowerCase();
  return !!me && !!who && me === who;
};
function myRole() {
  if (!DB.owners.length) return 'admin';              // first run — someone has to add the team
  if (!AUTH.user) return 'admin';                     // demo / local mode on this machine only
  /* The address the approval emails go to is the person who owns this tool.
     They are admin whatever the team list happens to say, because the team
     list is the thing most likely to be wrong — and when it is wrong, the

const isAdmin = () => myRole() === 'admin';
const isReadOnly = () => myRole() === 'read';

/* Writes that are not the person's doing — migrations, the seed import,
   the sync merge — must go through whatever the role is. */
let SYS = 0;
function sysWrite(fn) { SYS++; try { return fn(); } finally { SYS--; } }
let _roWarned = 0;

  }

}

/* ---- sales regions: which team a rep sits in, for the monthly review ---- */
const DEFAULT_SALES_REGIONS = ['Dubai', 'Abu Dhabi', 'Management'];
const salesRegions = () => (DB.config.salesRegions && DB.config.salesRegions.length)
  ? DB.config.salesRegions.slice() : DEFAULT_SALES_REGIONS.slice();
const UNASSIGNED_REGION = 'Unassigned';
function ownerRegion(id) {
  const o = DB.owners.find(x => x.id === String(id));
  const r = o && o.salesRegion;
  return (r && salesRegions().includes(r)) ? r : UNASSIGNED_REGION;
}
/* Every region that has someone in it, in the configured order, with
   Unassigned last so nobody's numbers quietly vanish from the roll-up. */
function regionsInPlay(owners) {
  const list = owners || activeOwners();
  const have = new Set(list.map(o => ownerRegion(o.id)));
  const out = salesRegions().filter(r => have.has(r));
  if (have.has(UNASSIGNED_REGION)) out.push(UNASSIGNED_REGION);
  return out;
}

/* ---- months, and the weeks that make one up ---- */
const monthKey = d => String(d || TODAY()).slice(0, 7);
function monthShift(mk, n) {
  const y = +mk.slice(0,4), m = +mk.slice(5,7) - 1 + n;
  const d = new Date(Date.UTC(y, m, 1));
  return d.toISOString().slice(0, 7);
}
const monthLabel = mk => `${MON[+mk.slice(5,7) - 1]} ${mk.slice(0,4)}`;
const MONTH_FULL = ['January','February','March','April','May','June',
  'July','August','September','October','November','December'];
const monthLongLabel = mk => `${MONTH_FULL[+mk.slice(5,7) - 1]} ${mk.slice(0,4)}`;
/* Every ISO week touching the month — so September 2026 is W1 31 Aug–06 Sep
   through W5 28 Sep–04 Oct, matching how the team already counts weeks. */
function weeksOfMonth(mk) {
  const b = mBounds(mk + '-01');
  const end = weekKey(b.to);
  const out = [];
  let k = weekKey(b.from);
  for (let i = 0; i < 6; i++) { out.push(k); if (k === end) break; k = weekShift(k, 1); }
  return out;
}
const weekOfMonthLabel = (mk, wk) => 'W' + (weeksOfMonth(mk).indexOf(wk) + 1);

const ownerName = id => (DB.owners.find(o => o.id === String(id)) || {}).name || 'Unassigned';
/* The team in team order: region first, in the order the regions are
   configured, then each person's own place inside their region, then name as
   the tie-break. Everything that presents the team — the commitment cards, the
   rollup grids, the rep filter, the exports — reads this, so the running order
   is set once in Settings and holds everywhere. */
function regionRank(o) {
  const r = ownerRegion(o.id);
  const i = salesRegions().indexOf(r);
  return i < 0 ? 900 : i;                       // Unassigned sorts last
}
const teamRank = o => regionRank(o) * 1000 + (Number(o.order) >= 0 ? Number(o.order) : 500);
const byTeamOrder = (a, b) => (teamRank(a) - teamRank(b)) || a.name.localeCompare(b.name);
const activeOwners = () => DB.owners.filter(o => o.active).sort(byTeamOrder);
/* [{ region, owners }] in configured order, only regions with somebody in them */
function ownersByRegion(list) {
  const people = (list || activeOwners()).slice().sort(byTeamOrder);
  const out = [];
  regionsInPlay(people).forEach(r => {
    const os = people.filter(o => ownerRegion(o.id) === r);
    if (os.length) out.push({ region: r, owners: os });

}

/* ---- fiscal period helpers ---- */
function fyBounds(d) {
  const y = +String(d || TODAY()).slice(0,4);
  return { from: `${y}-01-01`, to: `${y}-12-31`, label: `FY${y}` };
}
function qBounds(d) {
  const s = String(d || TODAY()), y = +s.slice(0,4), m = +s.slice(5,7);
  const q = Math.floor((m - 1) / 3), f = q * 3 + 1;
  const lastDay = new Date(Date.UTC(y, f + 2, 0)).getUTCDate();
  return { from: `${y}-${String(f).padStart(2,'0')}-01`, to: `${y}-${String(f+2).padStart(2,'0')}-${lastDay}`, label: `Q${q+1} ${y}` };
}
function mBounds(d) {
  const s = String(d || TODAY()), y = +s.slice(0,4), m = +s.slice(5,7);
  const lastDay = new Date(Date.UTC(y, m, 0)).getUTCDate();
  const mm = String(m).padStart(2,'0');
  return { from: `${y}-${mm}-01`, to: `${y}-${mm}-${lastDay}`, label: `${MON[m-1]} ${y}` };
}
/* ISO week key, e.g. 2026-W39 — the unit the weekly review runs on */
function weekKey(d) {
  const t = new Date((d || TODAY()) + 'T00:00:00Z');
  const day = (t.getUTCDay() + 6) % 7;            // Mon = 0
  t.setUTCDate(t.getUTCDate() - day + 3);         // nearest Thursday
  const y = t.getUTCFullYear();
  const jan4 = new Date(Date.UTC(y, 0, 4));
  const w = 1 + Math.round(((t - jan4) / 864e5 - 3 + ((jan4.getUTCDay() + 6) % 7)) / 7);
  return `${y}-W${String(w).padStart(2,'0')}`;
}
function weekRange(key) {
  /* A malformed key used to reach new Date() and throw, which took down
     whatever was rendering. Fall back to the current week instead. */
  const m = /^(\d{4})-W(\d{1,2})$/.exec(String(key == null ? '' : key));
  if (!m) return weekRange(weekKey());
  const [y, w] = [+m[1], +m[2]];
  const jan4 = new Date(Date.UTC(y, 0, 4));
  const mon = new Date(jan4); mon.setUTCDate(jan4.getUTCDate() - ((jan4.getUTCDay() + 6) % 7) + (w - 1) * 7);
  const sun = new Date(mon); sun.setUTCDate(mon.getUTCDate() + 6);
  return { from: mon.toISOString().slice(0,10), to: sun.toISOString().slice(0,10) };
}
function weekShift(key, n) { const r = weekRange(key); return weekKey(addDays(r.from, n * 7)); }
function weekLabel(key) { const r = weekRange(key); return `${fdate(r.from)} – ${fdate(r.to)}`; }

/* ---- write path: every mutation stamps the record and queues a sync ---- */
/* `loaded` is the flag that says "this session has read the shared folder end
   to end at least once". Until it is true the app does not know that an empty
   database means empty — it might just mean not-yet-read — so it must not seed
   over it, must not write emptiness back, and must not draw a confident zero. */
const SYNC = { dirty: new Set(), status: 'idle', last: null, err: null, mode: 'local', loaded: false };

function stamp(rec) { rec._v = now(); rec._by = (AUTH.user && AUTH.user.username) || 'local'; return rec; }

/* Bulk writes used to serialise the whole database once per record — a few
   hundred rows and the tab locks up. batch() marks shards dirty as it goes and
   saves once at the end. */
let BATCH = 0;
/* Which parts of the config THIS session deliberately changed. Anything not
   in here is taken from the shared folder rather than pushed over it — see
   the config merge in syncNow(). `touch('config')` on its own means settings;
   a caller that edited the team or the stages says so. */
const CFGEDIT = new Set();
function touch(shard, part) {
  SYNC.dirty.add(shard);
  if (shard === 'config') CFGEDIT.add(part || 'settings');
  if (BATCH) return;
  saveLocal(); renderSyncBadge(); scheduleSync();
}
function batch(fn) {
  BATCH++;
  try { return fn(); }
  finally {
    BATCH--;
    if (!BATCH) { saveLocal(); renderSyncBadge(); scheduleSync(); }
  }
}

function upsert(shard, rec) {
  if (!canWrite()) return rec;
  if (!rec.id) rec.id = uid(shard[0].toUpperCase());
  stamp(rec);
  const arr = DB[shard];
  const idx = IDX[shard];
  let i = -1;
  if (idx && idx.has(rec.id)) i = arr.indexOf(idx.get(rec.id));
  if (i < 0) i = arr.findIndex(r => r.id === rec.id);
  let out;
  if (i < 0) { arr.push(rec); out = rec; }
  else { out = Object.assign(arr[i], rec); }
  if (idx) idx.set(out.id, out);
  touch(shard);
  return out;
}
function remove(shard, id) {
  if (!canWrite()) return;
  const arr = DB[shard], i = arr.findIndex(r => r.id === id);
  if (i < 0) return;
  arr[i]._del = true; stamp(arr[i]);
  touch(shard);
}
const live = shard => DB[shard].filter(r => !r._del);

/* ---- activity log: the timeline every record shows ---- */
function logAct(a) {
  const rec = Object.assign({ id: uid('A'), at: new Date().toISOString(), by: (AUTH.user && AUTH.user.username) || 'local' }, a);
  DB.activities.push(stamp(rec));
  touch('activities');
  return rec;
}
const actsFor = (kind, id) => DB.activities
  .filter(a => !a._del && a[kind + 'Id'] === id)
  .sort((x, y) => (y.at || '').localeCompare(x.at || ''));

/* actsFor() scans AND sorts the whole activity log, which is fine for one deal
   on a detail page and ruinous in a loop: the dashboard's "no activity in 30+
   days" row called it once per open deal — 856 full scans and 856 sorts of a
   log that only ever grows. That is the shape of a frozen tab. These two
   indexes are built once per render and answer the same questions in O(1).
   They are invalidated by render(); anything that mutates mid-render should
   call dropActIndex(). */
let ACT_LAST = null, ACT_RECENT = null;
function dropActIndex() { ACT_LAST = null; ACT_RECENT = null; }
function lastActAt(dealId) {
  if (!ACT_LAST) {
    ACT_LAST = new Map();
    DB.activities.forEach(a => {
      if (a._del || !a.dealId || !a.at) return;
      const cur = ACT_LAST.get(a.dealId);
      if (!cur || a.at > cur) ACT_LAST.set(a.dealId, a.at);
    });
  }
  return ACT_LAST.get(dealId) || null;
}
/* The newest n activities without sorting the whole log. */
function recentActs(n, ownerId) {
  const key = n + '|' + (ownerId || 'all');
  if (ACT_RECENT && ACT_RECENT.key === key) return ACT_RECENT.rows;
  const keep = [];
  DB.activities.forEach(a => {
    if (a._del || !a.at) return;
    if (ownerId && ownerId !== 'all' && String(a.ownerId || '') !== ownerId) return;
    if (keep.length < n) { keep.push(a); if (keep.length === n) keep.sort((x, y) => (y.at || '').localeCompare(x.at || '')); return; }
    if (a.at <= keep[n - 1].at) return;
    let i = n - 1;
    while (i > 0 && keep[i - 1].at < a.at) { keep[i] = keep[i - 1]; i--; }
    keep[i] = a;
  });
  if (keep.length < n) keep.sort((x, y) => (y.at || '').localeCompare(x.at || ''));
  ACT_RECENT = { key, rows: keep };
  return keep;
}

/* ---------------------------------------------------- localStorage cache */
/* The cache, the export and the seed all used to hand-list the shards, which
   is how a new one gets added to the database and silently left out of the
   thing that persists it. They all derive from REC_SHARDS now. */
const FLAT_KEYS = ['owners', 'stages', 'lossReasons', 'config', 'meta'];
/* Safari caps localStorage at 5MB per origin and counts UTF-16, so this
   database — 1.5MB of JSON — is already ~3MB there, in the same 5MB the MSAL
   token cache lives in. Over the line every setItem throws, the whole cache is
   silently dropped, and every reload becomes a cold full sync: several seconds
   of blank screen, and an empty CRM if the sync does not land. So the cache is
   now shed in priority order rather than written all-or-nothing, and the
   result is reported instead of swallowed. */
const CACHE_SHED = ['activities', 'attachments', 'reviews', 'contacts', 'companies'];
let CACHE_STATE = { ok: true, dropped: [], bytes: 0 };
function saveLocal() {
  const drop = new Set();
  for (let attempt = 0; attempt <= CACHE_SHED.length; attempt++) {
    const db = {};
    REC_SHARDS.forEach(k => { db[k] = drop.has(k) ? [] : DB[k]; });
    FLAT_KEYS.forEach(k => { db[k] = DB[k]; });
    try {
      const s = JSON.stringify({ at: now(), dirty: Array.from(SYNC.dirty),
        partial: Array.from(drop), db });
      localStorage.setItem(CFG.cacheKey, s);
      CACHE_STATE = { ok: true, dropped: Array.from(drop), bytes: s.length };
      return;
    } catch (e) {
      if (attempt === CACHE_SHED.length) break;
      drop.add(CACHE_SHED[attempt]);      // shed the biggest, least urgent first
    }
  }
  /* Even the skeleton would not fit. Leave no half-written key behind — a
     truncated cache is worse than none, because it loads as a believable
     empty CRM. */
  try { localStorage.removeItem(CFG.cacheKey); } catch (e) {}
  CACHE_STATE = { ok: false, dropped: REC_SHARDS.slice(), bytes: 0 };
}
function loadLocal() {
  try {
    const raw = localStorage.getItem(CFG.cacheKey);
    if (!raw) return false;
    const p = JSON.parse(raw);
    if (!p || !p.db) return false;
    Object.assign(DB, p.db);
    CACHE_STATE = { ok: true, dropped: p.partial || [], bytes: raw.length };
    (p.dirty || []).forEach(s => SYNC.dirty.add(s));
    reindex(); rebuildStages();
    return true;
  } catch (e) { return false; }
}

/* ---------------------------------------------------------------- AUTH */
const AUTH = { msal: null, user: null, token: null, expires: 0 };

async function loadMsal() {
  if (window.msal) return true;
  const urls = [
    'https://cdn.jsdelivr.net/npm/@azure/msal-browser@3.26.1/lib/msal-browser.min.js',
    'https://cdnjs.cloudflare.com/ajax/libs/msal/3.26.1/msal-browser.min.js'
  ];
  for (const u of urls) {
    try {
      await new Promise((res, rej) => {
        const s = document.createElement('script');
        s.src = u; s.onload = res; s.onerror = rej; document.head.appendChild(s);
      });
      if (window.msal) return true;
    } catch (e) { /* try the fallback CDN */ }
  }
  return false;
}
async function signIn() {
  const btn = $('#signin'), err = $('#gate-err');
  err.style.display = 'none';
  btn.disabled = true; btn.innerHTML = '<span class="spin"></span> Connecting…';
  try {
    if (!(await loadMsal())) throw new Error('Could not load the Microsoft sign-in library. Check your network, then reload.');
    AUTH.msal = new msal.PublicClientApplication({
      auth: { clientId: CFG.clientId, authority: CFG.authority, redirectUri: location.href.split('#')[0].split('?')[0] },
      cache: { cacheLocation: 'localStorage', storeAuthStateInCookie: false }
    });
    await AUTH.msal.initialize();
    let acct = AUTH.msal.getAllAccounts()[0];
    if (!acct) {
      const r = await AUTH.msal.loginPopup({ scopes: CFG.scopes, prompt: 'select_account' });
      acct = r.account;
    }
    AUTH.msal.setActiveAccount(acct);
    AUTH.user = acct;
    await getToken();
    SYNC.mode = 'onedrive';
    await boot();
  } catch (e) {
    const msg = String(e && e.message || e);
    err.style.display = 'block';
    err.innerHTML = esc(msg) + (/popup|window/i.test(msg)
      ? '<br><br>If a popup was blocked, allow popups for this page and try again. This tool must be opened from its hosted URL — sign-in will not work from a local file or inside an iframe.'
      : '');
    btn.disabled = false;
    btn.innerHTML = 'Try again';
  }
}
/* Signing out clears the Microsoft session for this browser. Anything not yet
   sent up would be lost with it, so that is pushed first and said out loud if
   it cannot be. */
function signOut() {
  const pending = SYNC.dirty.size;
  const go = async () => {
    if (pending && SYNC.mode === 'onedrive') {
      try { await syncNow({ quiet: true }); }
      catch (e) { /* reported below */ }
      if (SYNC.dirty.size) {
        const ok = await new Promise(res => confirmDo('Some changes have not been sent up',
          `${SYNC.dirty.size} change${SYNC.dirty.size === 1 ? '' : 's'} could not reach the shared folder. ` +
          'Signing out now loses them. Staying signed in gives the sync another chance.',
          'Sign out anyway', () => res(true), () => res(false)));
        if (!ok) return;
      }
    }
    try { localStorage.removeItem(CFG.cacheKey); } catch (e) {}
    try {
      if (AUTH.msal) { await AUTH.msal.logoutPopup({ account: AUTH.msal.getActiveAccount() }); return; }
    } catch (e) { /* popup blocked or cancelled — fall through to a reload */ }
    location.reload();
  };
  confirmDo('Sign out', AUTH.user
    ? `You are signed in as ${AUTH.user.username}. The shared data stays where it is — this only ends the session in this browser.`
    : 'This ends the session in this browser.', 'Sign out', go);
}

async function getToken() {
  if (AUTH.token && now() < AUTH.expires - 120000) return AUTH.token;
  const req = { scopes: CFG.scopes, account: AUTH.msal.getActiveAccount() };
  let r;
  try { r = await AUTH.msal.acquireTokenSilent(req); }
  catch (e) { r = await AUTH.msal.acquireTokenPopup(req); }
  AUTH.token = r.accessToken;
  AUTH.expires = Date.parse(r.expiresOn) || (now() + 3000000);
  return AUTH.token;
}

/* ------------------------------------------------- Graph / OneDrive I/O */
async function graph(path, opt) {
  const o = opt || {};
  const t = await getToken();
  const r = await fetch('https://graph.microsoft.com/v1.0' + path, {
    method: o.method || 'GET',
    headers: Object.assign({ Authorization: 'Bearer ' + t }, o.headers || {}),
    body: o.body
  });
  if (r.status === 404) return null;
  if (!r.ok) throw new Error('Graph ' + r.status + ' ' + (await r.text()).slice(0, 200));
  return o.raw ? r : (r.status === 204 ? null : r.json());
}
/* ================================================================
   WHERE THE DATA LIVES

   This used to read and write /me/drive — the signed-in person's OWN
   OneDrive. That works perfectly for one person and not at all for a
   team: every rep got their own empty CoreVCRM folder and an empty CRM,
   which is exactly what they reported. Sharing a folder does not help,
   because a folder shared with you does not appear at the root of your
   own drive.

   So the whole tool now reads and writes ONE drive — the CoreVCRM
   folder on demo@core-velocity.com — and resolves it two ways:

     1. straight at that account's drive, which works when the rep has
        been given access to it; failing that,
     2. through "shared with me", which is how the folder shows up once
        demo@ shares it with the sales team.

   If neither works the app says so loudly instead of quietly showing an
   empty CRM, because a silent empty CRM is the bug being fixed here.
   ================================================================ */
const DRIVE = { id: null, folderId: null, owner: null, key: null, via: null, err: null, name: null };
const DRIVE_KEY = () => CFG.cacheKey + '.driveOwner';
const ROOT_KEY  = () => CFG.cacheKey + '.driveRoot';
function driveOwner() {
  try { const v = localStorage.getItem(DRIVE_KEY()); if (v != null) return v; } catch (e) {}
  if (DB.config && DB.config.driveOwner != null) return DB.config.driveOwner;
  return CFG.driveOwner;
}
function driveRoot() {
  try { const v = localStorage.getItem(ROOT_KEY()); if (v) return v; } catch (e) {}
  if (DB.config && DB.config.driveRoot) return DB.config.driveRoot;
  return CFG.root;
}
function forgetDrive() {
  DRIVE.id = DRIVE.folderId = DRIVE.owner = DRIVE.key = DRIVE.via = null;
  DRIVE.err = null; DRIVE.name = null;
}
function setDriveOwner(v) {
  try { localStorage.setItem(DRIVE_KEY(), v || ''); } catch (e) {}
  DB.config.driveOwner = v || '';
  DB.config._v = now(); touch('config');
  forgetDrive();
}
function setDriveRoot(v) {
  const clean = String(v || '').split('/').map(x => x.trim()).filter(Boolean).join('/');
  try { localStorage.setItem(ROOT_KEY(), clean); } catch (e) {}
  DB.config.driveRoot = clean;
  DB.config._v = now(); touch('config');
  forgetDrive();
}
const isPersonalDrive = () => !driveOwner();

/* Graph, but tells 403 apart from the rest so the caller can fall back. */
async function graphTry(path, opt) {
  try { return { ok: true, data: await graph(path, opt) }; }
  catch (e) {
    const m = String(e.message || e);
    return { ok: false, status: /Graph (\d+)/.test(m) ? +RegExp.$1 : 0, message: m };
  }
}

/* Walk a path under a folder, making any part of it that is not there yet. */
async function ensurePath(driveId, fromItemId, segments) {
  let id = fromItemId;
  for (const seg of segments) {
    const hit = await graphTry(`/drives/${driveId}/items/${id}:/${encodeURIComponent(seg)}`);
    if (hit.ok && hit.data) { id = hit.data.id; continue; }
    const made = await graphTry(`/drives/${driveId}/items/${id}/children`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: seg, folder: {}, '@microsoft.graph.conflictBehavior': 'replace' })
    });
    if (!made.ok || !made.data) return null;
    id = made.data.id;
  }
  return id;
}
const rootSegments = () => String(driveRoot() || '').split('/').map(x => x.trim()).filter(Boolean);

async function resolveDrive(force) {
  const owner = (driveOwner() || '').trim();
  const segs = rootSegments();
  const key = owner + '|' + segs.join('/');
  if (!force && DRIVE.folderId && DRIVE.key === key && !DRIVE.err) return DRIVE;
  DRIVE.owner = owner; DRIVE.key = key; DRIVE.id = null; DRIVE.folderId = null;
  DRIVE.via = null; DRIVE.err = null; DRIVE.name = null;

  /* no shared account set — the old single-person behaviour, kept so a lone
     user or a demo can still work with no sharing set up at all */
  if (!owner) {
    const r = await graph('/me/drive/root');
    const did = r.parentReference ? r.parentReference.driveId : (await graph('/me/drive')).id;
    const fid = await ensurePath(did, r.id, segs);
    if (!fid) throw new Error(`Could not create ${driveRoot()} in your OneDrive.`);
    DRIVE.id = did; DRIVE.folderId = fid; DRIVE.via = 'personal'; DRIVE.name = 'your own OneDrive';
    return DRIVE;
  }

  /* 1 — straight at the shared account's drive */
  const direct = await graphTry(`/users/${encodeURIComponent(owner)}/drive/root:/${segs.map(encodeURIComponent).join('/')}`);
  if (direct.ok && direct.data) {
    DRIVE.id = direct.data.parentReference.driveId;
    DRIVE.folderId = direct.data.id;
    DRIVE.via = 'owner'; DRIVE.name = owner;
    return DRIVE;
  }
  if (direct.ok && !direct.data) {
    /* the drive is reachable, the folder is not there — make the missing parts */
    const r = await graphTry(`/users/${encodeURIComponent(owner)}/drive/root`);
    if (r.ok && r.data) {
      const did = r.data.parentReference ? r.data.parentReference.driveId : null;
      const fid = did && await ensurePath(did, r.data.id, segs);
      if (fid) {
        DRIVE.id = did; DRIVE.folderId = fid; DRIVE.via = 'owner'; DRIVE.name = owner;
        return DRIVE;
      }
    }
  }

  /* 2 — through the folder as it appears once it is shared. What gets shared is
     usually the top of the path (OXEFIT), so match any segment and resolve the
     rest underneath it. */
  const sh = await graphTry('/me/drive/sharedWithMe');
  if (sh.ok && sh.data) {
    const sharedBy = x => {
      const r = x.remoteItem || {};
      return String((((r.shared || {}).owner || {}).user || {}).email ||
                    ((r.createdBy || x.createdBy || {}).user || {}).email || '').toLowerCase();
    };
    const items = (sh.data.value || []).filter(x => x.remoteItem);
    for (let i = 0; i < segs.length; i++) {
      const want = segs[i].toLowerCase();
      const named = items.filter(x => String(x.name || x.remoteItem.name || '').toLowerCase() === want);
      const hit = named.find(x => sharedBy(x) === owner.toLowerCase()) || named[0];
      if (!hit) continue;
      const r = hit.remoteItem;
      const did = r.parentReference && r.parentReference.driveId;
      if (!did || !r.id) continue;
      const fid = await ensurePath(did, r.id, segs.slice(i + 1));
      if (fid) {
        DRIVE.id = did; DRIVE.folderId = fid; DRIVE.via = 'shared';
        DRIVE.name = (sharedBy(hit) || owner) + ' (shared with you)';
        return DRIVE;
      }
    }
  }

  DRIVE.err = direct.status === 403 || (sh.ok === false && sh.status === 403)
    ? `You do not have access to ${driveRoot()} on ${owner}.`
    : `${driveRoot()} could not be found on ${owner}.`;
  throw new Error(DRIVE.err +
    ` Ask for the ${segs[0]} folder in that account's OneDrive to be shared with you with edit rights.`);
}

async function readShard(s) {

/* ---- the merge: per-record last-write-wins, tombstones sticky ---- */
function mergeRecords(mine, theirs) {
  const out = new Map();
  (theirs || []).forEach(r => r && r.id && out.set(r.id, r));
  (mine   || []).forEach(r => {
    if (!r || !r.id) return;
    const t = out.get(r.id);
    if (!t) { out.set(r.id, r); return; }
    const mv = r._v || 0, tv = t._v || 0;
    if (mv > tv) out.set(r.id, r);
    else if (mv === tv && r._del && !t._del) out.set(r.id, r);   // tombstone wins a tie
  });
  return Array.from(out.values());
}
const REC_SHARDS = ['companies','contacts','deals','tasks','commitments','reviews','activities','attachments','products','demos','demoRequests','leads'];

async function syncNow(opt) {
  const o = opt || {};
  if (SYNC.mode !== 'onedrive') { saveLocal(); return; }
  if (SYNC.status === 'syncing') return;
  SYNC.status = 'syncing'; SYNC.err = null; renderSyncBadge();
  try {
    await resolveDrive();
    for (const s of REC_SHARDS) {
      const remote = await readShard(s);
      const merged = mergeRecords(DB[s], (remote && remote.rows) || []);
      const changed = SYNC.dirty.has(s) || !remote || merged.length !== ((remote && remote.rows) || []).length;
      DB[s] = merged;
      /* Writing an EMPTY shard is the one write that can destroy the team's
         data, and the only honest reason to do it is that someone deleted the
         last record on purpose. A shard that came out empty on a session that
         has never successfully read the folder is not that — it is a cold
         start — so it is never pushed. */
      const safe = merged.length > 0 || SYNC.loaded || SYNC.dirty.has(s);
      if (changed && safe) await writeShard(s, { shard: s, v: 1, at: new Date().toISOString(), rows: merged });
      SYNC.dirty.delete(s);
    }
    // config: whole-document last-write-wins
    /* ---- config: merged part by part, NOT whole-document last-write-wins ----

       The old rule was: if this session has any unsaved config change, skip
       reading the remote entirely and push the whole document. One dirty flag
       — set by anything, including a migration — therefore stopped the team
       list and the stage list from EVER being read back, and then overwrote
       them. A session that started with an empty stage list, filled it with
       the built-in defaults and pushed, replaced the real CoreV stages for
       everybody; 1,239 deals still pointing at the old stage ids then matched
       no column on the board, and whoever was left out of the overwritten
       team list was demoted to read-only with no way back in.

       So each part is now merged on its own, and a part is only written when
       this session actually edited it. */
    const rc = await readShard('config');
    const parts = ['owners', 'stages', 'lossReasons'];
    if (rc) {
      /* plain settings (targets, thresholds, regions, approver…) stay
         whole-document, but never clobber a newer remote */
      if ((rc._v || 0) > (DB.config._v || 0) && !CFGEDIT.has('settings')) {
        const keep = {};
        CFGEDIT.forEach(k => { if (DB.config[k] !== undefined) keep[k] = DB.config[k]; });
        DB.config = Object.assign(DB.config, rc, keep);
      }
      parts.forEach(k => {
        const theirs = rc[k];
        if (!Array.isArray(theirs) || !theirs.length) return;   // nothing to take
        const mineHasRows = Array.isArray(DB[k]) && DB[k].length;
        /* We changed it on purpose — unless what we have is empty, which is
           never a deliberate "delete the whole team". */
        if (CFGEDIT.has(k) && mineHasRows) return;
        DB[k] = theirs;
      });
    }
    /* Write only what we meant to change, and never an empty list over a
       full one. A cold start has nothing to say about the team. */
    const iChanged = parts.filter(k => CFGEDIT.has(k) && Array.isArray(DB[k]) && DB[k].length);
    const settingsChanged = CFGEDIT.has('settings');
    const firstEver = !rc && (SYNC.loaded || DB.owners.length);
    if (iChanged.length || settingsChanged || firstEver) {
      DB.config._v = now();
      const doc = Object.assign({ shard: 'config' }, DB.config, { meta: DB.meta });
      parts.forEach(k => {
        /* keep whatever is up there for a part we did not touch */
        const mine = Array.isArray(DB[k]) && DB[k].length ? DB[k] : null;
        const theirs = rc && Array.isArray(rc[k]) && rc[k].length ? rc[k] : null;
        doc[k] = (CFGEDIT.has(k) && mine) ? mine : (theirs || mine || []);
      });
      await writeShard('config', doc);
    }
    CFGEDIT.clear();
    SYNC.dirty.delete('config');
    reindex(); rebuildStages();
    SYNC.status = 'idle'; SYNC.last = now(); SYNC.loaded = true;
    /* Keep a copy of a good team + stage list in this browser, so the next
       time the shared config goes wrong there is something local to put back
       that still carries the addresses, regions and targets. */
    if (typeof keepConfigBackup === 'function') keepConfigBackup();
    saveLocal();
    if (o.loud) toast('Synced with OneDrive', 'ok');
    if (!o.quiet) render();
  } catch (e) {
    SYNC.status = 'error'; SYNC.err = String(e.message || e);
    /* An empty CRM with a quiet badge is what sent people to you in the first
       place, so a sync that cannot reach the shared folder says so on screen. */
    if (o.loud) toast('Sync failed — ' + SYNC.err.slice(0, 90), 'err');
    if (!o.quiet && typeof render === 'function') render();
  }
  renderSyncBadge();
}

/* Green means this person's work is reaching the shared folder; red means it

  const n = $('#syncbadge'); if (!n) return;
  let cls, txt, sub;
  if (SYNC.status === 'error')          { cls = 'bad';  txt = 'Not syncing'; sub = 'the shared folder cannot be reached'; }
  else if (SYNC.mode === 'local')       { cls = 'bad';  txt = 'Not syncing'; sub = 'this browser only — nobody else sees it'; }
  else if (SYNC.status === 'syncing')   { cls = 'busy'; txt = 'Syncing…';    sub = 'sending and receiving'; }
  else if (SYNC.dirty.size)             { cls = 'warn'; txt = SYNC.dirty.size + ' waiting'; sub = 'not sent up yet'; }
  else if (!SYNC.loaded && !SYNC.last)  { cls = 'warn'; txt = 'Connecting…'; sub = 'first read has not finished'; }

  const where = SYNC.mode === 'onedrive' ? (DRIVE.name || driveOwner() || 'your own OneDrive') : '';
  n.className = 'syncpill ' + cls;

    ? (SYNC.status === 'error' ? `Could not reach ${driveRoot()} on ${where}`

  n.innerHTML = `<span class="dot"></span><span class="t"><b>${esc(txt)}</b><em>${esc(sub)}</em></span>`
    + `<span class="go">${ico('sync', 13)}</span>`;

function estimate(d) {
  const items = d.items || [];
  const months = Number(d.contractMonths) > 0 ? Number(d.contractMonths) : 12;
  let once = 0, monthly = 0, annual = 0;
  items.forEach(it => {
    const n = lineNet(it);

    else if (it.billing === 'annual') annual += n;
    else once += n;

async function uploadAttachment(dealId, file) {
  if (SYNC.mode !== 'onedrive') throw new Error('Sign in with Microsoft to upload files. In local-only mode you can still add a link.');
  if (file.size > 60 * 1024 * 1024) throw new Error('That file is over 60 MB — upload it to OneDrive yourself and add it here as a link.');
  const safe = String(file.name).replace(/[\\/:*?"<>|#%]/g, '-').slice(0, 120);
  await resolveDrive();
  const path = `${driveBase()}:/${CFG.attachDir}/${dealId}/${safe}:/content`;
  const t = await getToken();
  const r = await fetch('https://graph.microsoft.com/v1.0' + path, {
    method: 'PUT',
    headers: { Authorization: 'Bearer ' + t, 'Content-Type': file.type || 'application/octet-stream' },
    body: file

  if (!r.ok) throw new Error('OneDrive refused the upload (' + r.status + ')');
  const item = await r.json();
  return upsert('attachments', {
    dealId, name: safe, size: file.size, mime: file.type || null,
    url: item.webUrl || null, driveItemId: item.id || null,
    driveId: (item.parentReference && item.parentReference.driveId) || DRIVE.id || null,
    at: new Date().toISOString(), by: (AUTH.user && AUTH.user.username) || 'local', kind: 'file'
  });

function barPath(x, y, w, h, r, dir) {
  const rr = Math.min(r, w / 2, Math.max(h, 0));
  if (h <= 0.5) return `M${x} ${y}h${w}`;
  if (dir === 'up')    return `M${x} ${y+h}V${y+rr}a${rr} ${rr} 0 0 1 ${rr} -${rr}h${w-2*rr}a${rr} ${rr} 0 0 1 ${rr} ${rr}V${y+h}Z`;
  if (dir === 'right') { const q = Math.min(r, h/2, w); return `M${x} ${y}h${w-q}a${q} ${q} 0 0 1 ${q} ${q}v${h-2*q}a${q} ${q} 0 0 1 -${q} ${q}H${x}Z`; }
  return `M${x} ${y}h${w}v${h}h-${w}Z`;
}
function chartShell(host, opts) {
  const o = opts || {};
  host.innerHTML = '';
  const wrap = el('div', { class: 'chart' });
  host.appendChild(wrap);
  if (o.table) {
    const t = el('div', { class: 'chart-tbl' });
    t.innerHTML = o.table;
    const btn = el('button', { class: 'btn sm ghost', text: 'Table view',
      style: 'margin-top:8px;color:var(--ink-3)',
      onclick: () => { t.classList.toggle('on'); btn.textContent = t.classList.contains('on') ? 'Hide table' : 'Table view'; } });
    host.appendChild(btn); host.appendChild(t);
  }
  return wrap;
}
const tblHTML = (cols, rows) =>
  `<table><thead><tr>${cols.map(c => `<th class="${c.num?'num':''}">${esc(c.h)}</th>`).join('')}</tr></thead><tbody>${
    rows.map(r => `<tr>${cols.map(c => `<td class="${c.num?'num':''}">${esc(c.f(r))}</td>`).join('')}</tr>`).join('')}</tbody></table>`;

/* ---------------------------------------------------- vertical bars */
function chartBar(host, rows, o) {
  o = o || {};
  const fmt = o.fmt || (v => money(v, { compact: true }));
  const wrap = chartShell(host, { table: tblHTML(
    [{ h: o.xLabel || 'Category', f: r => r.label }, { h: o.yLabel || 'Value', num: true, f: r => fmt(r.value) }], rows) });
  if (!rows.length) { wrap.innerHTML = `<p style="color:var(--ink-3);margin:0;padding:24px 0;text-align:center">No data in range</p>`; return; }

  const H = o.height || 190, PT = 22, PB = 30, PL = 4, PR = 4;
  const W = Math.max(host.clientWidth || 520, 260);
  const max = Math.max(...rows.map(r => r.value), 1);
  const gap = rows.length > 14 ? 2 : 8;
  const bw = Math.max(4, (W - PL - PR - gap * (rows.length - 1)) / rows.length);
  const svg = svgEl('svg', { viewBox: `0 0 ${W} ${H}`, preserveAspectRatio: 'none', role: 'img',
    'aria-label': o.aria || 'Bar chart' });
  svg.style.height = H + 'px';

  // recessive gridlines + baseline
  for (let i = 1; i <= 3; i++) {
    const y = PT + (H - PT - PB) * (i / 3);
    svg.appendChild(svgEl('line', { x1: 0, x2: W, y1: y, y2: y, class: 'gl' }));
  }
  svg.appendChild(svgEl('line', { x1: 0, x2: W, y1: H - PB, y2: H - PB, class: 'bl' }));

  const plotH = H - PT - PB;
  rows.forEach((r, i) => {
    const h = Math.max(0, (r.value / max) * plotH);
    const x = PL + i * (bw + gap), y = H - PB - h;
    const g = svgEl('g', { class: 'mk' });
    g.appendChild(svgEl('path', { d: barPath(x, y, bw, h, 4, 'up'), fill: r.color || o.color || 'var(--s1)' }));
    svg.appendChild(g);
    // selective direct labels: only when they will not collide
    if (rows.length <= 9 && r.value) {
      const t = svgEl('text', { x: x + bw / 2, y: y - 6, 'text-anchor': 'middle', class: 'vlab' });
      t.textContent = fmt(r.value); svg.appendChild(t);
    }
    if (rows.length <= 16) {
      const t = svgEl('text', { x: x + bw / 2, y: H - PB + 14, 'text-anchor': 'middle', class: 'alab' });
      t.textContent = r.short || r.label; svg.appendChild(t);
    }
    const hit = svgEl('rect', { x, y: PT, width: bw, height: plotH + 6, class: 'hit' });
    hit.addEventListener('mousemove', ev => tipShow(
      `<b>${esc(r.label)}</b><div class="r"><span><i style="background:${r.color||o.color||'var(--s1)'}"></i>${esc(o.yLabel||'Value')}</span><b>${esc(fmt(r.value))}</b></div>` +
      (r.note ? `<div class="r"><span>${esc(r.note)}</span></div>` : ''), ev));
    hit.addEventListener('mouseleave', tipHide);
    svg.appendChild(hit);
  });
  wrap.appendChild(svg);
}

/* ------------------------------------------ vertical stacked bars ---
   One bar per category, split by series. Identity is the series, so the
   hues are the categorical palette in fixed order — never cycled, never
   reassigned when a series drops out. A 2px surface gap separates the
   segments (the secondary encoding the CVD floor asks for), only the
   topmost segment carries the 4px rounded data-end, and each bar gets a
   direct total label so the light-mode contrast relief is satisfied
   without relying on the fills alone. */
function chartStackBar(host, cats, series, o) {
  o = o || {};
  const fmt = o.fmt || (v => money(v, { compact: true }));
  const totalOf = c => sum(series, s => c.values[s.key] || 0);
  const wrap = chartShell(host, { table: tblHTML(
    [{ h: o.xLabel || 'Category', f: c => c.label }]
      .concat(series.map(s => ({ h: s.label, num: true, f: c => fmt(c.values[s.key] || 0) })))
      .concat([{ h: 'Total', num: true, f: c => fmt(totalOf(c)) }]), cats) });
  if (!cats.length || !series.length) {
    wrap.innerHTML = `<p style="color:var(--ink-3);margin:0;padding:24px 0;text-align:center">No data in range</p>`;
    return;
  }
  const H = o.height || 230, PT = 24, PB = 30, PL = 4, PR = 4, GAPSEG = 2;
  const W = Math.max(host.clientWidth || 520, 260);
  const max = Math.max(...cats.map(totalOf), 1);
  const gap = cats.length > 14 ? 3 : 12;
  const bw = Math.max(6, (W - PL - PR - gap * (cats.length - 1)) / cats.length);
  const plotH = H - PT - PB;
  const svg = svgEl('svg', { viewBox: `0 0 ${W} ${H}`, preserveAspectRatio: 'none', role: 'img',
    'aria-label': o.aria || 'Stacked bar chart' });
  svg.style.height = H + 'px';
  for (let i = 1; i <= 3; i++) {
    const y = PT + plotH * (i / 3);
    svg.appendChild(svgEl('line', { x1: 0, x2: W, y1: y, y2: y, class: 'gl' }));
  }
  svg.appendChild(svgEl('line', { x1: 0, x2: W, y1: H - PB, y2: H - PB, class: 'bl' }));

  cats.forEach((c, ci) => {
    const x = PL + ci * (bw + gap);
    const tot = totalOf(c);
    // top-down so the rounded end lands on the topmost segment that exists
    const present = series.map((s, si) => ({ s, si, v: c.values[s.key] || 0 })).filter(p => p.v > 0);
    let cursor = H - PB;
    present.forEach((p, idx) => {
      const h = (p.v / max) * plotH;
      const drawH = Math.max(1, h - (idx === present.length - 1 ? 0 : GAPSEG));
      const y = cursor - h;
      const top = idx === present.length - 1;
      const g = svgEl('g', { class: 'mk' });
      g.appendChild(svgEl('path', {
        d: top ? barPath(x, y, bw, drawH, 4, 'up') : barPath(x, y + (h - drawH), bw, drawH, 0, 'flat'),
        fill: p.s.color }));
      svg.appendChild(g);
      const hit = svgEl('rect', { x, y: y, width: bw, height: Math.max(3, h), class: 'hit' });
      hit.addEventListener('mousemove', ev => tipShow(
        `<b>${esc(c.label)}</b>` +
        `<div class="r"><span><i style="background:${p.s.color}"></i>${esc(p.s.label)}</span><b>${esc(fmt(p.v))}</b></div>` +
        `<div class="r"><span>Share of month</span><b>${pct(p.v, tot)}%</b></div>` +
        `<div class="r"><span>Month total</span><b>${esc(fmt(tot))}</b></div>`, ev));
      hit.addEventListener('mouseleave', tipHide);
      svg.appendChild(hit);
      cursor = y;
    });
    if (tot) {
      const t = svgEl('text', { x: x + bw / 2, y: (H - PB) - (tot / max) * plotH - 7,
        'text-anchor': 'middle', class: 'vlab' });
      t.textContent = fmt(tot); svg.appendChild(t);
    }
    const a = svgEl('text', { x: x + bw / 2, y: H - PB + 14, 'text-anchor': 'middle', class: 'alab' });
    a.textContent = c.short || c.label; svg.appendChild(a);
    if (!tot) {
      const z = svgEl('text', { x: x + bw / 2, y: H - PB - 7, 'text-anchor': 'middle', class: 'vlab',
        style: 'opacity:.45' });
      z.textContent = '—'; svg.appendChild(z);
    }
  });
  wrap.appendChild(svg);

  /* legend: always present for >= 2 series, and it carries the totals so
     identity is never colour alone */
  const lg = el('div', { class: 'legend' });
  series.forEach(s => {
    const tot = sum(cats, c => c.values[s.key] || 0);
    if (!tot && o.hideEmpty) return;
    lg.appendChild(el('span', { class: tot ? '' : 'off', html:
      `<i style="background:${s.color}"></i>${esc(s.label)}` +
      `<b class="mono" style="color:var(--ink-1)">${esc(fmt(tot))}</b>` }));
  });
  wrap.appendChild(lg);
}

/* ------------------------------------------- horizontal ranked bars */
function chartHBar(host, rows, o) {
  o = o || {};
  const fmt = o.fmt || (v => money(v, { compact: true }));
  const wrap = chartShell(host, { table: tblHTML(
    [{ h: o.xLabel || 'Name', f: r => r.label }, { h: o.yLabel || 'Value', num: true, f: r => fmt(r.value) }], rows) });
  if (!rows.length) { wrap.innerHTML = `<p style="color:var(--ink-3);margin:0;padding:20px 0;text-align:center">No data</p>`; return; }
  const max = Math.max(...rows.map(r => r.value), 1);
  const list = el('div', { style: 'display:flex;flex-direction:column;gap:7px' });
  rows.forEach(r => {
    const row = el('div', { class: 'mk', style: 'display:grid;grid-template-columns:minmax(76px,30%) 1fr auto;gap:10px;align-items:center' });
    row.appendChild(el('div', { style: 'font-size:var(--fs-sm);color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap', title: r.label, text: r.label }));
    const track = el('div', { style: 'height:12px;background:var(--surface-3);border-radius:4px;position:relative;overflow:hidden' });
    const fill = el('div', { style: `height:100%;width:${Math.max(1.5, r.value / max * 100)}%;background:${r.color || o.color || 'var(--s1)'};border-radius:2px 4px 4px 2px` });
    track.appendChild(fill); row.appendChild(track);
    row.appendChild(el('div', { class: 'mono', style: 'font-size:var(--fs-sm);font-weight:650;min-width:52px;text-align:right', text: fmt(r.value) }));
    row.addEventListener('mousemove', ev => tipShow(
      `<b>${esc(r.label)}</b><div class="r"><span><i style="background:${r.color||o.color||'var(--s1)'}"></i>${esc(o.yLabel||'Value')}</span><b>${esc(fmt(r.value))}</b></div>` +
      (r.note ? `<div class="r"><span>${esc(r.note)}</span></div>` : ''), ev));
    row.addEventListener('mouseleave', tipHide);
    list.appendChild(row);
  });
  wrap.appendChild(list);
}

/* --------------------------------------------------- stacked single bar */
function chartStack(host, segs, o) {
  o = o || {};
  const fmt = o.fmt || (v => money(v, { compact: true }));
  const total = sum(segs, s => s.value) || 1;
  const wrap = chartShell(host, { table: tblHTML(
    [{ h: 'Segment', f: s => s.label }, { h: 'Value', num: true, f: s => fmt(s.value) },
     { h: 'Share', num: true, f: s => pct(s.value, total) + '%' }], segs) });
  const bar = el('div', { style: 'display:flex;gap:2px;height:26px;border-radius:6px;overflow:hidden;background:var(--surface-3)' });
  segs.forEach((s, i) => {
    if (!s.value) return;
    const d = el('div', { class: 'mk', style: `flex:${s.value} 1 0;background:${s.color || serColor(i)};min-width:3px;display:grid;place-items:center;overflow:hidden` });
    const share = pct(s.value, total);
    if (share >= 12) d.appendChild(el('span', { class: 'mono',
      style: 'font-size:10.5px;font-weight:750;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.35)', text: share + '%' }));
    d.addEventListener('mousemove', ev => tipShow(
      `<b>${esc(s.label)}</b><div class="r"><span><i style="background:${s.color||serColor(i)}"></i>Value</span><b>${esc(fmt(s.value))}</b></div>
       <div class="r"><span>Share</span><b>${share}%</b></div>`, ev));
    d.addEventListener('mouseleave', tipHide);
    bar.appendChild(d);
  });
  wrap.appendChild(bar);
  const lg = el('div', { class: 'legend' });
  segs.forEach((s, i) => lg.appendChild(el('span', { html:
    `<i style="background:${s.color || serColor(i)}"></i>${esc(s.label)} <b class="mono" style="color:var(--ink-1)">${esc(fmt(s.value))}</b>` })));
  wrap.appendChild(lg);
}

/* ------------------------------------------------------------- donut */
function chartDonut(host, rows, o) {
  o = o || {};
  const fmt = o.fmt || (v => money(v, { compact: true }));
  const total = sum(rows, r => r.value);
  const wrap = chartShell(host, { table: tblHTML(
    [{ h: o.xLabel || 'Category', f: r => r.label }, { h: 'Value', num: true, f: r => fmt(r.value) },
     { h: 'Share', num: true, f: r => pct(r.value, total) + '%' }], rows) });
  if (!total) { wrap.innerHTML = `<p style="color:var(--ink-3);margin:0;padding:24px 0;text-align:center">No data in range</p>`; return; }

  const S = 148, R = 64, r0 = 42, cx = S/2, cy = S/2;
  const svg = svgEl('svg', { viewBox: `0 0 ${S} ${S}`, role: 'img', 'aria-label': o.aria || 'Donut chart' });
  svg.style.cssText = 'width:148px;height:148px;flex:none';
  let a0 = -Math.PI / 2;
  const GAP = 0.018;                         // 2px-equivalent surface gap
  rows.forEach((r, i) => {
    if (!r.value) return;
    const sweep = (r.value / total) * Math.PI * 2;
    const a1 = a0 + Math.max(sweep - GAP, 0.004);
    const big = (a1 - a0) > Math.PI ? 1 : 0;
    const p = [
      `M${cx + R*Math.cos(a0)} ${cy + R*Math.sin(a0)}`,
      `A${R} ${R} 0 ${big} 1 ${cx + R*Math.cos(a1)} ${cy + R*Math.sin(a1)}`,
      `L${cx + r0*Math.cos(a1)} ${cy + r0*Math.sin(a1)}`,
      `A${r0} ${r0} 0 ${big} 0 ${cx + r0*Math.cos(a0)} ${cy + r0*Math.sin(a0)}`, 'Z'
    ].join(' ');
    const path = svgEl('path', { d: p, fill: r.color || serColor(i), class: 'mk' });
    path.addEventListener('mousemove', ev => tipShow(
      `<b>${esc(r.label)}</b><div class="r"><span><i style="background:${r.color||serColor(i)}"></i>Value</span><b>${esc(fmt(r.value))}</b></div>
       <div class="r"><span>Share</span><b>${pct(r.value,total)}%</b></div>`, ev));
    path.addEventListener('mouseleave', tipHide);
    svg.appendChild(path);
    a0 += sweep;
  });
  const c = svgEl('text', { x: cx, y: cy - 2, 'text-anchor': 'middle',
    style: 'font-size:17px;font-weight:700;fill:var(--ink-1)' });
  c.textContent = o.centerVal != null ? o.centerVal : fmt(total);
  svg.appendChild(c);
  if (o.centerLbl) {
    const c2 = svgEl('text', { x: cx, y: cy + 13, 'text-anchor': 'middle', style: 'font-size:10px;fill:var(--ink-3)' });
    c2.textContent = o.centerLbl; svg.appendChild(c2);
  }
  const box = el('div', { style: 'display:flex;gap:var(--sp-4);align-items:center;flex-wrap:wrap' });
  box.appendChild(svg);
  const lg = el('div', { class: 'legend', style: 'margin:0;flex-direction:column;gap:5px;flex:1;min-width:150px' });
  rows.forEach((r, i) => lg.appendChild(el('span', { style: 'width:100%', html:
    `<i style="background:${r.color || serColor(i)}"></i><span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.label)}</span>
     <b class="mono" style="color:var(--ink-1);margin-left:auto">${esc(fmt(r.value))}</b>
     <span style="color:var(--ink-3);min-width:34px;text-align:right" class="mono">${pct(r.value,total)}%</span>` })));
  box.appendChild(lg);
  wrap.appendChild(box);
}

/* ----------------------------------------- line / area with crosshair */
function chartLine(host, series, labels, o) {
  o = o || {};
  const fmt = o.fmt || (v => money(v, { compact: true }));
  const wrap = chartShell(host, { table: tblHTML(
    [{ h: o.xLabel || 'Period', f: r => r.l }].concat(series.map((s, i) => ({ h: s.name, num: true, f: r => fmt(r.v[i]) }))),
    labels.map((l, j) => ({ l, v: series.map(s => s.data[j]) }))) });
  if (!labels.length) { wrap.innerHTML = `<p style="color:var(--ink-3);margin:0;padding:24px 0;text-align:center">No data in range</p>`; return; }

  const H = o.height || 200, PT = 16, PB = 26, PL = 6, PR = 6;
  const W = Math.max(host.clientWidth || 520, 260);
  const max = Math.max(1, ...series.flatMap(s => s.data.map(v => v || 0)));
  const plotH = H - PT - PB, plotW = W - PL - PR;
  const X = j => labels.length === 1 ? PL + plotW/2 : PL + (j / (labels.length - 1)) * plotW;
  const Y = v => PT + plotH - (Math.max(0, v || 0) / max) * plotH;

  const svg = svgEl('svg', { viewBox: `0 0 ${W} ${H}`, preserveAspectRatio: 'none', role: 'img',
    'aria-label': o.aria || 'Line chart' });
  svg.style.height = H + 'px';
  for (let i = 0; i <= 3; i++) {
    const y = PT + plotH * (i / 3);
    svg.appendChild(svgEl('line', { x1: 0, x2: W, y1: y, y2: y, class: i === 3 ? 'bl' : 'gl' }));
  }
  const cross = svgEl('line', { y1: PT, y2: PT + plotH, class: 'gl', stroke: 'var(--baseline)', opacity: 0 });
  svg.appendChild(cross);

  series.forEach((s, si) => {
    const col = s.color || serColor(si);
    const pts = s.data.map((v, j) => `${X(j)},${Y(v)}`).join(' ');
    if (o.area && series.length === 1) {
      svg.appendChild(svgEl('polygon', { points: `${PL},${PT+plotH} ${pts} ${PL+plotW},${PT+plotH}`, fill: col, opacity: .13 }));
    }
    svg.appendChild(svgEl('polyline', { points: pts, fill: 'none', stroke: col, 'stroke-width': 2,
      'stroke-dasharray': s.dash || null, 'stroke-linejoin': 'round', 'stroke-linecap': 'round', class: 'mk' }));
    s.data.forEach((v, j) => {
      if (labels.length > 18 && j % 2) return;
      svg.appendChild(svgEl('circle', { cx: X(j), cy: Y(v), r: 4, fill: col,
        stroke: 'var(--surface-1)', 'stroke-width': 2 }));   // 2px surface ring on overlap
    });
  });
  labels.forEach((l, j) => {
    const step = Math.ceil(labels.length / 8);
    if (j % step) return;
    const t = svgEl('text', { x: X(j), y: H - PB + 15, 'text-anchor': 'middle', class: 'alab' });
    t.textContent = l; svg.appendChild(t);
  });
  const hit = svgEl('rect', { x: 0, y: 0, width: W, height: H, class: 'hit' });
  hit.addEventListener('mousemove', ev => {
    const bb = svg.getBoundingClientRect();
    const rel = (ev.clientX - bb.left) / bb.width * W;
    let j = Math.round((rel - PL) / (plotW || 1) * (labels.length - 1));
    j = Math.max(0, Math.min(labels.length - 1, j));
    cross.setAttribute('x1', X(j)); cross.setAttribute('x2', X(j)); cross.setAttribute('opacity', .8);
    tipShow(`<b>${esc(labels[j])}</b>` + series.map((s, i) =>
      `<div class="r"><span><i style="background:${s.color||serColor(i)}"></i>${esc(s.name)}</span><b>${esc(fmt(s.data[j]))}</b></div>`).join(''), ev);
  });
  hit.addEventListener('mouseleave', () => { cross.setAttribute('opacity', 0); tipHide(); });
  svg.appendChild(hit);
  wrap.appendChild(svg);

  if (series.length >= 2) {
    const lg = el('div', { class: 'legend' });
    series.forEach((s, i) => lg.appendChild(el('span', { html:
      `<i style="background:${s.color || serColor(i)}${s.dash ? ';border-radius:1px;height:3px;background:repeating-linear-gradient(90deg,' + (s.color||serColor(i)) + ' 0 3px,transparent 3px 5px)' : ''}"></i>${esc(s.name)}` })));
    wrap.appendChild(lg);
  }
}

/* -------------------------------------------------- pipeline funnel */
function chartFunnel(host, rows, o) {
  o = o || {};
  const fmt = o.fmt || (v => money(v, { compact: true }));
  const totalVal = sum(rows, r => r.value);
  const wrap = chartShell(host, { table: tblHTML(
    [{ h: 'Stage', f: r => r.label }, { h: 'Deals', num: true, f: r => r.count },
     { h: 'Value', num: true, f: r => fmt(r.value) },
     { h: 'Weight', num: true, f: r => Math.round(stage(r.id).probability * 100) + '%' },
     { h: 'Weighted', num: true, f: r => fmt(r.value * stage(r.id).probability) },
     { h: 'Share of value', num: true, f: r => pct(r.value, totalVal) + '%' }], rows) });
  if (!rows.length) { wrap.innerHTML = `<p style="color:var(--ink-3);margin:0;padding:24px 0;text-align:center">No open deals</p>`; return; }
  const max = Math.max(...rows.map(r => r.count), 1);
  const list = el('div', { style: 'display:flex;flex-direction:column;gap:3px' });
  rows.forEach((r, i) => {
    const row = el('div', { class: 'mk', style: 'display:grid;grid-template-columns:minmax(132px,32%) minmax(0,1fr);gap:10px;align-items:center' });
    row.appendChild(el('div', { html:
      `<div style="font-size:var(--fs-sm);font-weight:600;line-height:1.3">${esc(r.label)}</div>
       <div style="font-size:10.5px;color:var(--ink-3);white-space:nowrap">${Math.round(stage(r.id).probability*100)}% weight · ${pct(r.value, totalVal)}% of value</div>` }));
    const track = el('div', { style: 'position:relative;height:30px;display:flex;align-items:center' });
    const w = Math.max(3, r.count / max * 100);
    const fill = el('div', { style:
      `height:26px;width:${w}%;background:${r.color || stageColor(r.id)};border-radius:3px 6px 6px 3px;
       display:flex;align-items:center;gap:8px;padding:0 9px;min-width:0` });

/* -------------------------------------------------------- stat tile */
function tile(label, value, o) {
  o = o || {};
  const n = el('div', { class: 'tile' });
  n.appendChild(el('div', { class: 'lbl', html: (o.icon ? ico(o.icon, 13) : '') + esc(label) }));
  /* Length is only a first guess — fitTiles() measures after layout and steps
     the size down until the figure actually fits, whatever the column width. */
  const str = String(value);
  const len = str.length + (o.cur ? 4 : 0);
  const guess = len > 13 ? ' fit-s' : len > 10 ? ' fit-m' : '';
  /* `tag` colours the figure good / warn / bad, so a KPI carries its own
     verdict instead of needing the reader to know the threshold. */
  n.appendChild(el('div', { class: 'val mono' + guess + (o.tag ? ' ' + o.tag : ''),
    title: (o.cur ? CFG.currency + ' ' : '') + str,
    html: (o.cur ? `<span class="cur">${CFG.currency}</span>` : '') + `<span class="num">${esc(str)}</span>` }));
  if (o.delta != null) {
    const up = o.delta >= 0, good = o.inverse ? !up : up;
    n.appendChild(el('div', { class: 'foot', html:
      `<span class="delta ${good ? 'up' : 'down'}">${ico(up ? 'up' : 'down', 12, 2.4)}${Math.abs(o.delta)}%</span>
       <span>${esc(o.foot || '')}</span>` }));
  } else if (o.foot) {
    n.appendChild(el('div', { class: 'foot', html: o.footHtml ? o.foot : esc(o.foot) }));
  }
  if (o.meter != null) {
    const p = Math.max(0, Math.min(100, o.meter));
    n.appendChild(el('div', { class: 'meter', html:
      `<i class="${p >= 100 ? 'good' : p >= 70 ? '' : p >= 40 ? 'warn' : 'bad'}" style="width:${p}%"></i>` }));
  }
  if (o.onclick) { n.style.cursor = 'pointer'; n.addEventListener('click', o.onclick); }
  return n;
}
/* A number that does not fit its tile is worse than a smaller number, so step
   the type down until it does. Measured, not guessed, because the same tile is
   200px wide on the dashboard and 120px in a drawer. */
const FITS = ['', 'fit-m', 'fit-s', 'fit-xs'];
function fitTiles(root) {
  $$('.tile .val, .strip .v', root || document).forEach(v => {
    const n = v.querySelector('.num');
    if (!n) return;
    for (const step of FITS) {
      FITS.forEach(c => c && v.classList.remove(c));
      if (step) v.classList.add(step);
      /* No tolerance: the number is ellipsised the moment it overflows at all,
         so one spare pixel is the difference between "673,211" and "673,2…".
         Erring toward smaller type is the right way to be wrong here. */
      if (n.scrollWidth <= n.clientWidth) return;
    }
  });
}

/* A hash can carry a record: #requests?r=R123 is the link in an approval

function routeOf(hash) {

  const i = h.indexOf('?');
  if (i < 0) return { name: h, args: {} };
  const args = {};
  new URLSearchParams(h.slice(i + 1)).forEach((v, k) => { args[k] = v; });
  return { name: h.slice(0, i), args };
}

/* ------------------------------------------------------- scoping */
/* The period filter. Grouped so a long list stays readable, and every
   option resolves to real dates — the labels weeks and months carry are the
   concrete range, not "this week", because a target is stored against the
   label and a moving label would attach to whichever week happened to be
   current when it was typed. */
const PERIODS = [
  ['Weeks', [
    ['w-1', 'Last week'], ['w0', 'This week'], ['w1', 'Next week'],
    ['w2', 'In 2 weeks'], ['w3', 'In 3 weeks'], ['wn4', 'Next 4 weeks']
  ]],
  ['Months', [
    ['m-1', 'Last month'], ['m0', 'This month'], ['m1', 'Next month'], ['mn3', 'Next 3 months']
  ]],
  ['Longer', [
    ['q', 'This quarter'], ['fy', 'Fiscal year'], ['all', 'All time']
  ]]
];
const periodName = v => {
  for (const [, list] of PERIODS) { const hit = list.find(x => x[0] === v); if (hit) return hit[1]; }
  return 'This fiscal year';
};
function periodBounds(which) {
  const p = which || VIEW.period;
  if (p === 'fy') return Object.assign(fyBounds(), { grain: 'year' });
  if (p === 'q')  return Object.assign(qBounds(), { grain: 'quarter' });
  if (p === 'm' || p === 'm0') return Object.assign(mBounds(), { grain: 'month' });
  let m;
  if ((m = /^w(-?\d+)$/.exec(p))) {
    const k = weekShift(weekKey(), +m[1]), r = weekRange(k);
    return { from: r.from, to: r.to, label: weekLabel(k), week: k, grain: 'week' };
  }
  if ((m = /^wn(\d+)$/.exec(p))) {
    const r = weekRange(weekKey()), to = weekRange(weekShift(weekKey(), +m[1] - 1)).to;
    return { from: r.from, to, label: `${fdate(r.from)} – ${fdate(to)}`, grain: 'week' };
  }
  if ((m = /^m(-?\d+)$/.exec(p))) {
    const b = mBounds(monthShift(monthKey(), +m[1]) + '-01');
    return Object.assign(b, { grain: 'month' });
  }
  if ((m = /^mn(\d+)$/.exec(p))) {
    const a = mBounds(), z = mBounds(monthShift(monthKey(), +m[1] - 1) + '-01');
    return { from: a.from, to: z.to, label: `${a.label} – ${z.label}`, grain: 'month' };
  }
  return { from: '1900-01-01', to: '2999-12-31', label: 'All time', grain: 'all' };
}
/* Targets are stored against the period label, so they only make sense for a
   period that names itself the same way every time you look at it. */
const targetablePeriod = b => b.grain !== 'week' && b.label !== 'All time';
const inPeriod = (d, b) => d && dnum(d) >= dnum(b.from) && dnum(d) <= dnum(b.to);
/* Visibility follows worksOn, so a collaborator sees the deal under their own
   filter. Revenue attribution below always uses ownedBy, so nothing is counted
   twice when a deal has two names on it. */
function scopedDeals() {
  const all = live('deals');
  return VIEW.rep === 'all' ? all : all.filter(d => worksOn(d, VIEW.rep));
}
const ownedDeals = rep => live('deals').filter(d => ownedBy(d, rep));
const openTasks = () => live('tasks').filter(t => t.status !== 'done' &&
  (VIEW.rep === 'all' || String(t.ownerId) === VIEW.rep));
const weighted = d => (d.amount || 0) * stage(d.stageId).probability;

/* "Newest added first" as one number, so the board and the table can't drift
   apart. 133 of the migrated deals share a single created date, so the record
   id — which came across from HubSpot roughly in creation order — breaks the
   tie and stops same-day deals shuffling on every render. A record with no
   created date sorts last. */
function addedRank(r) {
  /* A fixed-width string, not a number: packing a twelve-digit record id into
     the fraction of a date needs ~21 significant digits and a double carries
     about 16, so distinct deals on the same day collapsed to the same value
     and re-ordered themselves on every render. Padded digits compare exactly. */
  const day = String(dnum(r && r.createdAt) || 0).padStart(8, '0');
  const n = String((r && (r.hubspotId || r.id)) || '').replace(/\D/g, '').slice(-15).padStart(15, '0');
  return day + n;
}
const byNewest = (a, b) => addedRank(b).localeCompare(addedRank(a));

        if (k === z) break;

    }

    if (qv) return { value: qv / 3, basis: 'derived', from: `${q.label} ÷ 3` };
    const fy = fyBounds(b.from), yv = targetAt(rep, fy.label);
    if (yv) return { value: yv / 12, basis: 'derived', from: `${fy.label} ÷ 12` };
    return { value: 0, basis: null, from: null };
  }

    if (yv) return { value: yv / 4, basis: 'derived', from: `${fy.label} ÷ 4` };

/* ---------------------------------------------- overdue close dates

/* Minimised stages are a per-person view preference, so they live in this
   browser rather than the shared config — two reps watching different stages
   should not fight over one setting. */
const MINKEY = CFG.cacheKey + '.minStages';
function minStages() {
  try { return JSON.parse(localStorage.getItem(MINKEY) || '[]'); } catch (e) { return []; }
}
function toggleStageMin(id) {

  const next = cur.includes(id) ? cur.filter(x => x !== id) : cur.concat([id]);
  try { localStorage.setItem(MINKEY, JSON.stringify(next)); } catch (e) {}
  render();

function expandAllStages() {
  try { localStorage.removeItem(MINKEY); } catch (e) {}

  logAct({ dealId: d.id, ownerId: d.ownerId, kind: 'stage',
    html: `Moved <b>${esc(d.name)}</b> from ${esc(from.label)} to <b>${esc(to.label)}</b>` });

/* ================================================================

function dataTable(host, o) {
  const key = o.key;
  const sort = VIEW.sort[key] || (VIEW.sort[key] = { col: o.defaultSort || 0, dir: o.defaultDir || -1 });
  const page = VIEW.page[key] || (VIEW.page[key] = 0);
  const per  = o.per || 50;

  let rows = o.rows.slice();
  const col = o.cols[sort.col] || o.cols[0];
  rows.sort((a, b) => {
    const x = col.sv ? col.sv(a) : col.v(a), y = col.sv ? col.sv(b) : col.v(b);
    const nx = typeof x === 'number', ny = typeof y === 'number';
    if (nx && ny) return (x - y) * sort.dir;
    return String(x == null ? '' : x).localeCompare(String(y == null ? '' : y)) * sort.dir;
  });
  const total = rows.length;
  const pages = Math.max(1, Math.ceil(total / per));
  const p = Math.min(page, pages - 1);
  VIEW.page[key] = p;
  const slice = rows.slice(p * per, p * per + per);

  const wrap = el('div', { class: 'tw' });
  const t = el('table', { class: 'dt' });
  const thead = el('thead'), tr = el('tr');
  o.cols.forEach((c, i) => {
    const th = el('th', { class: (c.num ? 'num ' : '') + (c.sortable === false ? '' : 'sortable') + (sort.col === i ? ' sorted' : ''),
      html: esc(c.h) + (c.sortable === false ? '' : `<span class="ind">${sort.col === i ? (sort.dir > 0 ? '▲' : '▼') : '⇅'}</span>`) });
    if (c.sortable !== false) th.addEventListener('click', () => {
      if (sort.col === i) sort.dir *= -1; else { sort.col = i; sort.dir = c.num ? -1 : 1; }
      render();
    });
    tr.appendChild(th);
  });
  thead.appendChild(tr); t.appendChild(thead);
  const tb = el('tbody');
  if (!slice.length) {
    tb.appendChild(el('tr', {}, [ el('td', { colspan: o.cols.length, style: 'padding:36px;text-align:center;color:var(--ink-3)',
      text: o.emptyText || 'Nothing matches these filters.' }) ]));
  }
  slice.forEach(r => {
    const row = el('tr');
    o.cols.forEach(c => row.appendChild(el('td', { class: c.num ? 'num' : '', html: c.r ? c.r(r) : esc(c.v(r)) })));
    if (o.onRow) row.addEventListener('click', e => { if (!e.target.closest('button,a,input')) o.onRow(r); });
    tb.appendChild(row);
  });
  t.appendChild(tb); wrap.appendChild(t);
  const f = el('div', { class: 'tfoot' });
  f.appendChild(el('span', { text: `${total.toLocaleString()} ${o.noun || 'rows'}` + (o.footNote ? ' · ' + o.footNote : '') }));
  f.appendChild(el('div', { style: 'flex:1' }));
  if (pages > 1) {
    f.appendChild(el('button', { class: 'btn sm', text: '‹ Prev', disabled: p === 0 || null,
      onclick: () => { VIEW.page[key] = p - 1; render(); } }));
    f.appendChild(el('span', { class: 'mono', text: `${p+1} / ${pages}` }));
    f.appendChild(el('button', { class: 'btn sm', text: 'Next ›', disabled: p >= pages - 1 || null,
      onclick: () => { VIEW.page[key] = p + 1; render(); } }));
  }
  wrap.appendChild(f);
  host.appendChild(wrap);
}

function viewTasks(root) {

  const showDone = VIEW.tableFilter.done;
  const t0 = TODAY();
  const bucket = t => {
    if (t.status === 'done') return 'done';
    if (!t.dueDate) return 'someday';
    const n = dnum(t.dueDate);
    if (n < dnum(t0)) return 'overdue';

  };

  root.appendChild(viewHead(null, [
    el('button', { class: 'btn' + (showDone ? ' primary' : ''),
      text: showDone ? 'Hide completed' : 'Show completed',

    el('button', { class: 'btn primary', html: ico('plus',14) + ' New task', onclick: () => editTask(null) })

  let any = false;

      el('span', { class: 'tag', text: list.length }),

/* A labelled, non-shrinking header fact: "VALUE  AED 260,000".
   Labels are what make the header readable — a bare run of numbers and names
   is ambiguous once there are more than two of them. */
function mfact(label, value, o) {
  o = o || {};
  const n = el(o.onclick ? 'a' : 'span', {
    class: 'mfact' + (o.num ? ' num' : ''),
    title: o.title || (label ? label + ': ' + value : value),
    href: o.onclick ? 'javascript:void 0' : null
  });
  if (label) n.appendChild(el('em', { text: label }));

  return n;
}
function drawerHead(title, metaNodes, actions) {

  left.appendChild(m);

  (actions || []).forEach(a => h.appendChild(a));

  return h;
}
function tabbed(tabs, initialLabel, onSwitch) {

  let cur = Math.max(0, tabs.findIndex(t => t.label === initialLabel));
  function paint() {
    Array.from(bar.children).forEach((b, i) => b.className = i === cur ? 'on' : '');
    body.innerHTML = '';
    body.appendChild(tabs[cur].render());
    body.scrollTop = 0;
  }
  tabs.forEach((t, i) => bar.appendChild(el('button', { text: t.label + (t.count != null ? ` (${t.count})` : ''),
    onclick: () => { cur = i; if (onSwitch) onSwitch(t.label); paint(); } })));
  paint();
  return [bar, body];
}

                          : `Remove “${a.name}” from this deal and delete the file from OneDrive?`,

async function doUpload(d, files) {
  if (!files.length) return;
  const t = toast(`Uploading ${files.length} file${files.length > 1 ? 's' : ''}…`);
  let ok = 0;
  for (const f of files) {
    try { await uploadAttachment(d.id, f); ok++; }
    catch (e) { toast(String(e.message || e), 'err'); }
  }
  if (ok) {
    logAct({ dealId: d.id, ownerId: d.ownerId, kind: 'note',
      html: `Attached ${ok} file${ok > 1 ? 's' : ''}: ${esc(files.slice(0, 3).map(f => f.name).join(', '))}` });
    toast(`${ok} file${ok > 1 ? 's' : ''} attached`, 'ok');
    openDeal(d.id);
  }
}

    d.stageId = lostId; d.lossReason = r; d.lostTo = comp.value.trim() || null;
    d.closeDate = dt.value || TODAY();
    if (note.value.trim()) d.notes = (d.notes || []).concat([{ at: new Date().toISOString(),
      by: (AUTH.user && AUTH.user.username) || 'local', text: 'Loss learning: ' + note.value.trim() }]);
    upsert('deals', d);
    logAct({ dealId: d.id, ownerId: d.ownerId, kind: 'lost',
      html: `Marked <b>${esc(d.name)}</b> <b style="color:var(--critical-ink)">lost</b> — ${esc(r)}${d.lostTo ? ' (to ' + esc(d.lostTo) + ')' : ''}` });
    closeAll(); render(); toast('Marked lost — ' + r);
  } });
  modal('Mark lost — ' + d.name, body, [ el('button', { class: 'btn', text: 'Cancel', onclick: closeAll }), save ]);
}
function commitDeal(d) {
  const wk = weekKey();
  const existing = live('commitments').find(c => c.dealId === d.id && c.week === wk);
  if (existing) {
    return confirmDo('Already picked this week',
      `${d.name} is already in ${ownerName(existing.ownerId)}'s ${SLOTS[slotOf(existing)].toLowerCase()} for ${weekLabel(wk)}.`,
      'Remove it', () => { remove('commitments', existing.id); refreshDrawer(); render(); toast('Removed from this week'); });
  }
  let sl = 'commit';
  const seg = el('div', { class: 'seg' });
  ['commit','best'].forEach(s => seg.appendChild(el('button', { class: s === sl ? 'on' : '', text: SLOTS[s],
    onclick: () => { sl = s; Array.from(seg.children).forEach((b, i) => b.classList.toggle('on', ['commit','best'][i] === sl)); } })));
  const amt = el('input', { class: 'inp', type: 'number', value: d.amount || '' });
  const note = el('input', { class: 'inp', placeholder: 'What has to happen for this to land?' });
  modal('Pick for ' + weekLabel(wk), el('div', {}, [

      html: `<b>${esc(d.name)}</b> for <b>${esc(ownerName(d.ownerId))}</b>. <b>Commit</b> is what they are standing behind; <b>best case</b> is what could land if everything breaks right. Both feed the weighted forecast in the commitment review, and are scored against what actually closed.` }),
    fld('Slot', seg),
    el('div', { class: 'field' }, [ el('label', { class: 'fl', text: `Value (${CFG.currency})` }), amt ]),
    el('div', { class: 'field' }, [ el('label', { class: 'fl', text: 'Note' }), note ])
  ]), [

    el('button', { class: 'btn primary', text: 'Add', onclick: () => {
      upsert('commitments', { week: wk, dealId: d.id, ownerId: d.ownerId, slot: sl,
        amount: Number(amt.value) || d.amount || 0, note: note.value.trim() || null, stageAt: d.stageId });
      logAct({ dealId: d.id, ownerId: d.ownerId, kind: 'commit',
        html: `Picked <b>${esc(d.name)}</b> as <b>${esc(SLOTS[sl].toLowerCase())}</b> for ${esc(weekLabel(wk))}` });

    } })
  ]);
}

/* Fills only what is blank. A domain gives a readable name and, through the
   country-code TLD, a country. It cannot give a city — that needs a paid
   data provider — so the city is left alone rather than guessed. */
function enrichCompany(c, o) {
  o = o || {};
  const d = cleanDomain(c.domain);
  if (!d) { if (o.loud) toast('Add a domain first', 'err'); return 0; }
  const filled = [];
  const nm = domainToName(d);
  if (nm && (!c.name || !c.name.trim())) { c.name = nm; filled.push('name'); }
  const ctry = domainCountry(d);
  if (ctry && !c.country) { c.country = ctry; filled.push('country'); }
  if (c.domain !== d) { c.domain = d; }
  if (filled.length) {
    upsert('companies', c);
    if (o.loud) { toast('Filled ' + filled.join(' and ') + ' from the domain', 'ok'); openCompany(c.id); }
  } else if (o.loud) {
    const why = !nm && !ctry ? 'nothing could be derived from that domain'
      : 'name and country are already set';
    toast('Nothing to fill — ' + why);
  }
  return filled.length;
}

function fld(label, node, hint) {
  const w = el('div', { class: 'field' });
  w.appendChild(el('label', { class: 'fl', text: label }));
  w.appendChild(node);
  if (hint) w.appendChild(el('div', { style: 'font-size:var(--fs-xs);color:var(--ink-3);margin-top:4px;line-height:1.5', text: hint }));

/* Multi-select for collaborators: a chip per person, plus an add control. */
function ownerMulti(values, excludeId) {
  let chosen = (values || []).map(String).filter(v => v && v !== String(excludeId));
  const node = el('div', { class: 'multi' });
  const paint = () => {
    node.innerHTML = '';
    chosen.forEach(id => {
      const o = DB.owners.find(x => x.id === id);
      node.appendChild(el('span', { class: 'chip' }, [
        el('span', { class: 'avatar', style: `background:${ownerColor(id)};width:18px;height:18px;font-size:8px`,
          text: initials(ownerName(id)) }),
        el('span', { text: ownerName(id) + (o && !o.active ? ' (inactive)' : '') }),
        el('button', { html: ico('x',11), 'aria-label': 'Remove ' + ownerName(id),
          onclick: () => { chosen = chosen.filter(x => x !== id); paint(); } })
      ]));
    });
    const left = activeOwners().filter(o => !chosen.includes(o.id) && o.id !== String(excludeId));
    if (left.length) {
      const add = el('select', { class: 'inp', style: 'width:auto;min-width:150px',
        'aria-label': 'Add a collaborator',
        onchange: e => { if (!e.target.value) return; chosen = chosen.concat([e.target.value]); paint(); } });
      add.appendChild(el('option', { value: '', text: chosen.length ? '+ Add another…' : '+ Add a collaborator…' }));
      left.forEach(o => add.appendChild(el('option', { value: o.id, text: o.name })));
      node.appendChild(add);
    } else if (!chosen.length) {
      node.appendChild(el('span', { style: 'color:var(--ink-3);font-size:var(--fs-sm)', text: 'No one else available' }));
    }
  };
  paint();
  return { node, get: () => chosen.slice(), set: v => { chosen = (v || []).map(String); paint(); } };
}

/* Assignment picker. Only active people can be chosen. A record that already
   belongs to someone who has since left keeps that owner — it is shown as the
   current value so saving does not silently reassign it — but no *other*
   inactive person can be picked, so work never lands on a leaver. */
function ownerSelect(value, o) {
  o = o || {};
  const s = el('select', { class: 'inp' });
  if (o.onchange) s.addEventListener('change', o.onchange);
  s.appendChild(el('option', { value: '', text: o.emptyLabel || 'Unassigned' }));
  activeOwners().forEach(p => {
    if (o.exclude && String(o.exclude) === p.id) return;
    s.appendChild(el('option', { value: p.id, text: p.name, selected: String(value) === p.id || null }));
  });
  const cur = DB.owners.find(p => p.id === String(value));
  if (cur && !cur.active) {
    const g = el('optgroup', { label: 'No longer active — reassign' });
    g.appendChild(el('option', { value: cur.id, text: cur.name + ' (inactive)', selected: true }));
    s.appendChild(g);
  }
  return s;
}
/* Deal types: the three CoreV sells against, plus any legacy value already on
   a record so an import never loses what it came in with. */
function dealTypes() {
  const base = (DB.config && DB.config.dealTypes && DB.config.dealTypes.length)
    ? DB.config.dealTypes.slice() : ['Consumer', 'Commercial', 'International'];
  const found = Array.from(new Set(live('deals').map(d => d.dealType).filter(Boolean)));
  found.forEach(t => { if (!base.includes(t)) base.push(t); });
  return base;
}
/* type-ahead picker over an entity list */
/* The results list is absolutely positioned, and inside a modal it sat in a
   `.body` that scrolls — so in a tall form like the demo request the company
   suggestions were clipped at the edge of the scroll box and could not be
   clicked. The list is now put in a fixed layer on the page itself and
   positioned off the input's own rectangle, so nothing can crop it. */
let PICKER_LAYER = null;
function pickerLayer() {
  if (PICKER_LAYER && PICKER_LAYER.isConnected) return PICKER_LAYER;
  PICKER_LAYER = el('div', { id: 'picklayer' });
  document.body.appendChild(PICKER_LAYER);

}
function picker(opts) {
  const o = opts || {};
  const wrap = el('div', { style: 'position:relative' });
  const inp = el('input', { class: 'inp', placeholder: o.placeholder || 'Type to search…', autocomplete: 'off',
    value: o.initialLabel || '' });
  const res = el('div', { class: 'search-res floating' });
  let chosen = o.initialValue || null;
  wrap.appendChild(inp);
  const place = () => {
    const r = inp.getBoundingClientRect();
    /* flip above the field when there is more room up there */
    const below = window.innerHeight - r.bottom, above = r.top;
    const maxH = Math.max(140, Math.min(320, (below > 180 || below >= above ? below : above) - 14));
    res.style.left = r.left + 'px';
    res.style.width = r.width + 'px';
    res.style.maxHeight = maxH + 'px';
    if (below > 180 || below >= above) { res.style.top = (r.bottom + 6) + 'px'; res.style.bottom = 'auto'; }
    else { res.style.bottom = (window.innerHeight - r.top + 6) + 'px'; res.style.top = 'auto'; }
  };
  const close = () => { res.classList.remove('on'); if (res.parentNode) res.parentNode.removeChild(res); };
  const paint = () => {
    const q = inp.value.trim().toLowerCase();
    res.innerHTML = '';
    let list = o.items();
    if (q) list = list.filter(x => o.match(x, q));
    list = list.slice(0, 40);
    if (o.allowNew && q) {
      res.appendChild(el('button', { html: `${ico('plus',13)} <b>Create “${esc(inp.value.trim())}”</b>`,
        onclick: () => { close(); o.onNew(inp.value.trim(), lbl => { inp.value = lbl; }, id => { chosen = id; }); } }));
    }
    if (!list.length && !o.allowNew) res.appendChild(el('div', { class: 'sec', text: 'No match' }));
    list.forEach(x => res.appendChild(el('button', { html: o.render(x), onclick: () => {
      chosen = o.value(x); inp.value = o.label(x); close();
      if (o.onPick) o.onPick(x);
    } })));
    pickerLayer().appendChild(res);
    place();
    res.classList.add('on');
  };
  inp.addEventListener('focus', paint);
  inp.addEventListener('input', () => { chosen = null; paint(); });
  inp.addEventListener('blur', () => setTimeout(close, 180));
  /* the field moves when the modal behind it scrolls */
  addEventListener('scroll', () => { if (res.classList.contains('on')) place(); }, true);
  addEventListener('resize', () => { if (res.classList.contains('on')) place(); });
  return { node: wrap, get: () => chosen, getText: () => inp.value.trim(),
    set: id => { chosen = id; }, close,
    clear: () => { chosen = null; inp.value = ''; } };
}
const coPicker = (value) => picker({

  initialValue: value, initialLabel: value ? (getCo(value) || {}).name || '' : '',
  items: () => live('companies').sort((a,b) => (a.name||'').localeCompare(b.name||'')),

     selects it itself, which is what every caller already expected. */
  onNew: (name, setLabel, setValue) => {

function currentOwnerId() {
  if (!AUTH.user) return (DB.owners[0] || {}).id || '';
