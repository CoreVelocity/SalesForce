    [['', 'Exclude status: none']].concat(stages.map(s => [s, 'Exclude ' + s])),
    v => { f.not = v || null; render(); }, 180));

  const regions = leadUniq(base.map(l => l.region).filter(Boolean)).sort();
  bar.appendChild(selectFilter('Region', f.region || '',
    [['', 'All regions'], ['__none', 'No region yet']].concat(regions.map(r => [r, r])),
    v => { f.region = v || null; render(); }, 150));

  bar.appendChild(selectFilter('Re-connection', f.recon || '',
    [['', 'Re-connection: any'], ['yes', 'Tagged to re-connect'], ['due', 'Re-connect due now'], ['no', 'Not tagged']],
    v => { f.recon = v || null; render(); }, 190));

  if (leadSeeAll()) {
    const reps = activeOwners().filter(o => base.some(l => String(l.assignee) === o.id));
    bar.appendChild(selectFilter('Rep', f.rep || '',
      [['', 'All reps'], ['__none', 'Nobody yet']].concat(reps.map(o => [o.id, o.name])),
      v => { f.rep = v || null; render(); }, 165));
  }
  bar.appendChild(selectFilter('Type', f.type || '',
    [['', 'B2B and B2C'], ['B2B', 'B2B only'], ['B2C', 'B2C only']],
    v => { f.type = v || null; render(); }, 140));
  if (!lost) bar.appendChild(selectFilter('Flag', f.flag || '',
    [['', 'Any state'], ['due', 'Action due now'], ['awaiting', 'Awaiting a reply'],
     ['priority', 'Priority only'], ['cold', 'Cold only']],
    v => { f.flag = v || null; render(); }, 165));

  if (Object.keys(f).some(k => f[k])) bar.appendChild(el('button', { class: 'btn sm ghost', text: 'Clear',
    onclick: () => { VIEW.leadFilter = {}; render(); } }));
  bar.appendChild(el('div', { style: 'flex:1' }));
  if (sheetLast()) bar.appendChild(el('span', { class: 'sub',
    text: 'Sheet read ' + fdate(String(sheetLast()).slice(0, 10), 'long') }));
  return bar;
}

function leadRow(l) {
  const touches = (l.touches || []).length;
  const done = leadSentCount(l);
  const n = el('button', { class: 'leadrow' + (leadIsDue(l) ? ' due' : ''),
    onclick: () => { VIEW.leadOpen = l.id; render(); } });
  n.appendChild(el('span', { class: 'av', style: `background:${ownerColor(l.assignee || '')}`,
    text: (l.type === 'B2B' ? 'B' : (leadFirst(l.name)[0] || '·')).toUpperCase() }));

  /* The badges are the point of this row: they say what state the lead is in
     without opening it — answered fast, waiting too long, overdue, cold. */
  const badges = el('span', { class: 'badges' });
  const eng = leadEngagedMs(l);
  if (eng != null) badges.appendChild(el('span', { class: 'bg good', text: 'engaged in ' + fdur(eng) }));
  else if (leadAwaiting(l)) { const w = leadAwaitingMs(l);
    badges.appendChild(el('span', { class: 'bg ' + (w > 3 * 864e5 ? 'bad' : 'warn'), text: 'awaiting ' + fdur(w) })); }
  const due = leadNextDue(l);
  if (leadIsDue(l)) badges.appendChild(el('span', { class: 'bg bad',
    text: 'overdue ' + fdate(due.toISOString().slice(0, 10)) }));
  else if (due && LEAD_ACTIVE(l)) badges.appendChild(el('span', { class: 'bg',
    text: 'next ' + fdate(due.toISOString().slice(0, 10)) }));
  if (l.cold) badges.appendChild(el('span', { class: 'bg info', text: 'Cold' }));
  if (l.reconnect) badges.appendChild(el('span', { class: 'bg ' + (leadReconnectDue(l) ? 'warn' : ''),
    text: 're-connect ' + fdate(l.reconnectBy) }));
  if ((l.updates || []).length) badges.appendChild(el('span', { class: 'bg',
    title: (l.updates || []).length + ' updates', text: '✎ ' + (l.updates || []).length }));

  n.appendChild(el('div', { class: 'mid' }, [
    el('div', { class: 'nm', html: `${l.priority ? '<span class="star">★</span> ' : ''}${esc(l.name || 'Unnamed')}` +
      `<span class="tag">${esc(l.type)}</span>` +
      (l.region ? `<span class="tag">${esc(l.region)}</span>` : '') +
      (l.company ? `<span class="co">${esc(l.company)}</span>` : '') }),
    badges.childNodes.length ? badges : null,
    el('div', { class: 'sub', text: [l.assignee ? ownerName(l.assignee) : 'no rep yet',
      l.stage === 'Lost' && l.lostReason ? 'Lost · ' + l.lostReason : null,
      l.source, l.phone].filter(Boolean).join(' · ') })
  ]));
  n.appendChild(el('span', { class: 'steps', title: `${done} of ${touches} steps sent`,
    text: `${done}/${touches}` }));
  n.appendChild(el('span', { class: 'tag ' + (LEAD_TAG[l.stage] || ''), text: l.stage }));
  return n;
}

/* ---------------------------------------------------- one lead */
function leadDetail(root, l) {
  const mine = !isReadOnly() && (leadSeeAll() || String(l.assignee) === currentOwnerId() || String(l.owner) === currentOwnerId());
  root.appendChild(viewHead(null, [
    el('button', { class: 'btn', html: '‹ All leads', onclick: () => { VIEW.leadOpen = null; render(); } }),
    l.contactId ? el('button', { class: 'btn', html: ico('user',14) + ' Open the contact',
      onclick: () => openContact(l.contactId) }) : null,
    l.dealId ? el('button', { class: 'btn', html: ico('board',14) + ' Open the deal',
      onclick: () => openDeal(l.dealId) }) : null,
    mine ? el('button', { class: 'btn', html: ico('mail',14) + ' Email the rep',
      title: l.assignee ? 'Send ' + ownerName(l.assignee) + ' this lead and a link to it' : 'Assign a rep first',
      disabled: l.assignee ? null : true, onclick: () => leadEmailRep(l.id) }) : null,
    mine ? el('button', { class: 'btn', html: ico('cal',14) + ' Set reminders',
      title: 'Put every remaining step in the rep\u2019s task list, on the day it is due',
      onclick: () => leadRemind(l.id) }) : null,
    mine ? el('button', { class: 'btn', html: ico('cog',14) + ' Edit', onclick: () => leadEdit(l) }) : null
  ]));

  /* header */
  const head = card(null, null);
  const hd = el('div', { style: 'display:flex;gap:var(--sp-3);align-items:flex-start;flex-wrap:wrap' });
  hd.appendChild(el('span', { class: 'av lg', style: `background:${ownerColor(l.assignee || '')}`,
    text: (l.type === 'B2B' ? 'B' : (leadFirst(l.name)[0] || '·')).toUpperCase() }));
  hd.appendChild(el('div', { style: 'flex:1;min-width:0' }, [
    el('h3', { style: 'margin:0', html: esc(l.name || 'Unnamed') +
      ` <span class="tag">${esc(l.type)}</span> <span class="tag">${esc(l.language)}</span>` +
      (l.company ? ` <span class="tag info">${esc(l.company)}</span>` : '') }),
    el('div', { class: 'sub', style: 'margin-top:4px', text:
      [l.source ? 'Source: ' + l.source : null, l.region || null,
       'Added ' + fdate(String(l.createdAt).slice(0,10))].filter(Boolean).join(' · ') }),
    l.note ? el('p', { style: 'margin:var(--sp-2) 0 0;line-height:1.55;color:var(--ink-2)', text: l.note }) : null
  ]));
  if (mine) hd.appendChild(el('button', { class: 'btn sm', title: l.priority ? 'Priority — click to clear' : 'Mark as priority',
    text: l.priority ? '★' : '☆', onclick: () => { l.priority = !l.priority; leadSave(l); render(); } }));
  head.body.appendChild(hd);

  /* stage + rep */
  const ctl = el('div', { style: 'display:flex;gap:var(--sp-2);flex-wrap:wrap;align-items:center;margin-top:var(--sp-3);padding-top:var(--sp-3);border-top:1px solid var(--line-soft)' });
  const st = el('select', { class: 'inp', style: 'width:auto', disabled: mine ? null : true,
    onchange: e => leadSetStage(l.id, e.target.value) });
  MLEAD_STAGES.forEach(s => st.appendChild(el('option', { value: s, text: s, selected: l.stage === s || null })));
  ctl.appendChild(el('span', { class: 'sub', text: 'Stage' })); ctl.appendChild(st);
  const rep = ownerSelect(l.assignee || '', { emptyLabel: 'Not assigned',
    onchange: e => { l.assignee = e.target.value; l.routeNeeded = !e.target.value;
      if (l.assignee) { l.assignedAt = new Date().toISOString();
        if (l.contactId) { const c = getCt(l.contactId); if (c) { c.ownerId = l.assignee; upsert('contacts', c); } } }
      leadSave(l); render(); } });
  rep.style.width = 'auto'; rep.disabled = mine ? false : true;
  ctl.appendChild(el('span', { class: 'sub', text: 'Rep' })); ctl.appendChild(rep);
  if (l.lostReason) ctl.appendChild(el('span', { class: 'tag bad', text: 'Lost: ' + l.lostReason }));
  if (l.dealId) ctl.appendChild(el('span', { class: 'tag good', text: 'In the pipeline' }));
  head.body.appendChild(ctl);
  root.appendChild(head.node);

  /* contact details */
  const cd = card('Contact details', l.contactId
    ? 'Kept in step with the contact record this lead created'
    : 'No contact record yet');
  if (mine) cd.head.appendChild(el('button', { class: 'btn sm', html: '\u2193 Extract from the notes',
    title: 'Read the phone, email and emirate out of whatever was typed in the notes',
    onclick: () => leadExtract(l.id) }));
  const grid = el('div', { class: 'field-row' });
  const bind = (label, key, type) => {
    const i = el('input', { class: 'inp', type: type || 'text', value: l[key] || '', disabled: mine ? null : true,
      onchange: e => { l[key] = e.target.value.trim();
        if (l.contactId) { const c = getCt(l.contactId);
          if (c && (key === 'phone' || key === 'email')) { c[key] = l[key] || null; upsert('contacts', c); } }
        if (key === 'address') { l.region = leadRegionOf(l.address) || l.region; }
        leadSave(l); } });
    grid.appendChild(fld(label, i));
  };
  bind('Phone', 'phone', 'tel'); bind('Email', 'email', 'email');
  cd.body.appendChild(grid);
  const g2 = el('div', { class: 'field-row' });
  const addr = el('input', { class: 'inp', value: l.address || '', disabled: mine ? null : true,
    onchange: e => { l.address = e.target.value.trim();
      const r = leadRegionOf(l.address); if (r) l.region = r;
      if (r && !l.assignee) leadAutoAssign(l);
      leadSave(l); render(); } });
  g2.appendChild(fld('Address', addr, 'Dubai or Abu Dhabi in here is what routes the lead to a rep.'));
  const emi = el('select', { class: 'inp', disabled: mine ? null : true,
    onchange: e => { l.region = l.emirate = e.target.value || '';
      if (l.region && !l.assignee) leadAutoAssign(l);
      leadSave(l); render(); } });
  [['', 'Work it out from the address']].concat(EMIRATE_RULES.map(([r]) => [r, r]))
    .forEach(([v, t]) => emi.appendChild(el('option', { value: v, text: t, selected: l.region === v || null })));
  g2.appendChild(fld('Emirate', emi, 'Set it by hand when the address does not say.'));
  cd.body.appendChild(g2);
  const g3 = el('div', { class: 'field-row' });
  const cmp = el('input', { class: 'inp', value: l.company || '', disabled: mine ? null : true,
    placeholder: 'Gym, hotel, studio, clinic…',
    onchange: e => { l.company = e.target.value.trim();
      if (l.company && l.type !== 'B2B') l.type = 'B2B';
      leadSave(l); render(); } });
  g3.appendChild(fld('Company', cmp, 'A business here makes this a B2B lead and switches the message copy.'));
  const src = el('input', { class: 'inp', value: l.source || '', disabled: mine ? null : true,
    placeholder: 'Instagram, referral, walk-in…',
    onchange: e => { l.source = e.target.value.trim(); leadSave(l); } });
  g3.appendChild(fld('Source', src));
  cd.body.appendChild(g3);
  const brief = el('textarea', { class: 'inp', rows: 2, value: l.brief || '', disabled: mine ? null : true,
    placeholder: 'What you know about them — Claude uses this when tuning a message',
    onchange: e => { l.brief = e.target.value.trim(); leadSave(l); } });
  cd.body.appendChild(fld('Your brief on this lead', brief));
  root.appendChild(cd.node);

  /* ---- re-connection, cold, and the showroom line ---- */
  if (mine) {
    const sc = card('Keeping it alive', 'For a lead that is not no, just not now');
    const rowR = el('div', { class: 'leadopts' });
    if (l.reconnect) {
      rowR.appendChild(el('span', { class: 'tag warn', text: 'Re-connect by' }));
      const d = el('input', { class: 'inp', type: 'date', style: 'width:auto', value: l.reconnectBy || '',
        onchange: e => { l.reconnectBy = e.target.value || null; leadSave(l); render(); } });
      rowR.appendChild(d);
      rowR.appendChild(el('button', { class: 'btn sm ghost', text: 'Remove the tag',
        onclick: () => leadReconnectClear(l.id) }));
    } else {
      rowR.appendChild(el('button', { class: 'btn sm', html: ico('cal',13) + ' Tag for re-connection',
        title: 'Parks it with a date so it comes back up instead of being forgotten',
        onclick: () => leadReconnect(l.id) }));
      rowR.appendChild(el('span', { class: 'sub', text: 'Defaults to 30 days out — change the date after.' }));
    }
    sc.body.appendChild(rowR);

    const rowC = el('div', { class: 'leadopts' });
    rowC.appendChild(el('button', { class: 'btn sm' + (l.cold ? ' primary' : ''),
      html: '\u2744 ' + (l.cold ? 'Cold — click to undo' : 'Mark as cold'),
      onclick: () => leadMarkCold(l.id) }));
    rowC.appendChild(el('span', { class: 'sub',
      text: 'Adds three wider re-engagement touches after Day 12 rather than another chase.' }));
    sc.body.appendChild(rowC);

    const rowS = el('div', { class: 'leadopts' });
    rowS.appendChild(el('span', { class: 'sub', text: '\ud83d\udccd Showroom address in WhatsApp' }));
    const sh = el('select', { class: 'inp', style: 'width:auto',
      onchange: e => { l.showroom = e.target.value || null; leadSave(l); } });
    sh.appendChild(el('option', { value: '', text: 'None' }));
    Object.keys(showrooms()).forEach(k => sh.appendChild(el('option', { value: k,
      text: showrooms()[k].name, selected: l.showroom === k || null })));
    rowS.appendChild(sh);
    Object.keys(showrooms()).forEach(k => rowS.appendChild(el('a', { class: 'btn sm ghost',
      href: showrooms()[k].map, target: '_blank', rel: 'noopener', text: k + ' map' })));
    sc.body.appendChild(rowS);
    sc.body.appendChild(el('p', { class: 'sub', style: 'margin:var(--sp-2) 0 0;line-height:1.5',
      text: 'Picked here, the address and the map link are added to the end of every WhatsApp message you send from the steps below.' }));
    root.appendChild(sc.node);

    /* ---- what this lead is likely to want ---- */
    const hc = card('Lead heads-up', 'A read on what they are likely after, and the angle to take');
    const hrow = el('div', { class: 'leadopts' });
    hrow.appendChild(el('a', { class: 'btn sm ghost', target: '_blank', rel: 'noopener',
      href: 'https://www.linkedin.com/search/results/all/?keywords=' +
        encodeURIComponent([l.name, l.company].filter(Boolean).join(' ')),
      html: ico('out',13) + ' Look them up on LinkedIn' }));
    hrow.appendChild(el('button', { class: 'btn sm', disabled: aiReady() ? null : true,
      title: aiReady() ? 'Claude reads what you have on this lead and suggests the angle'
                       : 'An admin has to add the Anthropic key in Settings first',
      html: LEAD_AI_BUSY === l.id + ':brief' ? '<span class="spin sm"></span> Thinking…' : '\u2726 Ask Claude',
      onclick: () => leadHeadsUp(l.id) }));
    hc.body.appendChild(hrow);
    if (l.headsUp) hc.body.appendChild(el('p', { style: 'margin:var(--sp-3) 0 0;line-height:1.6;white-space:pre-wrap',
      text: l.headsUp }));
    else hc.body.appendChild(el('p', { class: 'sub', style: 'margin:var(--sp-2) 0 0;line-height:1.5',
      text: 'It works from the name, company, source and your notes — nothing leaves the tool except that.' }));
    root.appendChild(hc.node);
  }

  /* the cadence */
  const pend = (l.touches || []).filter(t => t.status === 'pending').length;
  const stepNo = (l.touches || []).length - pend + 1;
  const cc = card('The follow-up',
    `${(l.touches || []).length} touches` + (l.cold ? ' including the cold drip' : ' over twelve days') +
    (pend ? ` · step ${Math.min(stepNo, (l.touches || []).length)} of ${(l.touches || []).length}` : ' · all done'));
  if (mine) {
    const rem = leadRemindersFor(l).length;
    cc.head.appendChild(el('button', { class: 'btn sm', html: ico('cal',13) + (rem ? ` ${rem} reminders set` : ' Set reminders'),
      title: 'One task per remaining step, on the day the cadence says it is due',
      onclick: () => leadRemind(l.id) }));
  }
  if (!aiReady()) cc.body.appendChild(el('p', { class: 'sub', style: 'margin:0 0 var(--sp-3);line-height:1.55',
    text: 'Tuning with Claude is off until an admin adds the Anthropic key in Settings. The steps below still work — edit them by hand.' }));
  const steps = el('div', { class: 'cadence' });
  const next = leadNextStep(l);
  (l.touches || []).forEach(t => steps.appendChild(leadStep(l, t, mine, !!next && t.key === next.key)));
  cc.body.appendChild(steps);
  root.appendChild(cc.node);

  /* updates */
  const uc = card('Updates', 'What happened, and when — everyone on the team sees this');
  if (mine) {
    const ta = el('textarea', { class: 'inp', rows: 3,
      placeholder: 'What happened, what the client said, and the next step… (up to 100 words)' });
    const words = v => String(v || '').trim().split(/\s+/).filter(Boolean).length;
    const foot = el('div', { class: 'updfoot' });
    const cnt = el('span', { class: 'sub', text: '0 / 100 words' });
    const post = () => {
      const w = words(ta.value);
      if (!w) return toast('Write something first', 'err');
      if (w > 100) return toast(`That is ${w} words — keep it to 100`, 'err');
      leadAddUpdate(l, ta.value); ta.value = '';
    };
    ta.addEventListener('input', () => { const w = words(ta.value);
      cnt.textContent = `${w} / 100 words`; cnt.style.color = w > 100 ? 'var(--critical-ink)' : ''; });
    ta.addEventListener('keydown', e => {
      if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') { e.preventDefault(); post(); } });
    uc.body.appendChild(ta);
    foot.appendChild(cnt);
    foot.appendChild(el('span', { class: 'sub', text: 'Ctrl + Enter to post' }));
    foot.appendChild(el('div', { style: 'flex:1' }));
    foot.appendChild(el('button', { class: 'btn primary', text: 'Post update', onclick: post }));
    uc.body.appendChild(foot);
  }
  const ups = (l.updates || []).slice().sort((a, z) => String(z.at).localeCompare(String(a.at)));
  if (!ups.length) uc.body.appendChild(el('p', { class: 'sub', style: 'margin:var(--sp-3) 0 0', text: 'Nothing logged yet.' }));
  else {
    const tl = el('div', { class: 'tl', style: 'margin-top:var(--sp-3)' });
    ups.forEach(u => { const d = new Date(u.at);
      const when = isNaN(d) ? String(u.at).slice(0, 10)
        : fdate(String(u.at).slice(0, 10)) + ', ' + d.toLocaleTimeString('en-GB', { hour: 'numeric', minute: '2-digit' });
      tl.appendChild(el('div', { class: 'it note', html:
        `<div class="w">${esc(u.by || '')} · ${esc(when)}</div><div class="t">${esc(u.text)}</div>` })); });
    uc.body.appendChild(tl);
  }
  root.appendChild(uc.node);
}

function leadStep(l, t, mine, isNext) {
  const busy = LEAD_AI_BUSY === l.id + ':' + t.key;
  const due = leadStepDue(l, t.key);
  const overdue = isNext && due && due.getTime() <= Date.now();
  const n = el('div', { class: 'cstep' + (t.status === 'sent' ? ' done' : '') +
    (isNext ? ' now' : '') + (t.cold ? ' cold' : '') });
  n.appendChild(el('div', { class: 'ch' }, [
    isNext ? el('span', { class: 'tag ' + (overdue ? 'bad' : 'good'),
      text: overdue ? '▶ Do this now' : '▶ Next up' }) : null,
    el('span', { class: 'd', text: t.day }),
    el('span', { class: 'w', text: t.when }),
    el('span', { class: 'tag ' + (t.channel === 'Email' ? 'info' : ''), text: t.channel }),
    el('div', { style: 'flex:1' }),
    t.repliedAt ? el('span', { class: 'tag good', text: 'replied' }) : null,
    due && t.status === 'pending' ? el('span', { class: 'sub',
      title: due.toLocaleString('en-GB'),
      text: 'due ' + fdate(due.toISOString().slice(0, 10)) }) : null,
    t.waAt ? el('span', { class: 'sub', text: `sent ${fdate(String(t.waAt).slice(0,10))}` +
      (t.waCount > 1 ? ` · ${t.waCount}×` : '') }) : null,
    el('span', { class: 'tag ' + (t.status === 'sent' ? 'good' : t.status === 'skipped' ? '' : 'warn'),
      text: t.status === 'sent' ? 'sent' : t.status === 'skipped' ? 'skipped' : 'to do' })
  ]));
  n.appendChild(el('div', { class: 'p', text: t.purpose }));
  if (t.subject !== undefined) {
    const si = el('input', { class: 'inp', value: t.subject || '', placeholder: 'Subject', disabled: mine ? null : true,
      onchange: e => { t.subject = e.target.value; leadSave(l); } });
    n.appendChild(si);
  }
  const ta = el('textarea', { class: 'inp', rows: Math.min(8, Math.max(3, String(t.message || '').split('\n').length + 1)),
    value: t.message || '', disabled: mine ? null : true,
    onchange: e => { t.message = e.target.value; leadSave(l); } });
  n.appendChild(ta);
  if (!mine) return n;
  const acts = el('div', { class: 'ca' });
  acts.appendChild(el('button', { class: 'btn sm', disabled: busy || !aiReady() ? true : null,
    title: aiReady() ? 'Rewrite this step with Claude, using the lead and your brief'
                     : 'An admin has to add the Anthropic key in Settings first',
    html: busy ? '<span class="spin sm"></span> Tuning…' : '✦ Tune with Claude',
    onclick: () => leadTune(l.id, t.key) }));
  acts.appendChild(el('button', { class: 'btn sm', text: 'Copy', onclick: () => leadCopy(l.id, t.key) }));
  if (t.channel !== 'Email') acts.appendChild(el('button', { class: 'btn sm wa',
    title: 'Opens WhatsApp with this message ready — you press send',
    html: ico('chat',13) + ' WhatsApp', onclick: () => leadWhatsApp(l.id, t.key) }));
  acts.appendChild(el('div', { style: 'flex:1' }));
  acts.appendChild(el('button', { class: 'btn sm ghost',
    title: 'They answered — stops the clock on time-to-engage and moves the lead to Engaged',
    text: 'Replied → next', onclick: () => leadReplied(l.id, t.key) }));
  acts.appendChild(el('button', { class: 'btn sm ghost',
    text: t.status === 'sent' ? 'Mark not sent' : 'Sent → next',
    onclick: () => leadStepStatus(l.id, t.key, t.status === 'sent' ? 'pending' : 'sent') }));
  acts.appendChild(el('button', { class: 'btn sm ghost', text: t.status === 'skipped' ? 'Unskip' : 'Skip',
    onclick: () => leadStepStatus(l.id, t.key, t.status === 'skipped' ? 'pending' : 'skipped') }));
  n.appendChild(acts);
  return n;
}

/* ---------------------------------------------------- add / edit */
function leadEdit(l) {
  if (isReadOnly()) return toast('You have read-only access', 'err');
  const isNew = !l;
  l = l || { type: 'B2C', language: 'English', stage: 'New' };
  const nm = el('input', { class: 'inp', value: l.name || '', placeholder: 'e.g. Omar Al Mansoori' });
  const ty = el('select', { class: 'inp', onchange: () => { coF.style.display = ty.value === 'B2B' ? '' : 'none'; } });
  [['B2C','Home (B2C)'],['B2B','Business (B2B)']].forEach(([v, t]) =>
    ty.appendChild(el('option', { value: v, text: t, selected: l.type === v || null })));
  const co = el('input', { class: 'inp', value: l.company || '', placeholder: 'Gym, hotel, studio, clinic…' });
  const ph = el('input', { class: 'inp', type: 'tel', value: l.phone || '', placeholder: '+971…' });
  const em = el('input', { class: 'inp', type: 'email', value: l.email || '', placeholder: 'name@…' });

/* ================================================================
   BRING DATA ACROSS FROM THE SALES TRACKER

   The tracker (corevelocity/sales) keeps its records as JSON in the
   same OneDrive this CRM reads, so nothing has to be exported by hand:
   sign in, point at the tracker's folder, and its marketing leads come
   across with the stage they were at, the rep who had them and the day
   they arrived.

   Four things make it safe to run on live data:
     · a backup of the tracker's folder downloads before anything is
       read across, and OneDrive keeps its own version history besides;
     · nothing is ever written back to the tracker — this only reads;
     · every lead carries the id it had over there, so running it a
       second time updates what came across instead of doubling it;
     · the last run can be undone in one click.

   It does not assume the tracker's field names. It reads the file,
   finds the arrays that look like leads, guesses the columns, and then
   shows that guess for correction before a single record is written.

const MIG = { step: 'src', busy: '', err: '', folders: [], files: [], folder: null,
  file: null, raw: null, cands: [], pick: null, map: {}, rows: [], opts: {} };

/* ---------------------------------------------------- reading OneDrive */
const migFolderId = () => (DB.config && DB.config.trackerFolder) || '';

async function migChildren(id) {
  const r = await graph(`/drives/${DRIVE.id}/items/${id}/children` +
    '?$top=200&$select=id,name,size,folder,file,lastModifiedDateTime');
  return (r && r.value) || [];
}
async function migScan() {
  MIG.busy = 'Looking in OneDrive…'; MIG.err = ''; migPaint();
  try {
    await resolveDrive();
    /* The CRM's own folder sits beside the tracker's — OXEFIT/CoreVCRM and
       OXEFIT/<whatever the tracker called itself> — so the parent is where
       to look first. */
    const me = await graph(`/drives/${DRIVE.id}/items/${DRIVE.folderId}?$select=id,name,parentReference`);
    const parent = me && me.parentReference && me.parentReference.id;
    const sibs = parent ? await migChildren(parent) : [];
    MIG.folders = sibs.filter(x => x.folder && x.id !== DRIVE.folderId);
    MIG.step = 'folder';
  } catch (e) {
    MIG.err = String(e.message || e);
    MIG.step = 'folder';
  } finally { MIG.busy = ''; migPaint(); }
}
async function migOpenFolder(f) {
  MIG.folder = f; MIG.busy = 'Reading ' + f.name + '…'; MIG.err = ''; migPaint();
  try {
    const kids = await migChildren(f.id);
    MIG.files = kids.filter(x => x.file && /\.(json|csv|txt)$/i.test(x.name))
      .sort((a, b) => String(b.lastModifiedDateTime).localeCompare(String(a.lastModifiedDateTime)));
    /* One level down as well — some tools keep a data/ subfolder. */
    for (const sub of kids.filter(x => x.folder).slice(0, 6)) {
      const deeper = await migChildren(sub.id);
      deeper.filter(x => x.file && /\.(json|csv|txt)$/i.test(x.name))
        .forEach(x => MIG.files.push(Object.assign({}, x, { name: sub.name + '/' + x.name })));
    }
    MIG.step = 'file';
  } catch (e) { MIG.err = String(e.message || e); }
  finally { MIG.busy = ''; migPaint(); }
}
async function migGrab(item) {
  const r = await graph(`/drives/${DRIVE.id}/items/${item.id}/content`, { raw: true });
  return await r.text();
}
async function migReadFile(item) {
  MIG.busy = 'Opening ' + item.name + '…'; MIG.err = ''; migPaint();
  try {
    MIG.file = item;
    migTake(await migGrab(item), item.name);
  } catch (e) { MIG.err = String(e.message || e); MIG.busy = ''; migPaint(); }
}

/* Downloads everything in the tracker's folder as one file, before a single
   record is read across. This is the backup. */
async function migBackup() {
  const f = MIG.folder; if (!f) return;
  MIG.busy = 'Packing a backup of ' + f.name + '…'; migPaint();
  const bundle = { tool: f.name, folder: f.name, takenAt: new Date().toISOString(),
    takenBy: (AUTH.user && AUTH.user.username) || 'local', files: {} };
  let bytes = 0, failed = [];
  try {
    for (const item of MIG.files) {
      try {
        const text = await migGrab(item);
        bytes += text.length;
        try { bundle.files[item.name] = JSON.parse(text); }
        catch (e) { bundle.files[item.name] = text; }
      } catch (e) { failed.push(item.name); }
    }
    download(`${f.name.toLowerCase().replace(/[^a-z0-9]+/g, '-')}-backup-${TODAY()}.json`,
      JSON.stringify(bundle, null, 1));
    toast(`Backup of ${Object.keys(bundle.files).length} file${Object.keys(bundle.files).length === 1 ? '' : 's'} downloaded` +
      (failed.length ? ` · ${failed.length} could not be read` : ''), failed.length ? 'warn' : 'ok');
  } catch (e) { toast('Backup failed: ' + String(e.message || e).slice(0, 110), 'err'); }
  finally { MIG.busy = ''; migPaint(); }
}

/* ---------------------------------------------------- finding the leads */
function migTake(text, label) {
  MIG.busy = '';
  let data;
  try { data = JSON.parse(text); }
  catch (e) {
    /* Not JSON — read it as a sheet, keeping EVERY column as its own field.
       The plain lead reader would be simpler here, but it throws away any
       column it does not recognise, and stage and rep are exactly the two
       columns worth keeping off a tracker export. */
    const rows = migCsvRows(text);
    if (!rows.length) { MIG.err = 'Nothing readable in that — it is neither JSON nor rows of columns.';
      MIG.step = MIG.raw ? 'paste' : MIG.step; return migPaint(); }
    MIG.cands = [{ path: label, rows: rows, score: 99, keys: migKeys(rows) }];
    MIG.pick = MIG.cands[0]; MIG.map = migGuess(MIG.pick.keys, MIG.pick.rows); MIG.step = 'map';
    return migPaint();
  }
  MIG.cands = migArrays(data).map(c => Object.assign(c, { score: migScore(c.rows), keys: migKeys(c.rows) }))
    .filter(c => c.score > 0)
    .sort((a, b) => b.score - a.score || b.rows.length - a.rows.length);
  if (!MIG.cands.length) {
    MIG.err = 'Nothing in there looks like a list of people — no names with a phone or an email against them.';
    MIG.step = MIG.raw ? 'paste' : MIG.step; return migPaint(); }
  MIG.pick = MIG.cands[0]; MIG.map = migGuess(MIG.pick.keys, MIG.pick.rows);
  MIG.step = MIG.cands.length > 1 ? 'pick' : 'map';

/* A sheet, as rows of its own columns — every column kept, headings exactly as
   written so they read back recognisably in the mapper.

   This replaces a reader that split the text on blank lines and then treated
   each block separately. One empty row in the middle of an export — and there
   nearly always is one — left every row after it with no headings at all, read
   by position instead, so the phone column landed in the type field. It also
   only knew about commas and tabs, and it threw away any column it did not
   recognise, which is how stage, rep and date went missing on the way in. */

    .map(d => [d, first.split(d).length - 1])
    .sort((a, b) => b[1] - a[1])[0];

  if (!rows.length) return [];

     the file has no headings and the columns are named by position instead. */
  const looksLikeData = r => r.some(c => /@[\w-]+\.\w/.test(c) || /\d[\d\s()+-]{7,}/.test(c));
  const head = looksLikeData(rows[0])
    ? rows[0].map((_, i) => 'column ' + (i + 1))
    : rows.shift().map((h, i) => String(h).trim() || 'column ' + (i + 1));
  return rows.map(cells => {
    const o = {};
    head.forEach((h, n) => { o[h] = cells[n] === undefined ? '' : cells[n]; });
    /* More cells than headings — a stray separator. Keep them rather than lose
       whatever is in them. */
    for (let n = head.length; n < cells.length; n++) o['column ' + (n + 1)] = cells[n];
    return o;

/* A whole file at once, because a quoted cell is allowed to hold the line

function migCsvCells(s, d) {

  for (let i = 0; i < s.length; i++) {
    const c = s[i];
    if (q) {
      if (c === '"' && s[i + 1] === '"') { cur += '"'; i++; }
      else if (c === '"') q = false;
      else cur += c;
    }
    else if (c === '"') q = true;
    else if (c === d) { row.push(cur.trim()); cur = ''; }
    else if (c === '\n' || c === '\r') {
      if (c === '\r' && s[i + 1] === '\n') i++;
      row.push(cur.trim()); cur = ''; rows.push(row); row = [];
    }

  return rows.filter(r => r.some(c => String(c).trim() !== ''));

/* Every array of objects in the file, with the path that got there. */

  if (Array.isArray(node)) {
    if (node.length && node.some(x => x && typeof x === 'object' && !Array.isArray(x)))
      out.push({ path: path || '(the file itself)', rows: node.filter(x => x && typeof x === 'object') });
    node.slice(0, 3).forEach(x => migArrays(x, (path || '') + '[]', out, depth + 1));
    return out;
  }
  Object.keys(node).forEach(k => migArrays(node[k], path ? path + '.' + k : k, out, depth + 1));

  [/demo|appointment|booked|meeting|scheduled|visit|trial/i, 'Demo booked'],
  [/engag|interest|qualif|hot|warm|negoti|proposal|quote|discussion/i, 'Engaged'],
  [/refer/i, 'Referral'],

  live('leads').forEach(l => { if (l.srcId) bySrc.set('s:' + l.srcId, l); });
  const seen = new Set();
  rows.forEach(r => {
    const dupInFile = seen.has(leadKey(r)); seen.add(leadKey(r));
    const here = bySrc.get('s:' + r.srcId) || byKey.get(leadKey(r)) || null;
    r._here = here ? here.id : null;
    r._twice = dupInFile;
    r._take = !dupInFile;
  });
  MIG.rows = rows;
}

/* ---------------------------------------------------- writing it in */
function migCommit() {
  const take = MIG.rows.filter(r => r._take);
  if (!take.length) return;
  const made = [], touched = [];
  let routed = 0, deals = 0;
  batch(() => take.forEach(r => {
    let l = r._here ? getLead(r._here) : null;
    if (l) {
      /* Update, never overwrite: anything a rep has already put in here wins. */
      ['company', 'phone', 'email', 'address', 'source', 'note'].forEach(k => { if (!l[k] && r[k]) l[k] = r[k]; });
      if (!l.assignee && r.assignee) l.assignee = r.assignee;
      if (MIG.opts.stage !== false && r.stage && r.stage !== 'New') l.stage = r.stage;
      l.srcId = l.srcId || r.srcId; l.srcTool = l.srcTool || (MIG.folder ? 'Sales Tracker' : migSourceName());
      leadSave(l); touched.push(l.id);
    } else {
      l = leadCreate(Object.assign({}, r, { assignee: r.assignee || '' }), { quiet: true });
      if (r.createdAt) l.createdAt = r.createdAt;
      if (r.stage) l.stage = r.stage;
      l.srcId = r.srcId; l.srcTool = MIG.folder ? 'Sales Tracker' : migSourceName();
      if (r.rawStage && r.stage === 'New' && !/new|fresh|open/i.test(r.rawStage))
        leadAddUpdate(l, `Came across from ${MIG.folder ? "the Sales Tracker" : "that list"} as "${r.rawStage}" — parked at New`, true);
      if (r.rawAssignee && !r.assignee)
        leadAddUpdate(l, `Was with "${r.rawAssignee}" in ${MIG.folder ? "the Sales Tracker" : "that list"} — no one here matched that name` +
          (l.assignee ? `, so it was routed to ${ownerName(l.assignee)}` : ''), true);
      leadSave(l); made.push(l.id);
      if (l.assignee) routed++;
      if (MIG.opts.deals && LEAD_DEAL_AT.includes(l.stage)) { try { leadToDeal(l); leadSave(l); deals++; } catch (e) {} }
    }
  }));
  DB.config.leadMigLast = { at: new Date().toISOString(),
    by: (AUTH.user && AUTH.user.username) || 'local',
    from: (MIG.folder ? MIG.folder.name + '/' : '') + (MIG.file ? MIG.file.name : 'a file'),
    made, touched: touched.length };
  touch('config');
  closeAll(); VIEW.name = 'leads'; render();
  toast(`${made.length} lead${made.length === 1 ? '' : 's'} brought across` +
    (touched.length ? ` · ${touched.length} already here were topped up` : '') +
    ` · ${routed} routed` + (deals ? ` · ${deals} deals created` : ''), 'ok');
}
function migUndoLast() {
  const last = DB.config && DB.config.leadMigLast;
  if (!last || !(last.made || []).length) return toast('Nothing to undo', 'err');
  confirmDo('Undo the last import',
    `${last.made.length} leads came across on ${new Date(last.at).toLocaleString('en-GB')}. ` +
    'Removing them takes their contacts with them, unless a rep has since worked one — those are left alone. ' +
    'Leads that were already here and only topped up are not touched.',
    'Undo it', () => {
      let gone = 0, kept = 0;
      batch(() => last.made.forEach(id => {
        const l = getLead(id); if (!l) return;
        const worked = (l.updates || []).some(u => !/came across|was with/i.test(u.text)) ||
          l.lastWhatsAppAt || l.dealId || (l.touches || []).some(t => t.status === 'sent');
        if (worked) { kept++; return; }
        if (l.contactId) { const c = getCt(l.contactId); if (c && c.isLead) remove('contacts', c.id); }
        remove('leads', id); gone++;
      }));
      DB.config.leadMigLast = null; touch('config');
      closeAll(); render();
      toast(`${gone} removed` + (kept ? ` · ${kept} left alone because they have been worked` : ''), 'ok');
    });
}

async function migPasteRun(smart) {
  const raw = (($('#migraw') || {}).value || '').trim();

  MIG.raw = raw; MIG.err = ''; MIG.file = MIG.file || { name: 'a pasted list' };
  if (!smart) return migTake(raw, 'the pasted list');
  MIG.busy = 'Reading the list with Claude…'; migPaint();
  try {
    const rows = await leadParseSmart(raw);
    if (!rows.length) throw new Error('Claude found no leads in that');
    /* Claude hands back the fields already named, so there is nothing to map —
       straight to the list to check. */

    MIG.pick = MIG.cands[0]; MIG.map = migGuess(MIG.pick.keys, MIG.pick.rows);

/* ================================================================
   MARKETING LEADS — THE SUMMARY TAB

   The question this screen answers is not "how many leads do we have" but
   "who is sitting on work that has gone cold". So the tiles lead with what
   is overdue and what has had no answer, the rep table is grouped by the
   region each person actually covers, and the lost reasons are counted from

   ================================================================ */

const LEAD_PERIODS = [['w0','This week'],['m','This month'],['q','This quarter'],
  ['mn6','Half-year'],['fy','Fiscal year'],['all','All time']];

function leadPeriod() { return (VIEW.leadPeriod = VIEW.leadPeriod || 'all'); }
function leadPeriodBounds() {
  const p = leadPeriod();
  if (p === 'all') return { from: '1900-01-01', to: '2999-12-31', label: 'all time', grain: 'all' };
  if (p === 'w0') return periodBounds('w0');
  if (p === 'mn6') { const a = mBounds(monthShift(monthKey(), -5) + '-01'), z = mBounds();
    return { from: a.from, to: z.to, label: 'the last six months', grain: 'month' }; }
  return periodBounds(p);
}
/* A lead belongs to the period it arrived in — not the period it was last
   touched in, which would move leads between months as reps worked them. */
function leadInPeriod(rows, b) {
  if (!b || b.grain === 'all') return rows;
  return rows.filter(l => inPeriod(String(l.createdAt || '').slice(0, 10), b));
}

function leadStats(rows) {
  const cnt = s => rows.filter(l => l.stage === s).length;
  const engaged = rows.map(leadEngagedMs).filter(v => v != null);
  return {
    total: rows.length,
    priority: rows.filter(l => l.priority).length,
    due: rows.filter(leadIsDue).length,
    demos: cnt('Demo booked'),
    won: cnt('Won'),
    lost: cnt('Lost'),
    referral: cnt('Referral'),
    awaiting: rows.filter(leadAwaiting).length,
    avgEngage: engaged.length ? engaged.reduce((a, b) => a + b, 0) / engaged.length : null,
    engagedCount: engaged.length,
    reconnect: rows.filter(l => l.reconnect).length,
    noRep: rows.filter(l => !l.assignee).length
  };
}
function leadRepRow(rows) {
  return { leads: rows.length, due: rows.filter(leadIsDue).length,
    demos: rows.filter(l => l.stage === 'Demo booked').length,
    won: rows.filter(l => l.stage === 'Won').length,
    lost: rows.filter(l => l.stage === 'Lost').length,
    ref: rows.filter(l => l.stage === 'Referral').length };
}

function viewLeadSummary(root, all) {
  const b = leadPeriodBounds();
  const rows = leadInPeriod(all, b);
  const s = leadStats(rows);

  /* ---- period ---- */
  const pc = el('div', { class: 'leadperiod' });
  pc.appendChild(el('span', { class: 'lbl', text: 'Period' }));
  LEAD_PERIODS.forEach(([v, label]) => pc.appendChild(el('button', {
    class: 'btn sm' + (leadPeriod() === v ? ' primary' : ''), text: label,
    onclick: () => { VIEW.leadPeriod = v; render(); } })));
  pc.appendChild(el('div', { style: 'flex:1' }));
  pc.appendChild(el('span', { class: 'sub',
    text: `${rows.length} lead${rows.length === 1 ? '' : 's'} · ${b.label.toLowerCase()}` }));
  root.appendChild(pc);

  /* ---- the sheet, if one is not connected yet ---- */
  if (!sheetUrl() && !isReadOnly()) {
    const n = el('div', { class: 'alert', style: 'margin-bottom:var(--sp-3)' });
    n.appendChild(el('span', { class: 'ic', html: ico('sync', 18) }));
    n.appendChild(el('div', { style: 'flex:1;line-height:1.5',
      text: 'Connect the agency sheet and new rows come in on their own, routed to a rep by emirate.' }));
    if (isAdmin()) n.appendChild(el('button', { class: 'btn sm', text: 'Connect a sheet',
      onclick: () => { VIEW.name = 'settings'; render(); } }));
    root.appendChild(n);
  }

  /* ---- the numbers ---- */
  const t = el('div', { class: 'tiles' });
  t.appendChild(tile('Priority', s.priority, { icon: 'flag', tag: s.priority ? 'warn' : '',
    foot: 'starred by a rep' }));
  t.appendChild(tile('Total leads', s.total, { icon: 'user',
    foot: s.noRep ? `${s.noRep} still need a rep` : 'all routed' }));
  t.appendChild(tile('Action due now', s.due, { icon: 'bolt', tag: s.due ? 'bad' : 'good',
    foot: s.due ? 'a step is past its moment' : 'nothing overdue' }));
  t.appendChild(tile('Demos booked', s.demos, { icon: 'cal', foot: 'in the pipeline as deals' }));
  t.appendChild(tile('Won', s.won, { icon: 'check',
    foot: s.won + s.lost ? `${Math.round(s.won / (s.won + s.lost) * 100)}% of ${s.won + s.lost} decided` : 'none decided yet' }));
  t.appendChild(tile('Lost', s.lost, { icon: 'x', foot: 'with a reason on each' }));
  t.appendChild(tile('Referral', s.referral, { icon: 'chat', foot: 'came through someone' }));
  t.appendChild(tile('Avg time to engage', s.avgEngage == null ? '—' : fdur(s.avgEngage), { icon: 'sync',
    foot: s.engagedCount ? `across ${s.engagedCount} who answered` : 'nobody has answered yet' }));
  t.appendChild(tile('Awaiting engagement', s.awaiting, { icon: 'warn', tag: s.awaiting ? 'warn' : '',
    foot: 'messaged, no reply yet' }));
  if (s.reconnect) t.appendChild(tile('To re-connect', s.reconnect, { icon: 'cal',
    foot: rows.filter(leadReconnectDue).length + ' due now' }));
  root.appendChild(t);

  /* ---- by rep, grouped the way the team is actually organised ---- */
  const rc = card('By sales rep', 'Click a rep to see only their leads');
  const tbl = el('div', { class: 'reptbl' });
  const head = el('div', { class: 'rhead' });
  ['Sales rep', 'Leads', 'Due', 'Demos', 'Won', 'Lost', 'Ref'].forEach((h, i) =>
    head.appendChild(el('span', { class: i ? 'n' : '', text: h })));
  tbl.appendChild(head);
  const numCells = (parent, r, cls) => {
    parent.appendChild(el('span', { class: 'n', text: String(r.leads) }));
    parent.appendChild(el('span', { class: 'n' + (r.due ? ' warn' : ''), text: String(r.due) }));
    parent.appendChild(el('span', { class: 'n', text: String(r.demos) }));
    parent.appendChild(el('span', { class: 'n' + (r.won ? ' good' : ''), text: String(r.won) }));
    parent.appendChild(el('span', { class: 'n' + (r.lost ? ' bad' : ''), text: String(r.lost) }));
    parent.appendChild(el('span', { class: 'n' + (r.ref ? ' info' : ''), text: String(r.ref) }));
  };
  let shown = 0;
  ownersByRegion().forEach(({ region, owners }) => {
    const mine = owners.filter(o => rows.some(l => String(l.assignee) === o.id));
    if (!mine.length) return;
    const gr = el('div', { class: 'rgroup' });
    gr.appendChild(el('span', {}, [ el('b', { text: region }),
      el('span', { class: 'sub', style: 'margin-left:8px', text: `${mine.length} rep${mine.length === 1 ? '' : 's'}` }) ]));
    numCells(gr, leadRepRow(rows.filter(l => mine.some(o => o.id === String(l.assignee)))));
    tbl.appendChild(gr);
    mine.forEach(o => {
      const mineRows = rows.filter(l => String(l.assignee) === o.id);
      const r = el('button', { class: 'rrow', onclick: () => {
        VIEW.leadTab = 'active'; VIEW.leadFilter = { rep: o.id }; render(); } });
      r.appendChild(el('span', { class: 'who' }, [
        el('span', { class: 'av sm', style: `background:${ownerColor(o.id)}`, text: initials(o.name) }),
        el('span', { class: 'nm', text: o.name })
      ]));
      numCells(r, leadRepRow(mineRows));
      tbl.appendChild(r);
      shown++;
    });
  });
  const orphan = rows.filter(l => !l.assignee);
  if (orphan.length) {
    const r = el('button', { class: 'rrow', onclick: () => {
      VIEW.leadTab = 'active'; VIEW.leadFilter = { rep: '__none' }; render(); } });
    r.appendChild(el('span', { class: 'who' }, [
      el('span', { class: 'av sm', style: 'background:var(--surface-3);color:var(--ink-3)', text: '—' }),
      el('span', { class: 'nm', text: 'Nobody yet' }) ]));
    numCells(r, leadRepRow(orphan));
    tbl.appendChild(r);
    shown++;
  }
  if (!shown) rc.body.appendChild(el('p', { class: 'sub', style: 'margin:0', text: 'No leads in this period.' }));
  else rc.body.appendChild(tbl);
  root.appendChild(rc.node);

  /* ---- why we lose ---- */
  const lostRows = rows.filter(l => l.stage === 'Lost');
  const lc = card('Why we lose', `${lostRows.length} lost lead${lostRows.length === 1 ? '' : 's'}`);
  if (!lostRows.length) lc.body.appendChild(el('p', { class: 'sub', style: 'margin:0',
    text: 'Nothing lost in this period.' }));
  else {
    const bars = el('div', { class: 'lossbars' });
    const counts = {};
    MLEAD_LOST.forEach(r => { counts[r] = 0; });
    lostRows.forEach(l => { const r = l.lostReason && MLEAD_LOST.includes(l.lostReason) ? l.lostReason : '__none';
      counts[r] = (counts[r] || 0) + 1; });
    const max = Math.max(1, ...Object.values(counts));
    MLEAD_LOST.concat(['__none']).forEach(r => {
      const n = counts[r] || 0;
      const row = el('div', { class: 'lossbar' + (r === '__none' ? ' none' : '') });
      row.appendChild(el('div', { class: 'lb' }, [
        el('span', { class: 'nm', text: r === '__none' ? 'No reason recorded' : r }),
        el('span', { class: 'v', text: `${n} · ${lostRows.length ? Math.round(n / lostRows.length * 100) : 0}%` })
      ]));
      const track = el('div', { class: 'track' });
      track.appendChild(el('i', { style: `width:${Math.round(n / max * 100)}%` }));
      row.appendChild(track);
      bars.appendChild(row);
    });
    lc.body.appendChild(bars);
    if (counts.__none) lc.body.appendChild(el('p', { class: 'sub', style: 'margin:var(--sp-3) 0 0;line-height:1.5',
      text: `${counts.__none} were marked lost before the reason picker existed, so nothing was recorded. ` +
        'Everything lost from now on carries one.' }));
  }
  root.appendChild(lc.node);
}

/* ================================================================
   THE DUPLICATES TAB
   ================================================================ */
function viewLeadDupes(root, all) {
  const groups = leadDupes(all);
  const c = card('Duplicates', groups.length
    ? `${groups.length} set${groups.length === 1 ? '' : 's'} · matched on the same email, phone or name`
    : 'Nothing is doubled up');
  if (!groups.length) {
    c.body.appendChild(el('div', { class: 'empty', html: ico('check', 34) +
      '<h4>All clear</h4><p>No two leads share an email, a phone number or a name.</p>' }));
    root.appendChild(c.node); return;
  }
  c.body.appendChild(el('p', { style: 'margin:0 0 var(--sp-3);line-height:1.6;color:var(--ink-2)', html:
    'Merging keeps the <b>oldest</b> one — it holds the history — and folds the others into it: any field it was ' +
    'missing, every update, every step already sent, and the furthest-along stage. The others are then removed.' }));
  groups.slice(0, 60).forEach(g => {
    const box = el('div', { class: 'dupset' });
    const hd = el('div', { class: 'dh' });
    hd.appendChild(el('span', { class: 'nm', text: g.rows[0].name || 'Unnamed' }));
    hd.appendChild(el('span', { class: 'tag ' + (g.weak ? 'warn' : ''), text: g.weak
      ? 'same name only' : g.key.startsWith('e:') ? 'same email' : 'same phone' }));
    hd.appendChild(el('span', { class: 'sub', text: `${g.rows.length} records` }));
    hd.appendChild(el('div', { style: 'flex:1' }));
    if (!isReadOnly()) hd.appendChild(el('button', { class: 'btn sm primary', text: 'Merge into the oldest',
      onclick: () => confirmDo('Merge ' + g.rows.length + ' leads',
        `Everything is folded into the one added ${fdate(String(g.rows[0].createdAt).slice(0,10))}. ` +
        'The others are removed for everyone on the next sync. This cannot be undone.',
        'Merge', () => leadMerge(g.rows)) }));
    box.appendChild(hd);
    g.rows.forEach((l, i) => {
      const r = el('button', { class: 'duprow', onclick: () => { VIEW.leadOpen = l.id; render(); } });
      r.appendChild(el('span', { class: 'tag ' + (i ? '' : 'good'), text: i ? 'merged away' : 'kept' }));
      r.appendChild(el('span', { class: 'mid' }, [
        el('div', { class: 'nm', text: (l.name || 'Unnamed') + (l.company ? ' · ' + l.company : '') }),
        el('div', { class: 'sub', text: [l.phone, l.email, l.stage,
          l.assignee ? ownerName(l.assignee) : 'no rep',
          'added ' + fdate(String(l.createdAt || '').slice(0, 10)),
          (l.updates || []).length + ' updates', leadSentCount(l) + ' steps sent'].filter(Boolean).join(' · ') })
      ]));
      box.appendChild(r);
    });
    c.body.appendChild(box);
  });
  if (groups.length > 60) c.body.appendChild(el('p', { class: 'sub', style: 'margin:var(--sp-3) 0 0',
    text: `Showing the first 60 of ${groups.length} sets.` }));
  root.appendChild(c.node);
}

/* What a person still holds, so removing them is an informed decision. */
function ownerHoldings(id) {
  const sid = String(id);
  return {
    deals:     live('deals').filter(d => String(d.ownerId) === sid),
    collabs:   live('deals').filter(d => collabsOf(d).some(x => String(x) === sid)),
    contacts:  live('contacts').filter(c => String(c.ownerId) === sid),
    companies: live('companies').filter(c => String(c.ownerId) === sid),
    tasks:     live('tasks').filter(t => String(t.ownerId) === sid && t.status !== 'done')
  };
}
function reassignFrom(ids, toId) {
  const set = new Set(ids.map(String));
  let n = 0;
  batch(() => {
  live('deals').forEach(d => {
    let touched = false;
    if (set.has(String(d.ownerId))) { d.ownerId = toId; touched = true; }
    const cs = collabsOf(d).filter(x => !set.has(String(x)));
    if (cs.length !== collabsOf(d).length) { d.collaboratorIds = cs; d.collaboratorId = null; touched = true; }
    if (touched) { upsert('deals', d); n++; }
  });
  ['contacts','companies','tasks'].forEach(shard => {
    live(shard).forEach(r => {
      if (!set.has(String(r.ownerId))) return;
      r.ownerId = toId; upsert(shard, r); n++;
    });
  });
  });
  return n;
}

function removeInactive() {
  const list = DB.owners.filter(o => !o.active);
  if (!list.length) return;
  const ids = list.map(o => o.id);
  const tot = ids.reduce((acc, id) => {
    const h = ownerHoldings(id);
    acc.deals += h.deals.length; acc.contacts += h.contacts.length;
    acc.companies += h.companies.length; acc.tasks += h.tasks.length;
    acc.collabs += h.collabs.length;

  const numOf = v => { if (v == null) return null; const n = Number(String(v).replace(/[^0-9.\-]/g,'')); return isNaN(n) ? null : n; };
  const dateOf = v => {
    if (!v) return null;
    const s = String(v).trim();
    if (/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0,10);
    const d = new Date(s);
    return isNaN(d) ? null : d.toISOString().slice(0,10);
  };
  const ownerOf = v => {
    if (!v) return null;
    const s = String(v).trim().toLowerCase();
    const o = DB.owners.find(x => x.id === s || (x.email || '').toLowerCase() === s || x.name.toLowerCase() === s);
    return o ? o.id : null;
  };
  data.forEach(r => {
    if (kind === 'companies') {
      const hsid = pick(r, hdr, ['record id','hubspot id','companyid','id']);
      const name = pick(r, hdr, ['company name','name','company']);
      if (!name && !hsid) return;
      let c = (hsid && live('companies').find(x => x.hubspotId === hsid)) ||
              live('companies').find(x => NORM(x.name) === NORM(name));
      const patch = {
        name: name || (c && c.name), hubspotId: hsid || (c && c.hubspotId) || null,
        domain: pick(r, hdr, ['company domain name','domain','website']) || (c && c.domain) || null,
        phone: pick(r, hdr, ['phone number','phone']) || (c && c.phone) || null,
        city: pick(r, hdr, ['city']) || (c && c.city) || null,
        country: pick(r, hdr, ['country/region','country']) || (c && c.country) || null,
        industry: pick(r, hdr, ['industry']) || (c && c.industry) || null,
        lifecycleStage: pick(r, hdr, ['lifecycle stage','lifecyclestage']) || (c && c.lifecycleStage) || null,
        ownerId: ownerOf(pick(r, hdr, ['company owner','owner','hubspot owner id'])) || (c && c.ownerId) || null,
        createdAt: dateOf(pick(r, hdr, ['create date','created'])) || (c && c.createdAt) || TODAY()
      };
      if (c) { upsert('companies', Object.assign(c, patch)); updated++; }
      else { upsert('companies', patch); added++; }
    }
    if (kind === 'contacts') {
      const hsid = pick(r, hdr, ['record id','hubspot id','contactid','id']);
      const email = pick(r, hdr, ['email','email address']);
      const fn = pick(r, hdr, ['first name','firstname']);
      const ln = pick(r, hdr, ['last name','lastname']);
      const full = pick(r, hdr, ['name','full name','contact']) || [fn, ln].filter(Boolean).join(' ');
      if (!email && !full && !hsid) return;
      let c = (hsid && live('contacts').find(x => x.hubspotId === hsid)) ||
              (email && live('contacts').find(x => (x.email || '').toLowerCase() === email.toLowerCase()));
      const coName = pick(r, hdr, ['company name','associated company','company']);
      const co = coName ? live('companies').find(x => NORM(x.name) === NORM(coName)) : null;
      const patch = {
        hubspotId: hsid || (c && c.hubspotId) || null,
        firstName: fn || (c && c.firstName) || null, lastName: ln || (c && c.lastName) || null,
        fullName: full || (c && c.fullName) || email,
        email: email || (c && c.email) || null,
        phone: pick(r, hdr, ['phone number','phone','mobile phone number']) || (c && c.phone) || null,
        jobTitle: pick(r, hdr, ['job title','jobtitle','title']) || (c && c.jobTitle) || null,
        city: pick(r, hdr, ['city']) || (c && c.city) || null,
        country: pick(r, hdr, ['country/region','country']) || (c && c.country) || null,
        lifecycleStage: pick(r, hdr, ['lifecycle stage','lifecyclestage']) || (c && c.lifecycleStage) || null,
        leadStatus: pick(r, hdr, ['lead status','hs lead status']) || (c && c.leadStatus) || null,
        ownerId: ownerOf(pick(r, hdr, ['contact owner','owner','hubspot owner id'])) || (c && c.ownerId) || null,
        companyId: (co && co.id) || (c && c.companyId) || null,
        createdAt: dateOf(pick(r, hdr, ['create date','created'])) || (c && c.createdAt) || TODAY(),
        dealIds: (c && c.dealIds) || []
      };
      if (c) { upsert('contacts', Object.assign(c, patch)); updated++; }
      else { upsert('contacts', patch); added++; }
    }
    if (kind === 'deals') {
      const hsid = pick(r, hdr, ['record id','hubspot id','dealid','id']);
      const name = pick(r, hdr, ['deal name','name','deal']);
      if (!name && !hsid) return;
      let d = (hsid && live('deals').find(x => x.hubspotId === hsid)) ||
              live('deals').find(x => NORM(x.name) === NORM(name));
      const stLbl = pick(r, hdr, ['deal stage','stage','dealstage']);
      const st = stLbl ? (DB.stages.find(s => NORM(s.label) === NORM(stLbl)) ||
                          DB.stages.find(s => NORM(s.id) === NORM(stLbl))) : null;
      const coName = pick(r, hdr, ['associated company','company name','company']);
      const co = coName ? live('companies').find(x => NORM(x.name) === NORM(coName)) : null;
      const patch = {
        hubspotId: hsid || (d && d.hubspotId) || null,
        name: name || (d && d.name),
        stageId: (st && st.id) || (d && d.stageId) || (openStages()[0] || {}).id,
        amount: numOf(pick(r, hdr, ['amount','amount in company currency','deal amount','value'])) ?? (d ? d.amount : null),
        currency: CFG.currency,
        closeDate: dateOf(pick(r, hdr, ['close date','closedate'])) || (d && d.closeDate) || null,
        createdAt: dateOf(pick(r, hdr, ['create date','created'])) || (d && d.createdAt) || TODAY(),
        ownerId: ownerOf(pick(r, hdr, ['deal owner','owner','hubspot owner id'])) || (d && d.ownerId) || null,
        dealType: pick(r, hdr, ['deal type','dealtype','type']) || (d && d.dealType) || null,
        priority: (pick(r, hdr, ['priority']) || (d && d.priority) || '').toLowerCase() || null,
        lossReason: pick(r, hdr, ['closed lost reason','loss reason']) || (d && d.lossReason) || null,
        nextStep: pick(r, hdr, ['next step','next activity']) || (d && d.nextStep) || null,
        companyId: (co && co.id) || (d && d.companyId) || null,
        contactIds: (d && d.contactIds) || [], notes: (d && d.notes) || []
      };
      if (d) { upsert('deals', Object.assign(d, patch)); updated++; }
      else { upsert('deals', patch); added++; }
    }
  });
  reindex();
  return { added, updated };
}

const fmtThreshold = (m, n) => (m.signed && n > 0 ? '+' : '') + n + (m.asPct ? '%' : (m.unit || ''));
function editThreshold(m) {
  const t = thresholds(m.key);
  const good = el('input', { class: 'inp', type: 'number', step: m.step, value: t.good });
  const warn = el('input', { class: 'inp', type: 'number', step: m.step, value: t.warn });
  modal(m.label + ' thresholds', el('div', {}, [
    el('p', { style: 'margin:0 0 var(--sp-4);color:var(--ink-2);line-height:1.6', text: m.hint }),
    el('div', { class: 'field-row' }, [
      fld('Green at or above' + (m.asPct ? ' (%)' : ''), good),
      fld('Amber at or above' + (m.asPct ? ' (%)' : ''), warn)
    ]),
    el('p', { class: 'sub', style: 'margin:0;line-height:1.55',
      html: `Anything below the amber figure shows red. Defaults are ` +
        `<b>${esc(fmtThreshold(m, m.good))}</b> green and <b>${esc(fmtThreshold(m, m.warn))}</b> amber.` })
  ]), [
    el('button', { class: 'btn', text: 'Use the default', onclick: () => {
      if (DB.config.thresholds) delete DB.config.thresholds[m.key];
      DB.config._v = now(); touch('config'); closeAll(); render(); toast('Back to the default'); } }),
    el('div', { style: 'flex:1' }),
    el('button', { class: 'btn', text: 'Cancel', onclick: closeAll }),
    el('button', { class: 'btn primary', text: 'Save', onclick: () => {
      const gv = Number(good.value), wv = Number(warn.value);
      if (!isFinite(gv) || !isFinite(wv)) return toast('Both need a number', 'err');
      if (wv > gv) { warn.focus(); return toast('Amber has to sit below green', 'err'); }
      DB.config.thresholds = DB.config.thresholds || {};
      DB.config.thresholds[m.key] = { good: gv, warn: wv };
      DB.config._v = now(); touch('config');
      closeAll(); render(); toast('Thresholds saved', 'ok');
    } })
  ]);
}

/* ---- running order: regions, and people inside a region ---- */
function moveRegion(r, dir) {
  const list = salesRegions();
  const i = list.indexOf(r), j = i + dir;
  if (i < 0 || j < 0 || j >= list.length) return;
  list.splice(j, 0, list.splice(i, 1)[0]);
  saveRegions(list);
  render();
}
/* Orders are renumbered from what is on screen before the swap, so a team that
   has never been ordered gets a sane 1..n instead of everybody sharing a slot. */
function moveRep(region, id, dir) {
  const people = activeOwners().filter(o => ownerRegion(o.id) === region);
  const i = people.findIndex(o => String(o.id) === String(id)), j = i + dir;
  if (i < 0 || j < 0 || j >= people.length) return;
  people.splice(j, 0, people.splice(i, 1)[0]);
  batch(() => { people.forEach((o, n) => { o.order = n; }); });
  DB.config._v = now(); touch('config', 'owners');
  render();
}

/* ------------------------------------------------------------ boot */
/* The shell used to be unveiled BEFORE the first sync, so everything between
   sign-in and the first render was a white page with the static "Dashboard"
   title on it — no nav, no counts, no explanation. At this team's data size
   that is many seconds of looking at nothing, which reads as a broken tool.
   Nobody should ever see the shell empty. */
function bootSplash(msg, sub) {
  const root = $('#view'); if (!root) return;
  $('#vtitle').textContent = 'Starting up';   // not the stale "Dashboard" in the markup
  root.innerHTML = '';
  root.appendChild(el('div', { class: 'card bootsplash' }, [
    el('div', { class: 'spin' }),
    el('h3', { text: msg }),
    el('p', { class: 'sub', text: sub || '' })
  ]));
}
async function boot() {
  $('#gate').style.display = 'none';
  $('#app').classList.add('on');

  const cached = loadLocal();
  if (SYNC.mode === 'onedrive') {
    if (cached) { VIEW.name = routeOf(location.hash).name; render(); }
    else bootSplash('Loading the team\'s CRM…',
      `Reading ${driveRoot()} on ${driveOwner() || 'OneDrive'}. The first load pulls everything down, so it takes a few seconds.`);
    await syncNow({ quiet: true });
  }
  /* Nothing anywhere yet → the seed file shipped beside this page. But only
     when we actually KNOW it is empty: a rep whose sync failed used to get a
     local copy of the migration seed and a CRM that looked fine while being
     disconnected from the team's. Now a failed read shows the error instead. */
  const emptyHere = !live('deals').length && !live('companies').length && !live('contacts').length;
  if (emptyHere && (SYNC.mode !== 'onedrive' || SYNC.loaded)) {
    const ok = await trySeedFile();
    if (!ok) firstRun();
  }
  /* These fill in a blank tool. On a shared folder they must only fire when
     we KNOW it is blank — a session that could not read the config has an
     empty stage list because the read failed, not because there are no
     stages, and filling it with the built-in defaults and pushing is how
     1,239 deals ended up pointing at stages that no longer existed. */
  const blankIsReal = SYNC.mode !== 'onedrive' || SYNC.loaded;
  if (!DB.stages.length && blankIsReal) { DB.stages = DEFAULT_STAGES.slice(); touch('config', 'stages'); }
  if ((!DB.lossReasons || !DB.lossReasons.length) && blankIsReal) DB.lossReasons = DEFAULT_LOSS.slice();
  if (!DB.owners.length && AUTH.user && blankIsReal) {
    DB.owners = [{ id: uid('O'), name: AUTH.user.name || AUTH.user.username, email: AUTH.user.username,
      active: true, role: 'admin', initials: initials(AUTH.user.name || AUTH.user.username) }];
    touch('config', 'owners');
  }
  reindex(); rebuildStages();
  runMigrations();
  repairStages();
  repairOwners();
  keepConfigBackup();
  applyRoute();          // honours #requests?r=<id> from an approval email
  if (SYNC.mode === 'onedrive' && SYNC.dirty.size) scheduleSync();
}
/* One-shot data migrations, safe to run on every load. */
function runMigrations() {
  return sysWrite(() => batch(() => runMigrationsInner()));
}
function runMigrationsInner() {
  // single collaborator -> list
  let c = 0;
  DB.deals.forEach(d => {
    if (d._del) return;
    if (!Array.isArray(d.collaboratorIds)) {
      d.collaboratorIds = d.collaboratorId ? [String(d.collaboratorId)] : [];
      if (d.collaboratorId) { d.collaboratorId = null; c++; }
    }
  });
  if (c) SYNC.dirty.add('deals');
  // the running order the team asked for, applied once and only into a blank
  const teamFix = migrateTeamOrder();
  if (teamFix.changed) console.log(`Sales regions set on ${teamFix.changed} people`);
  // roles: rep / manager / viewer -> write / write / read, and exactly one admin
  const roleFix = migrateRoles();
  if (roleFix.changed) console.log(`Roles normalised on ${roleFix.changed} people` +
    (roleFix.admin ? `; sole admin is ${roleFix.admin}` : ''));
  // HubSpot lead statuses -> the four stages
  const lead = migrateLeadStatus();
  if (lead.changed) {
    console.log(`Lead status migrated on ${lead.changed} contacts` +
      (lead.unmapped ? `, ${lead.unmapped} left unmapped for review` : ''));
  }
  if (c || lead.changed || roleFix.changed || teamFix.changed) { saveLocal(); scheduleSync(); }
}

];
function migrateTeamOrder() {
  const people = DB.owners.filter(o => !o._del);
  if (!people.length) return { changed: 0 };
  if (people.some(o => o.salesRegion)) return { changed: 0 };       // already arranged
  const first = o => String(o.name || '').trim().split(/\s+/)[0].toLowerCase();
  let changed = 0;
  TEAM_LAYOUT.forEach(([region, names]) => {
    names.forEach((n, i) => {
      const hits = people.filter(o => first(o) === n.toLowerCase());
      if (hits.length !== 1) return;                                 // ambiguous or absent — skip
      hits[0].salesRegion = region;
      hits[0].order = i;
      changed++;
    });
  });
  if (changed) {
    DB.config.salesRegions = TEAM_LAYOUT.map(t => t[0]);
    DB.config._v = now();
    touch('config', 'owners');
  }
  return { changed };
}

/* One admin, everyone else a writer unless they were already read-only.
   Whoever is signed in and already an admin keeps it; failing that the
   longest-standing admin does. Changing it afterwards is two clicks in
   Settings, and this only ever runs while there is more than one. */
function migrateRoles() {
  const people = DB.owners.filter(o => !o._del);
  if (!people.length) return { changed: 0 };
  let changed = 0;
  people.forEach(o => {
    const want = ROLE_MAP[o.role] || 'write';
    if (o.role !== want) { o.role = want; changed++; }
  });
  const admins = people.filter(o => o.role === 'admin');
  let keep = null;
  if (admins.length > 1) {
    const me = meOwner();
    keep = (me && me.role === 'admin') ? me : admins.slice().sort((a, b) =>
      String(a.id).localeCompare(String(b.id)))[0];
    admins.forEach(o => { if (o !== keep) { o.role = 'write'; changed++; } });
  } else if (!admins.length) {
    keep = (meOwner() && meOwner().active !== false ? meOwner() : null) ||
           people.find(o => o.active !== false) || people[0];
    if (keep) { keep.role = 'admin'; changed++; }
  } else keep = admins[0];
  if (changed) touch('config', 'owners');
  return { changed, admin: keep ? keep.name : null };
}

/* Every record that belongs to somebody carries their id, so a missing team
   list can always be rebuilt from the work itself. Restored in this order:
   the local backup first, because it carries the addresses, regions and roles
   set since the migration; then the roster above; then, for an id neither
   knows, a placeholder so no record is ever left orphaned. */
const OWNER_SHARDS = ['deals', 'contacts', 'companies', 'tasks', 'commitments', 'reviews', 'demos', 'demoRequests'];
function referencedOwnerIds() {
  const ids = new Set();
  OWNER_SHARDS.forEach(k => live(k).forEach(r => {
    if (r.ownerId) ids.add(String(r.ownerId));
    (r.collaboratorIds || []).forEach(c => c && ids.add(String(c)));
    (r.supportIds || []).forEach(c => c && ids.add(String(c)));
  }));
  DB.activities.forEach(a => { if (!a._del && a.ownerId) ids.add(String(a.ownerId)); });
  return ids;
}
function repairOwners() {
  const want = referencedOwnerIds();
  if (!want.size) return { fixed: 0 };
  const have = new Set(DB.owners.filter(o => !o._del).map(o => String(o.id)));
  const missing = Array.from(want).filter(id => !have.has(id));
  if (!missing.length) return { fixed: 0 };

  const backup = configBackup();
  const fromBackup = new Map((backup && backup.owners || []).map(o => [String(o.id), o]));
  const fromRoster = new Map(COREV_TEAM.map(o => [String(o.id), o]));
  let restored = 0, invented = 0;
  sysWrite(() => {
    missing.forEach(id => {
      const src = fromBackup.get(id) || fromRoster.get(id);
      if (src) { DB.owners.push(Object.assign({}, src)); restored++; }
      else {
        DB.owners.push({ id, name: 'Unnamed (' + id + ')', active: true, role: 'write',
          initials: '??', _recovered: true });
        invented++;
      }
    });
    DB.owners.forEach(o => { if (!o.initials) o.initials = initials(o.name); });
    touch('config', 'owners');
  });
  const where = backup ? 'the local backup and the built-in roster' : 'the built-in roster';
  console.log(`Restored ${restored} people from ${where}` + (invented ? `, ${invented} as placeholders` : ''));
  toast(`${restored + invented} sales ${restored + invented === 1 ? 'rep was' : 'reps were'} missing from the team list and ${restored + invented === 1 ? 'has' : 'have'} been put back` +
    (invented ? ` — ${invented} need a name in Settings` : ''), invented ? '' : 'ok');
  return { fixed: restored + invented, restored, invented, from: where };
}

/* A copy of the last config that came down with a real team on it, kept in
   this browser. Small — people and stages, not records — and it is the only
   thing that knows the addresses, regions, roles and targets set since the
   migration, so it is what a repair reaches for first. */
const CFGBAK_KEY = () => CFG.cacheKey + '.cfgbak';
function keepConfigBackup() {
  if (!DB.owners.length || !DB.stages.length) return;
  try {
    localStorage.setItem(CFGBAK_KEY(), JSON.stringify({ at: now(),
      owners: DB.owners, stages: DB.stages, lossReasons: DB.lossReasons,
      targets: (DB.config || {}).targets || {}, salesRegions: (DB.config || {}).salesRegions || null }));
  } catch (e) { /* quota — the roster in the build is still there */ }
}
function configBackup() {
  try { const r = localStorage.getItem(CFGBAK_KEY()); return r ? JSON.parse(r) : null; }
  catch (e) { return null; }
}

/* The pipeline as it came out of HubSpot, which is what the 1,239 migrated
   deals actually point at. Kept here as the recovery source: if the stage
   list is ever replaced with something the deals do not reference — which is
   how the board ended up showing nine empty columns — these come back. */
const COREV_STAGES = [
  { id: '2366633176',           label: 'Business Development',       probability: .10, kind: 'open', order: 1 },
  { id: '2377533661',           label: 'B2C - Cold Lead',            probability: .05, kind: 'open', order: 2 },
  { id: '3031480507',           label: 'Channels & Referrals',       probability: .05, kind: 'open', order: 3 },
  { id: '2354741451',           label: 'Discovery & Identify',       probability: .20, kind: 'open', order: 4 },
  { id: 'appointmentscheduled', label: 'Qualified & Demo Completed', probability: .40, kind: 'open', order: 5 },
  { id: 'presentationscheduled',label: 'Proposal Submitted',         probability: .60, kind: 'open', order: 6 },
  { id: 'decisionmakerboughtin',label: 'Committed',                  probability: .90, kind: 'open', order: 7 },
  { id: 'closedwon',            label: 'Closed Won',                 probability: 1,   kind: 'won',  order: 8 },
  { id: 'closedlost',           label: 'Closed Lost',                probability: 0,   kind: 'lost', order: 9 }
];

/* A deal whose stage no longer exists is invisible: it is not on the board,
   it has no probability so it is worth nothing to the forecast, and it counts
   as open because that is what the fallback says. Nine empty columns over a
   40-million-dirham pipeline is not a thing to leave for somebody to notice,
   so it is detected and repaired on every load. */
function repairStages() {
  const deals = live('deals');
  if (!deals.length) return { fixed: 0 };
  const have = new Set(DB.stages.map(s => String(s.id)));
  const orphaned = deals.filter(d => d.stageId && !have.has(String(d.stageId)));
  if (orphaned.length < Math.max(5, deals.length * 0.2)) return { fixed: 0 };

  const want = new Set(orphaned.map(d => String(d.stageId)));
  const restore = COREV_STAGES.filter(s => want.has(s.id));
  if (!restore.length) return { fixed: 0, unknown: want.size };

  /* Put back only what is missing, keep anything the team added, and keep
     the order the pipeline is meant to run in. */
  sysWrite(() => {
    restore.forEach(s => { if (!have.has(s.id)) DB.stages.push(Object.assign({}, s)); });
    DB.stages.sort((a, z) => (a.order || 99) - (z.order || 99));
    rebuildStages();
    touch('config', 'stages');
  });
  const still = deals.filter(d => d.stageId && !DB.stages.some(s => String(s.id) === String(d.stageId))).length;
  console.log(`Restored ${restore.length} sales stages; ${orphaned.length - still} deals back on the board` +
    (still ? `; ${still} still point at a stage nobody recognises` : ''));
  toast(`${orphaned.length - still} deals were pointing at stages that had gone missing — the pipeline is back` +
    (still ? `. ${still} are still on an unknown stage; an admin can add it in Settings.` : ''), still ? '' : 'ok');
  return { fixed: restore.length, recovered: orphaned.length - still, still };
}

async function trySeedFile() {
  try {
    const r = await fetch('corev-crm-seed.json', { cache: 'no-store' });
    if (!r.ok) return false;
    const seed = await r.json();
    if (!seed || !Array.isArray(seed.deals)) return false;
    applySeed(seed);
    toast(`Loaded ${seed.deals.length} deals, ${(seed.companies||[]).length} companies and ${(seed.contacts||[]).length} contacts from the migration file`, 'ok');
    return true;
  } catch (e) { return false; }
}

  DB.stages = DEFAULT_STAGES.slice();

/* an existing MSAL session signs in silently */
(async () => {
  try {
    if (!localStorage.getItem('msal.account.keys')) return;
    if (!(await loadMsal())) return;
    AUTH.msal = new msal.PublicClientApplication({
      auth: { clientId: CFG.clientId, authority: CFG.authority, redirectUri: location.href.split('#')[0].split('?')[0] },
      cache: { cacheLocation: 'localStorage' }
    });
    await AUTH.msal.initialize();
    const acct = AUTH.msal.getAllAccounts()[0];
    if (!acct) return;
    AUTH.msal.setActiveAccount(acct);
    AUTH.user = acct;
    await getToken();
    SYNC.mode = 'onedrive';
    boot();
  } catch (e) { /* fall through to the sign-in gate */ }
})();
