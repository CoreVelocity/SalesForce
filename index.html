/* ------------------------------------------------- link a contact */
function linkContact(d) {
  const co = getCo(d.companyId);
  const p = picker({
    placeholder: 'Search people…',
    items: () => {
      /* Never slice here: picker() filters this list by what was typed and
         then caps the result. Capping first makes anything past the window
         unfindable — which is what it did. */
      const all = live('contacts').filter(c => !(d.contactIds || []).includes(c.id));
      if (!co) return all;
      const same = all.filter(c => c.companyId === co.id);
      return same.concat(all.filter(c => c.companyId !== co.id));
    },
    match: (c, q) => (c.fullName || '').toLowerCase().includes(q) || (c.email || '').toLowerCase().includes(q) ||
      ((getCo(c.companyId) || {}).name || '').toLowerCase().includes(q),
    label: c => c.fullName || c.email, value: c => c.id,
    render: c => `<span>${esc(c.fullName || c.email || '—')}</span><span class="sub">${esc((getCo(c.companyId)||{}).name || c.jobTitle || '')}</span>`,
    allowNew: true,
    onNew: (name, setLabel) => {
      const parts = name.split(/\s+/);
      const c = upsert('contacts', { firstName: parts[0], lastName: parts.slice(1).join(' ') || null,
        fullName: name, companyId: d.companyId || null, ownerId: d.ownerId, createdAt: TODAY(), dealIds: [d.id] });
      d.contactIds = (d.contactIds || []).concat([c.id]); d.contactInferred = false; upsert('deals', d);
      closeAll(); openDeal(d.id); toast('Contact created and linked', 'ok');
    }
  });
  modal('Link a contact to ' + d.name, el('div', {}, [
    el('p', { style: 'margin:0 0 var(--sp-4);color:var(--ink-2);line-height:1.6',
      text: co ? `People at ${co.name} are listed first.` : 'Search anyone on file, or type a new name to create them.' }),
    fld('Contact', p.node)
  ]), [
    el('button', { class: 'btn', text: 'Cancel', onclick: closeAll }),
    el('button', { class: 'btn primary', text: 'Link', onclick: () => {
      const id = p.get(); if (!id) return toast('Pick a contact first', 'err');
      d.contactIds = (d.contactIds || []).concat([id]); d.contactInferred = false;
      upsert('deals', d);
      const c = getCt(id); if (c) { c.dealIds = Array.from(new Set((c.dealIds || []).concat([d.id]))); upsert('contacts', c); }
      closeAll(); openDeal(d.id); toast('Linked', 'ok');
    } })
  ]);
}

/* ---- move an existing deal onto a company ----
   Records that came out of HubSpot without an account, or were created in a
   hurry, need to be attached to the right company rather than re-typed. */
function linkDealToCompany(co) {
  if (!canWrite()) return;
  const p = picker({
    placeholder: 'Search deals…',
    items: () => {
      const all = live('deals').filter(d => d.companyId !== co.id);
      /* the ones with no account at all are almost always the ones being
         looked for, so they come first */
      const orphan = all.filter(d => !d.companyId);
      return orphan.concat(all.filter(d => d.companyId));
    },
    match: (d, q) => (d.name || '').toLowerCase().includes(q) ||

/* ---- move an existing contact onto a company ---- */
function linkContactToCompany(co) {
  if (!canWrite()) return;
  const p = picker({
    placeholder: 'Search people…',
    items: () => {
      const all = live('contacts').filter(c => c.companyId !== co.id);
      const orphan = all.filter(c => !c.companyId);
      /* somebody whose email is on this company's domain is very likely theirs */
      const dom = cleanDomain(co.domain);
      const byDom = dom ? all.filter(c => c.companyId && String(c.email || '').toLowerCase().endsWith('@' + dom)) : [];
      const inFront = new Set(orphan.concat(byDom));
      return orphan.concat(byDom, all.filter(c => !inFront.has(c)));
    },
    match: (c, q) => (c.fullName || '').toLowerCase().includes(q) || (c.email || '').toLowerCase().includes(q) ||

/* ---- put an existing deal against a contact ---- */
function linkDealToContact(c) {

/* Names taken from the deal and contact records already in the CRM. Prices are
   deliberately blank — I am not going to invent your price list. */
function starterCatalogue() {
  const seed = [
    ['XS1-PEAK',      'XS1 PEAK',            'Hardware',     'once'],
    ['XS1-PEAKPLUS',  'XS1 PEAK PLUS',       'Hardware',     'once'],
    ['XS1-FLOWPLUS',  'XS1 FLOW PLUS',       'Hardware',     'once'],
    ['XP1-APEX',      'XP1 APEX',            'Hardware',     'once'],
    ['OXEAI-BASIC',   'OxeAI Basic',         'Subscription', 'monthly'],
    ['OXEAI-PREM',    'OxeAI Premium',       'Subscription', 'monthly'],
    ['INSTALL',       'Delivery & installation', 'Installation', 'once'],
    ['TRAINING',      'Onboarding & training',   'Service',      'once']
  ];
  let n = 0;
  batch(() => seed.forEach(([sku, name, category, billing]) => {
    if (live('products').some(p => p.sku === sku)) return;
    upsert('products', { sku, name, category, billing, listPrice: null, active: true, currency: CFG.currency });
    n++;
  }));
  toast(`${n} products added — set their prices in the catalogue`, 'ok');
}
function importProductsCSV(after) {
  const file = el('input', { type: 'file', accept: '.csv,text/csv', class: 'inp' });
  modal('Import products', el('div', {}, [
    el('p', { style: 'margin:0 0 var(--sp-4);color:var(--ink-2);line-height:1.6',
      html: 'Columns matched loosely: <b>SKU</b>, <b>Name</b>, <b>Category</b>, <b>List price</b>, <b>Billing</b> (once / monthly / annual), <b>Active</b>, <b>Notes</b>. Rows match on SKU, so re-importing updates rather than duplicates.' }),
    fld('File', file)
  ]), [
    el('button', { class: 'btn', text: 'Cancel', onclick: () => { closeAll(); productManager(); } }),
    el('button', { class: 'btn primary', text: 'Import', onclick: () => {
      const fl = file.files[0]; if (!fl) return toast('Choose a file first', 'err');
      const rd = new FileReader();
      rd.onload = () => {
        try {
          const rows = parseCSV(rd.result);
          if (rows.length < 2) throw new Error('no data rows');
          const hdr = rows[0].map(NORM);
          let added = 0, updated = 0;
          batch(() => rows.slice(1).forEach(r => {
            const sku = pick(r, hdr, ['sku','code','product code']);
            const name = pick(r, hdr, ['name','product','product name','description']);
            if (!sku && !name) return;
            const bRaw = (pick(r, hdr, ['billing','billing frequency','recurrence']) || 'once').toLowerCase();
            const billing = /month/.test(bRaw) ? 'monthly' : /year|annual/.test(bRaw) ? 'annual' : 'once';
            const priceRaw = pick(r, hdr, ['list price','price','unit price','amount']);
            const activeRaw = (pick(r, hdr, ['active','status']) || 'yes').toLowerCase();
            let p = sku ? live('products').find(x => x.sku === sku) : live('products').find(x => NORM(x.name) === NORM(name));
            const patch = {
              sku: sku || (p && p.sku) || null, name: name || (p && p.name) || sku,
              category: pick(r, hdr, ['category','type','group']) || (p && p.category) || null,
              listPrice: priceRaw == null ? (p ? p.listPrice : null) : Number(String(priceRaw).replace(/[^0-9.\-]/g, '')) || null,
              billing, active: !/^(no|false|0|inactive)$/.test(activeRaw),
              notes: pick(r, hdr, ['notes','note','comment']) || (p && p.notes) || null,
              currency: CFG.currency
            };
            if (p) { upsert('products', Object.assign(p, patch)); updated++; }
            else { upsert('products', patch); added++; }
          }));
          closeAll(); productManager(); render();
          toast(`${added} added, ${updated} updated`, 'ok');
        } catch (e) { toast('Import failed: ' + e.message, 'err'); }
      };
      rd.readAsText(fl);
    } })
  ]);
}

/* ================================================================
   COMMITMENT REVIEW — the weekly meeting view. Pipeline, forecast and
   what each rep is committing to, on one screen, across all reps.

   The commitment model is the one from the OxeFit Sales Tracker:
   each rep picks deals into a Commit slot and a Best case slot, ticks
   the buyer signals behind them, and the weighted forecast falls out
   of that. The difference here is that the deals are CoreV CRM deals,
   not typed-in names pulled from HubSpot — so the stage, the value and
   the outcome are the same records the pipeline and forecast views use.
   ================================================================ */

/* ---- the seven buyer signals, unchanged from the tracker ---- */
const SIGNALS = [
  ['budget',   'Budget confirmed'],
  ['timeline', 'Timeline defined'],
  ['champion', 'Internal champion'],
  ['demo',     'Demo completed'],
  ['proposal', 'Proposal submitted'],
  ['dm',       'Decision-maker engaged'],
  ['compout',  'Competition eliminated']
];
const CONF_LEVELS = [90, 70, 50, 30];

/* A deal that has not moved in this long is treated as stale and its
   contribution to the forecast is halved. The tracker hard-coded
   Qualified 14 / Proposal 21 / Negotiation 30; here the threshold comes
   off the stage's own probability, so it still works if you edit stages. */
const staleDays = p => p >= .6 ? 30 : p >= .4 ? 21 : 14;
const STALE_PENALTY = 0.5;

/* The monthly review asks "when did this last move?" of a few hundred deals
   per render. Scanning the whole activity log each time is one pass too many,
   so it is folded into a map once and reused until the log grows. */
let _SINCE = null, _SINCE_N = -1;
function stageSinceMap() {
  if (_SINCE && _SINCE_N === DB.activities.length) return _SINCE;
  const m = new Map();
  DB.activities.forEach(a => {
    if (a._del || a.kind !== 'stage' || !a.dealId || !a.at) return;
    const day = String(a.at).slice(0, 10), cur = m.get(a.dealId);
    if (!cur || day > cur) m.set(a.dealId, day);
  });
  _SINCE = m; _SINCE_N = DB.activities.length;
  return m;
}
function stageSince(d) {
  return stageSinceMap().get(d.id) || d.stageChangedAt || d.createdAt || null;
}
function daysInStage(d) {
  const s = stageSince(d);
  if (!s) return null;
  const n = days(TODAY(), s);
  return n >= 0 ? n : null;
}
function isStale(d) {
  const n = daysInStage(d);
  return n != null && n > staleDays(stage(d.stageId).probability);
}

/* ---- device counts on a commitment ------------------------------------
   The tracker asked each rep for forecast XS1 / XP1 units alongside the
   money. Here the counts hang off the individual commitment, and they are
   pre-filled from the deal's own estimate when it has one — the product
   lines are matched on the SKU prefix, so XS1-PEAKPLUS ×2 reads as 2 XS1.
   A rep can still type over it; a typed value wins and is remembered. */
const DEFAULT_UNIT_LINES = ['XS1', 'XP1'];
const unitLines = () => (DB.config.unitLines && DB.config.unitLines.length)
  ? DB.config.unitLines.slice() : DEFAULT_UNIT_LINES.slice();
/* A real CoreV SKU looks like MENA-XS1-PEAK-PLUS-APEX-36MO, so the line code
   sits in the middle, not at the front. Match it as a whole segment of the
   SKU — MENA-MEM-XLEAD-2500-SESS must not read as XS1 — and fall back to the
   same test on the product name for a line that was typed in without a SKU. */
const skuTokens = s => String(s || '').toUpperCase().split(/[^A-Z0-9]+/).filter(Boolean);
function lineMatches(it, code) {
  const up = String(code).toUpperCase();
  if (skuTokens(it.sku).includes(up)) return true;
  if (it.sku) return false;                       // a real SKU that misses is a miss
  return skuTokens(it.name).includes(up);
}
function autoUnits(d) {
  const out = {};
  if (!d) return out;
  unitLines().forEach(L => {
    const n = sum((d.items || []).filter(it => lineMatches(it, L)), it => Number(it.qty) || 0);
    if (n) out[L] = n;
  });
  return out;
}
function unitsOf(c) {
  if (c && c.units && typeof c.units === 'object' && Object.keys(c.units).length) return c.units;
  return autoUnits(c && getDl(c.dealId));
}
const unitTotal = (recs, line) => sum(recs, c => Number(unitsOf(c)[line]) || 0);
const unitSummary = recs => unitLines().map(L => [L, unitTotal(recs, L)]).filter(([, n]) => n);
const unitText = recs => unitSummary(recs).map(([L, n]) => `${n} ${L}`).join(' · ');

/* ---- commitments: one record per deal, per rep, per week, per slot ---- */
const slotOf = c => c.slot === 'best' ? 'best' : 'commit';
const SLOTS = { commit: 'Commit', best: 'Best case' };
function commitsIn(wk, ownerId, slot) {
  return live('commitments').filter(c => c.week === wk &&
    (ownerId == null || String(c.ownerId) === String(ownerId)) &&
    (slot == null || slotOf(c) === slot));
}
const commitValue = c => { const d = getDl(c.dealId); return Number(c.amount) || (d && d.amount) || 0; };

function reviewFor(week, ownerId) {
  let r = live('reviews').find(x => x.week === week && String(x.ownerId) === String(ownerId));
  if (!r) r = { id: uid('R'), week, ownerId: String(ownerId), problems: [], solutions: [], notes: [],
    signals: {}, confidence: 90, action: '', blocked: '', locked: false };
  if (!r.signals || typeof r.signals !== 'object') r.signals = {};
  return r;
}
function saveReview(r) { upsert('reviews', r); }

/* ---------------------------------------------------------------
   The whole commitment picture for one rep in one week. Every number
   on this screen comes from here, so the tiles, the table, the card
   and the exported agenda can never disagree with each other.
   --------------------------------------------------------------- */
function repWeek(o, wk, rng) {
  const b = { from: rng.from, to: rng.to };
  const r = reviewFor(wk, o.id);
  const mine = ownedDeals(o.id);
  const cRecs = commitsIn(wk, o.id, 'commit');
  const bRecs = commitsIn(wk, o.id, 'best');
  const commitDeals = cRecs.map(c => getDl(c.dealId)).filter(Boolean);
  const bestDeals   = bRecs.map(c => getDl(c.dealId)).filter(Boolean);

  const commitVal = sum(cRecs, commitValue);
  const bestVal   = sum(bRecs, commitValue);

  // the stage that drives the weight is the strongest committed deal,
  // falling back to best case when nothing is committed yet
  const pool = commitDeals.length ? commitDeals : bestDeals;
  const topProb = pool.reduce((m, d) => Math.max(m, stage(d.stageId).probability || 0), 0);
  const stale = (commitDeals.length ? commitDeals : bestDeals).some(isStale);
  const penalty = stale ? STALE_PENALTY : 1;
  const forecast = (commitVal + bestVal) * topProb * penalty;

  const sig = r.signals || {};
  const sigOn = SIGNALS.filter(([k]) => sig[k]).length;
  const score = Math.min(100, Math.round((sigOn / SIGNALS.length) * 60 + Math.min(1, topProb / .9) * 40));
  const tier = score >= 70 ? 'hot' : score >= 40 ? 'warm' : 'cold';

  const openD = mine.filter(isOpen);
  /* Attainment and coverage are month questions — a week's revenue against a
     month's target would read as a miss every week. The month the week ends in
     is the one that counts. */
  const mb = mBounds(rng.to);
  const monthWon = sum(mine.filter(d => isWon(d) && inPeriod(d.closeDate, mb)), d => d.amount);
  const won  = mine.filter(d => isWon(d)  && inPeriod(d.closeDate, b));
  const lost = mine.filter(d => isLost(d) && inPeriod(d.closeDate, b));
  const wonVal = sum(won, d => d.amount), lostVal = sum(lost, d => d.amount);
  const pipeline = sum(openD, d => d.amount);
  const ti = repTargetInfo(o.id, Object.assign(mBounds(rng.to), { grain: 'month' }));
  const target = ti.value;

  const units = {};
  unitLines().forEach(L => { const n = unitTotal(cRecs, L) + unitTotal(bRecs, L); if (n) units[L] = n; });
  const commitUnits = {};
  unitLines().forEach(L => { const n = unitTotal(cRecs, L); if (n) commitUnits[L] = n; });

  const denom = Math.max(forecast, wonVal);
  return { o, r, wk, rng, units, commitUnits,
    cRecs, bRecs, commitDeals, bestDeals, commitVal, bestVal,
    topProb, stale, penalty, forecast, sigOn, score, tier,
    openD, won, lost, wonVal, lostVal, pipeline,
    weightedPipe: sum(openD, weighted), target,
    accuracy: denom ? 1 - Math.abs(forecast - wonVal) / denom : null,
    variance: commitVal ? (wonVal - commitVal) / commitVal : null,
    monthWon, monthLabelOf: mb.label, targetInfo: ti,
    attain:   target ? monthWon / target : null,
    coverage: target ? pipeline / target : null,
    landed: sum(cRecs.filter(c => { const d = getDl(c.dealId); return d && isWon(d); }), commitValue)
  };
}

/* ---- the scorecard thresholds -------------------------------------------
   The tracker hard-coded these. Four times coverage is a SaaS rule of thumb,
   not a fact about selling gym equipment in the Gulf, so every one of them is
   configurable in Settings and the defaults are only defaults. Each metric has
   a green floor and an amber floor; below the amber floor is red. */
const METRICS = [
  { key: 'coverage', label: 'Pipeline coverage', unit: '×', step: '0.1',
    good: 4, warn: 2.5, hint: 'Open pipeline ÷ the period target. How many times over the pipeline covers the number.' },
  { key: 'accuracy', label: 'Forecast accuracy', unit: '%', step: '1', asPct: true,
    good: 85, warn: 70, hint: 'How close the weighted forecast landed to what actually closed. Symmetric.' },
  { key: 'attain',   label: 'Goal attainment', unit: '%', step: '1', asPct: true,
    good: 100, warn: 85, hint: 'Closed won ÷ the period target.' },
  { key: 'variance', label: 'Commit variance', unit: '%', step: '1', asPct: true, signed: true,
    good: 0, warn: -15, hint: 'Closed won against what was committed. Negative is a miss.' }
];
function thresholds(key) {
  const m = METRICS.find(x => x.key === key) || {};
  const c = (DB.config.thresholds || {})[key] || {};
  const g = Number(c.good), w = Number(c.warn);
  return { good: isFinite(g) && c.good !== '' && c.good != null ? g : m.good,
           warn: isFinite(w) && c.warn !== '' && c.warn != null ? w : m.warn };
}
/* v arrives as a ratio (0.85, 3.6); the percent metrics are stored as percents */
function metTag(key, v) {
  if (v == null) return '';
  const m = METRICS.find(x => x.key === key) || {};
  const t = thresholds(key);
  const x = m.asPct ? v * 100 : v;
  return x >= t.good ? 'good' : x >= t.warn ? 'warn' : 'bad';
}
const accTag = v => metTag('accuracy', v);
const varTag = v => metTag('variance', v);
const covTag = v => metTag('coverage', v);
const attTag = v => metTag('attain', v);
const thresholdNote = key => {
  const m = METRICS.find(x => x.key === key) || {}, t = thresholds(key);
  const f = n => m.asPct ? `${n}%` : `${n}${m.unit || ''}`;
  return `${f(t.good)} or better is green, ${f(t.warn)} amber, below that red.`;
};
const signed = v => (v > 0 ? '+' : '') + Math.round(v * 100) + '%';

/* ================================================================ view */
function viewReview(root) {
  const wk = VIEW.week, rng = weekRange(wk);
  const prev = weekShift(wk, -1);
  const b = { from: rng.from, to: rng.to };
  const reps = VIEW.rep === 'all' ? activeOwners() : DB.owners.filter(o => o.id === VIEW.rep);
  const W = reps.map(o => repWeek(o, wk, rng));

  root.appendChild(viewHead(null, [
    el('div', { class: 'seg' }, [
      el('button', { html: '‹', onclick: () => { VIEW.week = prev; render(); }, title: 'Previous week' }),
      el('button', { class: 'on', text: weekLabel(wk) }),
      el('button', { html: '›', onclick: () => { VIEW.week = weekShift(wk, 1); render(); }, title: 'Next week' })
    ]),
    wk !== weekKey() ? el('button', { class: 'btn', text: 'This week', onclick: () => { VIEW.week = weekKey(); render(); } }) : null,
    el('button', { class: 'btn', html: ico('dl',14) + ' Export agenda', onclick: () => exportReview(wk) }),
    el('button', { class: 'btn primary', html: ico('flag',14) + ' Commit deals', onclick: () => addCommitment(wk) })
  ]));

  /* A rep filter on the page itself. The meeting runs the whole team, but a
     one-to-one runs one person, and scrolling past six other scorecards to
     find yours is the wrong way to start it. */
  const fbar = el('div', { style: 'display:flex;gap:var(--sp-2);flex-wrap:wrap;align-items:center;margin-bottom:var(--sp-3)' });
  const rsel = el('select', { class: 'inp', style: 'width:auto;min-width:160px', 'aria-label': 'Sales rep',
    onchange: e => { VIEW.rep = e.target.value; render(); } });
  rsel.innerHTML = repOptions('All sales reps');
  rsel.value = VIEW.rep;
  fbar.appendChild(rsel);
  if (VIEW.rep !== 'all') fbar.appendChild(el('button', { class: 'btn sm ghost', text: 'Back to the team',
    onclick: () => { VIEW.rep = 'all'; render(); } }));
  fbar.appendChild(el('div', { style: 'flex:1' }));
  fbar.appendChild(el('span', { style: 'font-size:var(--fs-sm);color:var(--ink-3)',
    text: VIEW.rep === 'all'
      ? `${reps.length} rep${reps.length === 1 ? '' : 's'} · ${weekLabel(wk)}`
      : `${ownerName(VIEW.rep)} · ${weekLabel(wk)}` }));
  root.appendChild(fbar);

  // ---- team roll-up: commitment, forecast and pipeline in one band
  const commitVal = sum(W, x => x.commitVal), bestVal = sum(W, x => x.bestVal);
  const forecast  = sum(W, x => x.forecast);
  const wonVal    = sum(W, x => x.wonVal),   lostVal = sum(W, x => x.lostVal);
  const landed    = sum(W, x => x.landed);
  const pipeline  = sum(W, x => x.pipeline);
  const nCommit   = sum(W, x => x.cRecs.length), nBest = sum(W, x => x.bRecs.length);
  const locked    = W.filter(x => x.r.locked).length;
  const target    = repTarget(VIEW.rep, mBounds(rng.to));

  const t = el('div', { class: 'tiles' });
  t.appendChild(tile('Commit', money(commitVal), { cur: true, icon: 'flag',
    foot: `${nCommit} deal${nCommit === 1 ? '' : 's'} committed by ${W.filter(x => x.cRecs.length).length} of ${W.length} reps` }));
  t.appendChild(tile('Best case', money(bestVal), { cur: true, icon: 'up',
    foot: `${nBest} deal${nBest === 1 ? '' : 's'} that could land` }));
  t.appendChild(tile('Weighted forecast', money(forecast), { cur: true, icon: 'chart',
    foot: '(commit + best case) × stage weight' + (W.some(x => x.stale) ? ' · stale halved' : '') }));
  t.appendChild(tile('Of commit, landed', money(landed), { cur: true, icon: 'check',
    foot: commitVal ? pct(landed, commitVal) + '% of the commitment kept' : 'nothing committed yet',
    meter: commitVal ? pct(landed, commitVal) : null }));
  t.appendChild(tile('Closed won in week', money(wonVal), { cur: true, icon: 'bolt',
    foot: target ? `${pct(wonVal, target)}% of the ${fdate(rng.to,'month')} target` : `${sum(W, x => x.won.length)} won · ${sum(W, x => x.lost.length)} lost`,
    meter: target ? pct(wonVal, target) : null }));
  if (unitLines().length) {
    const allRecs = W.reduce((a, x) => a.concat(x.cRecs, x.bRecs), []);
    const us = unitSummary(allRecs);
    t.appendChild(tile('Devices committed', us.length ? us.map(([, n]) => n).reduce((a, b) => a + b, 0) : '0',
      { icon: 'board', foot: us.length ? us.map(([L, n]) => `${n} ${L}`).join(' · ') : 'no device counts entered' }));
  }
  t.appendChild(tile('Open pipeline', money(pipeline), { cur: true, icon: 'grid',
    foot: target ? `${(pipeline / target).toFixed(1)}× coverage of target` : `${sum(W, x => x.openD.length)} open deals`,
    onclick: () => go('pipeline') }));
  root.appendChild(t);

  if (W.length && locked < W.length) root.appendChild(el('div', { class: 'alert', style: 'margin-bottom:var(--sp-3)' }, [
    el('span', { class: 'ic', html: ico('warn', 16) }),
    el('div', { style: 'flex:1;min-width:0;line-height:1.5', html:
      `<b>${W.length - locked} of ${W.length} reps have not submitted</b><div class="sub">${
        esc(W.filter(x => !x.r.locked).map(x => x.o.name).join(', '))} — the roll-up above counts whatever is entered so far.</div>` })
  ]));

  // ---- the merged grid: pipeline + forecast + commitment, per rep
  const gr = card('Pipeline, forecast and commitment by rep',
    `${weekLabel(wk)} · commit and best case are this week's picks, pipeline is current`);
  const host = el('div'); gr.body.appendChild(host);
  dataTable(host, {
    key: 'wkgrid', noun: 'reps', rows: W, per: 30, defaultSort: 1, defaultDir: 1,
    emptyText: 'No active reps. Add your team in Settings and their commitment rows appear here.',
    cols: [
      { h: 'Rep', v: x => x.o.name, r: x => ownerCell(x.o.id) },
      /* sorts on the team order, not the region's name, so Dubai comes before
         Abu Dhabi when that is how the regions are arranged */
      { h: 'Region', v: x => teamRank(x.o), sv: x => teamRank(x.o),
        r: x => { const r = ownerRegion(x.o.id);
          return r === UNASSIGNED_REGION ? '<span class="cellsub">not set</span>' : esc(r); } },
      { h: 'Status', v: x => x.r.locked ? 1 : 0, r: x => x.r.locked
          ? `<span class="tag good">Submitted</span>` : `<span class="tag warn">In progress</span>` },
      { h: 'Commit', num: true, v: x => x.commitVal,
        r: x => `<span class="mono">${money(x.commitVal)}</span><div class="cellsub">${x.cRecs.length} deals</div>` },
      { h: 'Best case', num: true, v: x => x.bestVal,
        r: x => `<span class="mono" style="color:var(--ink-2)">${money(x.bestVal)}</span><div class="cellsub">${x.bRecs.length} deals</div>` },
      { h: 'Weight', num: true, v: x => x.topProb,
        r: x => x.topProb ? `${Math.round(x.topProb * 100)}%${x.stale ? '<div class="cellsub" style="color:var(--critical-ink)">stale ×0.5</div>' : ''}`
                          : '<span class="cellsub">—</span>' },
      { h: 'Forecast', num: true, v: x => x.forecast, r: x => `<span class="mono">${money(x.forecast)}</span>` },
      { h: 'Pipeline', num: true, v: x => x.pipeline,
        r: x => `<span class="mono" style="color:var(--ink-2)">${money(x.pipeline)}</span><div class="cellsub">${x.openD.length} open</div>` },
      { h: 'Closed won', num: true, v: x => x.wonVal,
        r: x => `<span class="mono" style="color:var(--good-ink)">${money(x.wonVal)}</span><div class="cellsub">${x.won.length} deals</div>` },
      { h: 'Coverage', num: true, v: x => x.coverage || 0,
        r: x => x.coverage == null ? '<span class="cellsub">no target</span>'
              : `<span class="tag ${covTag(x.coverage)}">${x.coverage.toFixed(1)}×</span>` },
      { h: 'Devices', num: true, v: x => unitLines().reduce((t, L) => t + (x.units[L] || 0), 0),
        r: x => { const n = unitLines().filter(L => x.units[L]);
          return n.length ? n.map(L => `${x.units[L]} ${esc(L)}`).join('<br>') : '<span class="cellsub">—</span>'; } },
      { h: 'Score', num: true, v: x => x.score,
        r: x => `<span class="tag ${x.tier === 'hot' ? 'good' : x.tier === 'warm' ? 'warn' : 'bad'}">${x.score}</span>` +
                `<div class="cellsub">${x.sigOn}/${SIGNALS.length} signals</div>` }
    ],
    footNote: `team commit ${CFG.currency} ${money(commitVal, {dash:false})} · forecast ${CFG.currency} ${money(forecast, {dash:false})} · won ${CFG.currency} ${money(wonVal, {dash:false})}`,
    onRow: x => { VIEW.rep = x.o.id; renderTopControls(); render(); }
  });
  root.appendChild(el('div', { style: 'margin-bottom:var(--sp-3)' }, [gr.node]));

  // ---- two charts: where the commitment sits, and how the calls have gone
  const g = el('div', { class: 'grid2', style: 'margin-bottom:var(--sp-3)' });

  const allC = W.reduce((a, x) => a.concat(x.cRecs), []);
  const allB = W.reduce((a, x) => a.concat(x.bRecs), []);
  const c1 = card('Committed and best-case deals by stage',
    `${allC.length + allB.length} deals picked for ${weekLabel(wk)}`);
  const byStage = openStages().map(s => {
    const cd = allC.filter(c => { const d = getDl(c.dealId); return d && d.stageId === s.id; });
    const bdl = allB.filter(c => { const d = getDl(c.dealId); return d && d.stageId === s.id; });
    return { s, cv: sum(cd, commitValue), bv: sum(bdl, commitValue), n: cd.length + bdl.length };
  }).filter(x => x.n);
  if (!byStage.length) c1.body.appendChild(el('p', { class: 'sub', style: 'margin:0',
    html: 'Nothing has been committed for this week yet. Use <b>Commit deals</b> above, or the <b>Commit this week</b> button inside any deal.' }));
  else chartBar(c1.body, byStage.map(x => ({
    label: x.s.label, short: x.s.label.split(' ')[0],
    value: Math.round(x.cv + x.bv),
    note: `${CFG.currency} ${money(x.cv, {compact:true})} commit · ${CFG.currency} ${money(x.bv, {compact:true})} best case · weight ${Math.round(x.s.probability*100)}%`
  })), { yLabel: CFG.currency, xLabel: 'Stage' });
  g.appendChild(c1.node);

  const c2 = card('Called versus closed, week by week', 'Does the commitment hold up? Eight weeks of history');
  const wks = []; for (let i = 7; i >= 0; i--) wks.push(weekShift(wk, -i));
  const repIds = reps.map(o => String(o.id));
  const inScope = c => VIEW.rep === 'all' || repIds.includes(String(c.ownerId));
  chartLine(c2.body, [
    { name: 'Commit', color: 'var(--s1)',
      data: wks.map(k => sum(commitsIn(k, null, 'commit').filter(inScope), commitValue)) },
    { name: 'Closed won', color: 'var(--s3)', dash: '5 4',
      data: wks.map(k => { const rr = weekRange(k);
        return sum(live('deals').filter(d => isWon(d) && inPeriod(d.closeDate, { from: rr.from, to: rr.to }) &&
          (VIEW.rep === 'all' || ownedBy(d, VIEW.rep))), d => d.amount); }) }
  ], wks.map(k => weekRange(k).from.slice(5).replace('-', '/')), { xLabel: 'Week beginning', height: 280 });
  g.appendChild(c2.node);
  root.appendChild(g);

  // ---- movement this week, from the activity log
  const moved = DB.activities.filter(a => !a._del && a.kind === 'stage' && a.at &&
    a.at.slice(0,10) >= rng.from && a.at.slice(0,10) <= rng.to);
  const mv = card('Stage movement this week', `${moved.length} stage changes logged between ${fdate(rng.from)} and ${fdate(rng.to)}`);
  if (!moved.length) mv.body.appendChild(el('p', { class: 'sub', style: 'margin:0',
    text: 'No stage changes were logged in this week. Movement is recorded automatically when a deal is dragged on the board.' }));
  else {
    const tl = el('div', { class: 'tl' });
    moved.slice(0, 14).forEach(a => tl.appendChild(el('div', { class: 'it stage', html:
      `<div class="w">${esc(fdate(a.at))} · ${esc(ownerName(a.ownerId))}</div><div class="t">${a.html || esc(a.text || '')}</div>` })));
    mv.body.appendChild(tl);
  }
  root.appendChild(el('div', { style: 'margin-bottom:var(--sp-3)' }, [mv.node]));

  // ---- per-rep cards, grouped by region and in the team's own running order
  const groups = ownersByRegion(reps);
  groups.forEach(({ region, owners }) => {
    const mine = owners.map(o => W.find(x => x.o.id === o.id)).filter(Boolean);
    if (!mine.length) return;
    const commit = sum(mine, x => x.commitVal), fc = sum(mine, x => x.forecast);
    const inN = mine.filter(x => x.r.locked).length;
    root.appendChild(el('div', { class: 'regionhead' }, [
      el('h3', { text: region === UNASSIGNED_REGION ? 'No region set' : region }),
      el('span', { class: 'sub', text: `${mine.length} rep${mine.length === 1 ? '' : 's'} · ${
        esc(mine.map(x => x.o.name.split(' ')[0]).join(', '))}` }),
      el('div', { style: 'flex:1' }),
      el('span', { class: 'sub mono', text: `commit ${CFG.currency} ${money(commit, { dash: false })} · forecast ${CFG.currency} ${money(fc, { dash: false })}` }),
      el('span', { class: 'tag ' + (mine.length && inN === mine.length ? 'good' : 'warn'),
        text: `${inN}/${mine.length} in` })
    ]));
    const grid = el('div', { class: 'wk', style: 'margin-bottom:var(--sp-4)' });
    mine.forEach(x => grid.appendChild(repReviewCard(x)));
    root.appendChild(grid);
  });
  if (!W.length) root.appendChild(el('div', { class: 'empty', html: ico('user',34) +
    '<h4>No active reps</h4><p>Add your sales team in Settings and their commitment cards appear here.</p>' }));
  else if (groups.length === 1 && groups[0].region === UNASSIGNED_REGION && isAdmin())
    root.appendChild(el('p', { class: 'sub', style: 'margin:0;line-height:1.55', html:
      'Nobody has a sales region yet, so everyone is in one group. Set each person\u2019s region in ' +
      '<b>Settings \u2192 Sales team &amp; targets</b>, and put them in the order you run the meeting in under ' +
      '<b>Sales regions</b>.' }));
}

/* ------------------------------------------------- one rep's card */
function repReviewCard(x) {
  const { o, r, wk, rng } = x;
  const locked = !!r.locked;
  const tasksLate = live('tasks').filter(t => String(t.ownerId) === o.id && t.status !== 'done' &&
    t.dueDate && dnum(t.dueDate) < dnum(TODAY()));

  const n = el('div', { class: 'repcard' });
  n.appendChild(el('header', {}, [
    el('span', { class: 'avatar lg', style: `background:${ownerColor(o.id)}`, text: initials(o.name) }),
    el('div', {}, [ el('div', { class: 'nm', text: o.name }),
      el('div', { class: 'rl', text: `${x.openD.length} open · ${CFG.currency} ${money(x.pipeline, {compact:true})} pipeline` }) ]),
    el('div', { style: 'flex:1' }),
    el('span', { class: 'tag ' + (locked ? 'good' : 'warn'), text: locked ? 'Submitted' : 'In progress' }),
    overdueDeals(o.id, { ownedOnly: true }).length ? el('button', { class: 'tag bad', style: 'border:0;cursor:pointer',
      title: 'Open deals past their close date — click to fix',
      text: overdueDeals(o.id, { ownedOnly: true }).length + ' overdue dates',
      onclick: () => { VIEW.rep = o.id; renderTopControls(); overdueQueue(); } }) : null,
    tasksLate.length ? el('span', { class: 'tag bad', text: tasksLate.length + ' late tasks' }) : null
  ]));
  const bd = el('div', { class: 'b' });

  // ---- the numbers
  const kv = el('dl', { class: 'kvs' });
  const add = (k, v) => { kv.appendChild(el('dt', { text: k })); kv.appendChild(el('dd', { html: v })); };
  add('Commit',    `${CFG.currency} ${money(x.commitVal, { dash: false })}`);
  add('Best case', `<span style="color:var(--ink-2)">${CFG.currency} ${money(x.bestVal, { dash: false })}</span>`);
  add('Stage weight', x.topProb
    ? `${Math.round(x.topProb * 100)}%${x.stale ? ` <span class="tag bad">stale ×0.5</span>` : ''}`
    : '<span style="color:var(--ink-3)">—</span>');
  add('Weighted forecast', `${CFG.currency} ${money(x.forecast, { dash: false })}`);
  if (unitLines().length) add('Devices', Object.keys(x.units).length
    ? unitLines().filter(L => x.units[L]).map(L => `${x.units[L]} ${esc(L)}`).join(' · ')
    : '<span style="color:var(--ink-3)">none counted</span>');
  add('Won this week',  `<span style="color:var(--good-ink)">${CFG.currency} ${money(x.wonVal, { dash: false })}</span>`);
  add('Lost this week', `<span style="color:var(--critical-ink)">${CFG.currency} ${money(x.lostVal, { dash: false })}</span>`);
  bd.appendChild(kv);

  // ---- scorecard: the four tracker metrics
  const sc = el('div', { class: 'scorecard' });
  const met = (label, text, tag, title) => sc.appendChild(el('div', { class: 'sc' + (tag ? ' ' + tag : ''), title: title || '' }, [
    el('div', { class: 'l', text: label }), el('div', { class: 'v', text: text })
  ]));
  met('Forecast accuracy', x.accuracy == null ? '—' : Math.round(x.accuracy * 100) + '%', accTag(x.accuracy),
    'How close the weighted forecast landed to what actually closed. Symmetric — over-calling and sandbagging both cost you. ' + thresholdNote('accuracy'));
  met('Commit variance', x.variance == null ? '—' : signed(x.variance), varTag(x.variance),
    'Closed won against what was committed. Positive means the commit was beaten. ' + thresholdNote('variance'));
  const teamT = x.target ? null : teamTargetInfo(Object.assign(mBounds(rng.to), { grain: 'month' }));
  const tnote = x.target
    ? `${CFG.currency} ${money(x.target, {dash:false})} for ${x.monthLabelOf}` +
      (x.targetInfo.basis === 'derived' ? ` — worked out from ${x.targetInfo.from}` : '')
    : (teamT && teamT.value)
      ? `no personal target for ${x.monthLabelOf} — the team one is ${CFG.currency} ${money(teamT.value, {dash:false})}, and a team number is not split into personal quotas`
      : `no target for ${x.monthLabelOf}, and none to work one out from`;
  met('Goal attainment', x.attain == null ? 'no target' : Math.round(x.attain * 100) + '%', attTag(x.attain),
    `${CFG.currency} ${money(x.monthWon, {dash:false})} closed in ${x.monthLabelOf} so far against ${tnote}. ${thresholdNote('attain')}`);
  met('Pipeline coverage', x.coverage == null ? 'no target' : x.coverage.toFixed(1) + '×', covTag(x.coverage),
    `Open pipeline against ${tnote}. ${thresholdNote('coverage')}`);
  bd.appendChild(sc);
  bd.appendChild(el('p', { class: 'sub', style: 'margin:-8px 0 var(--sp-4);line-height:1.5', html:
    x.target
      ? `Attainment and coverage run against <b>${esc(x.monthLabelOf)}</b> — ${esc(tnote)}.` +
        (x.targetInfo.basis === 'derived' && isAdmin()
          ? ' <a href="#settings" style="color:var(--accent)">Set a monthly one</a>' : '')
      : (teamT && teamT.value)
          ? `${esc(o.name)} has no target of their own for <b>${esc(x.monthLabelOf)}</b>. The team target is ` +
            `<b>${CFG.currency} ${money(teamT.value, {dash:false})}</b>, and a team number is never divided into personal quotas — ` +
            `so attainment and coverage stay blank until ${esc(o.name)} has one.${isAdmin()
              ? ' <a href="#settings" style="color:var(--accent)">Set it in Settings</a>' : ''}`
          : `No target to measure against.${isAdmin()
              ? ' <a href="#settings" style="color:var(--accent)">Set one in Settings</a>' : ''}` }));

  // ---- the two commitment slots
  ['commit', 'best'].forEach(slot => {
    const recs = slot === 'commit' ? x.cRecs : x.bRecs;
    bd.appendChild(el('div', { style: 'display:flex;align-items:center;gap:8px;margin-bottom:6px' }, [
      el('label', { class: 'fl', style: 'margin:0', html: ico(slot === 'commit' ? 'flag' : 'up', 12) + ' ' + SLOTS[slot] }),
      el('span', { class: 'mono', style: 'font-size:var(--fs-xs);color:var(--ink-3)',
        text: CFG.currency + ' ' + money(slot === 'commit' ? x.commitVal : x.bestVal, { dash: false }) }),
      el('div', { style: 'flex:1' }),
      locked ? null : el('button', { class: 'btn sm ghost', html: ico('plus',12), 'aria-label': 'Add to ' + SLOTS[slot],
        onclick: () => addCommitment(wk, o.id, slot) })
    ].filter(Boolean)));
    const list = el('div', { class: 'nlist', style: 'margin-bottom:var(--sp-4)' });
    if (!recs.length) list.appendChild(el('div', { class: 'nitem', style: 'color:var(--ink-3)',
      html: `<span class="ic">${ico(slot === 'commit' ? 'flag' : 'up',13)}</span><span>${
        slot === 'commit' ? 'Nothing committed for this week.' : 'No best-case deals picked.'}</span>` }));
    recs.forEach(c => {
      const d = getDl(c.dealId);
      const state = !d ? '' : isWon(d) ? 'good' : isLost(d) ? 'bad' : '';
      const age = d ? daysInStage(d) : null;
      const stale = d && isStale(d);
      list.appendChild(el('div', { class: 'nitem ' + (slot === 'commit' ? 'com' : 'best') }, [
        el('span', { class: 'ic', html: ico(slot === 'commit' ? 'flag' : 'up',13) }),
        el('div', { style: 'flex:1;cursor:pointer', onclick: () => d && openDeal(d.id), html:
          `<b>${esc(d ? d.name : (c.note || 'commitment'))}</b>
           <span class="mono" style="color:var(--ink-3)"> · ${CFG.currency} ${money(commitValue(c), { dash: false })}</span>
           ${d ? ` <span class="tag ${state}">${esc(stage(d.stageId).label)}</span>` : ''}
           ${stale ? ` <span class="tag bad" title="No stage movement in ${age} days">${age}d in stage</span>` : ''}
           ${unitText([c]) ? ` <span class="tag info">${esc(unitText([c]))}</span>` : ''}
           ${c.note ? `<div style="color:var(--ink-3);margin-top:3px">${esc(c.note)}</div>` : ''}` }),
        locked ? null : el('button', { html: ico('grid',12), title: 'Devices on this commitment',
          onclick: () => editUnits(c) }),
        locked ? null : el('button', { html: ico('x',12), 'aria-label': 'Remove',
          onclick: () => { remove('commitments', c.id); render(); } })
      ].filter(Boolean)));
    });
    bd.appendChild(list);
  });

  // ---- buyer signals + qual score
  bd.appendChild(el('div', { style: 'display:flex;align-items:center;gap:8px;margin-bottom:6px' }, [
    el('label', { class: 'fl', style: 'margin:0', text: 'Buyer signals' }),
    el('div', { style: 'flex:1' }),
    el('span', { class: 'tag ' + (x.tier === 'hot' ? 'good' : x.tier === 'warm' ? 'warn' : 'bad'),
      title: `${x.sigOn} of ${SIGNALS.length} signals and a ${Math.round(x.topProb*100)}% stage weight`,
      text: `${x.score} · ${x.tier}` })
  ]));
  const chips = el('div', { class: 'sigs' });
  SIGNALS.forEach(([k, label]) => {
    const on = !!(r.signals || {})[k];
    chips.appendChild(el('button', { class: 'sig' + (on ? ' on' : ''), text: label,
      disabled: locked || null, 'aria-pressed': on ? 'true' : 'false',
      onclick: () => { r.signals = Object.assign({}, r.signals); r.signals[k] = !on; saveReview(r); render(); } }));
  });
  bd.appendChild(chips);
  bd.appendChild(el('div', { class: 'scorebar', html: `<i class="${x.tier}" style="width:${x.score}%"></i>` }));

  // ---- confidence, next action, blocker
  const conf = el('select', { class: 'inp', disabled: locked || null,
    onchange: e => { r.confidence = Number(e.target.value); saveReview(r); } });
  CONF_LEVELS.forEach(v => conf.appendChild(el('option', { value: v, text: v + '%',
    selected: Number(r.confidence || 90) === v || null })));
  const act = el('input', { class: 'inp', value: r.action || '', disabled: locked || null,
    placeholder: 'The one thing that has to happen this week',
    onchange: e => { r.action = e.target.value.trim(); saveReview(r); } });
  const blk = el('input', { class: 'inp', value: r.blocked || '', disabled: locked || null,
    placeholder: 'What is in the way?',
    onchange: e => { r.blocked = e.target.value.trim(); saveReview(r); } });
  bd.appendChild(el('div', { class: 'field-row' }, [ fld('Confidence', conf), fld('Next action', act) ]));
  bd.appendChild(fld('Blocker', blk));

  // ---- problems / solutions / notes
  const sect = (key, label, cls, icon, ph) => {
    bd.appendChild(el('div', { style: 'display:flex;align-items:center;gap:8px;margin-bottom:6px' }, [
      el('label', { class: 'fl', style: 'margin:0', text: label }),
      el('div', { style: 'flex:1' }),
      locked ? null : el('button', { class: 'btn sm ghost', html: ico('plus',12), 'aria-label': 'Add ' + label,
        onclick: () => addReviewItem(r, key, label, ph) })
    ].filter(Boolean)));
    const list = el('div', { class: 'nlist', style: 'margin-bottom:var(--sp-4)' });
    const items = r[key] || [];
    if (!items.length) list.appendChild(el('div', { class: 'nitem', style: 'color:var(--ink-3)',
      html: `<span class="ic">${ico(icon,13)}</span><span>${esc(ph)}</span>` }));
    items.forEach((it, i) => list.appendChild(el('div', { class: 'nitem ' + cls }, [
      el('span', { class: 'ic', html: ico(icon,13) }),
      el('div', { style: 'flex:1' }, [
        el('div', { text: it.text }),
        el('div', { style: 'font-size:var(--fs-xs);color:var(--ink-3);margin-top:2px',
          text: `${fdate(it.at)}${it.by ? ' · ' + String(it.by).split('@')[0] : ''}${it.done ? ' · resolved' : ''}` })
      ]),
      (key === 'problems' && !locked) ? el('button', { html: ico('check',12), title: it.done ? 'Reopen' : 'Mark resolved',
        onclick: () => { it.done = !it.done; saveReview(r); render(); } }) : null,
      locked ? null : el('button', { html: ico('x',12), 'aria-label': 'Remove',
        onclick: () => { r[key].splice(i, 1); saveReview(r); render(); } })
    ].filter(Boolean))));
    bd.appendChild(list);
  };
  sect('problems',  'Problems raised',   'prob', 'warn', 'No problems raised this week.');
  sect('solutions', 'Solutions agreed',  'sol',  'bolt', 'No solutions agreed yet.');
  sect('notes',     'Coaching notes',    '',     'note', 'No notes.');

  // ---- submit / unlock
  const foot = el('div', { style: 'display:flex;align-items:center;gap:var(--sp-2);flex-wrap:wrap' });
  if (locked) {
    foot.appendChild(el('span', { class: 'sub', style: 'flex:1',
      text: `Submitted${r.submittedBy ? ' by ' + String(r.submittedBy).split('@')[0] : ''}${r.submittedAt ? ' · ' + fdate(r.submittedAt) : ''}` }));
    foot.appendChild(el('button', { class: 'btn sm', text: 'Reopen',
      onclick: () => { r.locked = false; r.submittedAt = null; saveReview(r); render(); toast('Reopened for editing'); } }));
  } else {
    foot.appendChild(el('span', { class: 'sub', style: 'flex:1',
      text: 'Submitting locks this week\'s commitment so the review has a fixed number to work from.' }));
    foot.appendChild(el('button', { class: 'btn sm primary', html: ico('check',12) + ' Submit',
      onclick: () => {
        r.locked = true; r.submittedAt = new Date().toISOString();
        r.submittedBy = (AUTH.user && AUTH.user.username) || 'local';
        saveReview(r); render(); toast(`${o.name}'s commitment submitted`, 'ok');
      } }));
  }
  bd.appendChild(foot);
  n.appendChild(bd);
  return n;
}

/* Devices on one commitment, after the fact. */
function editUnits(c) {
  const d = getDl(c.dealId);
  const cur = unitsOf(c);
  const ins = {};
  const rows = el('div', { class: 'field-row' });
  unitLines().forEach(L => {
    ins[L] = el('input', { class: 'inp', type: 'number', min: '0', step: '1',
      value: cur[L] != null ? cur[L] : '', placeholder: '0' });
    rows.appendChild(fld(L + ' units', ins[L]));
  });
  const auto = autoUnits(d);
  modal('Devices — ' + (d ? d.name : 'commitment'), el('div', {}, [
    el('p', { style: 'margin:0 0 var(--sp-4);color:var(--ink-2);line-height:1.6',
      html: Object.keys(auto).length
        ? `The estimate on this deal adds up to <b>${esc(unitLines().filter(L => auto[L]).map(L => auto[L] + ' ' + L).join(' · '))}</b>. Leave a box empty to keep following the estimate.`
        : 'This deal has no product lines yet, so nothing can be counted automatically — type the device counts in.' }),
    rows
  ]), [
    el('button', { class: 'btn', text: 'Cancel', onclick: closeAll }),
    el('button', { class: 'btn primary', text: 'Save', onclick: () => {
      const u = {};
      unitLines().forEach(L => { const v = ins[L].value;
        if (v !== '') u[L] = Math.max(0, Number(v) || 0); });
      c.units = Object.keys(u).length ? u : null;
      upsert('commitments', c);
      closeAll(); render(); toast('Devices saved', 'ok');
    } })
  ]);
}

function addReviewItem(r, key, label, ph) {
  const ta = el('textarea', { class: 'inp', rows: 3, placeholder: ph });
  modal('Add to ' + label.toLowerCase() + ' — ' + ownerName(r.ownerId), el('div', {}, [ fld(label, ta) ]), [
    el('button', { class: 'btn', text: 'Cancel', onclick: closeAll }),
    el('button', { class: 'btn primary', text: 'Add', onclick: () => {
      const v = ta.value.trim(); if (!v) return closeAll();
      r[key] = (r[key] || []).concat([{ text: v, at: new Date().toISOString(),
        by: (AUTH.user && AUTH.user.username) || 'local', done: false }]);
      saveReview(r); closeAll(); render(); toast('Added', 'ok');
    } })
  ]);
}

/* ------------------------------------------------------------------
   Commit deals — the multi-pick from the tracker, over CRM deals.
   Tick several at once; the total adds up as you go, and a deal
   already sitting in the other slot is shown as taken.
   ------------------------------------------------------------------ */
function addCommitment(wk, ownerId, slot) {
  let rep = ownerId || (VIEW.rep !== 'all' ? VIEW.rep : currentOwnerId()) || '';
  let sl = slot || 'commit';
  let week = wk || weekKey();
  const picked = new Set();

  /* Which week is being committed to is a decision, not a side effect of
     where the dialog was opened from — a rep on Monday morning is often
     filling in the week that has just started, not the one on screen. */
  const wkSel = el('select', { class: 'inp', 'aria-label': 'Week',
    onchange: e => { week = e.target.value; picked.clear(); paint(); paintUnits(); paintWeekNote(); } });
  const WEEK_SPAN = [-3, 8];
  for (let i = WEEK_SPAN[0]; i <= WEEK_SPAN[1]; i++) {
    const k = weekShift(weekKey(), i);
    const mkk = monthKey(weekRange(k).to);
    const tag = i === 0 ? ' — this week' : i === -1 ? ' — last week' : i === 1 ? ' — next week' : '';
    wkSel.appendChild(el('option', { value: k, selected: k === week || null,
      text: `${weekOfMonthLabel(mkk, k)} ${monthLabel(mkk)} · ${weekLabel(k)}${tag}` }));
  }
  if (!Array.from(wkSel.options).some(o => o.value === week)) {
    const mkk = monthKey(weekRange(week).to);
    wkSel.insertBefore(el('option', { value: week, selected: true,
      text: `${weekOfMonthLabel(mkk, week)} ${monthLabel(mkk)} · ${weekLabel(week)}` }), wkSel.firstChild);
  }
  const wkNote = el('p', { class: 'sub', style: 'margin:6px 0 0;line-height:1.5' });
  function paintWeekNote() {
    const mine = commitsIn(week, rep || null);
    const c = mine.filter(x => slotOf(x) === 'commit'), b = mine.filter(x => slotOf(x) === 'best');
    const who = rep ? ownerName(rep) : 'the team';
    wkNote.innerHTML = (c.length || b.length)
      ? `${esc(who)} already ${c.length + b.length === 1 ? 'has' : 'have'} <b>${c.length}</b> in commit and ` +
        `<b>${b.length}</b> in best case for this week — ${CFG.currency} ${money(sum(c, commitValue), {dash:false})} ` +
        `and ${CFG.currency} ${money(sum(b, commitValue), {dash:false})}. Anything you add here joins that.`
      : `Nothing picked for this week by ${esc(who)} yet.`;
  }

  const own = ownerSelect(rep, { emptyLabel: 'All reps',
    onchange: e => { rep = e.target.value; picked.clear(); paint(); paintUnits(); paintWeekNote(); } });
  const seg = el('div', { class: 'seg' });
  ['commit','best'].forEach(s => seg.appendChild(el('button', { class: s === sl ? 'on' : '', text: SLOTS[s],
    onclick: () => { sl = s; picked.clear(); paintSeg(); paint(); paintUnits(); paintWeekNote(); } })));
  function paintSeg() { Array.from(seg.children).forEach((b, i) => b.classList.toggle('on', ['commit','best'][i] === sl)); }

  const q = el('input', { class: 'inp', placeholder: 'Search open deals…', oninput: () => paint() });
  const units = new Map();          // dealId -> { XS1: n, ... } as typed here
  const unitHost = el('div');
  const note = el('input', { class: 'inp', placeholder: 'What has to happen for these to land?' });
  const list = el('div', { class: 'picklist' });
  const bar = el('div', { class: 'picksum' });

  function candidates() {
    const term = q.value.trim().toLowerCase();
    return live('deals').filter(isOpen)
      .filter(d => !rep || String(d.ownerId) === String(rep))
      .filter(d => !term || (d.name || '').toLowerCase().includes(term) ||
                   ((getCo(d.companyId) || {}).name || '').toLowerCase().includes(term))
      .sort((a, b) => (stage(b.stageId).probability - stage(a.stageId).probability) || ((b.amount||0) - (a.amount||0)))
      .slice(0, 200);
  }
  function paint() {
    const taken = new Map();
    commitsIn(week).forEach(c => taken.set(String(c.dealId), slotOf(c)));
    list.innerHTML = '';
    const ds = candidates();
    if (!ds.length) list.appendChild(el('div', { class: 'sub', style: 'padding:16px;text-align:center',
      text: rep ? 'No open deals for this rep match.' : 'No open deals match.' }));
    ds.forEach(d => {
      const has = taken.get(String(d.id));
      const on = picked.has(d.id);
      const row = el('label', { class: 'pick' + (has ? ' taken' : '') + (on ? ' on' : '') });
      /* Toggling repaints nothing but this row and the total — a full rebuild
         would throw away the scroll position halfway down a 200-deal list. */
      row.appendChild(el('input', { type: 'checkbox', checked: on || null, disabled: has ? true : null,
        onchange: e => {
          e.target.checked ? picked.add(d.id) : picked.delete(d.id);
          row.classList.toggle('on', e.target.checked);
          if (!e.target.checked) units.delete(d.id);
          updateSum(); paintUnits();
        } }));
      row.appendChild(el('div', { style: 'flex:1;min-width:0', html:
        `<div class="nm">${esc(d.name)}</div>
         <div class="sub">${esc(ownerName(d.ownerId))}${d.companyId ? ' · ' + esc((getCo(d.companyId) || {}).name || '') : ''} · ${
           esc(stage(d.stageId).label)} ${Math.round(stage(d.stageId).probability*100)}%${
           d.closeDate ? ' · closes ' + esc(fdate(d.closeDate)) : ''}${
           isStale(d) ? ` · <span style="color:var(--critical-ink)">${daysInStage(d)}d in stage</span>` : ''}</div>` }));
      row.appendChild(el('span', { class: 'mono', style: 'flex:none;color:var(--ink-2)',
        text: money(d.amount, { compact: true }) }));
      if (has) row.appendChild(el('span', { class: 'tag', style: 'flex:none', text: 'in ' + SLOTS[has] }));
      list.appendChild(row);
    });
    updateSum();
  }
  /* Device counts for the ticked deals, seeded from each deal's estimate. */
  function paintUnits() {
    unitHost.innerHTML = '';
    const ids = Array.from(picked);
    if (!ids.length || !unitLines().length) return;
    unitHost.appendChild(el('label', { class: 'fl', text: 'Devices committed' }));
    unitHost.appendChild(el('p', { class: 'sub', style: 'margin:0 0 8px;line-height:1.55',
      text: 'Pre-filled from each deal\u2019s estimate where there is one. Type over anything that is wrong.' }));
    const wrap = el('div', { class: 'unitrows' });
    ids.forEach(id => {
      const d = getDl(id); if (!d) return;
      const cur = units.get(id) || autoUnits(d);
      const row = el('div', { class: 'unitrow' });
      row.appendChild(el('div', { class: 'nm', title: d.name, text: d.name }));
      unitLines().forEach(L => {
        const inp = el('input', { class: 'inp', type: 'number', min: '0', step: '1',
          value: cur[L] != null ? cur[L] : '', placeholder: '0', 'aria-label': `${L} units for ${d.name}`,
          oninput: e => {
            const o = Object.assign({}, units.get(id) || autoUnits(d));
            if (e.target.value === '') delete o[L]; else o[L] = Math.max(0, Number(e.target.value) || 0);
            units.set(id, o);
          } });
        row.appendChild(el('label', { class: 'u' }, [ el('span', { text: L }), inp ]));
      });
      wrap.appendChild(row);
    });
    unitHost.appendChild(wrap);
  }
  function updateSum() {
    const tot = sum(Array.from(picked), id => (getDl(id) || {}).amount || 0);
    bar.innerHTML = `<b>${picked.size}</b> selected · <span class="mono">${CFG.currency} ${money(tot, { dash: false })}</span>` +
      (picked.size ? '' : ' <span style="color:var(--ink-3)">— tick the deals to add</span>');
    const go = $('#pickgo');
    if (go) { go.disabled = !picked.size; go.textContent = picked.size
      ? `Add ${picked.size} to ${SLOTS[sl].toLowerCase()}` : 'Add to ' + SLOTS[sl].toLowerCase();
      go.title = `Goes into ${weekLabel(week)}`; }
  }
  paint(); paintUnits();

  paintWeekNote();
  modal('Commit deals', el('div', {}, [
    el('p', { style: 'margin:0 0 var(--sp-4);color:var(--ink-2);line-height:1.6',
      html: '<b>Commit</b> is what the rep is personally standing behind that week. <b>Best case</b> is what could land if everything breaks right. The weighted forecast is built from both.' }),
    el('div', { class: 'field' }, [
      el('label', { class: 'fl', text: 'Week' }), wkSel, wkNote ]),
    el('div', { class: 'field-row' }, [ fld('Rep', own), fld('Slot', seg) ]),
    fld('Find deals', q),
    bar, list, unitHost,
    fld('Note', note, 'Applied to every deal picked here.')
  ]), [
    el('button', { class: 'btn', text: 'Cancel', onclick: closeAll }),
    el('button', { class: 'btn primary', id: 'pickgo', disabled: true,
      text: 'Add to ' + SLOTS[sl].toLowerCase(), onclick: () => {
      if (!picked.size) return toast('Pick at least one deal', 'err');
      const txt = note.value.trim() || null;
      batch(() => Array.from(picked).forEach(id => {
        const d = getDl(id); if (!d) return;
        const u = units.get(d.id) || autoUnits(d);
        upsert('commitments', { week, dealId: d.id, ownerId: d.ownerId, slot: sl,
          amount: d.amount || 0, note: txt, stageAt: d.stageId,
          units: Object.keys(u).length ? u : null });
        logAct({ dealId: d.id, ownerId: d.ownerId, kind: 'commit',
          html: `Picked <b>${esc(d.name)}</b> as <b>${esc(SLOTS[sl].toLowerCase())}</b> for ${esc(weekLabel(week))}` });
      }));
      closeAll(); render();
      toast(`${picked.size} deal${picked.size === 1 ? '' : 's'} added to ${SLOTS[sl].toLowerCase()} for ${weekLabel(week)}`, 'ok');
    } })
  ]);
  updateSum();   // the footer button only exists once the modal is in the DOM
}

/* -------------------------------------------------------- the agenda */
function exportReview(wk) {
  const rng = weekRange(wk), b = { from: rng.from, to: rng.to };
  const reps = VIEW.rep === 'all' ? activeOwners() : DB.owners.filter(o => o.id === VIEW.rep);
  const W = reps.map(o => repWeek(o, wk, rng));
  const cur = CFG.currency, m = v => `${cur} ${money(v, { dash: false })}`;
  const L = [`# CoreV commitment review — ${weekLabel(wk)}`, ''];

  L.push('## Team');
  L.push(`- Commit: ${m(sum(W, x => x.commitVal))} across ${sum(W, x => x.cRecs.length)} deals`);
  L.push(`- Best case: ${m(sum(W, x => x.bestVal))} across ${sum(W, x => x.bRecs.length)} deals`);
  L.push(`- Weighted forecast: ${m(sum(W, x => x.forecast))}`);
  L.push(`- Closed won this week: ${m(sum(W, x => x.wonVal))} · closed lost: ${m(sum(W, x => x.lostVal))}`);
  L.push(`- Open pipeline: ${m(sum(W, x => x.pipeline))}`);
  const notIn = W.filter(x => !x.r.locked).map(x => x.o.name);
  if (notIn.length) L.push(`- Not yet submitted: ${notIn.join(', ')}`);
  L.push('');

  ownersByRegion(reps).forEach(({ region, owners }) => {
    const mine = owners.map(o => W.find(x => x.o.id === o.id)).filter(Boolean);
    if (!mine.length) return;
    L.push(`# ${region === UNASSIGNED_REGION ? 'No region set' : region}`);
    L.push(`Commit ${m(sum(mine, x => x.commitVal))} · Forecast ${m(sum(mine, x => x.forecast))} · ${
      mine.filter(x => x.r.locked).length}/${mine.length} submitted`, '');
  mine.forEach(x => {
    const r = x.r;
    L.push(`## ${x.o.name}${r.locked ? '' : ' _(not submitted)_'}`);
    L.push(`- Commit ${m(x.commitVal)} · Best case ${m(x.bestVal)} · Stage weight ${Math.round(x.topProb*100)}%${x.stale ? ' (stale, halved)' : ''} → forecast ${m(x.forecast)}`);
    L.push(`- Pipeline ${m(x.pipeline)} · Won ${m(x.wonVal)} · Lost ${m(x.lostVal)}`);
    L.push(`- Accuracy ${x.accuracy == null ? '—' : Math.round(x.accuracy*100) + '%'} · Commit variance ${x.variance == null ? '—' : signed(x.variance)} · Attainment ${x.attain == null ? 'no target' : Math.round(x.attain*100) + '%'} · Coverage ${x.coverage == null ? 'no target' : x.coverage.toFixed(1) + '×'}`);
    L.push(`- Buyer signals ${x.sigOn}/${SIGNALS.length} (${SIGNALS.filter(([k]) => (r.signals||{})[k]).map(([,l]) => l).join(', ') || 'none ticked'}) · score ${x.score} ${x.tier}`);
    if (Object.keys(x.units).length) L.push(`- Devices: ${unitLines().filter(k => x.units[k]).map(k => `${x.units[k]} ${k}`).join(' · ')}`);
    if (r.confidence) L.push(`- Confidence: ${r.confidence}%`);
    if (r.action)  L.push(`- Next action: ${r.action}`);
    if (r.blocked) L.push(`- Blocker: ${r.blocked}`);
    [['commit','Commit', x.cRecs], ['best','Best case', x.bRecs]].forEach(([, label, recs]) => {
      if (!recs.length) return;
      L.push('', `**${label}**`);
      recs.forEach(c => { const d = getDl(c.dealId);
        L.push(`- ${d ? d.name : (c.note || 'commitment')} — ${m(commitValue(c))}${
          d ? ` — ${stage(d.stageId).label}${isWon(d) ? ' · WON' : isLost(d) ? ' · LOST' : ''}` : ''}${
          d && isStale(d) ? ` — stale, ${daysInStage(d)}d in stage` : ''}${
          unitText([c]) ? ` — ${unitText([c])}` : ''}${c.note ? ` — ${c.note}` : ''}`); });
    });
    if (x.lost.length) { L.push('', '**Lost, and why**');
      x.lost.forEach(d => L.push(`- ${d.name} — ${m(d.amount)} — ${d.lossReason || 'reason not recorded'}${d.lostTo ? ` (to ${d.lostTo})` : ''}`)); }
    ['problems','solutions','notes'].forEach(k => {
      const items = (r[k] || []); if (!items.length) return;
      L.push('', '**' + (k === 'problems' ? 'Problems' : k === 'solutions' ? 'Solutions agreed' : 'Coaching notes') + '**');
      items.forEach(i => L.push(`- ${i.text}${i.done ? ' _(resolved)_' : ''}`));
    });
    L.push('');
  });
  });
  download(`corev-commitment-review-${wk}.md`, L.join('\n'), 'text/markdown');
  toast('Agenda exported', 'ok');
}

/* ================================================================
   FORECAST & ANALYTICS
   ================================================================ */
function viewForecast(root) {
  const b = periodBounds();
  const deals = scopedDeals();
  const openD = deals.filter(isOpen);
  const won  = deals.filter(d => isWon(d)  && inPeriod(d.closeDate, b));
  const lost = deals.filter(d => isLost(d) && inPeriod(d.closeDate, b));
  const wk = VIEW.week;
  root.appendChild(viewHead(null, [
    el('button', { class: 'btn', html: ico('flag',14) + ' Sales Commitment',
      title: 'What the reps have actually committed to this week', onclick: () => go('review') }),
    periodSeg()
  ]));

  const t = el('div', { class: 'tiles' });
  // Commit here is what reps have put their name to this week; the stage-based
  // number is still shown underneath, so the two are never confused.
  const wkCommit = sum(commitsIn(wk, null, 'commit')
    .filter(c => VIEW.rep === 'all' || String(c.ownerId) === VIEW.rep), commitValue);
  const wkBest = sum(commitsIn(wk, null, 'best')
    .filter(c => VIEW.rep === 'all' || String(c.ownerId) === VIEW.rep), commitValue);
  const commitStages = openD.filter(d => stage(d.stageId).probability >= .9);
  const bestCase = openD.filter(d => stage(d.stageId).probability >= .4 && inPeriod(d.closeDate, b));
  const ti = repTargetInfo(VIEW.rep, b);
  const target = ti.value;
  t.appendChild(tile('Committed this week', money(wkCommit), { cur: true, icon: 'flag',
    foot: `rep commitments for ${weekLabel(wk)}`, onclick: () => go('review') }));
  t.appendChild(tile('Best case this week', money(wkBest), { cur: true, icon: 'up',
    foot: 'picked into the best-case slot', onclick: () => go('review') }));
  t.appendChild(tile('In commit stages', money(sum(commitStages, d => d.amount)), { cur: true, icon: 'chart',
    foot: `${commitStages.length} open deals at 90%+ · ${bestCase.length} at 40%+ closing in ${b.label}` }));
  t.appendChild(tile('Weighted', money(sum(openD.filter(d => inPeriod(d.closeDate, b)), weighted)), { cur: true, icon: 'grid',
    foot: 'open value × stage probability' }));
  t.appendChild(tile('Closed won', money(sum(won, d => d.amount)), { cur: true, icon: 'check',
    foot: target ? `${pct(sum(won, d => d.amount), target)}% of ${CFG.currency} ${money(target, {compact:true})}` : `${won.length} deals`,
    meter: target ? pct(sum(won, d => d.amount), target) : null }));
  const gap = target - sum(won, d => d.amount);
  /* A target is stored against the period label, so the tile says which
     period this one belongs to and offers the way to set it — "where is
     that 1.5M coming from" should be answerable from the tile itself. */
  t.appendChild(tile('Gap to target', target ? money(Math.max(0, gap)) : '—', { cur: !!target, icon: 'bolt',
    footHtml: true,
    foot: target
      ? `${gap <= 0 ? 'target met' : `coverage ${(sum(openD.filter(d => inPeriod(d.closeDate,b)), d=>d.amount) / Math.max(gap,1)).toFixed(1)}×`} · target ${CFG.currency} ${money(target, {compact:true})} for ${esc(b.label)}`
      : (isAdmin() && targetablePeriod(b)) ? `nothing set for ${esc(b.label)} — click to set one`
                                           : `nothing set for ${esc(b.label)}`,
    onclick: (isAdmin() && targetablePeriod(b)) ? () => editTargets() : null }));
  root.appendChild(t);
  root.appendChild(el('p', { class: 'sub', style: 'margin:-4px 0 var(--sp-4);line-height:1.55', html:
    target
      ? (ti.basis === 'set'
          ? `The <b>${esc(b.label)}</b> target of <b>${CFG.currency} ${money(target, {dash:false})}</b> is the one typed into ` +
            `<b>Settings \u2192 Sales team &amp; targets</b>${VIEW.rep === 'all'
              ? ', summed across the active team unless a team override is set' : ''}.`
          : `No target was set for <b>${esc(b.label)}</b>, so this uses <b>${esc(ti.from)}</b> — ` +
            `<b>${CFG.currency} ${money(target, {dash:false})}</b>. ` +
            (targetablePeriod(b)
              ? `Set one for ${esc(b.label)} in <b>Settings \u2192 Sales team &amp; targets</b> and it takes over.`
              : `Weeks cannot hold a target of their own — the monthly one governs, divided by its days.`))
      : `No target anywhere that covers <b>${esc(b.label)}</b>. Targets are set per person per period in ` +
        `<b>Settings \u2192 Sales team &amp; targets</b>; a yearly or quarterly one is divided down when a shorter period asks for it.` }));

  const g = el('div', { class: 'grid2' });

  // monthly won vs lost vs weighted forecast — three separate series, one axis
  const c1 = card('Closed won and lost by month', 'Actual closed value — one axis, no mixed scales');
  const months = [];
  for (let i = 11; i >= 0; i--) { const d = new Date(); d.setUTCDate(1); d.setUTCMonth(d.getUTCMonth() - i); months.push(d.toISOString().slice(0,7)); }
  // Diverging blue<->red, not green/red: green vs red measures CVD dE 4.1 and a
  // deuteranope cannot separate the two lines. Lost is also dashed.
  chartLine(c1.body, [
    { name: 'Won',  color: 'var(--s1)', data: months.map(m => sum(deals.filter(d => isWon(d)  && String(d.closeDate||'').slice(0,7) === m), d => d.amount)) },
    { name: 'Lost', color: 'var(--s8)', dash: '5 4',
      data: months.map(m => sum(deals.filter(d => isLost(d) && String(d.closeDate||'').slice(0,7) === m), d => d.amount)) }
  ], months.map(m => MON[+m.slice(5,7)-1]), { xLabel: 'Month', height: 300 });
  c1.node.classList.add('span2'); g.appendChild(c1.node);

  const c2 = card('Open pipeline by stage', `${openD.length} open deals`);
  chartFunnel(c2.body, openStages().map(s => {
    const ds = openD.filter(d => d.stageId === s.id);
    return { id: s.id, label: s.label, count: ds.length, value: sum(ds, d => d.amount) };
  }));
  g.appendChild(c2.node);

  const c3 = card('Reasons for losing', `${lost.length} deals lost in ${b.label}`);
  const lr = Array.from(groupBy(lost, d => (d.lossReason || '').trim() || 'Not recorded'),
    ([k, v]) => ({ label: k, value: sum(v, d => d.amount) })).sort((x,y) => y.value - x.value).slice(0, 8);
  chartDonut(c3.body, lr, { centerLbl: 'lost value', xLabel: 'Loss reason' });
  const unrec = lost.filter(d => !d.lossReason).length;
  if (unrec) c3.body.appendChild(el('p', { style: 'margin:12px 0 0;font-size:var(--fs-sm);color:var(--ink-3);line-height:1.55',
    html: `${unrec} of ${lost.length} lost deals carry no reason. Nothing was recorded in HubSpot, so this chart only becomes useful once reps pick a reason at the point of losing — the Mark lost dialog now requires one.` }));
  g.appendChild(c3.node);

  const c4 = card('Weighted forecast by close month', 'Open deals only');
  const fm = [];
  for (let i = 0; i <= 8; i++) { const d = new Date(); d.setUTCDate(1); d.setUTCMonth(d.getUTCMonth() + i); fm.push(d.toISOString().slice(0,7)); }
  chartBar(c4.body, fm.map(m => {
    const ds = openD.filter(d => String(d.closeDate||'').slice(0,7) === m);
    return { label: fdate(m + '-01','month'), short: MON[+m.slice(5,7)-1], value: Math.round(sum(ds, weighted)),
             note: `${ds.length} deals` };
  }), { yLabel: 'Weighted ' + CFG.currency, xLabel: 'Month' });
  g.appendChild(c4.node);

  const c5 = card('Deal value distribution', 'Where the pipeline value actually sits');
  const bands = [[0,25000,'< 25k'],[25000,100000,'25k–100k'],[100000,250000,'100k–250k'],
                 [250000,1000000,'250k–1M'],[1000000,Infinity,'1M+']];
  chartBar(c5.body, bands.map(([lo, hi, lbl]) => {
    const ds = openD.filter(d => (d.amount || 0) >= lo && (d.amount || 0) < hi);
    return { label: lbl, value: ds.length, note: `${CFG.currency} ${money(sum(ds, d => d.amount), {compact:true})} of pipeline` };
  }), { fmt: v => String(v), yLabel: 'Deals', xLabel: 'Value band', color: 'var(--s1)' });
  g.appendChild(c5.node);
  root.appendChild(g);

  // rep comparison table
  const rc = el('div', { class: 'card', style: 'margin-top:var(--sp-3)' });
  rc.appendChild(el('h3', { text: 'Rep comparison' }));
  rc.appendChild(el('p', { class: 'sub', text: `Closed in ${b.label}; pipeline and commitment are current` }));
  const rows = activeOwners().map(o => {
    const mine = ownedDeals(o.id);
    const op = mine.filter(isOpen);
    const w = mine.filter(d => isWon(d) && inPeriod(d.closeDate, b));
    const l = mine.filter(d => isLost(d) && inPeriod(d.closeDate, b));
    const tg = repTarget(o.id, b);
    const cycles = w.filter(d => d.createdAt && d.closeDate).map(d => days(d.closeDate, d.createdAt)).filter(x => x > 0);
    return { o, open: op.length, pipe: sum(op, d => d.amount), wt: sum(op, weighted),
      commit: sum(commitsIn(wk, o.id, 'commit'), commitValue),
      won: sum(w, d => d.amount), wonN: w.length, lostN: l.length, target: tg,
      cycle: cycles.length ? Math.round(sum(cycles) / cycles.length) : null };
  });
  const host = el('div'); rc.appendChild(host);
  dataTable(host, {
    key: 'repcmp', noun: 'reps', rows, per: 30, defaultSort: 5, defaultDir: -1,
    cols: [
      { h: 'Rep', v: r => r.o.name, r: r => ownerCell(r.o.id) },
      { h: 'Open', num: true, v: r => r.open },
      { h: 'Pipeline', num: true, v: r => r.pipe, r: r => `<span class="mono">${money(r.pipe)}</span>` },
      { h: 'Weighted', num: true, v: r => r.wt, r: r => `<span class="mono" style="color:var(--ink-2)">${money(r.wt)}</span>` },
      { h: 'Commit wk', num: true, v: r => r.commit, r: r => `<span class="mono">${money(r.commit)}</span>` },
      { h: 'Won', num: true, v: r => r.won, r: r => `<span class="mono" style="color:var(--good-ink)">${money(r.won)}</span><div class="cellsub">${r.wonN} deals</div>` },
      { h: 'Win rate', num: true, v: r => (r.wonN + r.lostN) ? r.wonN / (r.wonN + r.lostN) : 0,
        r: r => (r.wonN + r.lostN) ? pct(r.wonN, r.wonN + r.lostN) + '%' : '—' },
      { h: 'vs target', num: true, v: r => r.target ? r.won / r.target : 0, r: r => {
          if (!r.target) return '<span class="cellsub">no target</span>';
          const p = pct(r.won, r.target);
          return `<span class="tag ${p >= 100 ? 'good' : p >= 60 ? 'warn' : 'bad'}">${p}%</span>`;
        } },
      { h: 'Avg cycle', num: true, v: r => r.cycle || 0, r: r => r.cycle ? r.cycle + ' d' : '<span class="cellsub">—</span>' }
    ],
    onRow: r => { VIEW.rep = r.o.id; renderTopControls(); go('dashboard'); }
  });
  root.appendChild(rc);
}
/* ================================================================
   MONTHLY REVIEW — the month seen by region, and week by week.

   This is the tracker's monthly screen rebuilt on CRM records: the
   weekly forecast bars across the month, the region roll-up with the
   combined line underneath, and a drill-down into any single week. A
   rep belongs to a region (Settings → Sales regions); everything here
   groups by that, with anyone unassigned kept visible rather than
   dropped so the combined row always reconciles.
   ================================================================ */

/* One region's numbers for a set of weeks. Money and devices come from
   what reps actually committed in those weeks; pipeline is current and
   closed is what landed inside the month, both attributed by owner so a
   collaborator never double-counts. */
function regionRoll(region, weeks, mb) {
  const owners = activeOwners().filter(o => region === 'all' || ownerRegion(o.id) === region);
  const ids = new Set(owners.map(o => String(o.id)));
  const mine = c => ids.has(String(c.ownerId));
  const cRecs = weeks.reduce((a, k) => a.concat(commitsIn(k, null, 'commit').filter(mine)), []);
  const bRecs = weeks.reduce((a, k) => a.concat(commitsIn(k, null, 'best').filter(mine)), []);

  // the weighted forecast is built per rep per week, exactly as the
  // commitment review does it, then added up — never re-derived here
  let forecast = 0, locked = 0, slots = 0;
  weeks.forEach(k => {
    const rng = weekRange(k);
    owners.forEach(o => {
      const x = repWeek(o, k, rng);
      forecast += x.forecast;
      if (x.cRecs.length || x.bRecs.length || x.r.locked) { slots++; if (x.r.locked) locked++; }
    });
  });

  const deals = live('deals').filter(d => ids.has(String(d.ownerId)));
  const openD = deals.filter(isOpen);
  const won  = deals.filter(d => isWon(d)  && inPeriod(d.closeDate, mb));
  const lost = deals.filter(d => isLost(d) && inPeriod(d.closeDate, mb));
  const units = {};
  unitLines().forEach(L => { const n = unitTotal(cRecs, L) + unitTotal(bRecs, L); if (n) units[L] = n; });

  return { region, owners, cRecs, bRecs,
    commit: sum(cRecs, commitValue), best: sum(bRecs, commitValue), forecast,
    pipeline: sum(openD, d => d.amount), weightedPipe: sum(openD, weighted), openN: openD.length,
    closed: sum(won, d => d.amount), wonN: won.length,
    lostVal: sum(lost, d => d.amount), lostN: lost.length,
    quotes: deals.filter(d => isOpen(d) && attachmentsFor(d.id).length && inPeriod(d.closeDate, mb)).length,
    units, locked, slots,
    target: regionTarget(owners, region, mb) };
}
/* Per-person targets add up cleanly. A team override does not belong to
   anyone, so for the combined row it is used whole, and for a single region
   it is apportioned by headcount — the only split the data supports, and the
   table says so underneath rather than passing it off as someone's quota. */
function regionTarget(owners, region, mb) {
  const own = sum(owners, o => repTarget(o.id, mb));
  if (own) return own;
  const team = teamTargetInfo(Object.assign({}, mb, { grain: 'month' }));
  if (!team.value) return 0;
  if (region === 'all') return team.value;
  const heads = activeOwners().length;
  return heads ? team.value * owners.length / heads : 0;
}
const usingTeamSplit = mb => !sum(activeOwners(), o => repTarget(o.id, mb)) &&
  !!teamTargetInfo(Object.assign({}, mb, { grain: 'month' })).value;

function viewMonthly(root) {
  const mk = VIEW.month || monthKey();
  VIEW.month = mk;
  const mb = mBounds(mk + '-01');
  const weeks = weeksOfMonth(mk);
  const sel = VIEW.monthWeek && weeks.includes(VIEW.monthWeek) ? VIEW.monthWeek : null;
  const scope = sel ? [sel] : weeks;

  root.appendChild(viewHead(null, [
    el('div', { class: 'seg' }, [
      el('button', { html: '‹', title: 'Previous month',
        onclick: () => { VIEW.month = monthShift(mk, -1); VIEW.monthWeek = null; render(); } }),
      el('button', { class: 'on', text: monthLongLabel(mk) }),
      el('button', { html: '›', title: 'Next month',
        onclick: () => { VIEW.month = monthShift(mk, 1); VIEW.monthWeek = null; render(); } })
    ]),
    mk !== monthKey() ? el('button', { class: 'btn', text: 'This month',
      onclick: () => { VIEW.month = monthKey(); VIEW.monthWeek = null; render(); } }) : null,
    el('button', { class: 'btn', html: ico('dl',14) + ' Export month', onclick: () => exportMonthly(mk) }),
    isReadOnly() ? null : el('button', { class: 'btn primary', html: ico('flag',14) + ' Commit deals',
      onclick: () => addCommitment(sel || weekKey()) })
  ]));

  const regions = regionsInPlay();
  const rolls = regions.map(r => regionRoll(r, scope, mb));
  const all = regionRoll('all', scope, mb);

  /* ---- headline: one strip, not six cards stretched across the screen */
  const scopeLabel = sel ? `${weekOfMonthLabel(mk, sel)} · ${weekLabel(sel)}` : monthLabel(mk);
  const strip = el('div', { class: 'strip' });
  const stat = (label, icon, value, foot, o) => {
    o = o || {};
    const n = el('div', { class: 's' + (o.onclick ? ' click' : '') });
    n.appendChild(el('div', { class: 'l', html: ico(icon, 12) + esc(label) }));
    n.appendChild(el('div', { class: 'v mono', title: (o.cur ? CFG.currency + ' ' : '') + value,
      html: (o.cur ? `<span class="cur">${CFG.currency}</span>` : '') + `<span class="num">${esc(value)}</span>` }));
    if (o.meter != null) {
      const p = Math.max(0, Math.min(100, o.meter));
      n.appendChild(el('div', { class: 'bar', html: `<i style="width:${p}%"></i>` }));
    }
    n.appendChild(el('div', { class: 'f', html: foot }));
    if (o.onclick) { n.addEventListener('click', o.onclick); n.setAttribute('role', 'button'); n.tabIndex = 0; }
    strip.appendChild(n);
    return n;
  };
  stat('Commit', 'flag', money(all.commit, { dash: false }),
    `${all.cRecs.length} deal${all.cRecs.length === 1 ? '' : 's'} · ${esc(scopeLabel)}`, { cur: true });
  stat('Best case', 'up', money(all.best, { dash: false }),
    `${all.bRecs.length} deal${all.bRecs.length === 1 ? '' : 's'} that could land`, { cur: true });
  stat('Weighted forecast', 'chart', money(all.forecast, { dash: false }),
    '(commit + best case) × stage weight', { cur: true });
  stat('Closed won', 'check', money(all.closed, { dash: false }),
    all.target ? `${pct(all.closed, all.target)}% of ${CFG.currency} ${money(all.target, { compact: true })} target`
               : `${all.wonN} deal${all.wonN === 1 ? '' : 's'} in ${esc(monthLabel(mk))}`,
    { cur: true, meter: all.target ? pct(all.closed, all.target) : null });
  if (unitLines().length) {
    const us = unitLines().filter(L => all.units[L]);
    stat('Devices', 'board', us.length ? String(us.reduce((a, L) => a + all.units[L], 0)) : '0',
      us.length ? us.map(L => `${all.units[L]} ${esc(L)}`).join(' · ') : 'none counted yet');
  }
  stat('Open pipeline', 'grid', money(all.pipeline, { dash: false }),
    all.target ? `${(all.pipeline / all.target).toFixed(1)}× coverage of target`
               : `${all.openN} open deals`,
    { cur: true, onclick: () => go('pipeline') });
  /* the grid needs to know how many made it in — devices only shows when
     device lines are configured */
  strip.classList.add('n' + strip.children.length);
  root.appendChild(strip);

  /* ---- the weeks of the month. A month where one week is committed and four
     are empty made a single enormous bar and four empty gutters, so the weeks
     are cards instead: they carry their own figures, they read the same whether
     the month is full or untouched, and they are the week picker as well. */
  const wkRolls = weeks.map(k => ({ k, r: regionRoll('all', [k], mb) }));
  const peak = Math.max(1, ...wkRolls.map(w => w.r.forecast));
  const wc = card('The weeks of ' + monthLabel(mk),
    sel ? `Showing ${weekOfMonthLabel(mk, sel)} only — pick the whole month to widen it again`
        : 'Pick a week to narrow everything below to it');
  const rail = el('div', { class: 'weekrail' });
  const nowWk = weekKey();
  rail.appendChild(el('button', {
    class: 'wkcard' + (sel ? '' : ' on'),
    title: 'Every week of ' + monthLabel(mk),
    onclick: () => { VIEW.monthWeek = null; render(); } }, [
    el('div', { class: 'w', text: 'Whole month' }),
    el('div', { class: 'd', text: `${fdate(mb.from)} – ${fdate(mb.to)}` }),
    el('div', { class: 'n' + (all.forecast ? '' : ' zero'), text: money(all.forecast, { compact: true }) }),
    el('div', { class: 'bar', html: '<i style="width:100%"></i>' }),
    el('div', { class: 'm', html: `<span>${weeks.length} weeks</span>` +
      (all.slots ? `<span>· ${all.locked}/${all.slots} in</span>` : '') })
  ]));
  wkRolls.forEach(({ k, r }) => {
    rail.appendChild(el('button', {
      class: 'wkcard' + (sel === k ? ' on' : '') + (k === nowWk ? ' now' : ''),
      title: `${weekOfMonthLabel(mk, k)} · ${weekLabel(k)}`,
