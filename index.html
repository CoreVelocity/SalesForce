<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CoreV CRM</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2309193A'/%3E%3Cpath d='M9 21V11h4.6a3.4 3.4 0 010 6.8H12l4 3.2' stroke='%235294FF' stroke-width='2.4' fill='none' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
/* ============================================================
   CoreV CRM — design tokens
   Brand: Navy #09193A · Electric Blue #5294FF · Hyper Blue #1D0FD3
          Coral #F04E23 · Light Blue #82D3FF · Pearl #EAEAE8
   Chart series palette validated (dataviz six checks) against
   light surface #F7F8FA and dark surface #0F2149 — all pass.
   ============================================================ */
:root{
  --brand-navy:#09193A; --brand-eblue:#5294FF; --brand-hblue:#1D0FD3;
  --brand-coral:#F04E23; --brand-lblue:#82D3FF; --brand-pearl:#EAEAE8;

  --r-sm:6px; --r-md:10px; --r-lg:14px; --r-xl:20px;
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:24px; --sp-6:32px; --sp-7:48px;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --fs-xs:11px; --fs-sm:12px; --fs-md:13px; --fs-lg:15px; --fs-xl:19px; --fs-2xl:26px; --fs-3xl:34px;
  --sidebar-w:222px; --topbar-h:56px;
  --shadow-1:0 1px 2px rgba(0,0,0,.18);
  --shadow-2:0 6px 20px rgba(0,0,0,.22);
  --shadow-3:0 18px 48px rgba(0,0,0,.34);
  --ease:cubic-bezier(.22,.61,.36,1);
}
/* ---- dark (default) ---- */
:root[data-theme="dark"]{
  color-scheme:dark;
  --page:#081228; --surface-1:#0F2149; --surface-2:#142A58; --surface-3:#1B3568;
  --raised:#16305F;
  --ink-1:#F3F6FC; --ink-2:#AFC0DE; --ink-3:#7D91B4;
  --line:#22406F; --line-soft:#1A3360; --baseline:#2C4E80;
  --accent:var(--brand-eblue); --accent-ink:#06122B; --accent-soft:rgba(82,148,255,.16);
  --focus:#82D3FF;
  --good:#0ca30c; --warning:#fab219; --serious:#ec835a; --critical:#d03b3b;
  --good-ink:#3ddc6f; --critical-ink:#ff8a8a;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
  --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  --seq-1:#0d366b; --seq-2:#184f95; --seq-3:#256abf; --seq-4:#3987e5; --seq-5:#6da7ec; --seq-6:#9ec5f4;
  --grid:#1E3A66; --overlay:rgba(3,8,20,.66);
}
/* ---- light ---- */
:root[data-theme="light"]{
  color-scheme:light;
  --page:#F1F3F7; --surface-1:#F7F8FA; --surface-2:#FFFFFF; --surface-3:#EDF1F8;
  --raised:#FFFFFF;
  --ink-1:#0B1220; --ink-2:#48566E; --ink-3:#77869E;
  --line:#DCE2EC; --line-soft:#E8ECF3; --baseline:#C3CBD9;
  --accent:#1D5FD6; --accent-ink:#FFFFFF; --accent-soft:rgba(29,95,214,.10);
  --focus:#1D5FD6;
  --good:#0ca30c; --warning:#fab219; --serious:#ec835a; --critical:#d03b3b;
  --good-ink:#006300; --critical-ink:#b52626;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100;
  --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7; --s8:#e34948;
  --seq-1:#0d366b; --seq-2:#184f95; --seq-3:#256abf; --seq-4:#3987e5; --seq-5:#6da7ec; --seq-6:#9ec5f4;
  --grid:#E4E9F1; --overlay:rgba(11,18,32,.42);
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; font-family:var(--font); font-size:var(--fs-md); color:var(--ink-1);
  background:var(--page); -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus); outline-offset:2px; border-radius:var(--r-sm)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px;border:2px solid var(--page)}
::-webkit-scrollbar-thumb:hover{background:var(--baseline)}
.mono{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* ============================ gate ============================ */
#gate{
  position:fixed;inset:0;z-index:900;display:grid;place-items:center;
  background:radial-gradient(1100px 600px at 20% -10%, #14306B 0%, transparent 60%), var(--brand-navy);
  padding:var(--sp-5);
}
#gate .card{
  width:min(420px,100%); background:var(--surface-1); border:1px solid var(--line);
  border-radius:var(--r-xl); padding:var(--sp-6); box-shadow:var(--shadow-3); text-align:center;
}
#gate h1{margin:var(--sp-4) 0 var(--sp-2); font-size:var(--fs-xl); letter-spacing:-.01em}
#gate p{margin:0 0 var(--sp-5); color:var(--ink-2); font-size:var(--fs-md); line-height:1.55}
#gate .mark{width:56px;height:56px;margin:0 auto}
#gate .err{
  margin-top:var(--sp-4); padding:var(--sp-3); border-radius:var(--r-md);
  background:rgba(208,59,59,.12); border:1px solid rgba(208,59,59,.35);
  color:var(--critical-ink); font-size:var(--fs-sm); text-align:left; display:none; line-height:1.5;
}
#gate .alt{margin-top:var(--sp-4);font-size:var(--fs-sm);color:var(--ink-3)}
#gate .alt button{background:none;border:0;color:var(--accent);cursor:pointer;text-decoration:underline;padding:0}
#gate .ver{margin-top:var(--sp-5);padding-top:var(--sp-3);border-top:1px solid var(--line-soft);
  font-size:var(--fs-xs);color:var(--ink-3);letter-spacing:.04em;font-variant-numeric:tabular-nums}

/* ============================ shell ============================ */
#app{display:none;min-height:100vh}
#app.on{display:grid;grid-template-columns:var(--sidebar-w) 1fr;grid-template-rows:var(--topbar-h) 1fr;
  grid-template-areas:"brand topbar" "nav main"}

.brand{grid-area:brand;display:flex;align-items:center;gap:var(--sp-3);padding:0 var(--sp-4);
  background:var(--brand-navy);border-bottom:1px solid var(--line);border-right:1px solid var(--line)}
.brand svg{flex:none}
.brand b{font-size:var(--fs-lg);letter-spacing:-.02em;color:#fff}
.brand span{font-size:var(--fs-xs);color:var(--brand-lblue);letter-spacing:.09em;text-transform:uppercase;
  display:block;margin-top:-2px;font-weight:600}

nav.side{grid-area:nav;background:var(--surface-1);border-right:1px solid var(--line);
  padding:var(--sp-3) var(--sp-2);overflow-y:auto;display:flex;flex-direction:column;gap:2px}
nav.side .grp{font-size:var(--fs-xs);text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);
  padding:var(--sp-4) var(--sp-3) var(--sp-2);font-weight:700}
nav.side a{display:flex;align-items:center;gap:var(--sp-3);padding:8px var(--sp-3);border-radius:var(--r-md);
  color:var(--ink-2);text-decoration:none;font-weight:500;cursor:pointer;transition:background .12s,color .12s}
nav.side a svg{flex:none;opacity:.85}
nav.side a:hover{background:var(--surface-2);color:var(--ink-1)}
nav.side a.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
nav.side a.on svg{opacity:1}
nav.side a .pill{margin-left:auto;font-size:var(--fs-xs);background:var(--surface-3);color:var(--ink-2);
  padding:1px 7px;border-radius:99px;font-weight:600;font-variant-numeric:tabular-nums}
nav.side a.on .pill{background:var(--accent);color:var(--accent-ink)}
nav.side a .pill.alert{background:var(--critical);color:#fff}
.mobile-only{display:none}
@media (max-width:900px){.mobile-only{display:block}}
.side-foot{margin-top:auto;padding:var(--sp-3);border-top:1px solid var(--line-soft);font-size:var(--fs-xs);color:var(--ink-3)}
.side-foot .row{display:flex;align-items:center;gap:6px;margin-top:6px}
.dot{width:7px;height:7px;border-radius:99px;background:var(--ink-3);flex:none}
.dot.ok{background:var(--good)}.dot.warn{background:var(--warning)}.dot.err{background:var(--critical)}

header.top{grid-area:topbar;display:flex;align-items:center;gap:var(--sp-3);padding:0 var(--sp-4);
  background:var(--surface-1);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:40}
header.top h2{margin:0;font-size:var(--fs-lg);font-weight:650;letter-spacing:-.01em;white-space:nowrap}
.top-sp{flex:1}
.search{position:relative;flex:0 1 320px;min-width:150px}
.search input{width:100%;padding:7px var(--sp-3) 7px 32px;border-radius:var(--r-md);
  border:1px solid var(--line);background:var(--surface-2);color:var(--ink-1)}
.search svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);opacity:.5;pointer-events:none}
.search-res{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--raised);
  border:1px solid var(--line);border-radius:var(--r-md);box-shadow:var(--shadow-3);max-height:60vh;
  overflow-y:auto;display:none;z-index:60}
.search-res.on{display:block}
.search-res .sec{font-size:var(--fs-xs);text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);
  padding:var(--sp-3) var(--sp-3) var(--sp-1);font-weight:700}
.search-res button{display:flex;width:100%;text-align:left;gap:var(--sp-2);align-items:center;
  padding:7px var(--sp-3);background:none;border:0;cursor:pointer;color:var(--ink-1)}
.search-res button:hover,.search-res button.cur{background:var(--accent-soft)}
.search-res .sub{color:var(--ink-3);font-size:var(--fs-sm);margin-left:auto;white-space:nowrap}

main{grid-area:main;overflow-y:auto;padding:var(--sp-5);min-width:0}
@media (max-width:900px){
  #app.on{grid-template-columns:minmax(0,1fr);grid-template-areas:"brand" "topbar" "main"}
  nav.side{position:fixed;top:0;left:0;bottom:0;width:250px;z-index:120;transform:translateX(-100%);
    transition:transform .2s var(--ease);box-shadow:var(--shadow-3)}
  nav.side.open{transform:none}
  .brand{border-right:0;min-width:0;overflow:hidden}
  main{padding:var(--sp-4) var(--sp-3);min-width:0}
  .hamb{display:grid !important}
  header.top{min-width:0;overflow:hidden;padding:0 var(--sp-3);gap:var(--sp-2)}
  header.top h2{display:none}
  .top-sp{display:none}
  .search{flex:1 1 0;min-width:0}
  #repfilter{max-width:112px;min-width:0;padding-left:6px;padding-right:2px}
  #newbtn span,#newbtn{gap:4px}
  #themebtn{display:none}
}
@media (max-width:480px){
  .search{flex:1 1 0}
  #repfilter{display:none}
}
.hamb{display:none;place-items:center;width:34px;height:34px;border-radius:var(--r-md);
  background:var(--surface-2);border:1px solid var(--line);cursor:pointer}

/* ============================ primitives ============================ */
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:var(--r-md);
  border:1px solid var(--line);background:var(--surface-2);color:var(--ink-1);cursor:pointer;
  font-weight:550;white-space:nowrap;transition:background .12s,border-color .12s,transform .06s}
.btn:hover{background:var(--surface-3)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:650}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--critical-ink);border-color:rgba(208,59,59,.4)}
.btn.danger:hover{background:rgba(208,59,59,.12)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{padding:4px 9px;font-size:var(--fs-sm)}
.btn.icon{padding:6px;width:30px;height:30px;justify-content:center}
.btn[disabled]{opacity:.45;cursor:not-allowed}

.seg{display:inline-flex;background:var(--surface-3);border-radius:var(--r-md);padding:2px;border:1px solid var(--line-soft)}
.seg button{padding:5px 11px;border:0;background:none;border-radius:calc(var(--r-md) - 2px);cursor:pointer;
  color:var(--ink-2);font-weight:550;font-size:var(--fs-sm)}
.seg button.on{background:var(--surface-1);color:var(--ink-1);box-shadow:var(--shadow-1);font-weight:650}

select.inp,input.inp,textarea.inp{width:100%;padding:7px 10px;border-radius:var(--r-md);
  border:1px solid var(--line);background:var(--surface-2);color:var(--ink-1)}
textarea.inp{resize:vertical;min-height:72px;line-height:1.55}
label.fl{display:block;font-size:var(--fs-xs);text-transform:uppercase;letter-spacing:.06em;
  color:var(--ink-3);font-weight:700;margin-bottom:5px}
.field{margin-bottom:var(--sp-4)}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-3)}
@media (max-width:620px){.field-row{grid-template-columns:1fr}}

.card{background:var(--surface-1);border:1px solid var(--line);border-radius:var(--r-lg);padding:var(--sp-4)}
.card>h3{margin:0 0 var(--sp-1);font-size:var(--fs-md);font-weight:650}
.card .sub{color:var(--ink-3);font-size:var(--fs-sm);margin:0 0 var(--sp-4)}
.card-head{display:flex;align-items:center;gap:var(--sp-3);margin-bottom:var(--sp-4)}
.card-head h3{margin:0;font-size:var(--fs-md);font-weight:650}
.card-head .sp{flex:1}

.tag{display:inline-block;padding:2px 8px;border-radius:99px;
  font-size:var(--fs-xs);font-weight:650;background:var(--surface-3);color:var(--ink-2);
  white-space:nowrap;vertical-align:middle}
.tag.good{background:rgba(12,163,12,.14);color:var(--good-ink)}
.tag.bad{background:rgba(208,59,59,.14);color:var(--critical-ink)}
.tag.warn{background:rgba(250,178,25,.16);color:var(--warning)}
.tag.info{background:var(--accent-soft);color:var(--accent)}
.tag.sw::before{content:"";display:inline-block;vertical-align:middle;position:relative;top:-1px;
  width:8px;height:8px;border-radius:2px;margin-right:5px;background:var(--sw,var(--ink-3))}

.avatar{width:26px;height:26px;border-radius:99px;display:grid;place-items:center;flex:none;
  font-size:10px;font-weight:800;letter-spacing:.02em;color:#fff;background:var(--s1)}
.avatar.lg{width:38px;height:38px;font-size:13px}
.logo{display:inline-grid;place-items:center;flex:none;border-radius:var(--r-sm);overflow:hidden;
  background:var(--surface-2);border:1px solid var(--line)}
.logo img{width:100%;height:100%;object-fit:contain;background:#fff}

.empty{text-align:center;padding:var(--sp-7) var(--sp-4);color:var(--ink-3)}
.empty svg{opacity:.35;margin-bottom:var(--sp-3)}
.empty h4{margin:0 0 var(--sp-2);color:var(--ink-2);font-size:var(--fs-lg);font-weight:600}
.empty p{margin:0 auto var(--sp-4);max-width:42ch;line-height:1.6;font-size:var(--fs-md)}

/* ============================ table ============================ */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface-1)}
table.dt{width:100%;border-collapse:separate;border-spacing:0;font-size:var(--fs-md)}
table.dt th{position:sticky;top:0;z-index:2;background:var(--surface-3);text-align:left;font-weight:650;
  font-size:var(--fs-xs);text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);
  padding:9px var(--sp-3);white-space:nowrap;border-bottom:1px solid var(--line)}
table.dt th.sortable{cursor:pointer;user-select:none}
table.dt th.sortable:hover{color:var(--ink-1)}
table.dt th .ind{opacity:.4;margin-left:3px}
table.dt th.sorted .ind{opacity:1;color:var(--accent)}
table.dt td{padding:9px var(--sp-3);border-bottom:1px solid var(--line-soft);vertical-align:middle}
table.dt tbody tr{cursor:pointer}
table.dt tbody tr:hover td{background:var(--surface-2)}
table.dt tbody tr:last-child td{border-bottom:0}
table.dt td.num,table.dt th.num{text-align:right;font-variant-numeric:tabular-nums}
.cellmain{font-weight:600;color:var(--ink-1)}
.cellsub{font-size:var(--fs-sm);color:var(--ink-3)}
.tfoot{display:flex;align-items:center;gap:var(--sp-3);padding:var(--sp-3);color:var(--ink-3);font-size:var(--fs-sm);flex-wrap:wrap}

/* ============================ kanban ============================ */
.kan{display:flex;gap:var(--sp-3);overflow-x:auto;padding-bottom:var(--sp-4);align-items:flex-start}
.kcol{flex:0 0 272px;min-width:0;background:var(--surface-1);border:1px solid var(--line);border-radius:var(--r-lg);
  display:flex;flex-direction:column;max-height:calc(100vh - 230px)}
.kcol.drop{border-color:var(--accent);background:var(--accent-soft)}
.kcol>header{padding:var(--sp-3);border-bottom:1px solid var(--line);position:sticky;top:0;
  background:var(--surface-1);border-radius:var(--r-lg) var(--r-lg) 0 0;z-index:1}
.kcol .kt{display:flex;align-items:center;gap:6px;font-weight:650;font-size:var(--fs-md)}
.kcol .kt .bar{width:4px;height:15px;border-radius:2px;background:var(--stage,var(--s1));flex:none}
.kcol .kt .n{margin-left:auto;font-size:var(--fs-xs);color:var(--ink-3);font-weight:700;
  background:var(--surface-3);padding:1px 7px;border-radius:99px;font-variant-numeric:tabular-nums}
.kcol .kv{font-size:var(--fs-sm);color:var(--ink-2);margin-top:4px;font-variant-numeric:tabular-nums}
.kcol .kv em{color:var(--ink-3);font-style:normal}
.kcol .ktot{margin-top:7px;display:flex;flex-direction:column;gap:3px}
.kcol .ktot .r{display:flex;align-items:baseline;gap:8px;font-size:var(--fs-sm);line-height:1.25}
.kcol .ktot .r em{font-style:normal;font-size:var(--fs-xs);text-transform:uppercase;letter-spacing:.05em;
  color:var(--ink-3);font-weight:700;flex:none}
.kcol .ktot .r b{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--ink-1);font-weight:650;white-space:nowrap}
.kcol .ktot .r b.fc{color:var(--accent)}
.kmin{margin-left:6px;background:none;border:0;color:var(--ink-3);cursor:pointer;padding:2px;
  border-radius:var(--r-sm);flex:none;line-height:0}
.kmin:hover{background:var(--surface-3);color:var(--ink-1)}
/* a minimised stage: a narrow strip that still carries its count and value */
.kcol.min{flex:0 0 54px;max-height:none;cursor:pointer}
.kcol.min>header{border-bottom:0;border-radius:var(--r-lg);padding:var(--sp-3) 0;height:100%}
.kcol.min .klist,.kcol.min .ktot,.kcol.min .kmin{display:none}
.kcol.min .kt{flex-direction:column;gap:10px;align-items:center;height:100%}
.kcol.min .kt .bar{width:22px;height:4px}
.kcol.min .kt .lbl{writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;max-height:210px;font-size:var(--fs-sm);font-weight:650}
.kcol.min .kt .n{margin:0}
.kcol.min .kmv{writing-mode:vertical-rl;transform:rotate(180deg);font-size:var(--fs-xs);
  color:var(--ink-3);font-variant-numeric:tabular-nums;white-space:nowrap}
.kcol:not(.min) .kmv{display:none}
.kcol.min:hover{border-color:var(--accent)}
.klist{padding:var(--sp-2);overflow-y:auto;display:flex;flex-direction:column;gap:var(--sp-2);flex:1;min-height:70px;min-width:0}
.kcard>*{min-width:0}
.kcard{background:var(--surface-2);border:1px solid var(--line);border-left:3px solid var(--stage,var(--s1));
  border-radius:var(--r-md);padding:9px 10px;cursor:grab;transition:box-shadow .12s,transform .06s}
.kcard:hover{box-shadow:var(--shadow-2)}
.kcard.drag{opacity:.4}
.kcard .n{font-weight:600;line-height:1.35;margin-bottom:5px;display:block;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kcard .m{display:flex;align-items:center;gap:6px;font-size:var(--fs-sm);color:var(--ink-3);flex-wrap:wrap}
.kcard .amt{font-weight:700;color:var(--ink-1);font-variant-numeric:tabular-nums}
.kcard .co{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.kcard .due{margin-left:auto;font-variant-numeric:tabular-nums}
.kcard .due.late{color:var(--critical-ink);font-weight:650}
.kcard .due.soon{color:var(--warning);font-weight:650}

/* ============================ stat tiles ============================ */
.tiles{display:grid;gap:var(--sp-3);grid-template-columns:repeat(auto-fit,minmax(178px,1fr));margin-bottom:var(--sp-4)}
.tile{background:var(--surface-1);border:1px solid var(--line);border-radius:var(--r-lg);padding:var(--sp-4)}
.tile .lbl{font-size:var(--fs-xs);text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);
  font-weight:700;margin-bottom:6px;display:flex;align-items:center;gap:5px}
.tile .val{font-size:var(--fs-2xl);font-weight:700;letter-spacing:-.02em;line-height:1.1}
.tile .val .cur{font-size:var(--fs-md);color:var(--ink-3);font-weight:600;margin-right:3px}
.tile .foot{margin-top:7px;font-size:var(--fs-sm);color:var(--ink-3);display:flex;align-items:center;gap:6px}
.tile .delta{font-weight:650;display:inline-flex;align-items:center;gap:3px}
.tile .delta.up{color:var(--good-ink)}.tile .delta.down{color:var(--critical-ink)}
.meter{height:6px;border-radius:99px;background:var(--surface-3);overflow:hidden;margin-top:9px}
.meter i{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .4s var(--ease)}
.meter i.good{background:var(--good)}.meter i.warn{background:var(--warning)}.meter i.bad{background:var(--critical)}

/* ============================ charts ============================ */
.chart{position:relative}
.chart svg{display:block;width:100%;overflow:visible}
.chart .gl{stroke:var(--grid);stroke-width:1}
.chart .bl{stroke:var(--baseline);stroke-width:1}
.chart text{fill:var(--ink-3);font-size:10.5px;font-family:var(--font)}
.chart text.vlab{fill:var(--ink-2);font-size:10.5px;font-weight:650;font-variant-numeric:tabular-nums}
.chart text.alab{fill:var(--ink-2);font-size:11px}
.chart .hit{fill:transparent;cursor:pointer}
.chart .mk{transition:opacity .12s}
.chart.dim .mk{opacity:.35}
.chart.dim .mk.hi{opacity:1}
.legend{display:flex;flex-wrap:wrap;gap:var(--sp-2) var(--sp-4);margin-top:var(--sp-3);font-size:var(--fs-sm)}
.legend span{display:inline-flex;align-items:center;gap:6px;color:var(--ink-2);cursor:default}
.legend i{width:9px;height:9px;border-radius:2px;flex:none}
.tip{position:fixed;z-index:400;pointer-events:none;background:var(--raised);border:1px solid var(--line);
  border-radius:var(--r-md);box-shadow:var(--shadow-3);padding:8px 10px;font-size:var(--fs-sm);
  min-width:118px;opacity:0;transition:opacity .1s}
.tip.on{opacity:1}
.tip b{display:block;margin-bottom:4px;font-size:var(--fs-md)}
.tip .r{display:flex;align-items:center;gap:6px;justify-content:space-between;color:var(--ink-2);margin-top:2px}
.tip .r i{width:8px;height:8px;border-radius:2px;flex:none;margin-right:2px}
.tip .r b{display:inline;margin:0;color:var(--ink-1);font-variant-numeric:tabular-nums}
.chart-tbl{display:none;margin-top:var(--sp-3)}
.chart-tbl.on{display:block}
.chart-tbl table{width:100%;border-collapse:collapse;font-size:var(--fs-sm)}
.chart-tbl th,.chart-tbl td{padding:5px 8px;border-bottom:1px solid var(--line-soft);text-align:left}
.chart-tbl td.num,.chart-tbl th.num{text-align:right;font-variant-numeric:tabular-nums}
.chart-tbl th{color:var(--ink-3);font-size:var(--fs-xs);text-transform:uppercase;letter-spacing:.05em}

.grid2{display:grid;gap:var(--sp-3);grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.grid3{display:grid;gap:var(--sp-3);grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.span2{grid-column:span 2}
@media (max-width:760px){.span2{grid-column:span 1}}

/* ============================ drawer / modal ============================ */
.scrim{position:fixed;inset:0;background:var(--overlay);z-index:200;opacity:0;pointer-events:none;
  transition:opacity .18s;backdrop-filter:blur(2px)}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(720px,100%);background:var(--page);z-index:210;
  transform:translateX(100%);transition:transform .24s var(--ease);display:flex;flex-direction:column;
  box-shadow:var(--shadow-3)}
.drawer.on{transform:none}
.drawer>header{display:flex;align-items:flex-start;gap:var(--sp-3);padding:var(--sp-4);
  border-bottom:1px solid var(--line);background:var(--surface-1)}
.drawer>header h3{margin:0 0 6px;font-size:var(--fs-xl);letter-spacing:-.015em;line-height:1.25}
.drawer>header .meta{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;
  color:var(--ink-3);font-size:var(--fs-sm);min-width:0}
/* every meta item keeps its own width — a shrinking flex item was letting the
   stage chip collapse to 36px and the value text land on top of it */
.drawer>header .meta>*{flex:0 0 auto}
.mfact{display:inline-flex;align-items:baseline;gap:5px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;text-decoration:none}
.mfact em{font-style:normal;font-size:var(--fs-xs);text-transform:uppercase;letter-spacing:.06em;
  color:var(--ink-3);font-weight:700}
.mfact b{color:var(--ink-1);font-weight:650;overflow:hidden;text-overflow:ellipsis}
.mfact.num b{font-variant-numeric:tabular-nums}
a.mfact b{color:var(--accent)}
a.mfact:hover b{text-decoration:underline}
.drawer .body{flex:1;overflow-y:auto;padding:var(--sp-4)}
.drawer .foot{padding:var(--sp-3) var(--sp-4);border-top:1px solid var(--line);background:var(--surface-1);
  display:flex;gap:var(--sp-2);flex-wrap:wrap;align-items:center}
.tabs{display:flex;gap:2px;padding:0 var(--sp-4);background:var(--surface-1);border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{padding:9px var(--sp-3);background:none;border:0;border-bottom:2px solid transparent;
  color:var(--ink-3);cursor:pointer;font-weight:600;white-space:nowrap}
.tabs button:hover{color:var(--ink-1)}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}

.modal{position:fixed;z-index:310;top:50%;left:50%;transform:translate(-50%,-48%) scale(.98);
  width:min(600px,calc(100vw - 32px));max-height:88vh;background:var(--page);border:1px solid var(--line);
  border-radius:var(--r-xl);box-shadow:var(--shadow-3);display:flex;flex-direction:column;
  opacity:0;pointer-events:none;transition:opacity .16s,transform .16s var(--ease)}
.modal.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
.modal>header{padding:var(--sp-4);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:var(--sp-3)}
.modal>header h3{margin:0;font-size:var(--fs-lg)}
.modal .body{padding:var(--sp-4);overflow-y:auto}
.modal .foot{padding:var(--sp-3) var(--sp-4);border-top:1px solid var(--line);display:flex;gap:var(--sp-2);justify-content:flex-end}
.modal.wide{width:min(880px,calc(100vw - 32px))}

/* stage stepper */
.stepper{display:flex;gap:3px;margin:var(--sp-4) 0;flex-wrap:wrap}
.stepper button{flex:1 1 84px;min-width:78px;padding:7px 6px;border:1px solid var(--line);background:var(--surface-2);
  color:var(--ink-3);cursor:pointer;font-size:var(--fs-xs);font-weight:650;border-radius:var(--r-sm);
  text-align:center;line-height:1.3;transition:background .12s}
.stepper button:hover{background:var(--surface-3);color:var(--ink-1)}
.stepper button.done{background:var(--seq-3);border-color:var(--seq-3);color:#fff}
.stepper button.cur{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:var(--shadow-2)}
.stepper button.won{background:var(--good);border-color:var(--good);color:#fff}
.stepper button.lost{background:var(--critical);border-color:var(--critical);color:#fff}

/* attention banner */
.alert{display:flex;align-items:flex-start;gap:var(--sp-3);padding:var(--sp-3) var(--sp-4);
  border:1px solid rgba(250,178,25,.42);background:rgba(250,178,25,.10);
  border-left:3px solid var(--warning);border-radius:var(--r-lg);margin-bottom:var(--sp-4)}
.alert .ic{color:var(--warning);flex:none;margin-top:1px}
.alert .btn{flex:none;align-self:center}
@media (max-width:620px){.alert{flex-wrap:wrap}.alert .btn{width:100%;justify-content:center}}
/* overdue queue row */
.oq{display:flex;align-items:center;gap:var(--sp-3);flex-wrap:wrap;padding:10px var(--sp-3);
  border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface-1);margin-bottom:var(--sp-2)}

/* inline-edit field grid inside a drawer card */
.efields{display:grid;gap:var(--sp-3);grid-template-columns:repeat(auto-fit,minmax(196px,1fr))}
.efield{min-width:0}
.efield.wide{grid-column:1/-1}
.efield .fl{margin-bottom:5px}
.efield select.inp,.efield input.inp{width:100%}
.efield select.inp:focus,.efield input.inp:focus{border-color:var(--accent)}

/* multi-select chips */
.multi{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.multi .chip{display:inline-flex;align-items:center;gap:6px;padding:3px 6px 3px 3px;border-radius:99px;
  background:var(--surface-3);border:1px solid var(--line);font-size:var(--fs-sm);font-weight:550}
.multi .chip button{background:none;border:0;color:var(--ink-3);cursor:pointer;padding:0 2px;line-height:0}
.multi .chip button:hover{color:var(--critical-ink)}

/* line items */
.li{display:grid;grid-template-columns:1fr 70px 108px 74px 104px 30px;gap:8px;align-items:center;
  padding:8px var(--sp-2);border-bottom:1px solid var(--line-soft)}
.li:last-of-type{border-bottom:0}
.li .nm b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .nm span{font-size:var(--fs-xs);color:var(--ink-3)}
.li input{width:100%;padding:5px 7px;text-align:right;border-radius:var(--r-sm);
  border:1px solid var(--line);background:var(--surface-2);color:var(--ink-1);font-variant-numeric:tabular-nums}
.li .tot{text-align:right;font-weight:650;font-variant-numeric:tabular-nums}
.li-head{display:grid;grid-template-columns:1fr 70px 108px 74px 104px 30px;gap:8px;
  padding:0 var(--sp-2) 6px;font-size:var(--fs-xs);text-transform:uppercase;letter-spacing:.05em;
  color:var(--ink-3);font-weight:700}
.li-head span:not(:first-child){text-align:right}
@media (max-width:700px){
  .li,.li-head{grid-template-columns:1fr 56px 92px 60px 88px 28px;gap:5px;font-size:var(--fs-sm)}
}
.est{display:grid;gap:var(--sp-2);grid-template-columns:repeat(auto-fit,minmax(130px,1fr));margin-top:var(--sp-3)}
.est .b{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-md);padding:10px 12px}
.est .b em{font-style:normal;display:block;font-size:var(--fs-xs);text-transform:uppercase;
  letter-spacing:.06em;color:var(--ink-3);font-weight:700;margin-bottom:4px}
.est .b b{font-size:var(--fs-lg);font-variant-numeric:tabular-nums}
.est .b.total{background:var(--accent-soft);border-color:var(--accent)}
.est .b.total b{color:var(--accent)}

/* contact staging board */
.cboard{display:flex;gap:var(--sp-3);overflow-x:auto;padding-bottom:var(--sp-4);align-items:flex-start}
.ccol{flex:0 0 268px;min-width:0;background:var(--surface-1);border:1px solid var(--line);
  border-radius:var(--r-lg);display:flex;flex-direction:column;max-height:calc(100vh - 330px)}
.ccol.drop{border-color:var(--accent);background:var(--accent-soft)}
.ccol>header{padding:var(--sp-3);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:1;
  background:var(--surface-1);border-radius:var(--r-lg) var(--r-lg) 0 0}
.ccol .ct{display:flex;align-items:center;gap:6px;font-weight:650;font-size:var(--fs-md)}
.ccol .ct .bar{width:4px;height:15px;border-radius:2px;background:var(--st,var(--s1));flex:none}
.ccol .ct .n{margin-left:auto;font-size:var(--fs-xs);color:var(--ink-3);font-weight:700;
  background:var(--surface-3);padding:1px 7px;border-radius:99px;font-variant-numeric:tabular-nums}
.ccol .ch{font-size:var(--fs-xs);color:var(--ink-3);margin-top:4px;line-height:1.4}
.clist{padding:var(--sp-2);overflow-y:auto;display:flex;flex-direction:column;gap:var(--sp-2);flex:1;min-height:70px;min-width:0}
.ccard{background:var(--surface-2);border:1px solid var(--line);border-left:3px solid var(--st,var(--s1));
  border-radius:var(--r-md);padding:9px 10px;cursor:grab;min-width:0}
.ccard:hover{box-shadow:var(--shadow-2)}
.ccard.drag{opacity:.4}
.ccard .n{font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ccard .m{display:flex;align-items:center;gap:6px;font-size:var(--fs-sm);color:var(--ink-3);margin-top:4px;min-width:0}
.ccard .m span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ccol.min{flex:0 0 54px;max-height:none;cursor:pointer}
.ccol.min>header{border-bottom:0;border-radius:var(--r-lg);padding:var(--sp-3) 0;height:100%}
.ccol.min .clist,.ccol.min .ch,.ccol.min .kmin{display:none}
.ccol.min .ct{flex-direction:column;gap:10px;align-items:center;height:100%}
.ccol.min .ct .bar{width:22px;height:4px}
.ccol.min .ct .lbl{writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;max-height:210px;font-size:var(--fs-sm);font-weight:650}
.ccol.min .ct .n{margin:0}
.ccol.min:hover{border-color:var(--accent)}

/* attachments */
.att{display:flex;align-items:center;gap:var(--sp-3);padding:10px var(--sp-3);border:1px solid var(--line);
  border-radius:var(--r-md);background:var(--surface-1);margin-bottom:var(--sp-2)}
.att .ft{width:34px;height:34px;border-radius:var(--r-sm);display:grid;place-items:center;flex:none;
  font-size:9px;font-weight:800;letter-spacing:.03em;color:#fff;background:var(--seq-3)}
.att .ft.pdf{background:var(--s2)}
.att .ft.doc{background:var(--s1)}
.att .ft.xls{background:var(--s6)}
.att .ft.img{background:var(--s7)}
.att .nm{flex:1;min-width:0}
.att .nm b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.att .nm span{font-size:var(--fs-sm);color:var(--ink-3)}
.dropzone{border:1.5px dashed var(--line);border-radius:var(--r-lg);padding:var(--sp-5) var(--sp-4);
  text-align:center;color:var(--ink-3);transition:border-color .15s,background .15s;margin-bottom:var(--sp-3)}
.dropzone.hot{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}

/* timeline */
.tl{position:relative;padding-left:24px}
.tl::before{content:"";position:absolute;left:6px;top:6px;bottom:6px;width:1px;background:var(--line)}
.tl .it{position:relative;padding-bottom:var(--sp-4)}
.tl .it::before{content:"";position:absolute;left:-21px;top:5px;width:9px;height:9px;border-radius:99px;
  background:var(--surface-1);border:2px solid var(--baseline)}
.tl .it.stage::before{border-color:var(--accent);background:var(--accent)}
.tl .it.won::before{border-color:var(--good);background:var(--good)}
.tl .it.lost::before{border-color:var(--critical);background:var(--critical)}
.tl .it .w{font-size:var(--fs-xs);color:var(--ink-3);margin-bottom:2px;font-variant-numeric:tabular-nums}
.tl .it .t{line-height:1.5}
.tl .it .t b{font-weight:650}

/* task rows */
.trow{display:flex;align-items:flex-start;gap:var(--sp-3);padding:10px var(--sp-3);
  border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface-1);margin-bottom:var(--sp-2)}
.trow.done{opacity:.55}
.trow.done .tt{text-decoration:line-through}
.trow.late{border-left:3px solid var(--critical)}
.trow.today{border-left:3px solid var(--warning)}
.cb{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--baseline);background:var(--surface-2);
  cursor:pointer;flex:none;margin-top:1px;display:grid;place-items:center;padding:0}
.cb.on{background:var(--good);border-color:var(--good)}
.cb svg{opacity:0}.cb.on svg{opacity:1}
.trow .tb{flex:1;min-width:0}
.trow .tt{font-weight:600;line-height:1.4}
.trow .tm{font-size:var(--fs-sm);color:var(--ink-3);display:flex;gap:var(--sp-2);flex-wrap:wrap;margin-top:3px;align-items:center}

/* weekly review */
.wk{display:grid;gap:var(--sp-3);grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.repcard{background:var(--surface-1);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.repcard>header{display:flex;align-items:center;gap:var(--sp-3);padding:var(--sp-3) var(--sp-4);
  background:var(--surface-3);border-bottom:1px solid var(--line)}
.repcard>header .nm{font-weight:650}
.repcard>header .rl{font-size:var(--fs-xs);color:var(--ink-3)}
.repcard .b{padding:var(--sp-4)}
.kvs{display:grid;grid-template-columns:auto 1fr;gap:5px var(--sp-3);font-size:var(--fs-sm);margin-bottom:var(--sp-4)}
.kvs dt{color:var(--ink-3)}
.kvs dd{margin:0;font-weight:650;font-variant-numeric:tabular-nums;text-align:right}
.nlist{display:flex;flex-direction:column;gap:6px}
.nitem{display:flex;gap:var(--sp-2);align-items:flex-start;padding:7px 9px;border-radius:var(--r-sm);
  background:var(--surface-2);border:1px solid var(--line-soft);font-size:var(--fs-sm);line-height:1.5}
.nitem .ic{flex:none;margin-top:2px}
.nitem.prob{border-left:2px solid var(--critical)}
.nitem.sol{border-left:2px solid var(--good)}
.nitem.com{border-left:2px solid var(--accent)}
.nitem button{margin-left:auto;background:none;border:0;color:var(--ink-3);cursor:pointer;padding:0 2px;flex:none}
.nitem button:hover{color:var(--critical-ink)}

/* toast */
#toasts{position:fixed;bottom:var(--sp-4);left:50%;transform:translateX(-50%);z-index:500;
  display:flex;flex-direction:column;gap:var(--sp-2);align-items:center;pointer-events:none}
.toast{background:var(--raised);border:1px solid var(--line);border-radius:var(--r-md);
  box-shadow:var(--shadow-3);padding:9px 14px;font-weight:550;display:flex;align-items:center;gap:var(--sp-2);
  animation:tin .2s var(--ease)}
.toast.err{border-color:rgba(208,59,59,.45)}
.toast.ok{border-color:rgba(12,163,12,.45)}
@keyframes tin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.spin{width:15px;height:15px;border:2px solid var(--line);border-top-color:var(--accent);
  border-radius:99px;animation:sp .7s linear infinite;flex:none;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}

.widgets{display:flex;flex-direction:column;gap:6px}
.wtoggle{display:flex;align-items:center;gap:var(--sp-3);padding:9px var(--sp-3);border:1px solid var(--line);
  border-radius:var(--r-md);background:var(--surface-2);cursor:grab}
.wtoggle .hd{color:var(--ink-3);cursor:grab}
.wtoggle .nm{flex:1;font-weight:600}
.wtoggle.off{opacity:.5}
.tgl{position:relative;width:36px;height:20px;border-radius:99px;background:var(--surface-3);
  border:1px solid var(--line);cursor:pointer;flex:none;padding:0;transition:background .14s}
.tgl::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:99px;
  background:var(--ink-3);transition:transform .14s,background .14s}
.tgl.on{background:var(--accent);border-color:var(--accent)}
.tgl.on::after{transform:translateX(16px);background:#fff}
@media print{nav.side,header.top,.btn,.scrim,.drawer{display:none !important}
  #app.on{grid-template-columns:1fr;grid-template-areas:"brand" "main"}
  main{overflow:visible;padding:0}
  .card,.tile,.tw{break-inside:avoid}}
</style>
</head>
<body>

<!-- ===================== sign-in gate ===================== -->
<div id="gate">
  <div class="card">
    <svg class="mark" viewBox="0 0 48 48" fill="none" aria-hidden="true">
      <rect width="48" height="48" rx="11" fill="#09193A"/>
      <path d="M13 32V16h7a5 5 0 010 10h-2.4l6.4 6" stroke="#5294FF" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="33" cy="17" r="3" fill="#F04E23"/>
    </svg>
    <h1>CoreV Sales CRM</h1>
    <p>Sign in with your Core Velocity Microsoft account. Your CRM data is stored in the shared OneDrive folder for the sales team.</p>
    <button class="btn primary" id="signin" style="width:100%;justify-content:center;padding:11px">
      <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path fill="#f25022" d="M1 1h6.5v6.5H1z"/><path fill="#7fba00" d="M8.5 1H15v6.5H8.5z"/><path fill="#00a4ef" d="M1 8.5h6.5V15H1z"/><path fill="#ffb900" d="M8.5 8.5H15V15H8.5z"/></svg>
      Sign in with Microsoft
    </button>
    <div class="err" id="gate-err"></div>
    <div class="alt">
      Working offline? <button id="demo-mode">Open with local data only</button>
    </div>
    <div class="ver" id="gate-ver"></div>
  </div>
</div>

<!-- ===================== app shell ===================== -->
<div id="app">

const RELEASED = '2026-09-27';

/* ---------------------------------------------------------------- utils */
const $  = (s, r) => (r || document).querySelector(s);

const el = (tag, attrs, kids) => {

    if (k === 'class') n.className = attrs[k];
    else if (k === 'html') n.innerHTML = attrs[k];

};
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c =>
  ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' })[c]);
const uid = p => (p || 'X') + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

const TODAY = () => new Date().toISOString().slice(0, 10);
const dnum  = d => d ? Number(String(d).slice(0,10).replace(/-/g,'')) : 0;
const days  = (a, b) => Math.round((Date.parse(a + 'T00:00:00Z') - Date.parse(b + 'T00:00:00Z')) / 864e5);
const addDays = (d, n) => { const x = new Date(d + 'T00:00:00Z'); x.setUTCDate(x.getUTCDate() + n); return x.toISOString().slice(0,10); };

const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fdate(d, style) {
  if (!d) return '—';
  const s = String(d).slice(0,10), p = s.split('-');
  if (p.length < 3) return s;
  if (style === 'long')  return `${+p[2]} ${MON[+p[1]-1]} ${p[0]}`;
  if (style === 'month') return `${MON[+p[1]-1]} ${p[0].slice(2)}`;
  return `${+p[2]} ${MON[+p[1]-1]}`;
}
function frel(d) {
  if (!d) return '—';
  const n = days(String(d).slice(0,10), TODAY());
  if (n === 0) return 'today';
  if (n === 1) return 'tomorrow';
  if (n === -1) return 'yesterday';
  if (n < 0)  return `${-n}d overdue`;
  if (n < 30) return `in ${n}d`;
  return fdate(d);
}
function money(v, opt) {
  const o = opt || {};
  if (v == null || isNaN(v)) return o.dash === false ? '0' : '—';
  const n = Math.abs(v), sign = v < 0 ? '-' : '';
  if (o.compact && n >= 1e6) return sign + (n/1e6).toFixed(n >= 1e7 ? 0 : 1) + 'M';
  if (o.compact && n >= 1e3) return sign + Math.round(n/1e3) + 'k';
  return sign + n.toLocaleString('en-US', { maximumFractionDigits: 0 });
}
const pct = (a, b) => (!b ? 0 : Math.round(a / b * 100));
const sum = (arr, f) => arr.reduce((t, x) => t + (Number(f ? f(x) : x) || 0), 0);
function groupBy(arr, f) {
  const m = new Map();
  arr.forEach(x => { const k = f(x); if (!m.has(k)) m.set(k, []); m.get(k).push(x); });
  return m;
}
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };

function initials(name) {
  const w = String(name || '?').trim().split(/\s+/).filter(Boolean);
  return ((w[0] || '?')[0] + (w.length > 1 ? w[w.length-1][0] : '')).toUpperCase();
}
const SER = ['--s1','--s2','--s3','--s4','--s5','--s6','--s7','--s8'];
const serColor = i => `var(${SER[i % 8]})`;
/* Identity colour by position in the team list, not by hash: the palette's
   slot ORDER is what keeps adjacent colours separable for colour-blind
   viewers, and a hash happily hands two reps the same-looking red. */
function ownerColor(id) {
  const i = (typeof DB !== 'undefined' && DB.owners) ? DB.owners.findIndex(o => o.id === String(id)) : -1;
  if (i < 0) return 'var(--seq-3)';
  return serColor(i);
}
/* Avatars for people who are not reps: one hue, varying step. Decorative
   only, so it never reads as a categorical series colour. */
const SEQ = ['--seq-2','--seq-3','--seq-4','--seq-5'];
function personColor(id) {
  let h = 0; const s = String(id || '');
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0;
  return `var(${SEQ[Math.abs(h) % SEQ.length]})`;
}

/* ------------------------------------------------- domain → company data
   What a domain can honestly tell you offline: a readable name, and a country
   from the country-code TLD. A city cannot be derived from a domain without a
   paid enrichment provider, so this never guesses one. */
function cleanDomain(d) {
  if (!d) return null;
  let s = String(d).trim().toLowerCase()
    .replace(/^[a-z]+:\/\//, '').replace(/^www\./, '')
    .split('/')[0].split('?')[0].split('#')[0].split('@').pop().replace(/\.$/, '');
  return /^[a-z0-9.-]+\.[a-z]{2,}$/.test(s) ? s : null;
}
/* multi-part public suffixes we must not mistake for the name */
const SUFFIX2 = new Set(['co','com','net','org','gov','edu','ac','mil','or','ne','go','in','web','biz']);
const SMALLWORD = new Set(['and','of','the','for','by','on','at','in','to']);
const ACRONYM = new Set(['uae','ksa','llc','fze','fzc','fzco','dmcc','jlt','difc','adgm','gcc','uk','usa',
  'hq','it','ai','ae','pjsc','psc','wll','spc','bv','gmbh','sa','fc','sc','ufc','hr','pt','tv','id']);
function domainToName(domain) {
  const d = cleanDomain(domain);
  if (!d) return null;
  const parts = d.split('.');
  // drop the public suffix, including two-part ones like .co.uk / .com.sa
  let end = parts.length - 1;
  if (end >= 2 && SUFFIX2.has(parts[end - 1])) end -= 1;
  const core = parts.slice(0, end).filter(p => p !== 'www');
  const label = (core[core.length - 1] || parts[0]);
  return label.split(/[-_]+/).filter(Boolean).map(w =>
    ACRONYM.has(w) ? w.toUpperCase()
      : SMALLWORD.has(w) ? w
      : w.charAt(0).toUpperCase() + w.slice(1)
  ).join(' ').replace(/\s+/g, ' ').trim() || null;
}
const CCTLD = {
  ae:'United Arab Emirates', sa:'Saudi Arabia', qa:'Qatar', kw:'Kuwait', bh:'Bahrain', om:'Oman',
  jo:'Jordan', lb:'Lebanon', eg:'Egypt', iq:'Iraq', sy:'Syria', ye:'Yemen', ps:'Palestine',
  ma:'Morocco', tn:'Tunisia', dz:'Algeria', ly:'Libya', sd:'Sudan', tr:'Turkey', ir:'Iran',
  pk:'Pakistan', in:'India', bd:'Bangladesh', lk:'Sri Lanka', np:'Nepal',
  uk:'United Kingdom', gb:'United Kingdom', ie:'Ireland', fr:'France', de:'Germany', es:'Spain',
  it:'Italy', pt:'Portugal', nl:'Netherlands', be:'Belgium', ch:'Switzerland', at:'Austria',
  se:'Sweden', no:'Norway', dk:'Denmark', fi:'Finland', is:'Iceland', pl:'Poland', cz:'Czechia',
  gr:'Greece', ru:'Russia', ua:'Ukraine', ro:'Romania', hu:'Hungary', lt:'Lithuania', lv:'Latvia',
  us:'United States', ca:'Canada', mx:'Mexico', br:'Brazil', ar:'Argentina', cl:'Chile', co:'Colombia',
  au:'Australia', nz:'New Zealand', za:'South Africa', ng:'Nigeria', ke:'Kenya', gh:'Ghana',
  et:'Ethiopia', tz:'Tanzania', ug:'Uganda', cn:'China', hk:'Hong Kong', tw:'Taiwan', jp:'Japan',
  kr:'South Korea', sg:'Singapore', my:'Malaysia', th:'Thailand', id:'Indonesia', ph:'Philippines',
  vn:'Vietnam', mt:'Malta', cy:'Cyprus', az:'Azerbaijan', kz:'Kazakhstan', uz:'Uzbekistan', am:'Armenia'
};
function domainCountry(domain) {
  const d = cleanDomain(domain);
  if (!d) return null;
  const parts = d.split('.');
  const tld = parts[parts.length - 1];
  if (tld.length !== 2) return null;                 // .com/.org etc say nothing
  return CCTLD[tld] || null;
}
/* Logos come from public favicon/logo services, tried in order; each failure
   falls through to the next and finally to an initials badge. Opt-out lives in
   Settings, because using it sends customer domains to a third party. */
/* A table of 938 accounts would otherwise fire three requests per row every
   render. LOGO keeps a per-domain negative cache and trips a breaker if the
   services are unreachable at all, so a blocked network costs one round of
   attempts rather than thousands. */
const LOGO = { bad: new Set(), ok: 0, fail: 0, off: false, warned: false };
function logoFailed(domain) {
  LOGO.fail++;
  if (domain) LOGO.bad.add(domain);
  if (!LOGO.off && LOGO.ok === 0 && LOGO.fail >= 12) {
    LOGO.off = true;
    if (!LOGO.warned) {
      LOGO.warned = true;
      setTimeout(() => toast('Company logos are unreachable from this network — showing initials instead'), 600);
    }
  }
}
const logosOn = () => (DB.config && DB.config.logos) !== false && !LOGO.off;
const logoCandidates = domain => {
  const d = cleanDomain(domain);
  if (!d || LOGO.bad.has(d)) return [];
  return [
    'https://logo.clearbit.com/' + d + '?size=128',
    'https://icons.duckduckgo.com/ip3/' + d + '.ico',
    'https://www.google.com/s2/favicons?sz=128&domain=' + d
  ];
};
function logoEl(co, size) {
  const px = size || 38;
  const fallback = el('span', { class: 'avatar' + (px > 30 ? ' lg' : ''),
    style: `background:${personColor(co.id || co.name)};width:${px}px;height:${px}px;font-size:${Math.round(px*0.34)}px`,
    text: initials(co.name || co.domain) });
  const urls = logosOn() ? logoCandidates(co.domain) : [];
  if (!urls.length) return fallback;
  const wrap = el('span', { class: 'logo', style: `width:${px}px;height:${px}px` });
  let i = 0;
  const img = el('img', { alt: '', loading: 'lazy', referrerpolicy: 'no-referrer', src: urls[0] });
  img.addEventListener('load', () => { LOGO.ok++; });
  img.addEventListener('error', () => {
    i++;
    if (i < urls.length) { img.src = urls[i]; return; }
    logoFailed(cleanDomain(co.domain));
    wrap.replaceWith(fallback);
  });
  wrap.appendChild(img);
  return wrap;
}
/* HTML-string form, for the table renderers that build rows with innerHTML */
function logoFallback(img) {
  const rest = (img.getAttribute('data-next') || '').split('|').filter(Boolean);
  if (rest.length) { img.setAttribute('data-next', rest.slice(1).join('|')); img.src = rest[0]; return; }
  logoFailed(img.getAttribute('data-domain'));
  const w = img.parentNode;
  if (w) w.outerHTML = img.getAttribute('data-fb') || '';
}
function logoLoaded() { LOGO.ok++; }
function logoHTML(co, size) {
  const px = size || 26;
  const fb = `<span class="avatar" style="background:${personColor(co.id || co.name)};width:${px}px;height:${px}px;font-size:${Math.round(px*0.36)}px">${esc(initials(co.name || co.domain))}</span>`;
  const urls = logosOn() ? logoCandidates(co.domain) : [];
  if (!urls.length) return fb;
  return `<span class="logo" style="width:${px}px;height:${px}px"><img alt="" loading="lazy" referrerpolicy="no-referrer"
    src="${esc(urls[0])}" data-next="${esc(urls.slice(1).join('|'))}" data-domain="${esc(cleanDomain(co.domain) || '')}"
    data-fb="${esc(fb)}" onload="logoLoaded()" onerror="logoFallback(this)"></span>`;
}

const I = {

/* --------------------------------------------------------------- toast */
function toast(msg, kind) {

/* --------------------------------------------------- drawer & modal */
let onScrim = null;
function openScrim(fn) { onScrim = fn; $('#scrim').classList.add('on'); }
function closeAll() {
  if (typeof OPEN !== 'undefined') { OPEN.kind = null; OPEN.id = null; OPEN.tab = null; }
  $('#scrim').classList.remove('on');
  $('#drawer').classList.remove('on');
  $('#modal').classList.remove('on');

  const d = $('#drawer'); d.innerHTML = '';

function modal(title, bodyNode, footNodes, wide) {
  const m = $('#modal');
  m.className = 'modal' + (wide ? ' wide' : '');
  m.innerHTML = '';
  m.appendChild(el('header', {}, [
    el('h3', { text: title }),
    el('div', { style: 'flex:1' }),
    el('button', { class: 'btn icon ghost', html: ico('x',16), onclick: closeAll, 'aria-label': 'Close' })
  ]));
  const b = el('div', { class: 'body' }); b.appendChild(bodyNode); m.appendChild(b);
  if (footNodes) { const f = el('div', { class: 'foot' }); footNodes.forEach(n => f.appendChild(n)); m.appendChild(f); }
  m.classList.add('on'); openScrim(closeAll);

    el('button', { class: 'btn', text: 'Cancel', onclick: closeAll }),

}

/* ================================================================
   STORE — in-memory DB, localStorage cache, OneDrive shard sync
   Every record carries: _v (last write ms), _by (upn), _del (tombstone)
   Merge rule: per record id, highest _v wins; a tombstone at the same
   or higher _v deletes. Deletes are never resurrected by older writes.
   ================================================================ */
const DB = {
  companies: [], contacts: [], deals: [], tasks: [],
  commitments: [], reviews: [], activities: [], attachments: [], products: [],
  owners: [], stages: [], lossReasons: [],
  config: { widgets: null, targets: {}, theme: 'dark' },
  meta: { exportedAt: null, homeCurrency: CFG.currency }

const IDX = { companies: new Map(), contacts: new Map(), deals: new Map() };

function reindex() {
  for (const k of ['companies','contacts','deals']) {
    IDX[k].clear();
    DB[k].forEach(r => IDX[k].set(r.id, r));
  }
}
const getCo = id => IDX.companies.get(id) || null;
const getCt = id => IDX.contacts.get(id) || null;
const getDl = id => IDX.deals.get(id) || null;

/* ---- stage helpers ---- */
let STAGE = new Map();
function rebuildStages() {
  STAGE = new Map(DB.stages.map(s => [s.id, s]));
}
const stage     = id => STAGE.get(id) || { id, label: id || 'Unstaged', probability: 0, kind: 'open', order: 99 };
const openStages= () => DB.stages.filter(s => s.kind === 'open').sort((a,b) => a.order - b.order);
const isOpen    = d => stage(d.stageId).kind === 'open';
const isWon     = d => stage(d.stageId).kind === 'won';
const isLost    = d => stage(d.stageId).kind === 'lost';
function stageColor(id) {
  const s = stage(id);
  if (s.kind === 'won')  return 'var(--good)';
  if (s.kind === 'lost') return 'var(--critical)';
  const seq = ['--seq-6','--seq-5','--seq-4','--seq-3','--seq-2','--seq-1'];
  const o = openStages(), i = o.findIndex(x => x.id === id);
  return `var(${seq[Math.min(Math.max(i,0), seq.length-1)]})`;

/* ---- fiscal period helpers ---- */
function fyBounds(d) {
  const y = +String(d || TODAY()).slice(0,4);
  return { from: `${y}-01-01`, to: `${y}-12-31`, label: `FY${y}` };
}
function qBounds(d) {
  const s = String(d || TODAY()), y = +s.slice(0,4), m = +s.slice(5,7);
  const q = Math.floor((m - 1) / 3), f = q * 3 + 1;
  const lastDay = new Date(Date.UTC(y, f + 2, 0)).getUTCDate();
  return { from: `${y}-${String(f).padStart(2,'0')}-01`, to: `${y}-${String(f+2).padStart(2,'0')}-${lastDay}`, label: `Q${q+1} ${y}` };
}
function mBounds(d) {
  const s = String(d || TODAY()), y = +s.slice(0,4), m = +s.slice(5,7);
  const lastDay = new Date(Date.UTC(y, m, 0)).getUTCDate();
  const mm = String(m).padStart(2,'0');
  return { from: `${y}-${mm}-01`, to: `${y}-${mm}-${lastDay}`, label: `${MON[m-1]} ${y}` };
}
/* ISO week key, e.g. 2026-W39 — the unit the weekly review runs on */
function weekKey(d) {
  const t = new Date((d || TODAY()) + 'T00:00:00Z');
  const day = (t.getUTCDay() + 6) % 7;            // Mon = 0
  t.setUTCDate(t.getUTCDate() - day + 3);         // nearest Thursday
  const y = t.getUTCFullYear();
  const jan4 = new Date(Date.UTC(y, 0, 4));
  const w = 1 + Math.round(((t - jan4) / 864e5 - 3 + ((jan4.getUTCDay() + 6) % 7)) / 7);
  return `${y}-W${String(w).padStart(2,'0')}`;
}
function weekRange(key) {
  const [y, w] = key.split('-W').map(Number);
  const jan4 = new Date(Date.UTC(y, 0, 4));
  const mon = new Date(jan4); mon.setUTCDate(jan4.getUTCDate() - ((jan4.getUTCDay() + 6) % 7) + (w - 1) * 7);
  const sun = new Date(mon); sun.setUTCDate(mon.getUTCDate() + 6);
  return { from: mon.toISOString().slice(0,10), to: sun.toISOString().slice(0,10) };
}

/* ---- write path: every mutation stamps the record and queues a sync ---- */
const SYNC = { dirty: new Set(), status: 'idle', last: null, err: null, mode: 'local' };

function stamp(rec) { rec._v = now(); rec._by = (AUTH.user && AUTH.user.username) || 'local'; return rec; }

/* Bulk writes used to serialise the whole database once per record — a few
   hundred rows and the tab locks up. batch() marks shards dirty as it goes and
   saves once at the end. */
let BATCH = 0;
function touch(shard) {
  SYNC.dirty.add(shard);
  if (BATCH) return;
  saveLocal(); renderSyncBadge(); scheduleSync();
}
function batch(fn) {
  BATCH++;
  try { return fn(); }
  finally {
    BATCH--;
    if (!BATCH) { saveLocal(); renderSyncBadge(); scheduleSync(); }
  }
}

function upsert(shard, rec) {
  if (!rec.id) rec.id = uid(shard[0].toUpperCase());
  stamp(rec);
  const arr = DB[shard];
  const idx = IDX[shard];
  let i = -1;
  if (idx && idx.has(rec.id)) i = arr.indexOf(idx.get(rec.id));
  if (i < 0) i = arr.findIndex(r => r.id === rec.id);
  let out;
  if (i < 0) { arr.push(rec); out = rec; }
  else { out = Object.assign(arr[i], rec); }
  if (idx) idx.set(out.id, out);
  touch(shard);
  return out;
}
function remove(shard, id) {
  const arr = DB[shard], i = arr.findIndex(r => r.id === id);
  if (i < 0) return;
  arr[i]._del = true; stamp(arr[i]);
  touch(shard);
}
const live = shard => DB[shard].filter(r => !r._del);

const AUTH = { msal: null, user: null, token: null, expires: 0 };

async function loadMsal() {
  if (window.msal) return true;
  const urls = [
    'https://cdn.jsdelivr.net/npm/@azure/msal-browser@3.26.1/lib/msal-browser.min.js',

async function getToken() {
  if (AUTH.token && now() < AUTH.expires - 120000) return AUTH.token;
  const req = { scopes: CFG.scopes, account: AUTH.msal.getActiveAccount() };
  let r;
  try { r = await AUTH.msal.acquireTokenSilent(req); }

/* ------------------------------------------------- Graph / OneDrive I/O */
async function graph(path, opt) {
  const o = opt || {};
  const t = await getToken();
  const r = await fetch('https://graph.microsoft.com/v1.0' + path, {
    method: o.method || 'GET',
    headers: Object.assign({ Authorization: 'Bearer ' + t }, o.headers || {}),
    body: o.body
  });
  if (r.status === 404) return null;
  if (!r.ok) throw new Error('Graph ' + r.status + ' ' + (await r.text()).slice(0, 200));
  return o.raw ? r : (r.status === 204 ? null : r.json());
}
const shardPath = s => `/me/drive/root:/${CFG.root}/${s}.json`;

async function readShard(s) {
  try {
    const r = await graph(shardPath(s) + ':/content', { raw: true });
    if (!r) return null;
    return await r.json();
  } catch (e) {
    if (/ 404/.test(String(e.message))) return null;
    throw e;
  }
}
async function writeShard(s, data) {
  await graph(shardPath(s) + ':/content', {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(data)
  });

async function ensureFolder() {
  const f = await graph(`/me/drive/root:/${CFG.root}`);
  if (f) return;
  await graph('/me/drive/root/children', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },

/* ---- the merge: per-record last-write-wins, tombstones sticky ---- */
function mergeRecords(mine, theirs) {
  const out = new Map();
  (theirs || []).forEach(r => r && r.id && out.set(r.id, r));
  (mine   || []).forEach(r => {
    if (!r || !r.id) return;
    const t = out.get(r.id);
    if (!t) { out.set(r.id, r); return; }
    const mv = r._v || 0, tv = t._v || 0;
    if (mv > tv) out.set(r.id, r);
    else if (mv === tv && r._del && !t._del) out.set(r.id, r);   // tombstone wins a tie
  });
  return Array.from(out.values());
}
const REC_SHARDS = ['companies','contacts','deals','tasks','commitments','reviews','activities','attachments','products'];

async function syncNow(opt) {
  const o = opt || {};
  if (SYNC.mode !== 'onedrive') { saveLocal(); return; }
  if (SYNC.status === 'syncing') return;
  SYNC.status = 'syncing'; SYNC.err = null; renderSyncBadge();
  try {
    await ensureFolder();
    for (const s of REC_SHARDS) {
      const remote = await readShard(s);
      const merged = mergeRecords(DB[s], (remote && remote.rows) || []);
      const changed = SYNC.dirty.has(s) || !remote || merged.length !== ((remote && remote.rows) || []).length;
      DB[s] = merged;
      if (changed) await writeShard(s, { shard: s, v: 1, at: new Date().toISOString(), rows: merged });
      SYNC.dirty.delete(s);
    }
    // config: whole-document last-write-wins
    const rc = await readShard('config');
    if (rc && (rc._v || 0) > (DB.config._v || 0) && !SYNC.dirty.has('config')) {
      DB.config = Object.assign(DB.config, rc);
    } else if (SYNC.dirty.has('config') || !rc) {
      DB.config._v = now();
      await writeShard('config', Object.assign({ shard: 'config' }, DB.config,
        { owners: DB.owners, stages: DB.stages, lossReasons: DB.lossReasons, meta: DB.meta }));
    }
    if (rc && rc.owners && rc.owners.length && !SYNC.dirty.has('config')) {
      DB.owners = rc.owners; DB.stages = rc.stages || DB.stages;
      DB.lossReasons = rc.lossReasons || DB.lossReasons;
    }
    SYNC.dirty.delete('config');
    reindex(); rebuildStages();
    SYNC.status = 'idle'; SYNC.last = now(); saveLocal();
    if (o.loud) toast('Synced with OneDrive', 'ok');
    if (!o.quiet) render();
  } catch (e) {
    SYNC.status = 'error'; SYNC.err = String(e.message || e);
    if (o.loud) toast('Sync failed — ' + SYNC.err.slice(0, 90), 'err');
  }
  renderSyncBadge();
}
let syncTimer = null;
function scheduleSync() {
  if (SYNC.mode !== 'onedrive') return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(() => syncNow({ quiet: true }), 6000);
}
setInterval(() => { if (SYNC.mode === 'onedrive' && SYNC.status === 'idle') syncNow({ quiet: true }); }, CFG.autoSyncMs);
window.addEventListener('beforeunload', e => {
  saveLocal();
  if (SYNC.dirty.size && SYNC.mode === 'onedrive') { e.preventDefault(); e.returnValue = ''; }
});

function renderSyncBadge() {
  const n = $('#syncbadge'); if (!n) return;
  const cls = SYNC.status === 'error' ? 'err' : SYNC.dirty.size ? 'warn' : SYNC.mode === 'local' ? '' : 'ok';
  const txt = SYNC.status === 'syncing' ? 'Syncing…'
    : SYNC.status === 'error' ? 'Sync error'
    : SYNC.mode === 'local' ? 'Local only'
    : SYNC.dirty.size ? SYNC.dirty.size + ' pending'
    : SYNC.last ? 'Synced ' + new Date(SYNC.last).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' })
    : 'OneDrive ready';
  n.innerHTML = `<span class="dot ${cls}"></span><span>${esc(txt)}</span>`;
}

/* ---- who works a deal ----
   The owner carries the number. A collaborator gets to see and work the deal,
   so it appears under their filter, but revenue is never counted twice: every
   per-rep total below uses ownedBy, never worksOn. */
const collabsOf = d => Array.isArray(d.collaboratorIds) ? d.collaboratorIds
  : (d.collaboratorId ? [d.collaboratorId] : []);
const ownedBy = (d, rep) => rep === 'all' || String(d.ownerId) === String(rep);
const worksOn = (d, rep) => rep === 'all' || String(d.ownerId) === String(rep) ||
  collabsOf(d).some(id => String(id) === String(rep));
const isCollabOnly = (d, rep) => rep !== 'all' && String(d.ownerId) !== String(rep) &&
  collabsOf(d).some(id => String(id) === String(rep));

/* ---- lead status: four stages a contact moves through ---- */
const LEAD_STAGES = [
  { id: 'unqualified', label: 'Unqualified', hint: 'Not yet worked, or ruled out' },
  { id: 'connected',   label: 'Connected',   hint: 'We have reached them and spoken' },
  { id: 'followup',    label: 'Follow-up',   hint: 'Waiting on them, needs a next touch' },
  { id: 'progressing', label: 'Progressing', hint: 'Actively moving toward a deal' },
  { id: 'won',         label: 'Won',         hint: 'Bought — now a customer' }
];
const leadStages = () => (DB.config && DB.config.leadStages && DB.config.leadStages.length)
  ? DB.config.leadStages : LEAD_STAGES;
const leadStage = id => leadStages().find(s => s.id === id) || null;
const leadLabel = id => (leadStage(id) || {}).label || null;
const leadColor = id => {

  const i = leadStages().findIndex(s => s.id === id);
  const ramp = ['--seq-6','--seq-5','--seq-4','--seq-3','--seq-2'];

/* HubSpot's lead statuses, folded into the four. Anything unrecognised is left
   alone rather than guessed at, and surfaced in Settings for a human to sort. */
const LEAD_MAP = {
  attempted_to_contact: 'followup',
  in_progress: 'progressing',
  open_deal: 'progressing',
  connected: 'connected',
  qualified: 'connected',      // v1.3 called this stage Qualified
  open: 'unqualified',

  unqualified: 'unqualified',

};
function mapLeadStatus(raw) {
  if (!raw) return null;
  const s = String(raw).trim();
  if (leadStages().some(x => x.id === s)) return s;                  // already migrated
  const inBrackets = (s.match(/\(([^)]+)\)\s*$/) || [])[1] || s;     // "Open (OPEN)" -> "OPEN"
  const key = inBrackets.toLowerCase().replace(/[^a-z]+/g, '_').replace(/^_|_$/g, '');
  return LEAD_MAP[key] || null;
}
/* One-shot, on load: rewrite what maps, leave the rest for a human. */
function migrateLeadStatus() {
  let changed = 0, unmapped = 0;
  DB.contacts.forEach(c => {
    if (c._del || !c.leadStatus) return;
    // v1.3 -> v1.4 rename
    if (c.leadStatus === 'qualified' && !leadStages().some(x => x.id === 'qualified')) {
      c.leadStatus = 'connected'; c._v = now(); changed++; return;
    }
    if (leadStages().some(x => x.id === c.leadStatus)) return;
    const m = mapLeadStatus(c.leadStatus);
    if (m) { c.leadStatusRaw = c.leadStatus; c.leadStatus = m; c._v = now(); changed++; }

/* ---- products & line-item estimates ---- */
const BILLING = [
  { id: 'once',    label: 'One-time' },
  { id: 'monthly', label: 'Per month' },
  { id: 'annual',  label: 'Per year' }

  .sort((a, b) => (a.category || '').localeCompare(b.category || '') || (a.name || '').localeCompare(b.name || ''));
const lineNet = it => Math.max(0, (Number(it.qty) || 0) * (Number(it.unitPrice) || 0) *
  (1 - (Number(it.discountPct) || 0) / 100));
/* One-time value, recurring monthly value, and the contract total that the
   deal amount follows when it is on auto. */
function estimate(d) {
  const items = d.items || [];
  const months = Number(d.contractMonths) > 0 ? Number(d.contractMonths) : 12;
  let once = 0, monthly = 0, annual = 0;
  items.forEach(it => {
    const n = lineNet(it);
    if (it.billing === 'monthly') monthly += n;
    else if (it.billing === 'annual') annual += n;
    else once += n;
  });
  const mrr = monthly + annual / 12;
  return { items: items.length, once, monthly, annual, mrr, months,
           recurringOverTerm: mrr * months, total: once + mrr * months };
}
const amountAuto = d => (d.amountMode || (d.items && d.items.length ? 'auto' : 'manual')) === 'auto';
/* Keep the deal value in step with its estimate whenever it is on auto. */
function syncDealAmount(d, o) {
  if (!amountAuto(d)) return false;
  const e = estimate(d);
  const next = Math.round(e.total);
  if (!e.items) return false;
  if (Number(d.amount) === next) return false;
  d.amount = next;
  if (!o || o.save !== false) upsert('deals', d);
  return true;
}

/* Files live beside the data: CoreVCRM/attachments/<dealId>/<name>.
   The quote tool can push into the same folder and append a row to
   attachments.json — that pair is the whole cross-tool contract. */
async function uploadAttachment(dealId, file) {
  if (SYNC.mode !== 'onedrive') throw new Error('Sign in with Microsoft to upload files. In local-only mode you can still add a link.');
  if (file.size > 60 * 1024 * 1024) throw new Error('That file is over 60 MB — upload it to OneDrive yourself and add it here as a link.');
  const safe = String(file.name).replace(/[\\/:*?"<>|#%]/g, '-').slice(0, 120);
  const path = `/me/drive/root:/${CFG.root}/${CFG.attachDir}/${dealId}/${safe}:/content`;
  const t = await getToken();
  const r = await fetch('https://graph.microsoft.com/v1.0' + path, {
    method: 'PUT',
    headers: { Authorization: 'Bearer ' + t, 'Content-Type': file.type || 'application/octet-stream' },
    body: file
  });
  if (!r.ok) throw new Error('OneDrive refused the upload (' + r.status + ')');
  const item = await r.json();
  return upsert('attachments', {
    dealId, name: safe, size: file.size, mime: file.type || null,
    url: item.webUrl || null, driveItemId: item.id || null,
    at: new Date().toISOString(), by: (AUTH.user && AUTH.user.username) || 'local', kind: 'file'
  });
}

function applySeed(seed, opt) {
  const o = opt || {};
  const t = now(), by = (AUTH.user && AUTH.user.username) || 'import';
  const mark = r => { r._v = r._v || t; r._by = r._by || by; return r; };
  if (seed.owners && (o.replaceRef !== false)) DB.owners = seed.owners.map(x => Object.assign({}, x));
  if (seed.stages && (o.replaceRef !== false)) DB.stages = seed.stages.map(x => Object.assign({}, x));
  if (seed.lossReasons && (o.replaceRef !== false)) DB.lossReasons = seed.lossReasons.slice();
  if (seed.meta) DB.meta = Object.assign(DB.meta, seed.meta);
  REC_SHARDS.forEach(s => {
    if (!Array.isArray(seed[s])) return;
    const rows = seed[s].map(r => mark(Object.assign({}, r)));
    DB[s] = o.merge ? mergeRecords(rows, DB[s]) : rows;
    SYNC.dirty.add(s);

function download(name, text, mime) {
  const b = new Blob([text], { type: mime || 'application/json' });
  const a = el('a', { href: URL.createObjectURL(b), download: name });
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 400);
}
function toCSV(rows, cols) {
  const q = v => {
    const s = v == null ? '' : String(v);
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
  };
  return [cols.map(c => q(c.h)).join(',')]
    .concat(rows.map(r => cols.map(c => q(c.f(r))).join(','))).join('\r\n');
}
/* tolerant CSV parser — handles quotes, CRLF, embedded commas */
function parseCSV(text) {
  const rows = []; let row = [], cell = '', q = false;
  const s = text.replace(/^﻿/, '');
  for (let i = 0; i < s.length; i++) {
    const c = s[i];
    if (q) {
      if (c === '"') { if (s[i+1] === '"') { cell += '"'; i++; } else q = false; }
      else cell += c;
    } else if (c === '"') q = true;
    else if (c === ',') { row.push(cell); cell = ''; }
    else if (c === '\n') { row.push(cell); rows.push(row); row = []; cell = ''; }
    else if (c !== '\r') cell += c;
  }
  if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(v => String(v).trim() !== ''));
}
/* ================================================================
   CHARTS — inline SVG. Thin marks, 4px rounded data-ends anchored to
   the baseline, 2px surface gaps between fills, recessive grid, a
   hover layer by default, a legend whenever there are >=2 series, and
   a table view on every chart (the relief rule for the sub-3:1
   light-mode series steps). No dual axes anywhere.
   ================================================================ */
const TIP = () => $('#tip');
function tipShow(html, ev) {
  const t = TIP();
  t.innerHTML = html; t.classList.add('on');
  const r = t.getBoundingClientRect();
  let x = ev.clientX + 14, y = ev.clientY - r.height / 2;
  if (x + r.width > innerWidth - 8) x = ev.clientX - r.width - 14;
  t.style.left = Math.max(8, x) + 'px';
  t.style.top = Math.min(Math.max(8, y), innerHeight - r.height - 8) + 'px';
}
const tipHide = () => TIP().classList.remove('on');

function svgEl(tag, a) {
  const n = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const k in (a || {})) if (a[k] != null) n.setAttribute(k, a[k]);
  return n;
}
/* a bar with only its data-end rounded (4px), anchored to the baseline */
function barPath(x, y, w, h, r, dir) {
  const rr = Math.min(r, w / 2, Math.max(h, 0));
  if (h <= 0.5) return `M${x} ${y}h${w}`;
  if (dir === 'up')    return `M${x} ${y+h}V${y+rr}a${rr} ${rr} 0 0 1 ${rr} -${rr}h${w-2*rr}a${rr} ${rr} 0 0 1 ${rr} ${rr}V${y+h}Z`;
  if (dir === 'right') { const q = Math.min(r, h/2, w); return `M${x} ${y}h${w-q}a${q} ${q} 0 0 1 ${q} ${q}v${h-2*q}a${q} ${q} 0 0 1 -${q} ${q}H${x}Z`; }
  return `M${x} ${y}h${w}v${h}h-${w}Z`;
}
function chartShell(host, opts) {
  const o = opts || {};
  host.innerHTML = '';
  const wrap = el('div', { class: 'chart' });
  host.appendChild(wrap);
  if (o.table) {
    const t = el('div', { class: 'chart-tbl' });
    t.innerHTML = o.table;
    const btn = el('button', { class: 'btn sm ghost', text: 'Table view',
      style: 'margin-top:8px;color:var(--ink-3)',
      onclick: () => { t.classList.toggle('on'); btn.textContent = t.classList.contains('on') ? 'Hide table' : 'Table view'; } });
    host.appendChild(btn); host.appendChild(t);
  }
  return wrap;
}
const tblHTML = (cols, rows) =>
  `<table><thead><tr>${cols.map(c => `<th class="${c.num?'num':''}">${esc(c.h)}</th>`).join('')}</tr></thead><tbody>${
    rows.map(r => `<tr>${cols.map(c => `<td class="${c.num?'num':''}">${esc(c.f(r))}</td>`).join('')}</tr>`).join('')}</tbody></table>`;

/* ---------------------------------------------------- vertical bars */
function chartBar(host, rows, o) {
  o = o || {};
  const fmt = o.fmt || (v => money(v, { compact: true }));
  const wrap = chartShell(host, { table: tblHTML(
    [{ h: o.xLabel || 'Category', f: r => r.label }, { h: o.yLabel || 'Value', num: true, f: r => fmt(r.value) }], rows) });
  if (!rows.length) { wrap.innerHTML = `<p style="color:var(--ink-3);margin:0;padding:24px 0;text-align:center">No data in range</p>`; return; }

  const H = o.height || 190, PT = 22, PB = 30, PL = 4, PR = 4;
  const W = Math.max(host.clientWidth || 520, 260);
  const max = Math.max(...rows.map(r => r.value), 1);
  const gap = rows.length > 14 ? 2 : 8;
  const bw = Math.max(4, (W - PL - PR - gap * (rows.length - 1)) / rows.length);
  const svg = svgEl('svg', { viewBox: `0 0 ${W} ${H}`, preserveAspectRatio: 'none', role: 'img',
    'aria-label': o.aria || 'Bar chart' });
  svg.style.height = H + 'px';

  // recessive gridlines + baseline
  for (let i = 1; i <= 3; i++) {
    const y = PT + (H - PT - PB) * (i / 3);
    svg.appendChild(svgEl('line', { x1: 0, x2: W, y1: y, y2: y, class: 'gl' }));
  }
  svg.appendChild(svgEl('line', { x1: 0, x2: W, y1: H - PB, y2: H - PB, class: 'bl' }));

  const plotH = H - PT - PB;
  rows.forEach((r, i) => {
    const h = Math.max(0, (r.value / max) * plotH);
    const x = PL + i * (bw + gap), y = H - PB - h;
    const g = svgEl('g', { class: 'mk' });
    g.appendChild(svgEl('path', { d: barPath(x, y, bw, h, 4, 'up'), fill: r.color || o.color || 'var(--s1)' }));
    svg.appendChild(g);
    // selective direct labels: only when they will not collide
    if (rows.length <= 9 && r.value) {
      const t = svgEl('text', { x: x + bw / 2, y: y - 6, 'text-anchor': 'middle', class: 'vlab' });
      t.textContent = fmt(r.value); svg.appendChild(t);
    }
    if (rows.length <= 16) {
      const t = svgEl('text', { x: x + bw / 2, y: H - PB + 14, 'text-anchor': 'middle', class: 'alab' });
      t.textContent = r.short || r.label; svg.appendChild(t);
    }
    const hit = svgEl('rect', { x, y: PT, width: bw, height: plotH + 6, class: 'hit' });
    hit.addEventListener('mousemove', ev => tipShow(
      `<b>${esc(r.label)}</b><div class="r"><span><i style="background:${r.color||o.color||'var(--s1)'}"></i>${esc(o.yLabel||'Value')}</span><b>${esc(fmt(r.value))}</b></div>` +
      (r.note ? `<div class="r"><span>${esc(r.note)}</span></div>` : ''), ev));
    hit.addEventListener('mouseleave', tipHide);
    svg.appendChild(hit);
  });
  wrap.appendChild(svg);
}
