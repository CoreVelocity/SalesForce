      onclick: () => { VIEW.monthWeek = VIEW.monthWeek === k ? null : k; render(); } }, [
      el('div', { class: 'w', text: weekOfMonthLabel(mk, k) }),
      el('div', { class: 'd', text: weekLabel(k) }),
      el('div', { class: 'n' + (r.forecast ? '' : ' zero'),
        text: r.forecast ? money(r.forecast, { compact: true }) : '—' }),
      el('div', { class: 'bar', html: `<i style="width:${Math.round(r.forecast / peak * 100)}%"></i>` }),
      el('div', { class: 'm', html: r.commit || r.best
        ? `<span>${money(r.commit, { compact: true })} commit</span>` +
          (r.best ? `<span>· ${money(r.best, { compact: true })} best</span>` : '') +
          (r.slots ? `<span>· ${r.locked}/${r.slots} in</span>` : '')
        : '<span>nothing committed</span>' })
    ]));
  });
  wc.body.appendChild(rail);
  wc.body.appendChild(el('p', { class: 'sub', style: 'margin:var(--sp-3) 0 0;line-height:1.5',
    html: `Each figure is that week's weighted forecast. ${isReadOnly() ? ''
      : 'Use <b>Commit deals</b> above to add to any week — the dialog asks which one.'}` }));
  root.appendChild(el('div', { style: 'margin-bottom:var(--sp-3)' }, [wc.node]));

  /* ---- region roll-up, combined row last */
  const rc = card(`By region — ${scopeLabel}`,
    'Commit, best case and devices are what reps picked in these weeks; pipeline is current, closed is what landed in the month');
  const tb = el('table', { class: 'dt rollup' });
  const heads = ['Region', 'Commit', 'Best case', 'Forecast', 'Pipeline', 'Closed won', 'Lost']
    .concat(unitLines()).concat(['Quotes', 'Submitted']);
  tb.appendChild(el('thead', {}, [ el('tr', {}, heads.map((h, i) =>
    el('th', { class: i ? 'num' : '', text: h }))) ]));
  const body = el('tbody');
  const rowFor = (r, combined) => {
    const cells = [
      el('td', { html: combined ? '<b>Combined</b>'
        : `<b>${esc(r.region)}</b><div class="cellsub">${r.owners.length} rep${r.owners.length === 1 ? '' : 's'}</div>` }),
      el('td', { class: 'num mono', html: money(r.commit) }),
      el('td', { class: 'num mono', style: 'color:var(--ink-2)', html: money(r.best) }),
      el('td', { class: 'num mono', html: money(r.forecast) }),
      el('td', { class: 'num mono', style: 'color:var(--ink-2)',
        html: money(r.pipeline) + `<div class="cellsub">${r.openN} open</div>` }),
      el('td', { class: 'num mono', style: 'color:var(--good-ink)',
        html: money(r.closed) + `<div class="cellsub">${r.wonN} deals</div>` }),
      el('td', { class: 'num mono', style: 'color:var(--critical-ink)',
        html: money(r.lostVal) + `<div class="cellsub">${r.lostN} deals</div>` })
    ].concat(unitLines().map(L => el('td', { class: 'num mono',
        html: r.units[L] ? String(r.units[L]) : '<span class="cellsub">—</span>' })))
     .concat([
      el('td', { class: 'num mono', html: r.quotes ? String(r.quotes) : '<span class="cellsub">—</span>' }),
      el('td', { class: 'num', html: r.slots
        ? `<span class="tag ${r.locked === r.slots ? 'good' : 'warn'}">${r.locked}/${r.slots}</span>`
        : '<span class="cellsub">nothing entered</span>' })
    ]);
    const tr = el('tr', combined ? { class: 'tot' } : {});
    cells.forEach(c => tr.appendChild(c));
    if (!combined) {
      tr.style.cursor = 'pointer';
      tr.addEventListener('click', e => { if (!e.target.closest('button,a')) {
        VIEW.monthRegion = VIEW.monthRegion === r.region ? null : r.region; render(); } });
    }
    return tr;
  };
  rolls.forEach(r => body.appendChild(rowFor(r, false)));
  body.appendChild(rowFor(all, true));
  tb.appendChild(body);
  rc.body.appendChild(el('div', { class: 'tw' }, [tb]));
  if (!regions.length) rc.body.appendChild(el('p', { class: 'sub', style: 'margin:var(--sp-3) 0 0',
    text: 'No active reps yet. Add your team in Settings and give each person a sales region.' }));
  if (usingTeamSplit(mb)) rc.body.appendChild(el('p', { class: 'sub',
    style: 'margin:var(--sp-3) 0 0;line-height:1.55', html:
    'Nobody has a personal target for this month, so the <b>team</b> target is being split across the regions by headcount. ' +
    'That keeps the combined row honest, but it is a split, not a plan — give each rep a target in Settings and these become real.' }));
  if (regions.includes(UNASSIGNED_REGION)) rc.body.appendChild(el('p', { class: 'sub',
    style: 'margin:var(--sp-3) 0 0;line-height:1.55',
    html: `Some reps have no region set, so their numbers sit under <b>Unassigned</b>. ` +
      (isAdmin() ? 'Set one on each person in Settings → the team table.'
                 : 'An admin can set one in Settings.') }));
  root.appendChild(el('div', { style: 'margin-bottom:var(--sp-3)' }, [rc.node]));

  /* ---- region split of the month's committed value */
  if (rolls.length > 1) {
    const g = el('div', { class: 'grid2', style: 'margin-bottom:var(--sp-3)' });
    const c1 = card('Commit by region', scopeLabel);
    chartHBar(c1.body, rolls.map(r => ({ label: r.region, value: Math.round(r.commit),
      note: `${r.cRecs.length} deals · forecast ${CFG.currency} ${money(r.forecast, {compact:true})}` }))
      .sort((a, b) => b.value - a.value), { xLabel: CFG.currency });
    g.appendChild(c1.node);
    const c2 = card('Closed won by region', monthLabel(mk));
    chartHBar(c2.body, rolls.map(r => ({ label: r.region, value: Math.round(r.closed),
      note: `${r.wonN} deals · ${r.target ? pct(r.closed, r.target) + '% of target' : 'no target set'}` }))
      .sort((a, b) => b.value - a.value), { xLabel: CFG.currency, color: 'var(--s3)' });
    g.appendChild(c2.node);
    root.appendChild(g);
  }

  /* ---- the reps, grouped by region */
  const only = VIEW.monthRegion && regions.includes(VIEW.monthRegion) ? VIEW.monthRegion : null;
  if (only) root.appendChild(el('div', { style: 'display:flex;align-items:center;gap:var(--sp-2);margin-bottom:var(--sp-3)' }, [
    el('span', { class: 'sub', html: `Showing <b>${esc(only)}</b> only` }),
    el('button', { class: 'btn sm ghost', text: 'Show every region',
      onclick: () => { VIEW.monthRegion = null; render(); } })
  ]));
  (only ? [only] : regions).forEach(region => {
    const owners = activeOwners().filter(o => ownerRegion(o.id) === region);
    if (!owners.length) return;
    const rr = regionRoll(region, scope, mb);
    const head = card(region, `${owners.length} rep${owners.length === 1 ? '' : 's'} · commit ${
      CFG.currency} ${money(rr.commit, {dash:false})} · forecast ${CFG.currency} ${money(rr.forecast, {dash:false})}${
      unitLines().filter(L => rr.units[L]).length
        ? ' · ' + unitLines().filter(L => rr.units[L]).map(L => `${rr.units[L]} ${L}`).join(' · ') : ''}`);
    const host = el('div'); head.body.appendChild(host);
    dataTable(host, {
      key: 'mrep-' + region, noun: 'reps', rows: owners.map(o => monthRepRow(o, scope, mb)), per: 30,
      defaultSort: 1, defaultDir: -1,
      cols: [
        { h: 'Rep', v: r => r.o.name, r: r => ownerCell(r.o.id) },
        { h: 'Commit', num: true, v: r => r.commit,
          r: r => `<span class="mono">${money(r.commit)}</span><div class="cellsub">${r.cN} deals</div>` },
        { h: 'Best case', num: true, v: r => r.best,
          r: r => `<span class="mono" style="color:var(--ink-2)">${money(r.best)}</span>` },
        { h: 'Forecast', num: true, v: r => r.forecast, r: r => `<span class="mono">${money(r.forecast)}</span>` },
        { h: 'Pipeline', num: true, v: r => r.pipeline,
          r: r => `<span class="mono" style="color:var(--ink-2)">${money(r.pipeline)}</span>` },
        { h: 'Closed won', num: true, v: r => r.closed,
          r: r => `<span class="mono" style="color:var(--good-ink)">${money(r.closed)}</span><div class="cellsub">${r.wonN} deals</div>` }
      ].concat(unitLines().map(L => ({ h: L, num: true, v: r => r.units[L] || 0,
        r: r => r.units[L] ? String(r.units[L]) : '<span class="cellsub">—</span>' })))
       .concat([
        { h: 'vs target', num: true, v: r => r.target ? r.closed / r.target : 0, r: r => {
            if (!r.target) return '<span class="cellsub">no target</span>';
            const p = pct(r.closed, r.target);
            return `<span class="tag ${p >= 100 ? 'good' : p >= 60 ? 'warn' : 'bad'}">${p}%</span>`; } },
        { h: 'Submitted', num: true, v: r => r.locked, r: r => r.slots
            ? `<span class="tag ${r.locked === r.slots ? 'good' : 'warn'}">${r.locked}/${r.slots}</span>`
            : '<span class="cellsub">—</span>' }
      ]),
      onRow: r => { VIEW.rep = r.o.id; VIEW.week = sel || weeks[0]; renderTopControls(); go('review'); }
    });
    root.appendChild(el('div', { style: 'margin-bottom:var(--sp-3)' }, [head.node]));
  });
}

function monthRepRow(o, weeks, mb) {
  let commit = 0, best = 0, forecast = 0, cN = 0, bN = 0, locked = 0, slots = 0;
  const units = {}, recs = [];
  weeks.forEach(k => {
    const x = repWeek(o, k, weekRange(k));
    commit += x.commitVal; best += x.bestVal; forecast += x.forecast;
    cN += x.cRecs.length; bN += x.bRecs.length;
    recs.push.apply(recs, x.cRecs.concat(x.bRecs));
    if (x.cRecs.length || x.bRecs.length || x.r.locked) { slots++; if (x.r.locked) locked++; }
  });
  unitLines().forEach(L => { const n = unitTotal(recs, L); if (n) units[L] = n; });
  const mine = ownedDeals(o.id);
  const won = mine.filter(d => isWon(d) && inPeriod(d.closeDate, mb));
  return { o, commit, best, forecast, cN, bN, units, locked, slots,
    pipeline: sum(mine.filter(isOpen), d => d.amount),
    closed: sum(won, d => d.amount), wonN: won.length,
    target: repTarget(o.id, mb) };
}

function exportMonthly(mk) {
  const mb = mBounds(mk + '-01');
  const weeks = weeksOfMonth(mk);
  const cur = CFG.currency, m = v => `${cur} ${money(v, { dash: false })}`;
  const L = [`# CoreV monthly review — ${monthLongLabel(mk)}`, ''];
  const all = regionRoll('all', weeks, mb);
  L.push(`Commit ${m(all.commit)} · Best case ${m(all.best)} · Weighted forecast ${m(all.forecast)}`);
  L.push(`Closed won ${m(all.closed)} (${all.wonN} deals) · Closed lost ${m(all.lostVal)} (${all.lostN} deals)`);
  L.push(`Open pipeline ${m(all.pipeline)} across ${all.openN} deals${
    all.target ? ` · target ${m(all.target)} (${pct(all.closed, all.target)}% achieved)` : ''}`);
  if (Object.keys(all.units).length)
    L.push(`Devices ${unitLines().filter(k => all.units[k]).map(k => `${all.units[k]} ${k}`).join(' · ')}`);
  L.push('');

  L.push('## By week');
  weeks.forEach(k => {
    const r = regionRoll('all', [k], mb);
    L.push(`- ${weekOfMonthLabel(mk, k)} (${weekLabel(k)}): commit ${m(r.commit)} · best case ${m(r.best)} · forecast ${m(r.forecast)}${
      r.slots ? ` · ${r.locked}/${r.slots} submitted` : ''}`);
  });
  L.push('');

  regionsInPlay().forEach(region => {
    const r = regionRoll(region, weeks, mb);
    L.push(`## ${region}`);
    L.push(`- Reps: ${r.owners.map(o => o.name).join(', ') || 'none'}`);
    L.push(`- Commit ${m(r.commit)} · Best case ${m(r.best)} · Forecast ${m(r.forecast)}`);
    L.push(`- Pipeline ${m(r.pipeline)} · Closed won ${m(r.closed)} · Closed lost ${m(r.lostVal)}`);
    if (r.target) L.push(`- Target ${m(r.target)} — ${pct(r.closed, r.target)}% achieved`);
    if (Object.keys(r.units).length)
      L.push(`- Devices ${unitLines().filter(k => r.units[k]).map(k => `${r.units[k]} ${k}`).join(' · ')}`);
    r.owners.forEach(o => {
      const row = monthRepRow(o, weeks, mb);
      L.push(`  - ${o.name}: commit ${m(row.commit)} · forecast ${m(row.forecast)} · closed ${m(row.closed)}${
        Object.keys(row.units).length ? ' · ' + unitLines().filter(k => row.units[k]).map(k => `${row.units[k]} ${k}`).join(' · ') : ''}${
        row.slots ? ` · ${row.locked}/${row.slots} weeks submitted` : ''}`);
    });
    L.push('');
  });
  download(`corev-monthly-review-${mk}.md`, L.join('\n'), 'text/markdown');
  toast('Month exported', 'ok');
}
/* ================================================================
   DEMO TRACKER — carried over from the OxeFit Sales Tracker.

   The concepts are the tracker's, unchanged: a demo is logged against a
   primary rep with any number of supporting reps, every one of whom is
   credited; the outcome runs Pending → Won / 2nd demo / Site survey /
   No show / Lost; conversion is measured against demos run, not against
   deals; and each demo carries a timeline of short updates rather than
   one overwritten comment field.

   What changes is what a demo is attached to. In the tracker a demo held
   a typed client name and a HubSpot deal id. Here it links to the CRM's
   own company and deal records, so "converted to a deal" is a fact the
   tool can check rather than a number somebody typed.
   ================================================================ */

const DEMO_OUTCOMES = [
  { v: 'Pending',   label: 'Pending — too early to call', cls: 'pending' },
  { v: 'Won',       label: 'Won — converted to a deal',   cls: 'converted' },
  { v: '2nd demo',  label: '2nd demo needed',             cls: 'pending' },
  { v: 'Site survey', label: 'Site survey',               cls: 'pending' },
  { v: 'No show',   label: 'No show',                     cls: 'lost' },
  { v: 'Lost',      label: 'Lost — no deal',              cls: 'lost' }
];
const DEMO_TYPES = ['On-site', 'Showroom', 'Virtual', 'Trade Show'];
const demoOutcome = v => DEMO_OUTCOMES.find(o => o.v === demoNorm(v)) || DEMO_OUTCOMES[0];
/* the tracker wrote "Converted" for a while before settling on "Won" */
const demoNorm = v => (v === 'Converted' ? 'Won' : (v || 'Pending'));
const demoIsWon = d => demoNorm(d.outcome) === 'Won';
const demoIsLost = d => ['Lost', 'No show'].includes(demoNorm(d.outcome));
const demoPending = d => !demoIsWon(d) && !demoIsLost(d);
const demoCls = d => demoOutcome(d.outcome).cls;

/* products offered on a demo follow the configured device lines */
const demoProducts = () => unitLines().concat(unitLines().length > 1 ? [unitLines().join(' + ')] : [])
  .concat(['Full range']);

/* ---- who is credited -------------------------------------------------
   The tracker excluded the office and the management team from the rep
   league table so the numbers described the field. Here that is a flag on
   the person rather than a hard-coded list of names, defaulting to the
   same effect: anyone in a region marked "not field sales" is left out. */
const demoExcludedRegions = () => (DB.config.demoExcludeRegions ||
  (salesRegions().includes('Management') ? ['Management'] : [])).slice();
function demoCounts(ownerId) {
  const o = DB.owners.find(x => x.id === String(ownerId));
  if (!o) return false;
  if (o.demoCounts === false) return false;
  if (o.demoCounts === true) return true;
  return !demoExcludedRegions().includes(ownerRegion(o.id));
}
const demoSupport = d => Array.isArray(d.supportIds) ? d.supportIds.filter(Boolean) : [];
function demoCredits(d, ownerId) {
  const id = String(ownerId);
  return String(d.ownerId) === id || demoSupport(d).some(x => String(x) === id);
}
/* one row per (rep, demo) pair — the primary plus each supporter, so an
   assist shows up in that rep's total exactly as the tracker counted it */
function demoExpand(rows) {
  const out = [];
  rows.forEach(d => {
    const seen = new Set();
    if (d.ownerId && demoCounts(d.ownerId)) { out.push({ id: String(d.ownerId), d, role: 'primary' }); seen.add(String(d.ownerId)); }
    demoSupport(d).forEach(s => {
      if (!seen.has(String(s)) && demoCounts(s)) { out.push({ id: String(s), d, role: 'support' }); seen.add(String(s)); }
    });
  });
  return out;
}

/* ---- permissions ---- */
const demoCanEdit = d => canManageDemos() ||
  (!isReadOnly() && d && demoCredits(d, currentOwnerId()));
/* a rep may only touch the outcome, the deal link and the updates */
const demoRepOnly = d => !canManageDemos() && demoCanEdit(d);

/* ---- a demo with no outcome, well past its date, is the thing that rots --- */
const DEMO_CHASE_DAYS = 1;
function demoNeedsOutcome(d) {
  if (!demoPending(d) || demoNorm(d.outcome) !== 'Pending') return false;
  return d.date && days(TODAY(), d.date) >= DEMO_CHASE_DAYS;
}

function demoScope() {
  const all = live('demos');
  const b = periodBounds(VIEW.demoPeriod);
  return all.filter(d => {
    if (VIEW.demoPeriod !== 'all' && !inPeriod(d.date, b)) return false;
    if (VIEW.rep !== 'all' && !demoCredits(d, VIEW.rep)) return false;
    if (VIEW.demoRep && !demoCredits(d, VIEW.demoRep)) return false;
    if (VIEW.demoOutcome && demoNorm(d.outcome) !== VIEW.demoOutcome) return false;
    return true;
  });
}

const demoClient = d => d.client || (d.companyId && (getCo(d.companyId) || {}).name) || 'Unnamed';

function demoWeekLabel(date) {

/* ------------------------------------------------- one demo, in a drawer */
function openDemo(id) {

  /* the updates timeline */

  const ups = (d.updates || []).slice();
  const list = el('div', { class: 'nlist', style: 'margin-bottom:var(--sp-3)' });
  if (!ups.length) list.appendChild(el('div', { class: 'nitem', style: 'color:var(--ink-3)',

  ups.forEach((u, i) => list.appendChild(el('div', { class: 'nitem' }, [
    el('span', { class: 'ic', html: ico('note',13) }),
    el('div', { style: 'flex:1' }, [
      el('div', { text: u.text }),
      el('div', { style: 'font-size:var(--fs-xs);color:var(--ink-3);margin-top:2px',

    ]),
    demoCanEdit(d) ? el('button', { html: ico('x',12), 'aria-label': 'Remove',

  ].filter(Boolean))));
  c2.body.appendChild(list);
  if (demoCanEdit(d)) {
    const ta = el('textarea', { class: 'inp', rows: 2, placeholder: 'What happened? Keep it to a couple of lines.' });
    const count = el('div', { class: 'sub', style: 'margin-top:4px' });
    const MAXW = 60;
    const words = v => (v.trim() ? v.trim().split(/\s+/).length : 0);

    const post = () => {
      const v = ta.value.trim();
      if (!v) return toast('Write an update first');
      if (words(v) > MAXW) return toast(`That is ${words(v)} words — trim it to ${MAXW}`, 'err');
      d.updates = (d.updates || []).concat([{ at: new Date().toISOString(),
        by: (AUTH.user && AUTH.user.username) || 'local', text: v }]);
      upsert('demos', d); openDemo(id); toast('Update posted', 'ok');
    };
    ta.addEventListener('keydown', e => { if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') { e.preventDefault(); post(); } });
    c2.body.appendChild(fld('Post an update', ta));
    c2.body.appendChild(count);
    c2.body.appendChild(el('button', { class: 'btn sm primary', style: 'margin-top:8px',
      text: 'Post', onclick: post }));
  }
  body.appendChild(c2.node);

  if (d.notes) {
    const c3 = card('Notes', 'From when the demo was booked');
    c3.body.appendChild(el('p', { style: 'margin:0;line-height:1.6;color:var(--ink-2)', text: d.notes }));
    body.appendChild(c3.node);
  }

  const foot = el('div', { class: 'foot' });
  if (canManageDemos()) {
    foot.appendChild(el('button', { class: 'btn', html: ico('edit',14) + ' Edit', onclick: () => editDemo(d) }));
    foot.appendChild(el('div', { style: 'flex:1' }));
    foot.appendChild(el('button', { class: 'btn danger', html: ico('trash',14) + ' Delete',
      onclick: () => confirmDo('Delete this demo', `The demo for ${demoClient(d)} on ${fdate(d.date)} is removed for everyone.`,
        'Delete', () => { remove('demos', d.id); closeAll(); render(); toast('Demo deleted'); }) }));
  }
  drawer([head, body, foot]);
}

/* ------------------------------------------------------- log / edit form */
function editDemo(d) {
  if (!canManageDemos()) return toast('Only the office or an admin can log a demo', 'err');
  const isNew = !d;
  d = d || { date: TODAY(), outcome: 'Pending', type: 'On-site' };
  const date = el('input', { class: 'inp', type: 'date', value: (d.date || TODAY()).slice(0, 10) });
  const own = ownerSelect(d.ownerId || currentOwnerId(), { emptyLabel: 'Pick the rep who ran it' });
  const sup = ownerMulti(demoSupport(d), d.ownerId);
  const client = el('input', { class: 'inp', value: d.client || '', placeholder: 'e.g. Emirates Wellness Group' });
  const cp = coPicker(d.companyId);
  const type = el('select', { class: 'inp' });
  DEMO_TYPES.forEach(t => type.appendChild(el('option', { value: t, text: t, selected: d.type === t || null })));
  const prod = el('select', { class: 'inp' });
  prod.appendChild(el('option', { value: '', text: 'Not recorded' }));
  demoProducts().forEach(p => prod.appendChild(el('option', { value: p, text: p, selected: d.product === p || null })));
  const loc = el('input', { class: 'inp', value: d.location || '', placeholder: 'Showroom, client site, city…' });
  const out = el('select', { class: 'inp' });
  DEMO_OUTCOMES.forEach(x => out.appendChild(el('option', { value: x.v, text: x.label,
    selected: demoNorm(d.outcome) === x.v || null })));
  const notes = el('textarea', { class: 'inp', rows: 2, value: d.notes || '',
    placeholder: 'Anything the rep needs to know before walking in' });

  modal(isNew ? 'Log a demo' : 'Edit demo', el('div', {}, [
    el('div', { class: 'field-row' }, [ fld('Date *', date), fld('Type', type) ]),
    fld('Rep who ran it *', own),
    fld('Supporting reps', sup.node, 'Everyone ticked here is credited with the demo as well.'),
    fld('Client *', client, 'The name as the team says it. Link the company below if it is already in the CRM.'),
    fld('Company', cp.node),
    el('div', { class: 'field-row' }, [ fld('Product shown', prod), fld('Location', loc) ]),
    fld('Outcome', out),
    fld('Notes', notes)
  ]), [
    el('button', { class: 'btn', text: 'Cancel', onclick: closeAll }),
    el('button', { class: 'btn primary', text: isNew ? 'Log it' : 'Save', onclick: () => {
      if (!date.value) { date.focus(); return toast('A date is required', 'err'); }
      if (!own.value) { own.focus(); return toast('Pick the rep who ran it', 'err'); }
      const co = cp.get();
      if (!client.value.trim() && !co) { client.focus(); return toast('A client name or a company is required', 'err'); }
      const rec = Object.assign({}, d, {
        date: date.value, ownerId: own.value, supportIds: sup.get().filter(x => x !== own.value),
        client: client.value.trim() || null, companyId: co || null,
        type: type.value, product: prod.value || null, location: loc.value.trim() || null,
        outcome: out.value, notes: notes.value.trim() || null,
        createdAt: d.createdAt || new Date().toISOString()
      });
      const saved = upsert('demos', rec);
      logAct({ dealId: saved.dealId || null, ownerId: saved.ownerId, kind: 'note',
        html: `${isNew ? 'Logged' : 'Updated'} a <b>${esc(saved.type || 'demo')}</b> demo for <b>${esc(demoClient(saved))}</b>` });
      closeAll(); render(); toast(isNew ? 'Demo logged' : 'Saved', 'ok');
    } })
  ]);
}

function exportDemos(rows) {
  const cols = [
    { h: 'Date', f: d => d.date || '' },
    { h: 'Week', f: d => demoWeekLabel(d.date) },
    { h: 'Rep', f: d => ownerName(d.ownerId) },
    { h: 'Supporting reps', f: d => demoSupport(d).map(ownerName).join(' / ') },
    { h: 'Client', f: d => demoClient(d) },
    { h: 'Company', f: d => (getCo(d.companyId) || {}).name || '' },
    { h: 'Type', f: d => d.type || '' },
    { h: 'Product', f: d => d.product || '' },
    { h: 'Location', f: d => d.location || '' },
    { h: 'Outcome', f: d => demoNorm(d.outcome) },
    { h: 'Deal', f: d => (getDl(d.dealId) || {}).name || '' },
    { h: 'Deal stage', f: d => d.dealId && getDl(d.dealId) ? stage(getDl(d.dealId).stageId).label : '' },
    { h: 'Updates', f: d => (d.updates || []).map(u => u.text).join(' | ') },
    { h: 'Notes', f: d => d.notes || '' }
  ];
  if (!rows.length) return toast('Nothing to export', 'err');
  download('corev-demos.csv', toCSV(rows, cols), 'text/csv');
  toast(`${rows.length} demos exported`, 'ok');
}
/* ================================================================
   DEMO REQUESTS — the event / on-site request queue from the tracker.

   A rep asks for a demo or an event; the office or an admin approves or
   declines it; an approved request becomes a logged demo without anyone
   retyping the client, the date or the devices. A rep sees and edits
   their own while it is still pending, and everyone with write access
   can raise one.
   ================================================================ */

const REQ_KINDS  = ['On-site demo', 'Event'];
const REQ_EVENTS = ['Pilot', 'Client activation', 'Event', 'Conditional POC'];
const REQ_STATUS = [
  { v: 'Pending',  tag: 'warn' },
  { v: 'Approved', tag: 'good' },
  { v: 'Declined', tag: 'bad' },
  { v: 'Done',     tag: '' }
];
const REQ_AUDIENCE = ['Members', 'Athletes', 'Clinicians', 'Hotel guests', 'Corporate', 'Press', 'VIP / Government'];
const reqStatus = r => (r && r.status) || 'Pending';
const reqTag = r => (REQ_STATUS.find(s => s.v === reqStatus(r)) || REQ_STATUS[0]).tag;
const reqIsMine = r => String(r.ownerId) === String(currentOwnerId());
/* a rep owns their request only while it is still pending */
const reqCanEdit = r => canManageDemos() ||
  (!isReadOnly() && reqIsMine(r) && reqStatus(r) === 'Pending');
const reqVisible = r => canManageDemos() || isReadOnly() || reqIsMine(r);

function reqScope() {
  return live('demoRequests')
    .filter(reqVisible)
    .filter(r => !VIEW.reqStatus || reqStatus(r) === VIEW.reqStatus)
    .filter(r => VIEW.rep === 'all' || String(r.ownerId) === VIEW.rep)
    .sort((a, z) => String(z.createdAt || '').localeCompare(String(a.createdAt || '')));
}

function viewRequests(root) {
  const rows = reqScope();
  const all = live('demoRequests').filter(reqVisible);

  root.appendChild(viewHead(null, [
    el('button', { class: 'btn', html: ico('dl',14) + ' Export', onclick: () => exportRequests(rows) }),
    isReadOnly() ? null : el('button', { class: 'btn primary', html: ico('plus',14) + ' Raise a request',
      onclick: () => editRequest(null) })
  ]));

  const pending = all.filter(r => reqStatus(r) === 'Pending');
  const t = el('div', { class: 'tiles' });
  t.appendChild(tile('Waiting on a decision', String(pending.length), { icon: 'cal',
    foot: pending.length ? `oldest raised ${fdate((pending.map(r => r.createdAt).sort()[0] || '').slice(0,10))}` : 'nothing outstanding',
    onclick: () => { VIEW.reqStatus = 'Pending'; render(); } }));
  t.appendChild(tile('Approved', String(all.filter(r => reqStatus(r) === 'Approved').length),
    { icon: 'check', foot: 'ready to run' }));
  t.appendChild(tile('Declined', String(all.filter(r => reqStatus(r) === 'Declined').length),
    { icon: 'x', foot: 'not going ahead' }));
  t.appendChild(tile('Committed spend', money(sum(all.filter(r => reqStatus(r) === 'Approved'), r => r.cost)),
    { cur: true, icon: 'bolt', foot: 'expected cost of approved requests' }));
  root.appendChild(t);

  if (canManageDemos() && pending.length) {
    const n = el('div', { class: 'alert', style: 'margin-bottom:var(--sp-3)' });
    n.appendChild(el('span', { class: 'ic', html: ico('warn',18) }));
    n.appendChild(el('div', { style: 'flex:1;min-width:0;line-height:1.5', html:
      `<b>${pending.length} request${pending.length === 1 ? '' : 's'} waiting on you</b>` +
      `<div class="sub">${esc(pending.slice(0,4).map(r => `${r.client} (${ownerName(r.ownerId)})`).join(', '))}${
        pending.length > 4 ? ` and ${pending.length - 4} more` : ''}</div>` }));
    root.appendChild(n);
  }

  root.appendChild(filterBar([
    selectFilter('Status', VIEW.reqStatus || '',
      [['', 'Every status']].concat(REQ_STATUS.map(s => [s.v, s.v])),
      v => { VIEW.reqStatus = v || null; render(); }, 150),
    VIEW.reqStatus ? el('button', { class: 'btn sm ghost', text: 'Clear',
      onclick: () => { VIEW.reqStatus = null; render(); } }) : null
  ]));

  if (!rows.length) {
    root.appendChild(el('div', { class: 'empty', html: ico('cal',34) +
      '<h4>No requests here</h4><p>' + (isReadOnly() ? 'Nothing has been raised yet.'
        : 'Raise one when a client wants a demo on their site, or when an event needs devices and people.') + '</p>' }));
    return;
  }

  const list = el('div', { class: 'reqlist' });
  rows.forEach(r => list.appendChild(requestCard(r)));
  root.appendChild(list);
}

/* The link in the approval email lands here: scroll the request into view,
   highlight it, and say plainly if it has already been decided. */
function openRequestById(id) {
  const r = live('demoRequests').find(x => x.id === String(id));
  if (!r) return toast('That request is not here any more', 'err');
  VIEW.reqFocus = r.id;
  /* Arriving from a link has to beat whatever filters were left on the page,
     or the approver follows the mail and lands on a list that does not show
     the one thing they came for. */
  VIEW.reqStatus = null;
  if (VIEW.rep !== 'all' && String(r.ownerId) !== VIEW.rep) VIEW.rep = 'all';
  VIEW.name = 'requests';
  render();
  if (!reqVisible(r)) return toast('That request belongs to someone else', 'err');
  setTimeout(() => {
    const n = document.querySelector(`.reqcard[data-req="${CSS.escape(r.id)}"]`);
    if (!n) return;
    n.scrollIntoView({ block: 'center', behavior: 'smooth' });
    n.classList.add('focused');
    if (reqStatus(r) !== 'Pending')
      toast(`This one was already ${reqStatus(r).toLowerCase()}`, '');
  }, 60);
}
function requestCard(r) {
  const n = el('div', { class: 'reqcard' + (reqStatus(r) === 'Pending' ? ' pending' : '')
    + (VIEW.reqFocus === r.id ? ' focused' : '') });
  n.dataset.req = r.id;
  n.appendChild(el('header', {}, [
    el('div', { style: 'min-width:0;flex:1' }, [
      el('div', { class: 'nm', text: r.client || 'Unnamed' }),
      el('div', { class: 'rl', html: `${esc(r.kind || 'On-site demo')}${r.eventType ? ' · ' + esc(r.eventType) : ''} · raised by ${
        esc(ownerName(r.ownerId))}${r.createdAt ? ' · ' + esc(fdate(r.createdAt)) : ''}` })
    ]),
    el('span', { class: 'tag ' + reqTag(r), text: reqStatus(r) })
  ]));
  const b = el('div', { class: 'b' });
  const kv = el('dl', { class: 'kvs' });
  const add = (k, v) => { kv.appendChild(el('dt', { text: k })); kv.appendChild(el('dd', { html: v })); };
  add('When', `${esc(fdate(r.startDate))}${r.endDate && r.endDate !== r.startDate ? ' – ' + esc(fdate(r.endDate)) : ''}`);
  if (r.location) add('Location', esc(r.location));
  if ((r.devices || []).length) add('Devices', esc(r.devices.join(' + ')));
  if (r.cost) add('Expected cost', `${CFG.currency} ${money(r.cost, { dash: false })}`);
  if (r.participants) add('Participating', esc(r.participants));
  b.appendChild(kv);
  if (r.details) b.appendChild(el('p', { style: 'margin:0 0 var(--sp-3);line-height:1.6;color:var(--ink-2)', text: r.details }));

  /* Whether the approver actually heard about it. A rep should never have to
     wonder, and a request nobody was told about needs a visible way to fix it. */
  if (reqStatus(r) === 'Pending') {
    const line = el('div', { class: 'sub', style: 'margin:0 0 var(--sp-3);display:flex;gap:8px;align-items:center;flex-wrap:wrap' });
    if (r.notifiedAt) line.appendChild(el('span', { style: 'color:var(--good-ink)',
      html: ico('check',12) + ` ${esc(r.notifiedTo || approverAddress())} was emailed ${esc(frel(r.notifiedAt.slice(0,10)))}` }));
    else {
      line.appendChild(el('span', { style: 'color:var(--warning)',
        html: ico('warn',12) + ' The approver has not been emailed about this one yet.' }));
      if (!isReadOnly()) line.appendChild(el('button', { class: 'btn sm', text: 'Send it now',
        onclick: () => notifyApprover(r).then(() => render()) }));
    }
    b.appendChild(line);
  }

  if (r.kind === 'Event') {
    const ev = el('div', { class: 'reqev' });
    const cell = (k, v) => ev.appendChild(el('div', {}, [
      el('span', { class: 'k', text: k }), el('span', { class: 'v', html: v }) ]));
    if (r.organizer) cell('Organiser & host', esc(r.organizer));
    if (r.opHours)   cell('Operating hours', esc(r.opHours));
    if (r.footfall)  cell('Expected footfall', money(r.footfall, { dash: false }));
    if (r.contact)   cell('Primary contact', esc(r.contact));
    if ((r.audience || []).length) cell('Audience', r.audience.map(a => `<span class="tag">${esc(a)}</span>`).join(' '));
    cell('VIP attending', r.vip ? 'Yes' : 'No');
    cell('Media coverage', r.media ? 'Yes' : 'No');
    if (r.leads || r.revenueOpp) cell('Expected outcome',
      [r.leads ? `${r.leads} leads` : '', r.revenueOpp ? `${CFG.currency} ${money(r.revenueOpp, {dash:false})} potential` : '']
        .filter(Boolean).join(' · '));
    cell('Budget confirmed', r.budgetConfirmed
      ? 'Yes' + (r.budgetAmount ? ` · ${CFG.currency} ${money(r.budgetAmount, {dash:false})}` : '') : 'No');
    if (r.strategic) cell('Strategic value', esc(r.strategic));
    b.appendChild(ev);
  }
  if (r.plan) {
    b.appendChild(el('label', { class: 'fl', text: 'Project plan' }));
    b.appendChild(el('p', { style: 'margin:0 0 var(--sp-3);line-height:1.6;color:var(--ink-2)', text: r.plan }));
  }
  if (r.commercial) {
    b.appendChild(el('label', { class: 'fl', text: 'Path to commercial' }));
    b.appendChild(el('p', { style: 'margin:0 0 var(--sp-3);line-height:1.6;color:var(--ink-2)', text: r.commercial }));
  }
  if (r.decisionNote) b.appendChild(el('p', { class: 'sub', style: 'margin:0 0 var(--sp-3);line-height:1.55',
    html: `<b>${esc(reqStatus(r))}</b>${r.decidedBy ? ' by ' + esc(String(r.decidedBy).split('@')[0]) : ''}${
      r.decidedAt ? ' · ' + esc(fdate(r.decidedAt)) : ''} — ${esc(r.decisionNote)}` }));

  const foot = el('div', { style: 'display:flex;gap:var(--sp-2);flex-wrap:wrap;align-items:center' });
  if (canManageDemos() && reqStatus(r) === 'Pending') {
    foot.appendChild(el('button', { class: 'btn sm primary', html: ico('check',12) + ' Approve',
      onclick: () => decideRequest(r, 'Approved') }));
    foot.appendChild(el('button', { class: 'btn sm', style: 'color:var(--critical-ink)',
      html: ico('x',12) + ' Decline', onclick: () => decideRequest(r, 'Declined') }));
  }
  if (canManageDemos() && reqStatus(r) === 'Approved' && !r.demoId) {
    foot.appendChild(el('button', { class: 'btn sm primary', html: ico('board',12) + ' Log it as a demo',
      title: 'Carries the client, date, devices and people straight into the demo log',
      onclick: () => requestToDemo(r) }));
  }
  if (r.demoId && live('demos').some(d => d.id === r.demoId)) {
    foot.appendChild(el('button', { class: 'btn sm', html: ico('board',12) + ' Open the demo',
      onclick: () => openDemo(r.demoId) }));
  }
  foot.appendChild(el('div', { style: 'flex:1' }));
  if (reqCanEdit(r)) foot.appendChild(el('button', { class: 'btn sm ghost', html: ico('edit',12) + ' Edit',
    onclick: () => editRequest(r) }));
  if (canManageDemos() || (reqIsMine(r) && reqStatus(r) === 'Pending' && !isReadOnly()))
    foot.appendChild(el('button', { class: 'btn sm ghost', style: 'color:var(--critical-ink)',
      html: ico('trash',12), 'aria-label': 'Delete',
      onclick: () => confirmDo('Delete this request', `The ${r.kind || 'request'} for ${r.client} is removed for everyone.`,
        'Delete', () => { remove('demoRequests', r.id); render(); toast('Request deleted'); }) }));
  b.appendChild(foot);
  n.appendChild(b);
  return n;
}

function decideRequest(r, status) {
  const note = el('textarea', { class: 'inp', rows: 2,
    placeholder: status === 'Approved' ? 'Anything the rep should know — budget caveats, dates, who is coming.'
                                       : 'Why not, and what would change the answer.' });
  modal(`${status === 'Approved' ? 'Approve' : 'Decline'} — ${r.client}`, el('div', {}, [
    el('p', { style: 'margin:0 0 var(--sp-4);color:var(--ink-2);line-height:1.6', html:
      `${esc(ownerName(r.ownerId))} raised this ${esc((r.kind || 'request').toLowerCase())} for <b>${esc(r.client)}</b>` +
      `${r.startDate ? ` on <b>${esc(fdate(r.startDate))}</b>` : ''}${r.cost ? `, expected to cost <b>${CFG.currency} ${money(r.cost, {dash:false})}</b>` : ''}.` +
      (status === 'Approved' ? ' Approving it lets the office log it as a demo in one click.' : '') }),
    fld(status === 'Declined' ? 'Reason *' : 'Note', note)
  ]), [
    el('button', { class: 'btn', text: 'Cancel', onclick: closeAll }),
    el('button', { class: 'btn primary', text: status, onclick: () => {
      if (status === 'Declined' && !note.value.trim()) { note.focus(); return toast('A declined request needs a reason', 'err'); }
      r.status = status;
      r.decisionNote = note.value.trim() || null;
      r.decidedBy = (AUTH.user && AUTH.user.username) || 'local';
      r.decidedAt = new Date().toISOString();
      upsert('demoRequests', r);
      closeAll(); render(); toast(`Request ${status.toLowerCase()}`, status === 'Approved' ? 'ok' : '');
      notifyDecision(r);        // the rep who raised it hears the answer
    } })
  ]);
}

/* An approved request already holds everything a demo needs, so it carries
   across rather than being typed a second time. */
function requestToDemo(r) {
  const date = el('input', { class: 'inp', type: 'date', value: (r.startDate || TODAY()).slice(0, 10) });
  const own = ownerSelect(r.ownerId, { emptyLabel: 'Pick the rep' });
  const type = el('select', { class: 'inp' });
  DEMO_TYPES.forEach(t => type.appendChild(el('option', { value: t, text: t,
    selected: (r.kind === 'Event' ? 'Trade Show' : 'On-site') === t || null })));
  modal('Log it as a demo', el('div', {}, [
    el('p', { style: 'margin:0 0 var(--sp-4);color:var(--ink-2);line-height:1.6', html:
      `<b>${esc(r.client)}</b> comes across with its date, devices and people. The outcome starts as pending — ` +
      'whoever runs it fills that in afterwards.' }),
    el('div', { class: 'field-row' }, [ fld('Date', date), fld('Type', type) ]),
    fld('Rep running it', own)
  ]), [
    el('button', { class: 'btn', text: 'Cancel', onclick: closeAll }),
    el('button', { class: 'btn primary', text: 'Log the demo', onclick: () => {
      const d = upsert('demos', {
        date: date.value, ownerId: own.value || r.ownerId, supportIds: [],
        client: r.client, companyId: r.companyId || null,
        type: type.value, product: (r.devices || []).join(' + ') || null,
        location: r.location || null, outcome: 'Pending',
        notes: [r.details, r.participants ? 'Participating: ' + r.participants : '']
          .filter(Boolean).join('\n'),
        requestId: r.id, createdAt: new Date().toISOString()
      });
      r.demoId = d.id; r.status = 'Done';
      upsert('demoRequests', r);
      closeAll(); render(); toast('Demo logged from the request', 'ok');
    } })
  ]);
}

function editRequest(r) {
  if (isReadOnly()) return toast('You have read-only access', 'err');
  const isNew = !r;
  if (r && !reqCanEdit(r)) return toast('That request has already been decided', 'err');
  r = r || { kind: 'On-site demo', status: 'Pending', devices: [], audience: [] };

  const kind = el('select', { class: 'inp', onchange: () => paintKind() });
  REQ_KINDS.forEach(k => kind.appendChild(el('option', { value: k, text: k, selected: r.kind === k || null })));
  const own = ownerSelect(r.ownerId || currentOwnerId(), { emptyLabel: 'Who is asking' });
  const client = el('input', { class: 'inp', value: r.client || '', placeholder: 'e.g. Emirates Wellness Group' });
  const cp = coPicker(r.companyId);
  const details = el('textarea', { class: 'inp', rows: 3, value: r.details || '',
    placeholder: 'The opportunity, the scope and what this is meant to achieve' });
  const start = el('input', { class: 'inp', type: 'date', value: (r.startDate || TODAY()).slice(0,10) });
  const end = el('input', { class: 'inp', type: 'date', value: (r.endDate || r.startDate || TODAY()).slice(0,10) });
  const loc = el('input', { class: 'inp', value: r.location || '', placeholder: 'Dubai, Abu Dhabi, outside the UAE…' });
  const commercial = el('input', { class: 'inp', value: r.commercial || '',
    placeholder: 'The deal or quote this leads to, or who owns the close' });
  const plan = el('textarea', { class: 'inp', rows: 3, value: r.plan || '',
    placeholder: 'Milestones, logistics, setup and teardown, dependencies' });
  const participants = el('input', { class: 'inp', value: r.participants || '',
    placeholder: 'e.g. Wafiq leading, Jawdat supporting, two client stakeholders' });
  const cost = el('input', { class: 'inp', type: 'number', min: '0', step: '100', value: r.cost || '' });
  const devs = el('div', { class: 'sigs' });
  const devSet = new Set(r.devices || []);
  unitLines().forEach(L => {

/* ================================================================
   OUTLOOK IMPORT — the shared demo calendar.

   Every non-cancelled event on demo@core-velocity.com is a demo by
   convention, so nothing is keyword-matched. The organiser becomes the
   primary rep, internal attendees become supporting reps, the first
   external attendee names the client when the subject does not, and
   anything the convention missed is shown as a warning rather than
   quietly guessed. Nothing is written until the list is confirmed.
   ================================================================ */
let OUTLOOK = { candidates: [], busy: false, kind: 'period', custom: null, read: null };

async function calendarToken() {
  if (!AUTH.msal || !AUTH.user) throw new Error('Sign in with your Microsoft account first.');
  const req = { scopes: CFG.calendarScopes, account: AUTH.msal.getActiveAccount() };
  try { return (await AUTH.msal.acquireTokenSilent(req)).accessToken; }
  catch (e) { return (await AUTH.msal.acquireTokenPopup(req)).accessToken; }
}
const repByEmail = mail => {
  const m = String(mail || '').toLowerCase();
  if (!m) return null;
  return DB.owners.find(o => (o.email || '').toLowerCase() === m) || null;
};
/* Matching a calendar person to a rep by email alone does not work here: every
   owner record came out of HubSpot without an email address, so an email-only
   match failed on EVERY event and left all 17 rows saying "still need a rep"
   with the Import button disabled. The tracker matched people by name, so this
   does the same — email first, because it is the only exact answer, then the
   display name, then the first name, and only ever when exactly one person
   fits. An ambiguous name is left for you to pick rather than guessed at. */
const norm = s => String(s || '').toLowerCase().replace(/[^a-z\s]/g, ' ').replace(/\s+/g, ' ').trim();
function repByPerson(ea) {
  if (!ea) return null;
  const hit = repByEmail(ea.address);
  if (hit) return hit;
  const people = DB.owners.filter(o => !o._del && o.active !== false);
  const name = norm(ea.name);
  if (!name) {
    /* Nothing but an address: firstname.lastname@ and firstname@ are the two
       shapes this tenant uses. */
    const local = norm(String(ea.address || '').split('@')[0].replace(/[._-]+/g, ' '));
    if (!local || !/@core-velocity\.com$/i.test(String(ea.address || ''))) return null;
    return uniqueByName(people, local);
  }
  return uniqueByName(people, name);
}
function uniqueByName(people, name) {
  const words = name.split(' ').filter(Boolean);
  const first = words[0];
  const tries = [
    o => norm(o.name) === name,                                   // full name
    o => first && norm(o.name).split(' ')[0] === first
             && words.length > 1 && norm(o.name).includes(words[words.length - 1]),  // first + last
    o => first && norm(o.name).split(' ')[0] === first            // first name alone
  ];
  for (const t of tries) {
    const hits = people.filter(t);
    if (hits.length === 1) return hits[0];
    if (hits.length > 1) return null;      // two Fatimas — ask, never guess
  }
  return null;
}
function outlookGuessType(loc) {
  const s = String(loc || '').toLowerCase();
  if (/teams|zoom|meet|virtual|online|webex/.test(s)) return 'Virtual';
  if (/showroom|office|hq|core[\s-]?velocity/.test(s)) return 'Showroom';
  if (/expo|trade ?show|conference|exhibition|gitex/.test(s)) return 'Trade Show';
  return 'On-site';
}
/* the booking convention is "<Client> — <Product>" */
function outlookParseSubject(subject) {
  const s = String(subject || '').replace(/^\s*(demo|oxefit)\s*[:\-–]\s*/i, '').trim();
  const parts = s.split(/\s+[—–\-|]\s+/);
  const out = { client: (parts[0] || '').trim(), product: null };
  const tail = (parts[1] || '').trim();
  if (tail) {
    const hit = demoProducts().find(p => p.toLowerCase() === tail.toLowerCase()) ||
                unitLines().find(L => new RegExp('\\b' + L + '\\b', 'i').test(tail));
    out.product = hit || null;
  }
  if (!out.product) {
    const hit = unitLines().filter(L => new RegExp('\\b' + L + '\\b', 'i').test(s));
    if (hit.length) out.product = hit.length > 1 ? hit.join(' + ') : hit[0];
  }
  return out;
}
function outlookMap(ev) {
  const startRaw = ev.start && ev.start.dateTime;
  const date = startRaw ? String(startRaw).slice(0, 10) : TODAY();
  let primary = repByPerson(ev.organizer && ev.organizer.emailAddress);
  const support = [], external = [];
  (ev.attendees || []).forEach(a => {
    const ea = a && a.emailAddress;
    const em = ea && ea.address;
    if (!ea) return;
    if (em && em.toLowerCase() === CFG.demoCalendar.toLowerCase()) return;
    const rep = repByPerson(ea);
    if (rep) { if (!primary) primary = rep; else if (rep.id !== primary.id && !support.includes(rep.id)) support.push(rep.id); }
    else if (em && !/@core-velocity\.com$/i.test(em)) external.push(ea);
  });
  const parsed = outlookParseSubject(ev.subject || '');
  let client = parsed.client;
  if (!client && external.length) client = external[0].name || (external[0].address || '').split('@')[0];
  const location = (ev.location && ev.location.displayName) || '';
  const co = client ? live('companies').find(c =>
    (c.name || '').toLowerCase() === client.toLowerCase()) : null;

  const warn = [];
  if (!primary) warn.push('Could not tell which rep ran this one — nobody on the invite matched the team list by email or by name. Pick one.');
  if (!client) warn.push('No client name in the subject. The convention is “Client — Product”.');
  if (!parsed.product) warn.push('No product in the subject.');
  /* The name match used to run even when BOTH names were blank, so every event
     whose subject did not parse collided with the first nameless demo on the
     same day and was quietly dropped as a duplicate. A blank never matches
     anything now. */
  const key = String(client || '').trim().toLowerCase();
  const dupe = live('demos').find(d => d.calendarId && d.calendarId === ev.id) ||
    (key ? live('demos').find(d => d.date === date &&
      String(demoClient(d) || '').trim().toLowerCase() === key) : null);
  return { ev, id: ev.id, date, ownerId: primary ? primary.id : '', supportIds: support,
    client: client || '', companyId: co ? co.id : null, product: parsed.product,
    type: outlookGuessType(location), location, subject: ev.subject || '',
    warn, dupe: dupe || null, take: !dupe };
}
/* The import used to read a fixed window: the last 14 days, ending at the
   moment you clicked. On the 29th of a month that is half the month gone and
   every booking later today or tomorrow missed — which is exactly why this
   reported 10 demos for September where the tracker reported 17. It now reads
   whatever range you ask for, whole days, past AND future, with no cap. */
const OUTLOOK_RANGES = [
  { id: 'period', label: 'The period I am looking at' },
  { id: 'm3',     label: 'Last 3 months' },
  { id: 'm6',     label: 'Last 6 months' },
  { id: 'm12',    label: 'Last 12 months' },
  { id: 'ytd',    label: 'This year' },
  { id: 'all',    label: 'Everything on the calendar' },
  { id: 'custom', label: 'Pick the dates myself' }
];
/* Whole days, past AND future, so a booking at 16:00 today — or on the 30th
   when you are importing on the 29th — is not silently outside the window. */
function outlookBounds(kind, custom) {
  const t = TODAY();
  let from, to;
  if (kind === 'custom' && custom && custom.from && custom.to) { from = custom.from; to = custom.to; }
  else if (kind === 'm3')  { from = addDays(t, -92);  to = addDays(t, 120); }
  else if (kind === 'm6')  { from = addDays(t, -184); to = addDays(t, 120); }
  else if (kind === 'm12') { from = addDays(t, -366); to = addDays(t, 120); }
  else if (kind === 'ytd') { from = t.slice(0, 4) + '-01-01'; to = t.slice(0, 4) + '-12-31'; }
  else if (kind === 'all') { from = '2020-01-01'; to = addDays(t, 365); }
  else {
    /* whatever the Demo Tracker's own period filter is set to — so "This
       month" on screen reads the whole of this month, not the last fortnight */
    const b = periodBounds(VIEW.demoPeriod);
    from = b.grain === 'all' ? '2020-01-01' : b.from;
    to   = b.grain === 'all' ? addDays(t, 365) : b.to;
  }
  if (from > to) { const x = from; from = to; to = x; }
  return { from, to };
}
async function outlookFetch(bounds) {
  const tok = await calendarToken();
  const b = bounds || outlookBounds('period');
  const out = [];
  let dropped = 0;
  /* Graph is happiest with bounded windows, so a long backfill is walked in
     one-year slices rather than asked for in a single call. */
  const SLICE = 365;
  let cursor = b.from;
  while (cursor <= b.to) {
    const sliceEnd = addDays(cursor, SLICE) < b.to ? addDays(cursor, SLICE) : b.to;
    const params = new URLSearchParams({
      startDateTime: cursor + 'T00:00:00Z',
      endDateTime: sliceEnd + 'T23:59:59Z',
      '$top': '200',
      '$select': 'id,subject,bodyPreview,start,end,location,organizer,attendees,isCancelled,seriesMasterId,type'
    });
    let url = `https://graph.microsoft.com/v1.0/users/${encodeURIComponent(CFG.demoCalendar)}/calendarView?${params}`;
    let pages = 0;
    while (url && pages < 40) {
      const res = await fetch(url, { headers: { Authorization: 'Bearer ' + tok, Prefer: 'outlook.timezone="UTC"' } });
      if (!res.ok) {
        if (res.status === 403) throw new Error(
          `No access to the ${CFG.demoCalendar} calendar. It has to be shared with you at Reviewer level or better, and the app needs the Calendars.Read.Shared permission consented.`);
        if (res.status === 404) throw new Error(`No mailbox called ${CFG.demoCalendar}. Check the address in the code.`);
        throw new Error(`Microsoft Graph returned ${res.status}.`);
      }
      const j = await res.json();
      (j.value || []).forEach(e => { if (e.isCancelled) dropped++; else out.push(e); });
      url = j['@odata.nextLink'] || null;
      pages++;
    }
    if (sliceEnd === b.to) break;
    cursor = addDays(sliceEnd, 1);
  }
  /* calendarView expands a recurring series into one event per occurrence and
     each occurrence carries its own id, so a weekly slot is many demos — which
     is right. Identical ids can still arrive twice across slice boundaries. */
  const seen = new Set(), uniq = [];
  out.forEach(e => { if (e.id && seen.has(e.id)) return; if (e.id) seen.add(e.id); uniq.push(e); });
  uniq.sort((a, b2) => String((b2.start || {}).dateTime || '').localeCompare(String((a.start || {}).dateTime || '')));
  OUTLOOK.read = { events: uniq.length, cancelled: dropped, from: b.from, to: b.to };
  return uniq;
}

async function outlookImport(kind, custom) {
  if (!canManageDemos()) return toast('Only the office or an admin can import demos', 'err');
  if (OUTLOOK.busy) return;
  if (!AUTH.user) return toast('Sign in with Microsoft first — the calendar is read over your account', 'err');
  OUTLOOK.busy = true;
  OUTLOOK.kind = kind || OUTLOOK.kind || 'month';
  if (custom) OUTLOOK.custom = custom;
  const b = outlookBounds(OUTLOOK.kind, OUTLOOK.custom);
  toast(`Reading the demo calendar, ${fdate(b.from)} to ${fdate(b.to)}…`);
  try {
    const events = await outlookFetch(b);
    OUTLOOK.candidates = events.map(outlookMap);
    outlookPicker();
  } catch (e) {
    modal('The calendar could not be read', el('div', {}, [
      el('p', { style: 'margin:0;line-height:1.65;color:var(--ink-2)', text: String(e && e.message || e) }),
      el('p', { class: 'sub', style: 'margin:var(--sp-3) 0 0;line-height:1.55', html:
        `The import reads <b>${esc(CFG.demoCalendar)}</b> over Microsoft Graph and needs the ` +
        '<b>Calendars.Read.Shared</b> permission on the app registration, consented once by an administrator. ' +
        'Until then demos can still be logged by hand.' })
    ]), [ el('button', { class: 'btn primary', text: 'Close', onclick: closeAll }) ]);
  } finally { OUTLOOK.busy = false; }
}

function outlookPicker() {
  const list = el('div', { class: 'picklist', style: 'max-height:52vh' });
  const bar = el('div', { class: 'picksum' });
  const cands = OUTLOOK.candidates;
  const read = OUTLOOK.read || { events: cands.length, cancelled: 0, from: '', to: '' };
  function paint() {
    list.innerHTML = '';
    if (!cands.length) list.appendChild(el('div', { class: 'sub', style: 'padding:18px;text-align:center',
      text: `No events on ${CFG.demoCalendar} between ${fdate(read.from)} and ${fdate(read.to)}.` }));
    cands.forEach(c => {
      const row = el('label', { class: 'pick' + (c.take ? ' on' : '') + (c.dupe ? ' taken' : '') });
      row.appendChild(el('input', { type: 'checkbox', checked: c.take || null,
        onchange: e => { c.take = e.target.checked; row.classList.toggle('on', c.take); updateSum(); } }));
      const mid = el('div', { style: 'flex:1;min-width:0' });
      mid.appendChild(el('div', { class: 'nm', text: c.client || c.subject || 'Untitled' }));
      mid.appendChild(el('div', { class: 'sub', html:
        `${esc(fdate(c.date))} · ${esc(c.type)}${c.location ? ' · ' + esc(c.location) : ''}` +
        `${c.ownerId ? ' · ' + esc(ownerName(c.ownerId)) : ''}` +
        `${c.supportIds.length ? ' + ' + esc(c.supportIds.map(ownerName).join(', ')) : ''}` +
        `${c.product ? ' · ' + esc(c.product) : ''}` }));

        text: 'Already in the log — leave it unticked unless you meant to add it twice.' }));

       explained instead of guessed at. */

      `<b>${read.events}</b> event${read.events === 1 ? '' : 's'} read` +
      (read.cancelled ? ` · ${read.cancelled} cancelled, skipped` : '') +
      (already ? ` · ${already} already in the log` : '') +
      ` · <b>${n}</b> ticked` +

  }

/* ================================================================
   APPROVAL NOTIFICATIONS

   A request raised in the tool is no use to anybody if the person who
   has to approve it never learns it exists. Submitting one now sends
   the approver a summary by email with a link straight back to that
   request, and the decision sends the rep the answer.

   It sends over Microsoft Graph as the signed-in person, which needs
   the Mail.Send permission consented once. That consent is asked for
   only at the moment a request is submitted, so nobody is made to
   grant mail access just to look at the pipeline — and if it is
   refused or unavailable, the mail opens in Outlook already written
   instead, so the flow never dead-ends with the approver uninformed.
   ================================================================ */

const approverAddress = () =>
  String((DB.config && DB.config.approver) || CFG.approver || '').trim().toLowerCase();

/* The deep link: the tool's own URL, the Demo Requests view, and the record.
   applyRoute() in the router opens it. */
function requestLink(r) {
  const base = location.origin + location.pathname + location.search;
  return `${base}#requests?r=${encodeURIComponent(r.id)}`;
}
function ownerEmail(id) {
  const o = DB.owners.find(x => x.id === String(id));
  const m = o && String(o.email || '').trim();
  return m && m.includes('@') ? m : null;
}

async function mailToken() {
  if (!AUTH.msal || !AUTH.user) throw new Error('Not signed in');
  const req = { scopes: CFG.mailScopes, account: AUTH.msal.getActiveAccount() };
  try { return (await AUTH.msal.acquireTokenSilent(req)).accessToken; }
  catch (e) { return (await AUTH.msal.acquireTokenPopup(req)).accessToken; }
}

const R = v => (v == null || v === '' ? '—' : String(v));
function requestRows(r) {
  const rows = [
    ['Request type', r.kind + (r.kind === 'Event' && r.eventType ? ` · ${r.eventType}` : '')],
    ['Client', r.client],
    ['Raised by', ownerName(r.ownerId)],
    ['Dates', r.startDate === r.endDate || !r.endDate
      ? fdate(r.startDate) : `${fdate(r.startDate)} – ${fdate(r.endDate)}`],
    ['Location', r.location],
    ['Expected cost', r.cost ? `${CFG.currency} ${money(r.cost, { dash: false })}` : null],
    ['Devices needed', (r.devices || []).join(', ')],
    ['Who is participating', r.participants],
    ['Path to commercial', r.commercial]
  ];
  if (r.kind === 'Event') rows.push(
    ['Organiser & host', r.organizer],
    ['Operating hours', r.opHours],
    ['Expected footfall', r.footfall || null],
    ['Audience', (r.audience || []).join(', ')],
    ['VIP attending', r.vip ? 'Yes' : null],
    ['Media coverage', r.media ? 'Yes' : null],
    ['Expected leads', r.leads || null],
    ['Potential revenue', r.revenueOpp ? `${CFG.currency} ${money(r.revenueOpp, { dash: false })}` : null],
    ['Budget confirmed', r.budgetConfirmed
      ? `Yes${r.budgetAmount ? ` · ${CFG.currency} ${money(r.budgetAmount, { dash: false })}` : ''}` : 'No'],
    ['Strategic value', r.strategic]);
  return rows.filter(([, v]) => v != null && v !== '' && v !== 0);
}
function requestHtml(r) {
  const link = requestLink(r);
  const rows = requestRows(r).map(([k, v]) =>
    `<tr><td style="padding:7px 14px 7px 0;color:#5b6474;vertical-align:top;white-space:nowrap">${esc(k)}</td>` +
    `<td style="padding:7px 0;color:#11151c"><b>${esc(String(v))}</b></td></tr>`).join('');
  return `<div style="font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;font-size:15px;line-height:1.6;color:#11151c;max-width:640px">
  <p style="margin:0 0 4px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:#5b6474">CoreV Sales CRM · approval needed</p>
  <h2 style="margin:0 0 6px;font-size:21px">${esc(r.kind)} — ${esc(r.client)}</h2>
  <p style="margin:0 0 18px;color:#5b6474">${esc(ownerName(r.ownerId))} submitted this for your approval.</p>
  <table style="border-collapse:collapse;margin:0 0 18px">${rows}</table>
  <p style="margin:0 0 6px;font-weight:600">What it is for</p>
  <p style="margin:0 0 22px;white-space:pre-wrap">${esc(r.details || '')}</p>
  ${r.plan ? `<p style="margin:0 0 6px;font-weight:600">Project plan</p>
  <p style="margin:0 0 22px;white-space:pre-wrap">${esc(r.plan)}</p>` : ''}
  <p style="margin:0 0 22px">
    <a href="${esc(link)}" style="background:#2f6df6;color:#fff;text-decoration:none;padding:11px 20px;border-radius:8px;display:inline-block;font-weight:600">Open it in the CRM to approve or decline</a>
  </p>
  <p style="margin:0;color:#5b6474;font-size:13px">If the button does not work, paste this into your browser:<br>
    <a href="${esc(link)}" style="color:#2f6df6">${esc(link)}</a></p>
</div>`;
}
function requestText(r) {
  return `CoreV Sales CRM — approval needed\n\n${r.kind} — ${r.client}\n` +
    `${ownerName(r.ownerId)} submitted this for your approval.\n\n` +
    requestRows(r).map(([k, v]) => `${k}: ${v}`).join('\n') +
    `\n\nWhat it is for:\n${R(r.details)}\n` +
    (r.plan ? `\nProject plan:\n${r.plan}\n` : '') +
    `\nApprove or decline here:\n${requestLink(r)}\n`;
}

async function graphSendMail(to, subject, html) {
  const tok = await mailToken();
  const res = await fetch('https://graph.microsoft.com/v1.0/me/sendMail', {
    method: 'POST',
    headers: { Authorization: 'Bearer ' + tok, 'Content-Type': 'application/json' },
    body: JSON.stringify({
      message: {
        subject,
        body: { contentType: 'HTML', content: html },
        toRecipients: to.filter(Boolean).map(a => ({ emailAddress: { address: a } }))
      },
      saveToSentItems: true
    })
  });
  if (!res.ok) throw new Error(`Graph ${res.status} ${(await res.text()).slice(0, 160)}`);
}
/* The fallback: hand the person a mail already written. Not as good as
   sending it, but it is the difference between the approver hearing about
   this today and not at all. */
function mailtoFallback(to, subject, body) {
  const url = `mailto:${encodeURIComponent(to)}?subject=${encodeURIComponent(subject)}` +
    `&body=${encodeURIComponent(body)}`;
  const a = el('a', { href: url });
  document.body.appendChild(a); a.click(); a.remove();
}

/* Sends, and records on the record itself what happened, so the card can say
   "the approver was notified" instead of leaving the rep to wonder. */
async function notifyApprover(r, opt) {
  const to = approverAddress();
  const subject = `Approval needed · ${r.kind} — ${r.client} · ${fdate(r.startDate)}`;
  if (!to) { toast('No approver address is set — Settings → Approvals', 'err'); return false; }
  try {
    await graphSendMail([to], subject, requestHtml(r));
    r.notifiedAt = new Date().toISOString(); r.notifiedTo = to; r.notifyMode = 'sent';
    sysWrite(() => upsert('demoRequests', r));
    toast(`${to} has been emailed for approval`, 'ok');
    return true;
  } catch (e) {
    r.notifyMode = 'manual'; r.notifyErr = String(e && e.message || e);
    sysWrite(() => upsert('demoRequests', r));
    if (opt && opt.silent) return false;
    modal('The approval email could not be sent for you', el('div', {}, [
      el('p', { style: 'margin:0 0 var(--sp-3);line-height:1.65;color:var(--ink-2)', html:
        `The request is saved and is sitting in <b>Demo Requests</b> as Pending — that part is fine. What did not ` +
        `work is sending the mail on your behalf, which needs the <b>Mail.Send</b> permission consented once by an ` +
        `administrator on the app registration.` }),
      el('p', { class: 'sub', style: 'margin:0 0 var(--sp-3);line-height:1.55', text: r.notifyErr }),
      el('p', { style: 'margin:0;line-height:1.65;color:var(--ink-2)', html:
        `You can open it in Outlook already written, or copy the summary and send it however you like. Either way ` +
        `<b>${esc(to)}</b> gets a link straight to the request.` })
    ]), [
      el('button', { class: 'btn', text: 'Copy the summary', onclick: () => {
        navigator.clipboard.writeText(requestText(r)).then(() => toast('Copied', 'ok'),
          () => toast('Could not copy', 'err')); } }),
      el('button', { class: 'btn primary', text: 'Open it in Outlook', onclick: () => {
        mailtoFallback(to, subject, requestText(r)); closeAll(); } })
    ], true);
    return false;
  }
}

/* The other half of the loop: the rep who raised it hears the answer. */
async function notifyDecision(r) {
  const to = ownerEmail(r.ownerId);
  if (!to) return false;                      // no email on file — stay quiet
  const ok = r.status === 'Approved';
  const subject = `${r.status} · ${r.kind} — ${r.client}`;
  const html = `<div style="font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;font-size:15px;line-height:1.6;color:#11151c;max-width:640px">
  <h2 style="margin:0 0 6px;font-size:21px">${ok ? 'Approved' : 'Declined'} — ${esc(r.client)}</h2>
  <p style="margin:0 0 18px;color:#5b6474">Your ${esc((r.kind || 'request').toLowerCase())} on ${esc(fdate(r.startDate))} was ${esc(r.status.toLowerCase())} by ${esc(String(r.decidedBy || '').split('@')[0])}.</p>
  ${r.decisionNote ? `<p style="margin:0 0 6px;font-weight:600">Note</p><p style="margin:0 0 22px;white-space:pre-wrap">${esc(r.decisionNote)}</p>` : ''}
  <p style="margin:0"><a href="${esc(requestLink(r))}" style="color:#2f6df6">Open it in the CRM</a></p>
</div>`;
  try { await graphSendMail([to], subject, html); return true; }
  catch (e) { return false; }
}

/* A one-click check that the whole chain works — permission, address, link —

function testApprovalMail() {

    ]), [ el('button', { class: 'btn primary', text: 'Close', onclick: closeAll }) ]));

/* ================================================================
   REP PERFORMANCE   (migrated from the OxeFit Sales Tracker v28)

   Same logic, same layout, same structure — with every number now
   coming out of this tool instead of HubSpot and a weekly spreadsheet:

     Forecast accuracy  = 1 − |weighted forecast − closed won| ÷ max(the two)
     Commit variance    = (closed won − committed) ÷ committed        (signed)
     Goal attainment    = closed won ÷ the period target
     Pipeline coverage  = open pipeline closing in the period ÷ target
     Demo effectiveness = volume 40% + conversion 60%
     Score              = attainment 55 · accuracy 15 · coverage 15 · demos 15
                          + a closer bonus of up to 10 for beating the goal

   Where the tracker read a hand-kept weekly sheet, this reads:
     closed won      → deals in a won stage with a close date in the period
     pipeline        → open deals with a close date in the period
     weighted fcst   → those deals × stage probability, halved when stale
     committed       → Sales Commitment records in the period's weeks
     XS1 / XP1       → the device counts on those commitments
     goal            → the targets in Settings, via the same repTargetInfo()
                       fallback the rest of the tool uses
     demos           → the Demo Tracker, primary and supporting credits

   The thresholds are NOT a second set: coverage, accuracy, attainment
   and commit variance all read the same configurable values that the
   Sales Commitment scorecard uses, so a rep cannot be green on one
   screen and amber on another.
   ================================================================ */

const PERF_DEMO_TARGET_PER_MONTH = 4;

/* How many months the selected period spans — the demo volume target
   scales with it, exactly as the tracker did. */
function perfMonthSpan(b) {
  if (!b || b.grain === 'all') {
    const ds = live('deals').map(d => d.closeDate).filter(Boolean).sort();
    if (!ds.length) return 1;
    return Math.max(1, Math.round((dnum(ds[ds.length - 1]) - dnum(ds[0])) / 30.44) || 1);
  }
  return Math.max(1, Math.round((days(b.to, b.from) + 1) / 30.44));
}
/* Every week key that overlaps the period, so commitments can be summed
   over a quarter or a year and not just a single week. */
function perfWeeks(b) {
  const out = [];
  let k = weekKey(b.from);
  for (let i = 0; i < 400; i++) {
    const r = weekRange(k);
    if (dnum(r.from) > dnum(b.to)) break;
    out.push(k);
    k = weekShift(k, 1);
  }
  return out;
}

function perfDemoStats(ownerId, b) {
  const mine = live('demos').filter(d => demoCredits(d, ownerId) &&
    (b.grain === 'all' || inPeriod(d.date, b)));
  const asPrimary = mine.filter(d => String(d.ownerId) === String(ownerId)).length;
  const won  = mine.filter(demoIsWon).length;
  const lost = mine.filter(demoIsLost).length;
  const decided = won + lost;
  return { total: mine.length, converted: won, lost,
    pending: mine.length - decided, asPrimary, asSupport: mine.length - asPrimary,
    /* Only decided demos count, so a wall of Pending does not crater the
       rate — the tracker's rule, kept. */
    convRate: decided > 0 ? won / decided : null };
}

function computeRepPerf(o, b) {
  const mine = ownedDeals(o.id);
  const wonD  = mine.filter(d => isWon(d) && inPeriod(d.closeDate, b));
  const openD = mine.filter(d => isOpen(d) && (b.grain === 'all' || inPeriod(d.closeDate, b)));

  const closed   = sum(wonD, d => d.amount || 0);
  const pipeline = sum(openD, d => d.amount || 0);
  /* The tool's own weighted forecast, with the same stale penalty the
     Sales Commitment screen applies. */
  const forecast = sum(openD, d => weighted(d) * (isStale(d) ? STALE_PENALTY : 1));

  const wks = perfWeeks(b);
  const cRecs = [], bRecs = [];
  wks.forEach(w => { commitsIn(w, o.id, 'commit').forEach(c => cRecs.push(c));
                     commitsIn(w, o.id, 'best').forEach(c => bRecs.push(c)); });
  /* One deal committed in four consecutive weeks is one commitment, not
     four — the tracker read a single end-of-month snapshot for exactly
     this reason, so the latest week each deal appears in is the one
     that counts. */
  const latest = recs => {
    const by = new Map();
    recs.forEach(c => { const k = String(c.dealId || c.id);
      const cur = by.get(k);
      if (!cur || String(c.week) > String(cur.week)) by.set(k, c); });
    return Array.from(by.values());
  };
  const cOne = latest(cRecs), bOne = latest(bRecs);
  const commit = sum(cOne, commitValue);
  const best   = sum(bOne, commitValue);
  const units = {};
  unitLines().forEach(L => { const n = unitTotal(cOne.concat(bOne), L); if (n) units[L] = n; });

  const ti = repTargetInfo(o.id, b);
  const goal = ti.value || 0;

  const denom = Math.max(forecast, closed);
  const accuracy = denom > 0 ? Math.max(0, 1 - Math.abs(forecast - closed) / denom) : null;
  const variance = commit > 0 ? (closed - commit) / commit : null;
  const attain   = goal > 0 ? closed / goal : null;
  const coverage = goal > 0 ? pipeline / goal : null;

  const demo = perfDemoStats(o.id, b);
  const demoTarget = Math.max(1, perfMonthSpan(b) * PERF_DEMO_TARGET_PER_MONTH);
  const volComp  = Math.min(1, demo.total / demoTarget);
  const convComp = demo.convRate != null ? demo.convRate : 0;
  const demoComp = volComp * .4 + convComp * .6;

  /* The score uses the configured coverage target as its ceiling, so
     changing the threshold in Settings moves the score with it rather
     than leaving a hard-coded 4× behind. */
  const covTarget = thresholds('coverage').good || 4;
  const goalComp = attain != null ? Math.min(1, attain) : 0;
  const accComp  = accuracy != null ? accuracy : 0;
  const covComp  = coverage != null ? Math.min(1, coverage / covTarget) : 0;
  const base  = (goalComp * .55 + accComp * .15 + covComp * .15 + demoComp * .15) * 100;
  const bonus = Math.min(10, Math.max(0, (attain || 0) - 1) * 50);   // +1 per 2% over, cap 10
  /* 70 of the 100 points are attainment and coverage, and both need a target.
     Without one the arithmetic still produces a number — a small one — and it
     would read as a failing grade rather than as "nobody set a number for this
     person". So there is no score until there is a target. */
  const score = goal > 0 ? Math.min(100, Math.round(base + bonus)) : null;

  return { o, id: o.id, name: ownerName(o.id), region: ownerRegion(o.id) || 'No region',
    closed, pipeline, forecast, commit, best, goal, targetBasis: ti,
    accuracy, variance, attain, coverage, units, demo, demoComp, score,
    wonCount: wonD.length, openCount: openD.length, deals: { won: wonD, open: openD } };
}

const scoreTag = s => s == null ? '' : s >= 75 ? 'good' : s >= 50 ? 'warn' : 'bad';
const demoTag  = c => c == null ? '' : c >= .5 ? 'good' : c >= .25 ? 'warn' : 'bad';
const pctOrDash    = v => v == null ? '—' : Math.round(v * 100) + '%';
const signedPct    = v => v == null ? '—' : (v >= 0 ? '+' : '') + Math.round(v * 100) + '%';
const ratioOrDash  = v => v == null ? '—' : v.toFixed(2) + '×';

/* ------------------------------------------------------------------ view */
function viewPerf(root) {
  const b = periodBounds(VIEW.perfPeriod || 'm');
  const people = activeOwners().filter(o => !VIEW.perfRep || VIEW.perfRep === 'all' || o.id === VIEW.perfRep);
  const all = activeOwners().map(o => computeRepPerf(o, b));
  const rows = VIEW.perfRep && VIEW.perfRep !== 'all' ? all.filter(p => p.id === VIEW.perfRep) : all;
  const single = rows.length === 1 && VIEW.perfRep && VIEW.perfRep !== 'all';

  root.appendChild(viewHead(null, [
    el('button', { class: 'btn', html: ico('dl',14) + ' Export', onclick: () => exportPerf(rows, b) }),
    el('button', { class: 'btn primary', html: ico('clip',14) +
        (rows.length === 1 ? ' Report (PDF)' : ` Reports (PDF) · ${rows.length}`),
      title: rows.length === 1
        ? `A full performance report for ${rows[0].name} over ${b.label}`
        : `One report per rep over ${b.label}, ${rows.length} in a single PDF — pick a rep above for just theirs`,
      onclick: () => perfReport(rows, b) })
  ]));

  /* ---- toolbar ---- */
  const bar = el('div', { style: 'display:flex;gap:var(--sp-2);flex-wrap:wrap;align-items:center;margin-bottom:var(--sp-3)' });
  bar.appendChild(periodSeg('perfPeriod'));
  const rep = el('select', { class: 'inp', style: 'width:auto;min-width:160px', 'aria-label': 'Sales rep',
    onchange: e => { VIEW.perfRep = e.target.value; render(); } });
  rep.innerHTML = repOptions('All reps');
  rep.value = VIEW.perfRep || 'all';
  bar.appendChild(rep);
  bar.appendChild(el('div', { style: 'flex:1' }));
  bar.appendChild(el('span', { style: 'font-size:var(--fs-sm);color:var(--ink-3)', text: b.label }));
  root.appendChild(bar);

  if (!rows.length) {
    root.appendChild(el('div', { class: 'empty', html: ico('user',34) +
      '<h4>Nobody to measure</h4><p>Add the team in Settings and set their targets, and this fills in.</p>' }));
    return;
  }

  /* ---- region roll-up ---- */
  if (!single) root.appendChild(perfRegionRow(all, b));

  /* ---- KPI strip: the four the whole tool is judged on, plus demos ---- */
  root.appendChild(perfKpiStrip(rows, single));

  /* ---- pipeline coverage ---- */
  const cov = card('Pipeline coverage', `Open pipeline closing in ${b.label} ÷ that period's target · ` +
    `green at ${thresholds('coverage').good}× or better, amber to ${thresholds('coverage').warn}×`);
  cov.body.appendChild(perfCoverageGrid(rows));
  root.appendChild(cov.node);

  /* ---- scorecards ---- */
  const sc = card('Rep scorecards', 'Forecast accuracy · commit variance · units committed · goal attainment · demos');
  const grid = el('div', { class: 'perfgrid' });
  rows.slice().sort((a, z) => (z.score == null ? -1 : z.score) - (a.score == null ? -1 : a.score))
      .forEach(p => grid.appendChild(perfRepCard(p, b)));
  sc.body.appendChild(grid);
  root.appendChild(sc.node);

  /* ---- leaderboard ---- */
  if (!single) root.appendChild(perfLeaderboard(rows));
  else root.appendChild(perfStanding(all, rows[0]));
}

function perfRegionRow(all, b) {
  const c = card('By region', `Everything closed, forecast and committed in ${b.label}`);
  const wrap = el('div', { class: 'perfteams' });
  const roll = list => {
    const g = sum(list, p => p.goal), cl = sum(list, p => p.closed);
    const f = sum(list, p => p.forecast), pi = sum(list, p => p.pipeline);
    const den = Math.max(f, cl);
    return { g, cl, f, pi, n: list.length,
      attain: g > 0 ? cl / g : null,
      acc: den > 0 ? Math.max(0, 1 - Math.abs(f - cl) / den) : null,
      cov: g > 0 ? pi / g : null };
  };
  const cards = [];
  ownersByRegion(all.map(p => p.o)).forEach(g => {
    const ids = new Set(g.owners.map(o => o.id));
    cards.push([g.region, roll(all.filter(p => ids.has(p.id)))]);
  });
  cards.push(['Combined', roll(all)]);
  cards.forEach(([label, s]) => {
    const n = el('div', { class: 'perfteam' + (label === 'Combined' ? ' combined' : '') });
    n.appendChild(el('div', { class: 'ttl', text: `${label} · ${s.n} ${s.n === 1 ? 'rep' : 'reps'}` }));
    n.appendChild(el('div', { class: 'big', html: `<span class="cur">${CFG.currency}</span> ${money(s.cl, { dash: false })}` }));
    n.appendChild(el('div', { class: 'sub', html:
      `closed of ${CFG.currency} ${money(s.g, { dash: false })} target · ` +
      `<b class="${attTag(s.attain)}">${esc(pctOrDash(s.attain))}</b>` }));
    const m = el('div', { class: 'mini' });
    [['Accuracy', pctOrDash(s.acc), accTag(s.acc)],
     ['Pipeline', CFG.currency + ' ' + money(s.pi, { compact: true, dash: false }), ''],
     ['Coverage', ratioOrDash(s.cov), covTag(s.cov)]].forEach(([k, v, cls]) =>
      m.appendChild(el('div', {}, [ el('span', { class: 'k', text: k }),
        el('span', { class: 'v ' + cls, text: v }) ])));
    n.appendChild(m);
    wrap.appendChild(n);
  });
  c.body.appendChild(wrap);
  return c.node;
}

function perfKpiStrip(rows, single) {
  const g = sum(rows, p => p.goal), cl = sum(rows, p => p.closed);
  const f = sum(rows, p => p.forecast), pi = sum(rows, p => p.pipeline);
  const den = Math.max(f, cl);
  const acc = den > 0 ? Math.max(0, 1 - Math.abs(f - cl) / den) : null;
  const attain = g > 0 ? cl / g : null;
  const cov = g > 0 ? pi / g : null;
  const dW = sum(rows, p => p.demo.converted), dL = sum(rows, p => p.demo.lost);
  const dT = sum(rows, p => p.demo.total);
  const conv = (dW + dL) > 0 ? dW / (dW + dL) : null;

  const t = el('div', { class: 'tiles' });
  t.appendChild(tile('Forecast accuracy', pctOrDash(acc), { icon: 'bolt', tag: accTag(acc),
    foot: `${CFG.currency} ${money(f, { compact: true, dash: false })} weighted vs ${money(cl, { compact: true, dash: false })} closed` }));
  t.appendChild(tile('Goal attainment', pctOrDash(attain), { icon: 'flag', tag: attTag(attain),
    foot: g ? `${CFG.currency} ${money(cl, { compact: true, dash: false })} of ${money(g, { compact: true, dash: false })}`
            : 'no target set for this period' }));
  t.appendChild(tile('Pipeline coverage', ratioOrDash(cov), { icon: 'chart', tag: covTag(cov),
    foot: `target ${thresholds('coverage').good}× · floor ${thresholds('coverage').warn}×` }));
  t.appendChild(tile('Demo conversion', pctOrDash(conv), { icon: 'board', tag: demoTag(conv),
    foot: `${dW} converted of ${dW + dL} decided · ${dT} run` }));
  if (single) {
    const p = rows[0];
    t.appendChild(tile('Commit variance', signedPct(p.variance), { icon: 'check', tag: varTag(p.variance),
      foot: p.commit ? `${CFG.currency} ${money(p.closed, { compact: true, dash: false })} against ${money(p.commit, { compact: true, dash: false })} committed`
                     : 'nothing committed in this period' }));
  }
  return t;
}

function perfCoverageGrid(rows) {
