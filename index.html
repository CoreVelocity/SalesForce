/* ---- products & line-item estimates ---- */
const BILLING = [
  { id: 'once',    label: 'One-time' },

  (1 - (Number(it.discountPct) || 0) / 100));
/* One-time value, recurring monthly value, and the contract total that the
   deal amount follows when it is on auto. */
function estimate(d) {
  const items = d.items || [];
  const months = Number(d.contractMonths) > 0 ? Number(d.contractMonths) : 12;
  let once = 0, monthly = 0, annual = 0;
  items.forEach(it => {
    const n = lineNet(it);
    if (it.billing === 'monthly') monthly += n;
    else if (it.billing === 'annual') annual += n;
    else once += n;
  });
  const mrr = monthly + annual / 12;
  return { items: items.length, once, monthly, annual, mrr, months,
           recurringOverTerm: mrr * months, total: once + mrr * months };
}

function syncDealAmount(d, o) {
  if (!amountAuto(d)) return false;
  const e = estimate(d);
  const next = Math.round(e.total);
  if (!e.items) return false;
  if (Number(d.amount) === next) return false;
  d.amount = next;
  if (!o || o.save !== false) upsert('deals', d);
  return true;
}

/* Files live beside the data: CoreVCRM/attachments/<dealId>/<name>.

   attachments.json — that pair is the whole cross-tool contract. */
async function uploadAttachment(dealId, file) {
  if (SYNC.mode !== 'onedrive') throw new Error('Sign in with Microsoft to upload files. In local-only mode you can still add a link.');
  if (file.size > 60 * 1024 * 1024) throw new Error('That file is over 60 MB — upload it to OneDrive yourself and add it here as a link.');
  const safe = String(file.name).replace(/[\\/:*?"<>|#%]/g, '-').slice(0, 120);
  await resolveDrive();
  const path = `${driveBase()}:/${CFG.attachDir}/${dealId}/${safe}:/content`;
  const t = await getToken();
  const r = await fetch('https://graph.microsoft.com/v1.0' + path, {
    method: 'PUT',
    headers: { Authorization: 'Bearer ' + t, 'Content-Type': file.type || 'application/octet-stream' },
    body: file
  });
  if (!r.ok) throw new Error('OneDrive refused the upload (' + r.status + ')');
  const item = await r.json();
  return upsert('attachments', {
    dealId, name: safe, size: file.size, mime: file.type || null,
    url: item.webUrl || null, driveItemId: item.id || null,
    driveId: (item.parentReference && item.parentReference.driveId) || DRIVE.id || null,
    at: new Date().toISOString(), by: (AUTH.user && AUTH.user.username) || 'local', kind: 'file'

    const s = v == null ? '' : String(v);
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
  };

function parseCSV(text) {

  const s = text.replace(/^﻿/, '');

    if (q) {

      else cell += c;
    } else if (c === '"') q = true;
    else if (c === ',') { row.push(cell); cell = ''; }

/* ================================================================

function chartBar(host, rows, o) {
  o = o || {};

    [{ h: o.xLabel || 'Category', f: r => r.label }, { h: o.yLabel || 'Value', num: true, f: r => fmt(r.value) }], rows) });
  if (!rows.length) { wrap.innerHTML = `<p style="color:var(--ink-3);margin:0;padding:24px 0;text-align:center">No data in range</p>`; return; }

  const H = o.height || 190, PT = 22, PB = 30, PL = 4, PR = 4;
  const W = Math.max(host.clientWidth || 520, 260);
  const max = Math.max(...rows.map(r => r.value), 1);
  const gap = rows.length > 14 ? 2 : 8;
  const bw = Math.max(4, (W - PL - PR - gap * (rows.length - 1)) / rows.length);
  const svg = svgEl('svg', { viewBox: `0 0 ${W} ${H}`, preserveAspectRatio: 'none', role: 'img',
    'aria-label': o.aria || 'Bar chart' });
  svg.style.height = H + 'px';

  // recessive gridlines + baseline
  for (let i = 1; i <= 3; i++) {
    const y = PT + (H - PT - PB) * (i / 3);

  }
  svg.appendChild(svgEl('line', { x1: 0, x2: W, y1: H - PB, y2: H - PB, class: 'bl' }));

  const plotH = H - PT - PB;
  rows.forEach((r, i) => {
    const h = Math.max(0, (r.value / max) * plotH);

  if (!cats.length || !series.length) {
    wrap.innerHTML = `<p style="color:var(--ink-3);margin:0;padding:24px 0;text-align:center">No data in range</p>`;
    return;
  }
  const H = o.height || 230, PT = 24, PB = 30, PL = 4, PR = 4, GAPSEG = 2;
  const W = Math.max(host.clientWidth || 520, 260);
  const max = Math.max(...cats.map(totalOf), 1);
  const gap = cats.length > 14 ? 3 : 12;
  const bw = Math.max(6, (W - PL - PR - gap * (cats.length - 1)) / cats.length);
  const plotH = H - PT - PB;
  const svg = svgEl('svg', { viewBox: `0 0 ${W} ${H}`, preserveAspectRatio: 'none', role: 'img',
    'aria-label': o.aria || 'Stacked bar chart' });
  svg.style.height = H + 'px';
  for (let i = 1; i <= 3; i++) {
    const y = PT + plotH * (i / 3);
    svg.appendChild(svgEl('line', { x1: 0, x2: W, y1: y, y2: y, class: 'gl' }));
  }
  svg.appendChild(svgEl('line', { x1: 0, x2: W, y1: H - PB, y2: H - PB, class: 'bl' }));

  cats.forEach((c, ci) => {
    const x = PL + ci * (bw + gap);
    const tot = totalOf(c);
    // top-down so the rounded end lands on the topmost segment that exists
    const present = series.map((s, si) => ({ s, si, v: c.values[s.key] || 0 })).filter(p => p.v > 0);
    let cursor = H - PB;
    present.forEach((p, idx) => {
      const h = (p.v / max) * plotH;
      const drawH = Math.max(1, h - (idx === present.length - 1 ? 0 : GAPSEG));
      const y = cursor - h;
      const top = idx === present.length - 1;
      const g = svgEl('g', { class: 'mk' });
      g.appendChild(svgEl('path', {
        d: top ? barPath(x, y, bw, drawH, 4, 'up') : barPath(x, y + (h - drawH), bw, drawH, 0, 'flat'),
        fill: p.s.color }));
      svg.appendChild(g);
      const hit = svgEl('rect', { x, y: y, width: bw, height: Math.max(3, h), class: 'hit' });
      hit.addEventListener('mousemove', ev => tipShow(
        `<b>${esc(c.label)}</b>` +
        `<div class="r"><span><i style="background:${p.s.color}"></i>${esc(p.s.label)}</span><b>${esc(fmt(p.v))}</b></div>` +
        `<div class="r"><span>Share of month</span><b>${pct(p.v, tot)}%</b></div>` +
        `<div class="r"><span>Month total</span><b>${esc(fmt(tot))}</b></div>`, ev));
      hit.addEventListener('mouseleave', tipHide);
      svg.appendChild(hit);
      cursor = y;
    });
    if (tot) {
      const t = svgEl('text', { x: x + bw / 2, y: (H - PB) - (tot / max) * plotH - 7,
        'text-anchor': 'middle', class: 'vlab' });
      t.textContent = fmt(tot); svg.appendChild(t);
    }
    const a = svgEl('text', { x: x + bw / 2, y: H - PB + 14, 'text-anchor': 'middle', class: 'alab' });
    a.textContent = c.short || c.label; svg.appendChild(a);
    if (!tot) {
      const z = svgEl('text', { x: x + bw / 2, y: H - PB - 7, 'text-anchor': 'middle', class: 'vlab',
        style: 'opacity:.45' });
      z.textContent = '—'; svg.appendChild(z);
    }
  });
  wrap.appendChild(svg);

  /* legend: always present for >= 2 series, and it carries the totals so
     identity is never colour alone */
  const lg = el('div', { class: 'legend' });
  series.forEach(s => {
    const tot = sum(cats, c => c.values[s.key] || 0);
    if (!tot && o.hideEmpty) return;
    lg.appendChild(el('span', { class: tot ? '' : 'off', html:
      `<i style="background:${s.color}"></i>${esc(s.label)}` +
      `<b class="mono" style="color:var(--ink-1)">${esc(fmt(tot))}</b>` }));
  });
  wrap.appendChild(lg);
}

/* --------------------------------------------------- stacked single bar */
function chartStack(host, segs, o) {

/* ------------------------------------------------------------- donut */
function chartDonut(host, rows, o) {
  o = o || {};
  const fmt = o.fmt || (v => money(v, { compact: true }));
  const total = sum(rows, r => r.value);
  const wrap = chartShell(host, { table: tblHTML(
    [{ h: o.xLabel || 'Category', f: r => r.label }, { h: 'Value', num: true, f: r => fmt(r.value) },
     { h: 'Share', num: true, f: r => pct(r.value, total) + '%' }], rows) });
  if (!total) { wrap.innerHTML = `<p style="color:var(--ink-3);margin:0;padding:24px 0;text-align:center">No data in range</p>`; return; }

  const S = 148, R = 64, r0 = 42, cx = S/2, cy = S/2;
  const svg = svgEl('svg', { viewBox: `0 0 ${S} ${S}`, role: 'img', 'aria-label': o.aria || 'Donut chart' });
  svg.style.cssText = 'width:148px;height:148px;flex:none';
  let a0 = -Math.PI / 2;
  const GAP = 0.018;                         // 2px-equivalent surface gap
  rows.forEach((r, i) => {
    if (!r.value) return;
    const sweep = (r.value / total) * Math.PI * 2;
    const a1 = a0 + Math.max(sweep - GAP, 0.004);
    const big = (a1 - a0) > Math.PI ? 1 : 0;
    const p = [
      `M${cx + R*Math.cos(a0)} ${cy + R*Math.sin(a0)}`,
      `A${R} ${R} 0 ${big} 1 ${cx + R*Math.cos(a1)} ${cy + R*Math.sin(a1)}`,
      `L${cx + r0*Math.cos(a1)} ${cy + r0*Math.sin(a1)}`,
      `A${r0} ${r0} 0 ${big} 0 ${cx + r0*Math.cos(a0)} ${cy + r0*Math.sin(a0)}`, 'Z'
    ].join(' ');
    const path = svgEl('path', { d: p, fill: r.color || serColor(i), class: 'mk' });
    path.addEventListener('mousemove', ev => tipShow(
      `<b>${esc(r.label)}</b><div class="r"><span><i style="background:${r.color||serColor(i)}"></i>Value</span><b>${esc(fmt(r.value))}</b></div>
       <div class="r"><span>Share</span><b>${pct(r.value,total)}%</b></div>`, ev));
    path.addEventListener('mouseleave', tipHide);
    svg.appendChild(path);
    a0 += sweep;
  });
  const c = svgEl('text', { x: cx, y: cy - 2, 'text-anchor': 'middle',
    style: 'font-size:17px;font-weight:700;fill:var(--ink-1)' });
  c.textContent = o.centerVal != null ? o.centerVal : fmt(total);
  svg.appendChild(c);
  if (o.centerLbl) {
    const c2 = svgEl('text', { x: cx, y: cy + 13, 'text-anchor': 'middle', style: 'font-size:10px;fill:var(--ink-3)' });
    c2.textContent = o.centerLbl; svg.appendChild(c2);
  }
  const box = el('div', { style: 'display:flex;gap:var(--sp-4);align-items:center;flex-wrap:wrap' });
  box.appendChild(svg);
  const lg = el('div', { class: 'legend', style: 'margin:0;flex-direction:column;gap:5px;flex:1;min-width:150px' });
  rows.forEach((r, i) => lg.appendChild(el('span', { style: 'width:100%', html:
    `<i style="background:${r.color || serColor(i)}"></i><span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.label)}</span>
     <b class="mono" style="color:var(--ink-1);margin-left:auto">${esc(fmt(r.value))}</b>
     <span style="color:var(--ink-3);min-width:34px;text-align:right" class="mono">${pct(r.value,total)}%</span>` })));
  box.appendChild(lg);
  wrap.appendChild(box);
}

/* ----------------------------------------- line / area with crosshair */
function chartLine(host, series, labels, o) {
  o = o || {};
  const fmt = o.fmt || (v => money(v, { compact: true }));
  const wrap = chartShell(host, { table: tblHTML(
    [{ h: o.xLabel || 'Period', f: r => r.l }].concat(series.map((s, i) => ({ h: s.name, num: true, f: r => fmt(r.v[i]) }))),
    labels.map((l, j) => ({ l, v: series.map(s => s.data[j]) }))) });
  if (!labels.length) { wrap.innerHTML = `<p style="color:var(--ink-3);margin:0;padding:24px 0;text-align:center">No data in range</p>`; return; }

  const H = o.height || 200, PT = 16, PB = 26, PL = 6, PR = 6;
  const W = Math.max(host.clientWidth || 520, 260);
  const max = Math.max(1, ...series.flatMap(s => s.data.map(v => v || 0)));
  const plotH = H - PT - PB, plotW = W - PL - PR;
  const X = j => labels.length === 1 ? PL + plotW/2 : PL + (j / (labels.length - 1)) * plotW;
  const Y = v => PT + plotH - (Math.max(0, v || 0) / max) * plotH;

  const svg = svgEl('svg', { viewBox: `0 0 ${W} ${H}`, preserveAspectRatio: 'none', role: 'img',
    'aria-label': o.aria || 'Line chart' });
  svg.style.height = H + 'px';
  for (let i = 0; i <= 3; i++) {
    const y = PT + plotH * (i / 3);
    svg.appendChild(svgEl('line', { x1: 0, x2: W, y1: y, y2: y, class: i === 3 ? 'bl' : 'gl' }));
  }
  const cross = svgEl('line', { y1: PT, y2: PT + plotH, class: 'gl', stroke: 'var(--baseline)', opacity: 0 });
  svg.appendChild(cross);

  series.forEach((s, si) => {
    const col = s.color || serColor(si);
    const pts = s.data.map((v, j) => `${X(j)},${Y(v)}`).join(' ');
    if (o.area && series.length === 1) {
      svg.appendChild(svgEl('polygon', { points: `${PL},${PT+plotH} ${pts} ${PL+plotW},${PT+plotH}`, fill: col, opacity: .13 }));
    }
    svg.appendChild(svgEl('polyline', { points: pts, fill: 'none', stroke: col, 'stroke-width': 2,
      'stroke-dasharray': s.dash || null, 'stroke-linejoin': 'round', 'stroke-linecap': 'round', class: 'mk' }));
    s.data.forEach((v, j) => {
      if (labels.length > 18 && j % 2) return;
      svg.appendChild(svgEl('circle', { cx: X(j), cy: Y(v), r: 4, fill: col,
        stroke: 'var(--surface-1)', 'stroke-width': 2 }));   // 2px surface ring on overlap
    });
  });
  labels.forEach((l, j) => {
    const step = Math.ceil(labels.length / 8);
    if (j % step) return;
    const t = svgEl('text', { x: X(j), y: H - PB + 15, 'text-anchor': 'middle', class: 'alab' });
    t.textContent = l; svg.appendChild(t);
  });
  const hit = svgEl('rect', { x: 0, y: 0, width: W, height: H, class: 'hit' });
  hit.addEventListener('mousemove', ev => {
    const bb = svg.getBoundingClientRect();
    const rel = (ev.clientX - bb.left) / bb.width * W;
    let j = Math.round((rel - PL) / (plotW || 1) * (labels.length - 1));
    j = Math.max(0, Math.min(labels.length - 1, j));
    cross.setAttribute('x1', X(j)); cross.setAttribute('x2', X(j)); cross.setAttribute('opacity', .8);
    tipShow(`<b>${esc(labels[j])}</b>` + series.map((s, i) =>
      `<div class="r"><span><i style="background:${s.color||serColor(i)}"></i>${esc(s.name)}</span><b>${esc(fmt(s.data[j]))}</b></div>`).join(''), ev);
  });
  hit.addEventListener('mouseleave', () => { cross.setAttribute('opacity', 0); tipHide(); });
  svg.appendChild(hit);
  wrap.appendChild(svg);

  if (series.length >= 2) {
    const lg = el('div', { class: 'legend' });
    series.forEach((s, i) => lg.appendChild(el('span', { html:
      `<i style="background:${s.color || serColor(i)}${s.dash ? ';border-radius:1px;height:3px;background:repeating-linear-gradient(90deg,' + (s.color||serColor(i)) + ' 0 3px,transparent 3px 5px)' : ''}"></i>${esc(s.name)}` })));
    wrap.appendChild(lg);
  }
}

/* -------------------------------------------------------- stat tile */
function tile(label, value, o) {
  o = o || {};
  const n = el('div', { class: 'tile' });
  n.appendChild(el('div', { class: 'lbl', html: (o.icon ? ico(o.icon, 13) : '') + esc(label) }));
  /* Length is only a first guess — fitTiles() measures after layout and steps
     the size down until the figure actually fits, whatever the column width. */
  const str = String(value);
  const len = str.length + (o.cur ? 4 : 0);
  const guess = len > 13 ? ' fit-s' : len > 10 ? ' fit-m' : '';
  n.appendChild(el('div', { class: 'val mono' + guess, title: (o.cur ? CFG.currency + ' ' : '') + str,
    html: (o.cur ? `<span class="cur">${CFG.currency}</span>` : '') + `<span class="num">${esc(str)}</span>` }));
  if (o.delta != null) {
    const up = o.delta >= 0, good = o.inverse ? !up : up;
    n.appendChild(el('div', { class: 'foot', html:
      `<span class="delta ${good ? 'up' : 'down'}">${ico(up ? 'up' : 'down', 12, 2.4)}${Math.abs(o.delta)}%</span>
       <span>${esc(o.foot || '')}</span>` }));
  } else if (o.foot) {
    n.appendChild(el('div', { class: 'foot', html: o.footHtml ? o.foot : esc(o.foot) }));
  }
  if (o.meter != null) {
    const p = Math.max(0, Math.min(100, o.meter));
    n.appendChild(el('div', { class: 'meter', html:
      `<i class="${p >= 100 ? 'good' : p >= 70 ? '' : p >= 40 ? 'warn' : 'bad'}" style="width:${p}%"></i>` }));
  }
  if (o.onclick) { n.style.cursor = 'pointer'; n.addEventListener('click', o.onclick); }
  return n;
}
/* A number that does not fit its tile is worse than a smaller number, so step
   the type down until it does. Measured, not guessed, because the same tile is
   200px wide on the dashboard and 120px in a drawer. */
const FITS = ['', 'fit-m', 'fit-s', 'fit-xs'];
function fitTiles(root) {
  $$('.tile .val, .strip .v', root || document).forEach(v => {
    const n = v.querySelector('.num');
    if (!n) return;
    for (const step of FITS) {
      FITS.forEach(c => c && v.classList.remove(c));
      if (step) v.classList.add(step);
      /* No tolerance: the number is ellipsised the moment it overflows at all,
         so one spare pixel is the difference between "673,211" and "673,2…".
         Erring toward smaller type is the right way to be wrong here. */
      if (n.scrollWidth <= n.clientWidth) return;
    }
  });
}

/* ------------------------------------------------------- scoping */
/* The period filter. Grouped so a long list stays readable, and every
   option resolves to real dates — the labels weeks and months carry are the
   concrete range, not "this week", because a target is stored against the
   label and a moving label would attach to whichever week happened to be
   current when it was typed. */
const PERIODS = [
  ['Weeks', [
    ['w-1', 'Last week'], ['w0', 'This week'], ['w1', 'Next week'],
    ['w2', 'In 2 weeks'], ['w3', 'In 3 weeks'], ['wn4', 'Next 4 weeks']
  ]],
  ['Months', [
    ['m-1', 'Last month'], ['m0', 'This month'], ['m1', 'Next month'], ['mn3', 'Next 3 months']
  ]],
  ['Longer', [
    ['q', 'This quarter'], ['fy', 'Fiscal year'], ['all', 'All time']
  ]]
];
const periodName = v => {
  for (const [, list] of PERIODS) { const hit = list.find(x => x[0] === v); if (hit) return hit[1]; }
  return 'This fiscal year';
};
function periodBounds(which) {
  const p = which || VIEW.period;
  if (p === 'fy') return Object.assign(fyBounds(), { grain: 'year' });
  if (p === 'q')  return Object.assign(qBounds(), { grain: 'quarter' });
  if (p === 'm' || p === 'm0') return Object.assign(mBounds(), { grain: 'month' });
  let m;
  if ((m = /^w(-?\d+)$/.exec(p))) {
    const k = weekShift(weekKey(), +m[1]), r = weekRange(k);
    return { from: r.from, to: r.to, label: weekLabel(k), week: k, grain: 'week' };
  }
  if ((m = /^wn(\d+)$/.exec(p))) {
    const r = weekRange(weekKey()), to = weekRange(weekShift(weekKey(), +m[1] - 1)).to;
    return { from: r.from, to, label: `${fdate(r.from)} – ${fdate(to)}`, grain: 'week' };
  }
  if ((m = /^m(-?\d+)$/.exec(p))) {
    const b = mBounds(monthShift(monthKey(), +m[1]) + '-01');
    return Object.assign(b, { grain: 'month' });
  }
  if ((m = /^mn(\d+)$/.exec(p))) {
    const a = mBounds(), z = mBounds(monthShift(monthKey(), +m[1] - 1) + '-01');
    return { from: a.from, to: z.to, label: `${a.label} – ${z.label}`, grain: 'month' };
  }
  return { from: '1900-01-01', to: '2999-12-31', label: 'All time', grain: 'all' };
}
/* Targets are stored against the period label, so they only make sense for a
   period that names itself the same way every time you look at it. */
const targetablePeriod = b => b.grain !== 'week' && b.label !== 'All time';
const inPeriod = (d, b) => d && dnum(d) >= dnum(b.from) && dnum(d) <= dnum(b.to);
/* Visibility follows worksOn, so a collaborator sees the deal under their own
   filter. Revenue attribution below always uses ownedBy, so nothing is counted
   twice when a deal has two names on it. */
function scopedDeals() {
  const all = live('deals');
  return VIEW.rep === 'all' ? all : all.filter(d => worksOn(d, VIEW.rep));
}
const ownedDeals = rep => live('deals').filter(d => ownedBy(d, rep));
const openTasks = () => live('tasks').filter(t => t.status !== 'done' &&
  (VIEW.rep === 'all' || String(t.ownerId) === VIEW.rep));
const weighted = d => (d.amount || 0) * stage(d.stageId).probability;

/* Rep dropdowns list active people only. Someone who has left keeps their
   closed history — it still counts in every total — but they are not a filter
   anyone should be picking week to week. */
function repOptions(allLabel) {

/* ------------------------------------------------------------------ targets
   A target is stored against the label of whichever period it was typed into,
   so a number entered under FY2026 is an annual one. Asking for a month and
   getting nothing back was the old behaviour, and it read as "no target set"
   even when a year's number was sitting right there. Now a shorter period
   falls back to the longer one it sits inside and says it did so, while the
   Settings editor still only ever shows and writes what was typed. */
function targetAt(rep, key) {
  const t = DB.config.targets || {};
  if (rep === 'all') {
    const each = sum(activeOwners(), o => (t[o.id] && t[o.id][key]) || 0);
    return each || ((t.team && t.team[key]) || 0);
  }

/* Callers build bounds with mBounds/qBounds/fyBounds as well as through the
   period picker, so the grain is worked out from the dates when it is absent
   rather than relying on every call site to pass one. */
function grainOf(b) {
  if (b.grain) return b.grain;
  if (b.label === 'All time' || b.from < '1901-01-01') return 'all';
  const span = days(b.to, b.from) + 1;
  if (span <= 8) return 'week';
  const mb = mBounds(b.from);
  if (b.from === mb.from && b.to === mb.to) return 'month';
  const qb = qBounds(b.from);
  if (b.from === qb.from && b.to === qb.to) return 'quarter';
  const fy = fyBounds(b.from);
  if (b.from === fy.from && b.to === fy.to) return 'year';
  return 'month';                                   // a run of months

function repTargetInfo(rep, b) {

        v += mi.value;

        if (k === z) break;
        k = monthShift(k, 1);

      return { value: v, basis: v ? (allSet ? 'set' : 'derived') : null, from: 'the months in range' };
    }

    if (qv) return { value: qv / 3, basis: 'derived', from: `${q.label} ÷ 3` };
    const fy = fyBounds(b.from), yv = targetAt(rep, fy.label);
    if (yv) return { value: yv / 12, basis: 'derived', from: `${fy.label} ÷ 12` };

    return { value: 0, basis: null, from: null };
  }
  if (g === 'week') {
    // the month the week ends in, pro-rated across its days
    const mb = Object.assign(mBounds(b.to), { grain: 'month' });
    const mi = repTargetInfo(rep, mb);
    if (!mi.value) return { value: 0, basis: null, from: null };
    const dim = days(mb.to, mb.from) + 1;
    const wdays = days(b.to, b.from) + 1;

      from: `${mb.label} pro-rated over ${wdays} of ${dim} days` };

  const y = String(b.from).slice(0, 4);

  if (any) return { value: v, basis: 'derived', from: `the quarters of ${y}` };
  for (let mm = 1; mm <= 12; mm++) { const mv = targetAt(rep, `${MON[mm-1]} ${y}`); if (mv) { v += mv; any = true; } }
  if (any) return { value: v, basis: 'derived', from: `the months of ${y}` };

/* ---------------------------------------------- overdue close dates
   An open deal whose close date has passed is the single most corrosive thing
   in a pipeline: it is silently wrong, and it drags every forecast down with
   it. Surface it wherever the rep is, and make fixing it one click. */
function overdueDeals(rep, o) {
  const t = dnum(TODAY());
  const who = rep === undefined ? VIEW.rep : rep;
  const match = (o && o.ownedOnly) ? ownedBy : worksOn;
  return live('deals').filter(d =>
    isOpen(d) && d.closeDate && dnum(d.closeDate) < t && match(d, who))
    .sort((a, b) => dnum(a.closeDate) - dnum(b.closeDate));
}
/* The failure this exists for: a rep signs in, the shared folder cannot be

function dataBanner() {
  if (SYNC.mode !== 'onedrive') return null;
  const empty = !live('deals').length && !live('companies').length && !live('contacts').length;
  if (SYNC.status !== 'error' && !empty) return null;
  /* An empty CRM with no explanation is what the reps reported: every tile
     reading AED 0 as though zero were the answer. Until the shared folder has
     been read once, an empty database means "not read yet", and the page says
     so rather than drawing a confident zero. */
  if (SYNC.status !== 'error' && !SYNC.loaded) {
    const w = el('div', { class: 'alert' });
    w.appendChild(el('span', { class: 'ic' }, [el('span', { class: 'spin sm' })]));
    w.appendChild(el('div', { style: 'flex:1;min-width:0;line-height:1.5', html:
      `<b>Still reading the team's data</b><div class="sub">The figures below are not your numbers yet — ` +
      `they fill in as ${esc(driveRoot())} on ${esc(driveOwner() || 'OneDrive')} comes down.</div>` }));
    return w;
  }
  const n = el('div', { class: 'alert', style: 'border-color:var(--critical)' });
  n.appendChild(el('span', { class: 'ic', html: ico('warn', 18) }));
  n.appendChild(el('div', { style: 'flex:1;min-width:0;line-height:1.5', html: SYNC.status === 'error'
    ? `<b>The shared CRM data could not be read</b><div class="sub">${esc(SYNC.err || '')}</div>`
    : `<b>Signed in, but there is nothing here</b><div class="sub">The ${esc(driveRoot())} folder on ` +
      `${esc(driveOwner() || 'your own OneDrive')} was reached and is empty. If you expected the team's ` +
      `records, you are probably pointed at the wrong folder.</div>` }));
  n.appendChild(el('button', { class: 'btn sm', html: ico('sync',13) + ' Try again',
    onclick: () => syncNow({ loud: true }) }));

    onclick: () => go('settings') }));

}

}

/* kcard used to call live('tasks') once PER CARD — with 800 cards on the board

    const e = m.get(t.dealId) || (m.set(t.dealId, { n: 0, late: 0 }), m.get(t.dealId));
    e.n++; if (dnum(t.dueDate) < today) e.late++;

function kcard(d, s) {

       ${co ? `<span class="co" title="${esc(co.name)}">· ${esc(co.name)}</span>` : ''}

    style: `background:${ownerColor(cid)};width:20px;height:20px;font-size:9px;opacity:.75;margin-left:-7px`,
    text: initials(ownerName(cid)), title: 'Collaborator: ' + ownerName(cid) })));
  if (isCollabOnly(d, VIEW.rep)) foot.appendChild(el('span', { class: 'tag info',
    style: 'font-size:9px;padding:1px 6px', text: 'collab', title: 'Owned by ' + ownerName(d.ownerId) }));
  const tks = taskMap().get(d.id);
  if (tks) {
    const od = tks.late;
    foot.appendChild(el('span', { style: `margin-left:auto;font-size:var(--fs-xs);${od ? 'color:var(--critical-ink);font-weight:650' : ''}`,

/* One set of listeners for the whole board, however many cards are on it. */
function kanDelegate(kan) {

  kan.addEventListener('click', e => {
    const c = cardOf(e); if (c && c.dataset.deal) openDeal(c.dataset.deal);

function moveStage(d, toId) {
  const from = stage(d.stageId), to = stage(toId);
  if (to.kind === 'lost') return askLoss(d, toId);
  if (to.kind === 'won')  return askWin(d, toId);
  d.stageId = toId;
  if (!d.closeDate) d.closeDate = addDays(TODAY(), 30);
  upsert('deals', d);
  logAct({ dealId: d.id, ownerId: d.ownerId, kind: 'stage',
    html: `Moved <b>${esc(d.name)}</b> from ${esc(from.label)} to <b>${esc(to.label)}</b>` });
  toast(`${d.name} → ${to.label}`, 'ok');
  render();
}
/* ================================================================
   TABLES — one sortable / filterable / paged builder, three views
   ================================================================ */
function dataTable(host, o) {
  const key = o.key;
  const sort = VIEW.sort[key] || (VIEW.sort[key] = { col: o.defaultSort || 0, dir: o.defaultDir || -1 });
  const page = VIEW.page[key] || (VIEW.page[key] = 0);
  const per  = o.per || 50;

  let rows = o.rows.slice();
  const col = o.cols[sort.col] || o.cols[0];
  rows.sort((a, b) => {
    const x = col.sv ? col.sv(a) : col.v(a), y = col.sv ? col.sv(b) : col.v(b);
    const nx = typeof x === 'number', ny = typeof y === 'number';
    if (nx && ny) return (x - y) * sort.dir;
    return String(x == null ? '' : x).localeCompare(String(y == null ? '' : y)) * sort.dir;
  });
  const total = rows.length;
  const pages = Math.max(1, Math.ceil(total / per));
  const p = Math.min(page, pages - 1);
  VIEW.page[key] = p;
  const slice = rows.slice(p * per, p * per + per);

  const wrap = el('div', { class: 'tw' });
  const t = el('table', { class: 'dt' });
  const thead = el('thead'), tr = el('tr');
  o.cols.forEach((c, i) => {
    const th = el('th', { class: (c.num ? 'num ' : '') + (c.sortable === false ? '' : 'sortable') + (sort.col === i ? ' sorted' : ''),
      html: esc(c.h) + (c.sortable === false ? '' : `<span class="ind">${sort.col === i ? (sort.dir > 0 ? '▲' : '▼') : '⇅'}</span>`) });
    if (c.sortable !== false) th.addEventListener('click', () => {
      if (sort.col === i) sort.dir *= -1; else { sort.col = i; sort.dir = c.num ? -1 : 1; }
      render();
    });
    tr.appendChild(th);
  });
  thead.appendChild(tr); t.appendChild(thead);
  const tb = el('tbody');
  if (!slice.length) {
    tb.appendChild(el('tr', {}, [ el('td', { colspan: o.cols.length, style: 'padding:36px;text-align:center;color:var(--ink-3)',
      text: o.emptyText || 'Nothing matches these filters.' }) ]));
  }
  slice.forEach(r => {
    const row = el('tr');
    o.cols.forEach(c => row.appendChild(el('td', { class: c.num ? 'num' : '', html: c.r ? c.r(r) : esc(c.v(r)) })));
    if (o.onRow) row.addEventListener('click', e => { if (!e.target.closest('button,a,input')) o.onRow(r); });
    tb.appendChild(row);
  });
  t.appendChild(tb); wrap.appendChild(t);
  const f = el('div', { class: 'tfoot' });
  f.appendChild(el('span', { text: `${total.toLocaleString()} ${o.noun || 'rows'}` + (o.footNote ? ' · ' + o.footNote : '') }));
  f.appendChild(el('div', { style: 'flex:1' }));
  if (pages > 1) {
    f.appendChild(el('button', { class: 'btn sm', text: '‹ Prev', disabled: p === 0 || null,
      onclick: () => { VIEW.page[key] = p - 1; render(); } }));
    f.appendChild(el('span', { class: 'mono', text: `${p+1} / ${pages}` }));
    f.appendChild(el('button', { class: 'btn sm', text: 'Next ›', disabled: p >= pages - 1 || null,
      onclick: () => { VIEW.page[key] = p + 1; render(); } }));
  }
  wrap.appendChild(f);
  host.appendChild(wrap);
}

const CMINKEY = CFG.cacheKey + '.minLeadStages';
function minLeadStages() {

function toggleLeadMin(id) {

    col.addEventListener('dragleave', () => col.classList.remove('drop'));

/* ----------------------------------------------------------- TASKS */
function viewTasks(root) {
  const mine = VIEW.rep === 'all' ? live('tasks') : live('tasks').filter(t => String(t.ownerId) === VIEW.rep);
  const showDone = VIEW.tableFilter.done;
  const t0 = TODAY();
  const bucket = t => {
    if (t.status === 'done') return 'done';
    if (!t.dueDate) return 'someday';
    const n = dnum(t.dueDate);
    if (n < dnum(t0)) return 'overdue';
    if (n === dnum(t0)) return 'today';
    if (n <= dnum(addDays(t0, 7))) return 'week';
    return 'later';
  };
  const groups = [
    ['overdue', 'Overdue',        'critical'],
    ['today',   'Due today',      'warning'],
    ['week',    'Next 7 days',    ''],
    ['later',   'Later',          ''],
    ['someday', 'No due date',    ''],
    ['done',    'Completed',      'good']
  ];
  const by = groupBy(mine, bucket);
  root.appendChild(viewHead(null, [
    el('button', { class: 'btn' + (showDone ? ' primary' : ''),
      text: showDone ? 'Hide completed' : 'Show completed',
      onclick: () => { VIEW.tableFilter.done = !showDone; render(); } }),
    el('button', { class: 'btn primary', html: ico('plus',14) + ' New task', onclick: () => editTask(null) })
  ]));
  const tl = el('div', { class: 'tiles' });
  tl.appendChild(tile('Overdue', (by.get('overdue') || []).length, { icon: 'warn' }));
  tl.appendChild(tile('Due today', (by.get('today') || []).length, { icon: 'cal' }));
  tl.appendChild(tile('Next 7 days', (by.get('week') || []).length, { icon: 'clip' }));
  tl.appendChild(tile('Open in total', mine.filter(t => t.status !== 'done').length, { icon: 'check' }));
  root.appendChild(tl);

  let any = false;
  groups.forEach(([k, label, sev]) => {
    if (k === 'done' && !showDone) return;
    const list = (by.get(k) || []).sort((a, b) =>
      (dnum(a.dueDate) || 99999999) - (dnum(b.dueDate) || 99999999));
    if (!list.length) return;
    any = true;
    const c = el('div', { class: 'card', style: 'margin-bottom:var(--sp-3)' });
    c.appendChild(el('div', { class: 'card-head' }, [
      el('h3', { html: (sev ? `<span style="color:var(--${sev})">${ico('flag',13)}</span> ` : '') + esc(label) }),
      el('span', { class: 'tag', text: list.length }),
      el('div', { class: 'sp' })
    ]));
    list.slice(0, 200).forEach(t => c.appendChild(taskRow(t)));
    if (list.length > 200) c.appendChild(el('p', { class: 'sub', style: 'margin:8px 0 0',
      text: `+${list.length - 200} more` }));
    root.appendChild(c);
  });
  if (!any) root.appendChild(el('div', { class: 'empty', html:
    ico('check',34) + '<h4>Nothing on the list</h4><p>Add follow-ups from a deal or with the New task button, and they appear here grouped by when they are due.</p>' }));
}
function taskRow(t) {

  const late = t.status !== 'done' && t.dueDate && dnum(t.dueDate) < dnum(TODAY());
  const today = t.status !== 'done' && t.dueDate && dnum(t.dueDate) === dnum(TODAY());
  const n = el('div', { class: 'trow' + (t.status === 'done' ? ' done' : late ? ' late' : today ? ' today' : '') });
  n.appendChild(el('button', { class: 'cb' + (t.status === 'done' ? ' on' : ''), 'aria-label': 'Complete task',
    html: `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg>`,
    onclick: e => { e.stopPropagation(); toggleTask(t); } }));
  const b = el('div', { class: 'tb' });
  b.appendChild(el('div', { class: 'tt', text: t.title }));

    html: ico('cal',11) + ' ' + (t.dueDate ? frel(t.dueDate) : 'no date') }));
  if (t.type && t.type !== 'todo') m.appendChild(el('span', { class: 'tag', text: t.type }));

  if (d) m.appendChild(el('a', { href: 'javascript:void 0', style: 'color:var(--accent);text-decoration:none',
    text: d.name, onclick: e => { e.preventDefault(); e.stopPropagation(); openDeal(d.id); } }));
  else if (co) m.appendChild(el('span', { text: co.name }));
  m.appendChild(el('span', { style: 'margin-left:auto;display:flex;align-items:center;gap:6px' }, [
    el('span', { class: 'avatar', style: `background:${ownerColor(t.ownerId)};width:20px;height:20px;font-size:9px`,
      text: initials(ownerName(t.ownerId)), title: ownerName(t.ownerId) })
  ]));
  b.appendChild(m);

  n.appendChild(b);
  const acts = el('div', { style: 'display:flex;gap:4px;align-items:center;flex:none' });
  acts.appendChild(el('button', {
    class: 'btn sm' + (t.status === 'done' ? '' : ' primary'),
    html: t.status === 'done' ? 'Reopen' : ico('check',13) + ' Done',

    onclick: e => { e.stopPropagation(); toggleTask(t); } }));
  acts.appendChild(el('button', { class: 'btn icon ghost', html: ico('edit',14), 'aria-label': 'Edit task',
    onclick: e => { e.stopPropagation(); editTask(t); } }));
  n.appendChild(acts);
  return n;
}
function toggleTask(t) {
  const done = t.status !== 'done';

  upsert('tasks', t);

    kind: 'task', html: `Completed task <b>${esc(t.title)}</b>` });

  return n;
}

async function doUpload(d, files) {
  if (!files.length) return;
  const t = toast(`Uploading ${files.length} file${files.length > 1 ? 's' : ''}…`);
  let ok = 0;
  for (const f of files) {
    try { await uploadAttachment(d.id, f); ok++; }
    catch (e) { toast(String(e.message || e), 'err'); }
  }
  if (ok) {
    logAct({ dealId: d.id, ownerId: d.ownerId, kind: 'note',
      html: `Attached ${ok} file${ok > 1 ? 's' : ''}: ${esc(files.slice(0, 3).map(f => f.name).join(', '))}` });
    toast(`${ok} file${ok > 1 ? 's' : ''} attached`, 'ok');
    openDeal(d.id);
  }
}

  ]));

function askLoss(d, lostId) {
  const reasons = DB.lossReasons && DB.lossReasons.length ? DB.lossReasons : ['Price too high','Lost to competitor','No budget','No response','Timing / postponed','Not a fit','Other'];
  const sel = el('select', { class: 'inp' });

/* Fills only what is blank. A domain gives a readable name and, through the
   country-code TLD, a country. It cannot give a city — that needs a paid
   data provider — so the city is left alone rather than guessed. */
function enrichCompany(c, o) {
  o = o || {};
  const d = cleanDomain(c.domain);
  if (!d) { if (o.loud) toast('Add a domain first', 'err'); return 0; }
  const filled = [];
  const nm = domainToName(d);
  if (nm && (!c.name || !c.name.trim())) { c.name = nm; filled.push('name'); }
  const ctry = domainCountry(d);
  if (ctry && !c.country) { c.country = ctry; filled.push('country'); }
  if (c.domain !== d) { c.domain = d; }
  if (filled.length) {
    upsert('companies', c);
    if (o.loud) { toast('Filled ' + filled.join(' and ') + ' from the domain', 'ok'); openCompany(c.id); }
  } else if (o.loud) {
    const why = !nm && !ctry ? 'nothing could be derived from that domain'
      : 'name and country are already set';
    toast('Nothing to fill — ' + why);
  }
  return filled.length;
}

/* ================================================================
   FORMS — create / edit records, entity pickers, global search
   ================================================================ */
function fld(label, node, hint) {
  const w = el('div', { class: 'field' });
  w.appendChild(el('label', { class: 'fl', text: label }));
  w.appendChild(node);
  if (hint) w.appendChild(el('div', { style: 'font-size:var(--fs-xs);color:var(--ink-3);margin-top:4px;line-height:1.5', text: hint }));
  return w;
}
/* Multi-select for collaborators: a chip per person, plus an add control. */
function ownerMulti(values, excludeId) {
  let chosen = (values || []).map(String).filter(v => v && v !== String(excludeId));
  const node = el('div', { class: 'multi' });
  const paint = () => {
    node.innerHTML = '';
    chosen.forEach(id => {
      const o = DB.owners.find(x => x.id === id);
      node.appendChild(el('span', { class: 'chip' }, [
        el('span', { class: 'avatar', style: `background:${ownerColor(id)};width:18px;height:18px;font-size:8px`,
          text: initials(ownerName(id)) }),
        el('span', { text: ownerName(id) + (o && !o.active ? ' (inactive)' : '') }),
        el('button', { html: ico('x',11), 'aria-label': 'Remove ' + ownerName(id),
          onclick: () => { chosen = chosen.filter(x => x !== id); paint(); } })
      ]));
    });
    const left = activeOwners().filter(o => !chosen.includes(o.id) && o.id !== String(excludeId));
    if (left.length) {
      const add = el('select', { class: 'inp', style: 'width:auto;min-width:150px',
        'aria-label': 'Add a collaborator',
        onchange: e => { if (!e.target.value) return; chosen = chosen.concat([e.target.value]); paint(); } });
      add.appendChild(el('option', { value: '', text: chosen.length ? '+ Add another…' : '+ Add a collaborator…' }));
      left.forEach(o => add.appendChild(el('option', { value: o.id, text: o.name })));
      node.appendChild(add);
    } else if (!chosen.length) {
      node.appendChild(el('span', { style: 'color:var(--ink-3);font-size:var(--fs-sm)', text: 'No one else available' }));
    }
  };
  paint();
  return { node, get: () => chosen.slice(), set: v => { chosen = (v || []).map(String); paint(); } };
}

/* Assignment picker. Only active people can be chosen. A record that already
   belongs to someone who has since left keeps that owner — it is shown as the
   current value so saving does not silently reassign it — but no *other*
   inactive person can be picked, so work never lands on a leaver. */
function ownerSelect(value, o) {
  o = o || {};
  const s = el('select', { class: 'inp' });
  if (o.onchange) s.addEventListener('change', o.onchange);
  s.appendChild(el('option', { value: '', text: o.emptyLabel || 'Unassigned' }));
  activeOwners().forEach(p => {
    if (o.exclude && String(o.exclude) === p.id) return;
    s.appendChild(el('option', { value: p.id, text: p.name, selected: String(value) === p.id || null }));
  });
  const cur = DB.owners.find(p => p.id === String(value));
  if (cur && !cur.active) {
    const g = el('optgroup', { label: 'No longer active — reassign' });
    g.appendChild(el('option', { value: cur.id, text: cur.name + ' (inactive)', selected: true }));
    s.appendChild(g);
  }
  return s;
}
/* Deal types: the three CoreV sells against, plus any legacy value already on
   a record so an import never loses what it came in with. */
function dealTypes() {
  const base = (DB.config && DB.config.dealTypes && DB.config.dealTypes.length)
    ? DB.config.dealTypes.slice() : ['Consumer', 'Commercial', 'International'];
  const found = Array.from(new Set(live('deals').map(d => d.dealType).filter(Boolean)));
  found.forEach(t => { if (!base.includes(t)) base.push(t); });
  return base;
}
/* type-ahead picker over an entity list */
function picker(opts) {
  const o = opts || {};
  const wrap = el('div', { style: 'position:relative' });
  const inp = el('input', { class: 'inp', placeholder: o.placeholder || 'Type to search…', autocomplete: 'off',
    value: o.initialLabel || '' });
  const res = el('div', { class: 'search-res' });
  let chosen = o.initialValue || null;
  wrap.appendChild(inp); wrap.appendChild(res);
  const paint = () => {
    const q = inp.value.trim().toLowerCase();
    res.innerHTML = '';
    let list = o.items();
    if (q) list = list.filter(x => o.match(x, q));
    list = list.slice(0, 40);
    if (o.allowNew && q) {
      res.appendChild(el('button', { html: `${ico('plus',13)} <b>Create “${esc(inp.value.trim())}”</b>`,
        onclick: () => { res.classList.remove('on'); o.onNew(inp.value.trim(), lbl => { inp.value = lbl; }); } }));
    }
    if (!list.length && !o.allowNew) res.appendChild(el('div', { class: 'sec', text: 'No match' }));
    list.forEach(x => res.appendChild(el('button', { html: o.render(x), onclick: () => {
      chosen = o.value(x); inp.value = o.label(x); res.classList.remove('on');
      if (o.onPick) o.onPick(x);
    } })));
    res.classList.add('on');
  };
  inp.addEventListener('focus', paint);
  inp.addEventListener('input', () => { chosen = null; paint(); });
  inp.addEventListener('blur', () => setTimeout(() => res.classList.remove('on'), 180));
  return { node: wrap, get: () => chosen, getText: () => inp.value.trim(), clear: () => { chosen = null; inp.value = ''; } };
}
const coPicker = (value) => picker({
  placeholder: 'Search companies…',
  initialValue: value, initialLabel: value ? (getCo(value) || {}).name || '' : '',
  items: () => live('companies').sort((a,b) => (a.name||'').localeCompare(b.name||'')),

  allowNew: true,

    pendingCo = c.id;
  }
});

function currentOwnerId() {
  if (!AUTH.user) return (DB.owners[0] || {}).id || '';

      /* A contact nobody can reach is a contact nobody works, so the four
         fields that make one usable are required on the form. Records that
         came in from HubSpot short of them are left alone until edited. */
      const problems = [];
      const mark = (node, bad) => node.style.borderColor = bad ? 'var(--critical)' : '';

  ].filter(Boolean));
}

function linkContact(d) {
  const co = getCo(d.companyId);
  const p = picker({
    placeholder: 'Search people…',
    items: () => {
      const all = live('contacts').filter(c => !(d.contactIds || []).includes(c.id));
      if (!co) return all.slice(0, 400);
      const same = all.filter(c => c.companyId === co.id);
      return same.concat(all.filter(c => c.companyId !== co.id)).slice(0, 400);
    },
    match: (c, q) => (c.fullName || '').toLowerCase().includes(q) || (c.email || '').toLowerCase().includes(q) ||
      ((getCo(c.companyId) || {}).name || '').toLowerCase().includes(q),
    label: c => c.fullName || c.email, value: c => c.id,
    render: c => `<span>${esc(c.fullName || c.email || '—')}</span><span class="sub">${esc((getCo(c.companyId)||{}).name || c.jobTitle || '')}</span>`,
    allowNew: true,
    onNew: (name, setLabel) => {
      const parts = name.split(/\s+/);
      const c = upsert('contacts', { firstName: parts[0], lastName: parts.slice(1).join(' ') || null,
        fullName: name, companyId: d.companyId || null, ownerId: d.ownerId, createdAt: TODAY(), dealIds: [d.id] });
      d.contactIds = (d.contactIds || []).concat([c.id]); d.contactInferred = false; upsert('deals', d);
      closeAll(); openDeal(d.id); toast('Contact created and linked', 'ok');
    }
  });
  modal('Link a contact to ' + d.name, el('div', {}, [
    el('p', { style: 'margin:0 0 var(--sp-4);color:var(--ink-2);line-height:1.6',
      text: co ? `People at ${co.name} are listed first.` : 'Search anyone on file, or type a new name to create them.' }),
    fld('Contact', p.node)
  ]), [
    el('button', { class: 'btn', text: 'Cancel', onclick: closeAll }),
    el('button', { class: 'btn primary', text: 'Link', onclick: () => {
      const id = p.get(); if (!id) return toast('Pick a contact first', 'err');
      d.contactIds = (d.contactIds || []).concat([id]); d.contactInferred = false;
      upsert('deals', d);
      const c = getCt(id); if (c) { c.dealIds = Array.from(new Set((c.dealIds || []).concat([d.id]))); upsert('contacts', c); }
      closeAll(); openDeal(d.id); toast('Linked', 'ok');
    } })
  ]);
}

/* Names taken from the deal and contact records already in the CRM. Prices are
   deliberately blank — I am not going to invent your price list. */
function starterCatalogue() {
  const seed = [
    ['XS1-PEAK',      'XS1 PEAK',            'Hardware',     'once'],
    ['XS1-PEAKPLUS',  'XS1 PEAK PLUS',       'Hardware',     'once'],
    ['XS1-FLOWPLUS',  'XS1 FLOW PLUS',       'Hardware',     'once'],
    ['XP1-APEX',      'XP1 APEX',            'Hardware',     'once'],
    ['OXEAI-BASIC',   'OxeAI Basic',         'Subscription', 'monthly'],
    ['OXEAI-PREM',    'OxeAI Premium',       'Subscription', 'monthly'],
    ['INSTALL',       'Delivery & installation', 'Installation', 'once'],
    ['TRAINING',      'Onboarding & training',   'Service',      'once']
  ];
  let n = 0;
  batch(() => seed.forEach(([sku, name, category, billing]) => {
    if (live('products').some(p => p.sku === sku)) return;
    upsert('products', { sku, name, category, billing, listPrice: null, active: true, currency: CFG.currency });
    n++;
  }));
  toast(`${n} products added — set their prices in the catalogue`, 'ok');
}
function importProductsCSV(after) {
  const file = el('input', { type: 'file', accept: '.csv,text/csv', class: 'inp' });
  modal('Import products', el('div', {}, [
    el('p', { style: 'margin:0 0 var(--sp-4);color:var(--ink-2);line-height:1.6',
      html: 'Columns matched loosely: <b>SKU</b>, <b>Name</b>, <b>Category</b>, <b>List price</b>, <b>Billing</b> (once / monthly / annual), <b>Active</b>, <b>Notes</b>. Rows match on SKU, so re-importing updates rather than duplicates.' }),
    fld('File', file)
  ]), [
    el('button', { class: 'btn', text: 'Cancel', onclick: () => { closeAll(); productManager(); } }),
    el('button', { class: 'btn primary', text: 'Import', onclick: () => {
      const fl = file.files[0]; if (!fl) return toast('Choose a file first', 'err');
      const rd = new FileReader();
      rd.onload = () => {
        try {
          const rows = parseCSV(rd.result);
          if (rows.length < 2) throw new Error('no data rows');
          const hdr = rows[0].map(NORM);
          let added = 0, updated = 0;
          batch(() => rows.slice(1).forEach(r => {
            const sku = pick(r, hdr, ['sku','code','product code']);
            const name = pick(r, hdr, ['name','product','product name','description']);
            if (!sku && !name) return;
            const bRaw = (pick(r, hdr, ['billing','billing frequency','recurrence']) || 'once').toLowerCase();
            const billing = /month/.test(bRaw) ? 'monthly' : /year|annual/.test(bRaw) ? 'annual' : 'once';
            const priceRaw = pick(r, hdr, ['list price','price','unit price','amount']);
            const activeRaw = (pick(r, hdr, ['active','status']) || 'yes').toLowerCase();
            let p = sku ? live('products').find(x => x.sku === sku) : live('products').find(x => NORM(x.name) === NORM(name));
            const patch = {
              sku: sku || (p && p.sku) || null, name: name || (p && p.name) || sku,
              category: pick(r, hdr, ['category','type','group']) || (p && p.category) || null,
              listPrice: priceRaw == null ? (p ? p.listPrice : null) : Number(String(priceRaw).replace(/[^0-9.\-]/g, '')) || null,
              billing, active: !/^(no|false|0|inactive)$/.test(activeRaw),
              notes: pick(r, hdr, ['notes','note','comment']) || (p && p.notes) || null,
              currency: CFG.currency
            };
            if (p) { upsert('products', Object.assign(p, patch)); updated++; }
            else { upsert('products', patch); added++; }
          }));
          closeAll(); productManager(); render();
          toast(`${added} added, ${updated} updated`, 'ok');
        } catch (e) { toast('Import failed: ' + e.message, 'err'); }
      };
      rd.readAsText(fl);
    } })
  ]);
}

        `<b title="${esc(it.name)}">${esc(it.name)}</b>

      const mk = (key, step, min) => el('input', { type: 'number', step: step, min: min == null ? '0' : min,
        value: it[key] == null ? '' : it[key], 'aria-label': key + ' for ' + it.name,

/* ================================================================
   COMMITMENT REVIEW — the weekly meeting view. Pipeline, forecast and
   what each rep is committing to, on one screen, across all reps.

   The commitment model is the one from the OxeFit Sales Tracker:
   each rep picks deals into a Commit slot and a Best case slot, ticks
   the buyer signals behind them, and the weighted forecast falls out
   of that. The difference here is that the deals are CoreV CRM deals,
   not typed-in names pulled from HubSpot — so the stage, the value and
   the outcome are the same records the pipeline and forecast views use.
   ================================================================ */

/* ---- the seven buyer signals, unchanged from the tracker ---- */
const SIGNALS = [
  ['budget',   'Budget confirmed'],
  ['timeline', 'Timeline defined'],
  ['champion', 'Internal champion'],
  ['demo',     'Demo completed'],
  ['proposal', 'Proposal submitted'],
  ['dm',       'Decision-maker engaged'],
  ['compout',  'Competition eliminated']
];
const CONF_LEVELS = [90, 70, 50, 30];

/* A deal that has not moved in this long is treated as stale and its
   contribution to the forecast is halved. The tracker hard-coded
   Qualified 14 / Proposal 21 / Negotiation 30; here the threshold comes
   off the stage's own probability, so it still works if you edit stages. */
const staleDays = p => p >= .6 ? 30 : p >= .4 ? 21 : 14;
const STALE_PENALTY = 0.5;

/* The monthly review asks "when did this last move?" of a few hundred deals
   per render. Scanning the whole activity log each time is one pass too many,
   so it is folded into a map once and reused until the log grows. */
let _SINCE = null, _SINCE_N = -1;
function stageSinceMap() {
  if (_SINCE && _SINCE_N === DB.activities.length) return _SINCE;
  const m = new Map();
  DB.activities.forEach(a => {
    if (a._del || a.kind !== 'stage' || !a.dealId || !a.at) return;
    const day = String(a.at).slice(0, 10), cur = m.get(a.dealId);
    if (!cur || day > cur) m.set(a.dealId, day);
  });
  _SINCE = m; _SINCE_N = DB.activities.length;
  return m;
}
function stageSince(d) {
  return stageSinceMap().get(d.id) || d.stageChangedAt || d.createdAt || null;
}
function daysInStage(d) {
  const s = stageSince(d);
  if (!s) return null;
  const n = days(TODAY(), s);
  return n >= 0 ? n : null;
}
function isStale(d) {
  const n = daysInStage(d);
  return n != null && n > staleDays(stage(d.stageId).probability);
}

/* ---- device counts on a commitment ------------------------------------
   The tracker asked each rep for forecast XS1 / XP1 units alongside the
   money. Here the counts hang off the individual commitment, and they are
   pre-filled from the deal's own estimate when it has one — the product
   lines are matched on the SKU prefix, so XS1-PEAKPLUS ×2 reads as 2 XS1.
   A rep can still type over it; a typed value wins and is remembered. */
const DEFAULT_UNIT_LINES = ['XS1', 'XP1'];
const unitLines = () => (DB.config.unitLines && DB.config.unitLines.length)
  ? DB.config.unitLines.slice() : DEFAULT_UNIT_LINES.slice();
/* A real CoreV SKU looks like MENA-XS1-PEAK-PLUS-APEX-36MO, so the line code
   sits in the middle, not at the front. Match it as a whole segment of the
   SKU — MENA-MEM-XLEAD-2500-SESS must not read as XS1 — and fall back to the
   same test on the product name for a line that was typed in without a SKU. */
const skuTokens = s => String(s || '').toUpperCase().split(/[^A-Z0-9]+/).filter(Boolean);
function lineMatches(it, code) {
  const up = String(code).toUpperCase();
  if (skuTokens(it.sku).includes(up)) return true;
  if (it.sku) return false;                       // a real SKU that misses is a miss
  return skuTokens(it.name).includes(up);
}
function autoUnits(d) {
  const out = {};
  if (!d) return out;
  unitLines().forEach(L => {
    const n = sum((d.items || []).filter(it => lineMatches(it, L)), it => Number(it.qty) || 0);
    if (n) out[L] = n;
  });
  return out;
}
function unitsOf(c) {
  if (c && c.units && typeof c.units === 'object' && Object.keys(c.units).length) return c.units;
  return autoUnits(c && getDl(c.dealId));
}
const unitTotal = (recs, line) => sum(recs, c => Number(unitsOf(c)[line]) || 0);
const unitSummary = recs => unitLines().map(L => [L, unitTotal(recs, L)]).filter(([, n]) => n);
const unitText = recs => unitSummary(recs).map(([L, n]) => `${n} ${L}`).join(' · ');

/* ---- commitments: one record per deal, per rep, per week, per slot ---- */
const slotOf = c => c.slot === 'best' ? 'best' : 'commit';
const SLOTS = { commit: 'Commit', best: 'Best case' };
function commitsIn(wk, ownerId, slot) {
  return live('commitments').filter(c => c.week === wk &&
    (ownerId == null || String(c.ownerId) === String(ownerId)) &&
    (slot == null || slotOf(c) === slot));
}
const commitValue = c => { const d = getDl(c.dealId); return Number(c.amount) || (d && d.amount) || 0; };

function reviewFor(week, ownerId) {
  let r = live('reviews').find(x => x.week === week && String(x.ownerId) === String(ownerId));
  if (!r) r = { id: uid('R'), week, ownerId: String(ownerId), problems: [], solutions: [], notes: [],
    signals: {}, confidence: 90, action: '', blocked: '', locked: false };
  if (!r.signals || typeof r.signals !== 'object') r.signals = {};
  return r;
}
function saveReview(r) { upsert('reviews', r); }

/* ---------------------------------------------------------------
   The whole commitment picture for one rep in one week. Every number
   on this screen comes from here, so the tiles, the table, the card
   and the exported agenda can never disagree with each other.
   --------------------------------------------------------------- */
function repWeek(o, wk, rng) {
  const b = { from: rng.from, to: rng.to };
  const r = reviewFor(wk, o.id);
  const mine = ownedDeals(o.id);
  const cRecs = commitsIn(wk, o.id, 'commit');
  const bRecs = commitsIn(wk, o.id, 'best');
  const commitDeals = cRecs.map(c => getDl(c.dealId)).filter(Boolean);
  const bestDeals   = bRecs.map(c => getDl(c.dealId)).filter(Boolean);

  const commitVal = sum(cRecs, commitValue);
  const bestVal   = sum(bRecs, commitValue);

  // the stage that drives the weight is the strongest committed deal,
  // falling back to best case when nothing is committed yet
  const pool = commitDeals.length ? commitDeals : bestDeals;
  const topProb = pool.reduce((m, d) => Math.max(m, stage(d.stageId).probability || 0), 0);
  const stale = (commitDeals.length ? commitDeals : bestDeals).some(isStale);
  const penalty = stale ? STALE_PENALTY : 1;
  const forecast = (commitVal + bestVal) * topProb * penalty;

  const sig = r.signals || {};
  const sigOn = SIGNALS.filter(([k]) => sig[k]).length;
  const score = Math.min(100, Math.round((sigOn / SIGNALS.length) * 60 + Math.min(1, topProb / .9) * 40));
  const tier = score >= 70 ? 'hot' : score >= 40 ? 'warm' : 'cold';

  const openD = mine.filter(isOpen);
  /* Attainment and coverage are month questions — a week's revenue against a
     month's target would read as a miss every week. The month the week ends in
     is the one that counts. */
  const mb = mBounds(rng.to);
  const monthWon = sum(mine.filter(d => isWon(d) && inPeriod(d.closeDate, mb)), d => d.amount);
  const won  = mine.filter(d => isWon(d)  && inPeriod(d.closeDate, b));
  const lost = mine.filter(d => isLost(d) && inPeriod(d.closeDate, b));
  const wonVal = sum(won, d => d.amount), lostVal = sum(lost, d => d.amount);
  const pipeline = sum(openD, d => d.amount);
  const ti = repTargetInfo(o.id, Object.assign(mBounds(rng.to), { grain: 'month' }));
  const target = ti.value;

  const units = {};
  unitLines().forEach(L => { const n = unitTotal(cRecs, L) + unitTotal(bRecs, L); if (n) units[L] = n; });
  const commitUnits = {};
  unitLines().forEach(L => { const n = unitTotal(cRecs, L); if (n) commitUnits[L] = n; });

  const denom = Math.max(forecast, wonVal);
  return { o, r, wk, rng, units, commitUnits,
    cRecs, bRecs, commitDeals, bestDeals, commitVal, bestVal,
    topProb, stale, penalty, forecast, sigOn, score, tier,
    openD, won, lost, wonVal, lostVal, pipeline,
    weightedPipe: sum(openD, weighted), target,
    accuracy: denom ? 1 - Math.abs(forecast - wonVal) / denom : null,
    variance: commitVal ? (wonVal - commitVal) / commitVal : null,
    monthWon, monthLabelOf: mb.label, targetInfo: ti,
    attain:   target ? monthWon / target : null,
    coverage: target ? pipeline / target : null,
    landed: sum(cRecs.filter(c => { const d = getDl(c.dealId); return d && isWon(d); }), commitValue)
  };
}

/* ---- the scorecard thresholds -------------------------------------------
   The tracker hard-coded these. Four times coverage is a SaaS rule of thumb,
   not a fact about selling gym equipment in the Gulf, so every one of them is
   configurable in Settings and the defaults are only defaults. Each metric has
   a green floor and an amber floor; below the amber floor is red. */
const METRICS = [
  { key: 'coverage', label: 'Pipeline coverage', unit: '×', step: '0.1',
    good: 4, warn: 2.5, hint: 'Open pipeline ÷ the period target. How many times over the pipeline covers the number.' },
  { key: 'accuracy', label: 'Forecast accuracy', unit: '%', step: '1', asPct: true,
    good: 85, warn: 70, hint: 'How close the weighted forecast landed to what actually closed. Symmetric.' },
  { key: 'attain',   label: 'Goal attainment', unit: '%', step: '1', asPct: true,
    good: 100, warn: 85, hint: 'Closed won ÷ the period target.' },
  { key: 'variance', label: 'Commit variance', unit: '%', step: '1', asPct: true, signed: true,
    good: 0, warn: -15, hint: 'Closed won against what was committed. Negative is a miss.' }
];
function thresholds(key) {
  const m = METRICS.find(x => x.key === key) || {};
  const c = (DB.config.thresholds || {})[key] || {};
  const g = Number(c.good), w = Number(c.warn);
  return { good: isFinite(g) && c.good !== '' && c.good != null ? g : m.good,
           warn: isFinite(w) && c.warn !== '' && c.warn != null ? w : m.warn };
}
/* v arrives as a ratio (0.85, 3.6); the percent metrics are stored as percents */
function metTag(key, v) {
  if (v == null) return '';
  const m = METRICS.find(x => x.key === key) || {};
  const t = thresholds(key);
  const x = m.asPct ? v * 100 : v;
  return x >= t.good ? 'good' : x >= t.warn ? 'warn' : 'bad';
}
const accTag = v => metTag('accuracy', v);
const varTag = v => metTag('variance', v);
const covTag = v => metTag('coverage', v);
const attTag = v => metTag('attain', v);
const thresholdNote = key => {
  const m = METRICS.find(x => x.key === key) || {}, t = thresholds(key);
  const f = n => m.asPct ? `${n}%` : `${n}${m.unit || ''}`;
  return `${f(t.good)} or better is green, ${f(t.warn)} amber, below that red.`;
};
const signed = v => (v > 0 ? '+' : '') + Math.round(v * 100) + '%';

/* ================================================================ view */
function viewReview(root) {
  const wk = VIEW.week, rng = weekRange(wk);
  const prev = weekShift(wk, -1);
  const b = { from: rng.from, to: rng.to };
  const reps = VIEW.rep === 'all' ? activeOwners() : DB.owners.filter(o => o.id === VIEW.rep);
  const W = reps.map(o => repWeek(o, wk, rng));

  root.appendChild(viewHead(null, [
    el('div', { class: 'seg' }, [
      el('button', { html: '‹', onclick: () => { VIEW.week = prev; render(); }, title: 'Previous week' }),
      el('button', { class: 'on', text: weekLabel(wk) }),
      el('button', { html: '›', onclick: () => { VIEW.week = weekShift(wk, 1); render(); }, title: 'Next week' })
    ]),
    wk !== weekKey() ? el('button', { class: 'btn', text: 'This week', onclick: () => { VIEW.week = weekKey(); render(); } }) : null,
    el('button', { class: 'btn', html: ico('dl',14) + ' Export agenda', onclick: () => exportReview(wk) }),
    el('button', { class: 'btn primary', html: ico('flag',14) + ' Commit deals', onclick: () => addCommitment(wk) })
  ]));

  // ---- team roll-up: commitment, forecast and pipeline in one band
  const commitVal = sum(W, x => x.commitVal), bestVal = sum(W, x => x.bestVal);
  const forecast  = sum(W, x => x.forecast);
  const wonVal    = sum(W, x => x.wonVal),   lostVal = sum(W, x => x.lostVal);
  const landed    = sum(W, x => x.landed);
  const pipeline  = sum(W, x => x.pipeline);
  const nCommit   = sum(W, x => x.cRecs.length), nBest = sum(W, x => x.bRecs.length);
  const locked    = W.filter(x => x.r.locked).length;
  const target    = repTarget(VIEW.rep, mBounds(rng.to));

  const t = el('div', { class: 'tiles' });
  t.appendChild(tile('Commit', money(commitVal), { cur: true, icon: 'flag',
    foot: `${nCommit} deal${nCommit === 1 ? '' : 's'} committed by ${W.filter(x => x.cRecs.length).length} of ${W.length} reps` }));
  t.appendChild(tile('Best case', money(bestVal), { cur: true, icon: 'up',
    foot: `${nBest} deal${nBest === 1 ? '' : 's'} that could land` }));
  t.appendChild(tile('Weighted forecast', money(forecast), { cur: true, icon: 'chart',
    foot: '(commit + best case) × stage weight' + (W.some(x => x.stale) ? ' · stale halved' : '') }));
  t.appendChild(tile('Of commit, landed', money(landed), { cur: true, icon: 'check',
    foot: commitVal ? pct(landed, commitVal) + '% of the commitment kept' : 'nothing committed yet',
    meter: commitVal ? pct(landed, commitVal) : null }));
  t.appendChild(tile('Closed won in week', money(wonVal), { cur: true, icon: 'bolt',
    foot: target ? `${pct(wonVal, target)}% of the ${fdate(rng.to,'month')} target` : `${sum(W, x => x.won.length)} won · ${sum(W, x => x.lost.length)} lost`,
    meter: target ? pct(wonVal, target) : null }));
  if (unitLines().length) {
    const allRecs = W.reduce((a, x) => a.concat(x.cRecs, x.bRecs), []);
    const us = unitSummary(allRecs);
    t.appendChild(tile('Devices committed', us.length ? us.map(([, n]) => n).reduce((a, b) => a + b, 0) : '0',
      { icon: 'board', foot: us.length ? us.map(([L, n]) => `${n} ${L}`).join(' · ') : 'no device counts entered' }));
  }
  t.appendChild(tile('Open pipeline', money(pipeline), { cur: true, icon: 'grid',
    foot: target ? `${(pipeline / target).toFixed(1)}× coverage of target` : `${sum(W, x => x.openD.length)} open deals`,
    onclick: () => go('pipeline') }));
  root.appendChild(t);

  if (W.length && locked < W.length) root.appendChild(el('div', { class: 'alert', style: 'margin-bottom:var(--sp-3)' }, [
    el('span', { class: 'ic', html: ico('warn', 16) }),
    el('div', { style: 'flex:1;min-width:0;line-height:1.5', html:
      `<b>${W.length - locked} of ${W.length} reps have not submitted</b><div class="sub">${
        esc(W.filter(x => !x.r.locked).map(x => x.o.name).join(', '))} — the roll-up above counts whatever is entered so far.</div>` })
  ]));

  // ---- the merged grid: pipeline + forecast + commitment, per rep
  const gr = card('Pipeline, forecast and commitment by rep',
    `${weekLabel(wk)} · commit and best case are this week's picks, pipeline is current`);
  const host = el('div'); gr.body.appendChild(host);
  dataTable(host, {
    key: 'wkgrid', noun: 'reps', rows: W, per: 30, defaultSort: 1, defaultDir: 1,
    emptyText: 'No active reps. Add your team in Settings and their commitment rows appear here.',
    cols: [
      { h: 'Rep', v: x => x.o.name, r: x => ownerCell(x.o.id) },
      /* sorts on the team order, not the region's name, so Dubai comes before
         Abu Dhabi when that is how the regions are arranged */
      { h: 'Region', v: x => teamRank(x.o), sv: x => teamRank(x.o),
        r: x => { const r = ownerRegion(x.o.id);
          return r === UNASSIGNED_REGION ? '<span class="cellsub">not set</span>' : esc(r); } },
      { h: 'Status', v: x => x.r.locked ? 1 : 0, r: x => x.r.locked
          ? `<span class="tag good">Submitted</span>` : `<span class="tag warn">In progress</span>` },
      { h: 'Commit', num: true, v: x => x.commitVal,
        r: x => `<span class="mono">${money(x.commitVal)}</span><div class="cellsub">${x.cRecs.length} deals</div>` },
      { h: 'Best case', num: true, v: x => x.bestVal,
        r: x => `<span class="mono" style="color:var(--ink-2)">${money(x.bestVal)}</span><div class="cellsub">${x.bRecs.length} deals</div>` },
      { h: 'Weight', num: true, v: x => x.topProb,
        r: x => x.topProb ? `${Math.round(x.topProb * 100)}%${x.stale ? '<div class="cellsub" style="color:var(--critical-ink)">stale ×0.5</div>' : ''}`
                          : '<span class="cellsub">—</span>' },
      { h: 'Forecast', num: true, v: x => x.forecast, r: x => `<span class="mono">${money(x.forecast)}</span>` },
      { h: 'Pipeline', num: true, v: x => x.pipeline,
        r: x => `<span class="mono" style="color:var(--ink-2)">${money(x.pipeline)}</span><div class="cellsub">${x.openD.length} open</div>` },
      { h: 'Closed won', num: true, v: x => x.wonVal,
        r: x => `<span class="mono" style="color:var(--good-ink)">${money(x.wonVal)}</span><div class="cellsub">${x.won.length} deals</div>` },
      { h: 'Coverage', num: true, v: x => x.coverage || 0,
        r: x => x.coverage == null ? '<span class="cellsub">no target</span>'
              : `<span class="tag ${covTag(x.coverage)}">${x.coverage.toFixed(1)}×</span>` },
      { h: 'Devices', num: true, v: x => unitLines().reduce((t, L) => t + (x.units[L] || 0), 0),
        r: x => { const n = unitLines().filter(L => x.units[L]);
          return n.length ? n.map(L => `${x.units[L]} ${esc(L)}`).join('<br>') : '<span class="cellsub">—</span>'; } },
      { h: 'Score', num: true, v: x => x.score,
        r: x => `<span class="tag ${x.tier === 'hot' ? 'good' : x.tier === 'warm' ? 'warn' : 'bad'}">${x.score}</span>` +
                `<div class="cellsub">${x.sigOn}/${SIGNALS.length} signals</div>` }
    ],
    footNote: `team commit ${CFG.currency} ${money(commitVal, {dash:false})} · forecast ${CFG.currency} ${money(forecast, {dash:false})} · won ${CFG.currency} ${money(wonVal, {dash:false})}`,
    onRow: x => { VIEW.rep = x.o.id; renderTopControls(); render(); }
  });
  root.appendChild(el('div', { style: 'margin-bottom:var(--sp-3)' }, [gr.node]));

  // ---- two charts: where the commitment sits, and how the calls have gone
  const g = el('div', { class: 'grid2', style: 'margin-bottom:var(--sp-3)' });

  const allC = W.reduce((a, x) => a.concat(x.cRecs), []);
  const allB = W.reduce((a, x) => a.concat(x.bRecs), []);
  const c1 = card('Committed and best-case deals by stage',
    `${allC.length + allB.length} deals picked for ${weekLabel(wk)}`);
  const byStage = openStages().map(s => {
    const cd = allC.filter(c => { const d = getDl(c.dealId); return d && d.stageId === s.id; });
    const bdl = allB.filter(c => { const d = getDl(c.dealId); return d && d.stageId === s.id; });
    return { s, cv: sum(cd, commitValue), bv: sum(bdl, commitValue), n: cd.length + bdl.length };
  }).filter(x => x.n);
  if (!byStage.length) c1.body.appendChild(el('p', { class: 'sub', style: 'margin:0',
    html: 'Nothing has been committed for this week yet. Use <b>Commit deals</b> above, or the <b>Commit this week</b> button inside any deal.' }));
  else chartBar(c1.body, byStage.map(x => ({
    label: x.s.label, short: x.s.label.split(' ')[0],
    value: Math.round(x.cv + x.bv),
    note: `${CFG.currency} ${money(x.cv, {compact:true})} commit · ${CFG.currency} ${money(x.bv, {compact:true})} best case · weight ${Math.round(x.s.probability*100)}%`
  })), { yLabel: CFG.currency, xLabel: 'Stage' });
  g.appendChild(c1.node);

  const c2 = card('Called versus closed, week by week', 'Does the commitment hold up? Eight weeks of history');
  const wks = []; for (let i = 7; i >= 0; i--) wks.push(weekShift(wk, -i));
  const repIds = reps.map(o => String(o.id));
  const inScope = c => VIEW.rep === 'all' || repIds.includes(String(c.ownerId));
  chartLine(c2.body, [
    { name: 'Commit', color: 'var(--s1)',
      data: wks.map(k => sum(commitsIn(k, null, 'commit').filter(inScope), commitValue)) },
    { name: 'Closed won', color: 'var(--s3)', dash: '5 4',
      data: wks.map(k => { const rr = weekRange(k);
        return sum(live('deals').filter(d => isWon(d) && inPeriod(d.closeDate, { from: rr.from, to: rr.to }) &&
          (VIEW.rep === 'all' || ownedBy(d, VIEW.rep))), d => d.amount); }) }
  ], wks.map(k => weekRange(k).from.slice(5).replace('-', '/')), { xLabel: 'Week beginning', height: 280 });
  g.appendChild(c2.node);
  root.appendChild(g);

  // ---- movement this week, from the activity log
  const moved = DB.activities.filter(a => !a._del && a.kind === 'stage' && a.at &&
    a.at.slice(0,10) >= rng.from && a.at.slice(0,10) <= rng.to);
  const mv = card('Stage movement this week', `${moved.length} stage changes logged between ${fdate(rng.from)} and ${fdate(rng.to)}`);
  if (!moved.length) mv.body.appendChild(el('p', { class: 'sub', style: 'margin:0',
    text: 'No stage changes were logged in this week. Movement is recorded automatically when a deal is dragged on the board.' }));
  else {
    const tl = el('div', { class: 'tl' });
    moved.slice(0, 14).forEach(a => tl.appendChild(el('div', { class: 'it stage', html:
      `<div class="w">${esc(fdate(a.at))} · ${esc(ownerName(a.ownerId))}</div><div class="t">${a.html || esc(a.text || '')}</div>` })));
    mv.body.appendChild(tl);
  }
  root.appendChild(el('div', { style: 'margin-bottom:var(--sp-3)' }, [mv.node]));

  // ---- per-rep cards, grouped by region and in the team's own running order
  const groups = ownersByRegion(reps);
  groups.forEach(({ region, owners }) => {
    const mine = owners.map(o => W.find(x => x.o.id === o.id)).filter(Boolean);
    if (!mine.length) return;
    const commit = sum(mine, x => x.commitVal), fc = sum(mine, x => x.forecast);
    const inN = mine.filter(x => x.r.locked).length;
    root.appendChild(el('div', { class: 'regionhead' }, [
      el('h3', { text: region === UNASSIGNED_REGION ? 'No region set' : region }),
      el('span', { class: 'sub', text: `${mine.length} rep${mine.length === 1 ? '' : 's'} · ${
        esc(mine.map(x => x.o.name.split(' ')[0]).join(', '))}` }),
      el('div', { style: 'flex:1' }),
      el('span', { class: 'sub mono', text: `commit ${CFG.currency} ${money(commit, { dash: false })} · forecast ${CFG.currency} ${money(fc, { dash: false })}` }),
      el('span', { class: 'tag ' + (mine.length && inN === mine.length ? 'good' : 'warn'),
        text: `${inN}/${mine.length} in` })
    ]));
    const grid = el('div', { class: 'wk', style: 'margin-bottom:var(--sp-4)' });
    mine.forEach(x => grid.appendChild(repReviewCard(x)));
    root.appendChild(grid);
  });
  if (!W.length) root.appendChild(el('div', { class: 'empty', html: ico('user',34) +
    '<h4>No active reps</h4><p>Add your sales team in Settings and their commitment cards appear here.</p>' }));
  else if (groups.length === 1 && groups[0].region === UNASSIGNED_REGION && isAdmin())
    root.appendChild(el('p', { class: 'sub', style: 'margin:0;line-height:1.55', html:
      'Nobody has a sales region yet, so everyone is in one group. Set each person\u2019s region in ' +
      '<b>Settings \u2192 Sales team &amp; targets</b>, and put them in the order you run the meeting in under ' +
      '<b>Sales regions</b>.' }));
}

/* ------------------------------------------------- one rep's card */
function repReviewCard(x) {
  const { o, r, wk, rng } = x;
  const locked = !!r.locked;
  const tasksLate = live('tasks').filter(t => String(t.ownerId) === o.id && t.status !== 'done' &&
    t.dueDate && dnum(t.dueDate) < dnum(TODAY()));

  const n = el('div', { class: 'repcard' });
  n.appendChild(el('header', {}, [
    el('span', { class: 'avatar lg', style: `background:${ownerColor(o.id)}`, text: initials(o.name) }),
    el('div', {}, [ el('div', { class: 'nm', text: o.name }),
      el('div', { class: 'rl', text: `${x.openD.length} open · ${CFG.currency} ${money(x.pipeline, {compact:true})} pipeline` }) ]),
    el('div', { style: 'flex:1' }),
    el('span', { class: 'tag ' + (locked ? 'good' : 'warn'), text: locked ? 'Submitted' : 'In progress' }),
    overdueDeals(o.id, { ownedOnly: true }).length ? el('button', { class: 'tag bad', style: 'border:0;cursor:pointer',
      title: 'Open deals past their close date — click to fix',
      text: overdueDeals(o.id, { ownedOnly: true }).length + ' overdue dates',
      onclick: () => { VIEW.rep = o.id; renderTopControls(); overdueQueue(); } }) : null,
    tasksLate.length ? el('span', { class: 'tag bad', text: tasksLate.length + ' late tasks' }) : null
  ]));
  const bd = el('div', { class: 'b' });

  // ---- the numbers
  const kv = el('dl', { class: 'kvs' });
  const add = (k, v) => { kv.appendChild(el('dt', { text: k })); kv.appendChild(el('dd', { html: v })); };
  add('Commit',    `${CFG.currency} ${money(x.commitVal, { dash: false })}`);
  add('Best case', `<span style="color:var(--ink-2)">${CFG.currency} ${money(x.bestVal, { dash: false })}</span>`);
  add('Stage weight', x.topProb
    ? `${Math.round(x.topProb * 100)}%${x.stale ? ` <span class="tag bad">stale ×0.5</span>` : ''}`
    : '<span style="color:var(--ink-3)">—</span>');
  add('Weighted forecast', `${CFG.currency} ${money(x.forecast, { dash: false })}`);
  if (unitLines().length) add('Devices', Object.keys(x.units).length
    ? unitLines().filter(L => x.units[L]).map(L => `${x.units[L]} ${esc(L)}`).join(' · ')
    : '<span style="color:var(--ink-3)">none counted</span>');
  add('Won this week',  `<span style="color:var(--good-ink)">${CFG.currency} ${money(x.wonVal, { dash: false })}</span>`);
  add('Lost this week', `<span style="color:var(--critical-ink)">${CFG.currency} ${money(x.lostVal, { dash: false })}</span>`);
  bd.appendChild(kv);

  // ---- scorecard: the four tracker metrics
  const sc = el('div', { class: 'scorecard' });
  const met = (label, text, tag, title) => sc.appendChild(el('div', { class: 'sc' + (tag ? ' ' + tag : ''), title: title || '' }, [
    el('div', { class: 'l', text: label }), el('div', { class: 'v', text: text })
  ]));
  met('Forecast accuracy', x.accuracy == null ? '—' : Math.round(x.accuracy * 100) + '%', accTag(x.accuracy),
    'How close the weighted forecast landed to what actually closed. Symmetric — over-calling and sandbagging both cost you. ' + thresholdNote('accuracy'));
  met('Commit variance', x.variance == null ? '—' : signed(x.variance), varTag(x.variance),
    'Closed won against what was committed. Positive means the commit was beaten. ' + thresholdNote('variance'));
  const teamT = x.target ? null : teamTargetInfo(Object.assign(mBounds(rng.to), { grain: 'month' }));
  const tnote = x.target
    ? `${CFG.currency} ${money(x.target, {dash:false})} for ${x.monthLabelOf}` +
      (x.targetInfo.basis === 'derived' ? ` — worked out from ${x.targetInfo.from}` : '')
    : (teamT && teamT.value)
      ? `no personal target for ${x.monthLabelOf} — the team one is ${CFG.currency} ${money(teamT.value, {dash:false})}, and a team number is not split into personal quotas`
      : `no target for ${x.monthLabelOf}, and none to work one out from`;
  met('Goal attainment', x.attain == null ? 'no target' : Math.round(x.attain * 100) + '%', attTag(x.attain),
    `${CFG.currency} ${money(x.monthWon, {dash:false})} closed in ${x.monthLabelOf} so far against ${tnote}. ${thresholdNote('attain')}`);
  met('Pipeline coverage', x.coverage == null ? 'no target' : x.coverage.toFixed(1) + '×', covTag(x.coverage),
    `Open pipeline against ${tnote}. ${thresholdNote('coverage')}`);
  bd.appendChild(sc);
  bd.appendChild(el('p', { class: 'sub', style: 'margin:-8px 0 var(--sp-4);line-height:1.5', html:
    x.target
      ? `Attainment and coverage run against <b>${esc(x.monthLabelOf)}</b> — ${esc(tnote)}.` +
        (x.targetInfo.basis === 'derived' && isAdmin()
          ? ' <a href="#settings" style="color:var(--accent)">Set a monthly one</a>' : '')
      : (teamT && teamT.value)
          ? `${esc(o.name)} has no target of their own for <b>${esc(x.monthLabelOf)}</b>. The team target is ` +
            `<b>${CFG.currency} ${money(teamT.value, {dash:false})}</b>, and a team number is never divided into personal quotas — ` +
            `so attainment and coverage stay blank until ${esc(o.name)} has one.${isAdmin()
              ? ' <a href="#settings" style="color:var(--accent)">Set it in Settings</a>' : ''}`
          : `No target to measure against.${isAdmin()
              ? ' <a href="#settings" style="color:var(--accent)">Set one in Settings</a>' : ''}` }));

  // ---- the two commitment slots
  ['commit', 'best'].forEach(slot => {
    const recs = slot === 'commit' ? x.cRecs : x.bRecs;
    bd.appendChild(el('div', { style: 'display:flex;align-items:center;gap:8px;margin-bottom:6px' }, [
      el('label', { class: 'fl', style: 'margin:0', html: ico(slot === 'commit' ? 'flag' : 'up', 12) + ' ' + SLOTS[slot] }),
      el('span', { class: 'mono', style: 'font-size:var(--fs-xs);color:var(--ink-3)',
        text: CFG.currency + ' ' + money(slot === 'commit' ? x.commitVal : x.bestVal, { dash: false }) }),
      el('div', { style: 'flex:1' }),
      locked ? null : el('button', { class: 'btn sm ghost', html: ico('plus',12), 'aria-label': 'Add to ' + SLOTS[slot],
        onclick: () => addCommitment(wk, o.id, slot) })
    ].filter(Boolean)));
    const list = el('div', { class: 'nlist', style: 'margin-bottom:var(--sp-4)' });
    if (!recs.length) list.appendChild(el('div', { class: 'nitem', style: 'color:var(--ink-3)',
      html: `<span class="ic">${ico(slot === 'commit' ? 'flag' : 'up',13)}</span><span>${
        slot === 'commit' ? 'Nothing committed for this week.' : 'No best-case deals picked.'}</span>` }));
    recs.forEach(c => {
      const d = getDl(c.dealId);
      const state = !d ? '' : isWon(d) ? 'good' : isLost(d) ? 'bad' : '';
      const age = d ? daysInStage(d) : null;
      const stale = d && isStale(d);
      list.appendChild(el('div', { class: 'nitem ' + (slot === 'commit' ? 'com' : 'best') }, [
        el('span', { class: 'ic', html: ico(slot === 'commit' ? 'flag' : 'up',13) }),
        el('div', { style: 'flex:1;cursor:pointer', onclick: () => d && openDeal(d.id), html:
          `<b>${esc(d ? d.name : (c.note || 'commitment'))}</b>
           <span class="mono" style="color:var(--ink-3)"> · ${CFG.currency} ${money(commitValue(c), { dash: false })}</span>
           ${d ? ` <span class="tag ${state}">${esc(stage(d.stageId).label)}</span>` : ''}
           ${stale ? ` <span class="tag bad" title="No stage movement in ${age} days">${age}d in stage</span>` : ''}
           ${unitText([c]) ? ` <span class="tag info">${esc(unitText([c]))}</span>` : ''}
           ${c.note ? `<div style="color:var(--ink-3);margin-top:3px">${esc(c.note)}</div>` : ''}` }),
        locked ? null : el('button', { html: ico('grid',12), title: 'Devices on this commitment',
          onclick: () => editUnits(c) }),
