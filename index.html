/* ------------------------------------------------------------- donut */
function chartDonut(host, rows, o) {
  o = o || {};
  const fmt = o.fmt || (v => money(v, { compact: true }));
  const total = sum(rows, r => r.value);
  const wrap = chartShell(host, { table: tblHTML(
    [{ h: o.xLabel || 'Category', f: r => r.label }, { h: 'Value', num: true, f: r => fmt(r.value) },
     { h: 'Share', num: true, f: r => pct(r.value, total) + '%' }], rows) });
  if (!total) { wrap.innerHTML = `<p style="color:var(--ink-3);margin:0;padding:24px 0;text-align:center">No data in range</p>`; return; }

  const S = 148, R = 64, r0 = 42, cx = S/2, cy = S/2;
  const svg = svgEl('svg', { viewBox: `0 0 ${S} ${S}`, role: 'img', 'aria-label': o.aria || 'Donut chart' });
  svg.style.cssText = 'width:148px;height:148px;flex:none';
  let a0 = -Math.PI / 2;
  const GAP = 0.018;                         // 2px-equivalent surface gap
  rows.forEach((r, i) => {
    if (!r.value) return;
    const sweep = (r.value / total) * Math.PI * 2;
    const a1 = a0 + Math.max(sweep - GAP, 0.004);
    const big = (a1 - a0) > Math.PI ? 1 : 0;
    const p = [
      `M${cx + R*Math.cos(a0)} ${cy + R*Math.sin(a0)}`,
      `A${R} ${R} 0 ${big} 1 ${cx + R*Math.cos(a1)} ${cy + R*Math.sin(a1)}`,
      `L${cx + r0*Math.cos(a1)} ${cy + r0*Math.sin(a1)}`,
      `A${r0} ${r0} 0 ${big} 0 ${cx + r0*Math.cos(a0)} ${cy + r0*Math.sin(a0)}`, 'Z'
    ].join(' ');
    const path = svgEl('path', { d: p, fill: r.color || serColor(i), class: 'mk' });
    path.addEventListener('mousemove', ev => tipShow(
      `<b>${esc(r.label)}</b><div class="r"><span><i style="background:${r.color||serColor(i)}"></i>Value</span><b>${esc(fmt(r.value))}</b></div>
       <div class="r"><span>Share</span><b>${pct(r.value,total)}%</b></div>`, ev));
    path.addEventListener('mouseleave', tipHide);
    svg.appendChild(path);
    a0 += sweep;
  });
  const c = svgEl('text', { x: cx, y: cy - 2, 'text-anchor': 'middle',
    style: 'font-size:17px;font-weight:700;fill:var(--ink-1)' });
  c.textContent = o.centerVal != null ? o.centerVal : fmt(total);
  svg.appendChild(c);
  if (o.centerLbl) {
    const c2 = svgEl('text', { x: cx, y: cy + 13, 'text-anchor': 'middle', style: 'font-size:10px;fill:var(--ink-3)' });
    c2.textContent = o.centerLbl; svg.appendChild(c2);
  }
  const box = el('div', { style: 'display:flex;gap:var(--sp-4);align-items:center;flex-wrap:wrap' });
  box.appendChild(svg);
  const lg = el('div', { class: 'legend', style: 'margin:0;flex-direction:column;gap:5px;flex:1;min-width:150px' });
  rows.forEach((r, i) => lg.appendChild(el('span', { style: 'width:100%', html:
    `<i style="background:${r.color || serColor(i)}"></i><span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.label)}</span>
     <b class="mono" style="color:var(--ink-1);margin-left:auto">${esc(fmt(r.value))}</b>
     <span style="color:var(--ink-3);min-width:34px;text-align:right" class="mono">${pct(r.value,total)}%</span>` })));
  box.appendChild(lg);
  wrap.appendChild(box);
}

/* ----------------------------------------- line / area with crosshair */
function chartLine(host, series, labels, o) {
  o = o || {};
  const fmt = o.fmt || (v => money(v, { compact: true }));
  const wrap = chartShell(host, { table: tblHTML(
    [{ h: o.xLabel || 'Period', f: r => r.l }].concat(series.map((s, i) => ({ h: s.name, num: true, f: r => fmt(r.v[i]) }))),
    labels.map((l, j) => ({ l, v: series.map(s => s.data[j]) }))) });
  if (!labels.length) { wrap.innerHTML = `<p style="color:var(--ink-3);margin:0;padding:24px 0;text-align:center">No data in range</p>`; return; }

  const H = o.height || 200, PT = 16, PB = 26, PL = 6, PR = 6;
  const W = Math.max(host.clientWidth || 520, 260);
  const max = Math.max(1, ...series.flatMap(s => s.data.map(v => v || 0)));
  const plotH = H - PT - PB, plotW = W - PL - PR;
  const X = j => labels.length === 1 ? PL + plotW/2 : PL + (j / (labels.length - 1)) * plotW;
  const Y = v => PT + plotH - (Math.max(0, v || 0) / max) * plotH;

  const svg = svgEl('svg', { viewBox: `0 0 ${W} ${H}`, preserveAspectRatio: 'none', role: 'img',
    'aria-label': o.aria || 'Line chart' });
  svg.style.height = H + 'px';
  for (let i = 0; i <= 3; i++) {
    const y = PT + plotH * (i / 3);
    svg.appendChild(svgEl('line', { x1: 0, x2: W, y1: y, y2: y, class: i === 3 ? 'bl' : 'gl' }));
  }
  const cross = svgEl('line', { y1: PT, y2: PT + plotH, class: 'gl', stroke: 'var(--baseline)', opacity: 0 });
  svg.appendChild(cross);

  series.forEach((s, si) => {
    const col = s.color || serColor(si);
    const pts = s.data.map((v, j) => `${X(j)},${Y(v)}`).join(' ');
    if (o.area && series.length === 1) {
      svg.appendChild(svgEl('polygon', { points: `${PL},${PT+plotH} ${pts} ${PL+plotW},${PT+plotH}`, fill: col, opacity: .13 }));
    }
    svg.appendChild(svgEl('polyline', { points: pts, fill: 'none', stroke: col, 'stroke-width': 2,
      'stroke-dasharray': s.dash || null, 'stroke-linejoin': 'round', 'stroke-linecap': 'round', class: 'mk' }));
    s.data.forEach((v, j) => {
      if (labels.length > 18 && j % 2) return;
      svg.appendChild(svgEl('circle', { cx: X(j), cy: Y(v), r: 4, fill: col,
        stroke: 'var(--surface-1)', 'stroke-width': 2 }));   // 2px surface ring on overlap
    });
  });
  labels.forEach((l, j) => {
    const step = Math.ceil(labels.length / 8);
    if (j % step) return;
    const t = svgEl('text', { x: X(j), y: H - PB + 15, 'text-anchor': 'middle', class: 'alab' });
    t.textContent = l; svg.appendChild(t);
  });
  const hit = svgEl('rect', { x: 0, y: 0, width: W, height: H, class: 'hit' });
  hit.addEventListener('mousemove', ev => {
    const bb = svg.getBoundingClientRect();
    const rel = (ev.clientX - bb.left) / bb.width * W;
    let j = Math.round((rel - PL) / (plotW || 1) * (labels.length - 1));
    j = Math.max(0, Math.min(labels.length - 1, j));
    cross.setAttribute('x1', X(j)); cross.setAttribute('x2', X(j)); cross.setAttribute('opacity', .8);
    tipShow(`<b>${esc(labels[j])}</b>` + series.map((s, i) =>
      `<div class="r"><span><i style="background:${s.color||serColor(i)}"></i>${esc(s.name)}</span><b>${esc(fmt(s.data[j]))}</b></div>`).join(''), ev);
  });
  hit.addEventListener('mouseleave', () => { cross.setAttribute('opacity', 0); tipHide(); });
  svg.appendChild(hit);
  wrap.appendChild(svg);

  if (series.length >= 2) {
    const lg = el('div', { class: 'legend' });
    series.forEach((s, i) => lg.appendChild(el('span', { html:
      `<i style="background:${s.color || serColor(i)}${s.dash ? ';border-radius:1px;height:3px;background:repeating-linear-gradient(90deg,' + (s.color||serColor(i)) + ' 0 3px,transparent 3px 5px)' : ''}"></i>${esc(s.name)}` })));
    wrap.appendChild(lg);
  }
}

/* -------------------------------------------------------- stat tile */
function tile(label, value, o) {
  o = o || {};
  const n = el('div', { class: 'tile' });
  n.appendChild(el('div', { class: 'lbl', html: (o.icon ? ico(o.icon, 13) : '') + esc(label) }));
  n.appendChild(el('div', { class: 'val mono', html: (o.cur ? `<span class="cur">${CFG.currency}</span>` : '') + esc(value) }));
  if (o.delta != null) {
    const up = o.delta >= 0, good = o.inverse ? !up : up;
    n.appendChild(el('div', { class: 'foot', html:
      `<span class="delta ${good ? 'up' : 'down'}">${ico(up ? 'up' : 'down', 12, 2.4)}${Math.abs(o.delta)}%</span>
       <span>${esc(o.foot || '')}</span>` }));
  } else if (o.foot) {

/* ------------------------------------------------------- scoping */
function periodBounds(which) {
  const p = which || VIEW.period;
  if (p === 'fy') return fyBounds();
  if (p === 'q')  return qBounds();
  if (p === 'm')  return mBounds();
  return { from: '1900-01-01', to: '2999-12-31', label: 'All time' };
}
const inPeriod = (d, b) => d && dnum(d) >= dnum(b.from) && dnum(d) <= dnum(b.to);
/* Visibility follows worksOn, so a collaborator sees the deal under their own
   filter. Revenue attribution below always uses ownedBy, so nothing is counted
   twice when a deal has two names on it. */
function scopedDeals() {
  const all = live('deals');
  return VIEW.rep === 'all' ? all : all.filter(d => worksOn(d, VIEW.rep));
}
const ownedDeals = rep => live('deals').filter(d => ownedBy(d, rep));
const openTasks = () => live('tasks').filter(t => t.status !== 'done' &&
  (VIEW.rep === 'all' || String(t.ownerId) === VIEW.rep));
const weighted = d => (d.amount || 0) * stage(d.stageId).probability;

/* Rep dropdowns list active people only. Someone who has left keeps their

function repTarget(rep, b) {

  if (rep === 'all') return sum(activeOwners(), o => (t[o.id] && t[o.id][key]) || 0) || (t.team && t.team[key]) || 0;

function customizeDash() {
  const off = widgetOff().slice();
  let order = widgetOrder().slice();
  const body = el('div');
  body.appendChild(el('p', { style: 'margin:0 0 var(--sp-4);color:var(--ink-2);line-height:1.6',
    text: 'Switch panels on or off and drag to reorder. Saved per team in the shared config file, so everyone sees the same dashboard.' }));
  const list = el('div', { class: 'widgets' });
  function paint() {
    list.innerHTML = '';
    order.forEach(id => {
      const w = WIDGETS.find(x => x.id === id); if (!w) return;
      const isOff = off.includes(id);
      const row = el('div', { class: 'wtoggle' + (isOff ? ' off' : ''), draggable: 'true' });
      row.dataset.id = id;
      row.appendChild(el('span', { class: 'hd', html: ico('list',14) }));
      row.appendChild(el('span', { class: 'nm', text: w.name }));
      row.appendChild(el('button', { class: 'tgl' + (isOff ? '' : ' on'), 'aria-label': 'Toggle ' + w.name,
        onclick: () => { const i = off.indexOf(id); if (i < 0) off.push(id); else off.splice(i, 1); paint(); } }));
      row.addEventListener('dragstart', e => { e.dataTransfer.setData('text/plain', id); row.style.opacity = '.4'; });
      row.addEventListener('dragend',   () => row.style.opacity = '');
      row.addEventListener('dragover',  e => e.preventDefault());
      row.addEventListener('drop', e => {
        e.preventDefault();
        const src = e.dataTransfer.getData('text/plain');
        if (!src || src === id) return;
        order = order.filter(x => x !== src);
        order.splice(order.indexOf(id), 0, src);
        paint();
      });
      list.appendChild(row);
    });
  }
  paint(); body.appendChild(list);
  modal('Customize dashboard', body, [
    el('button', { class: 'btn', text: 'Reset to default', onclick: () => {
      DB.config.widgets = defaultWidgets(); DB.config.widgetsOff = [];
      DB.config._v = now(); SYNC.dirty.add('config'); touch('config'); closeAll(); render(); } }),
    el('button', { class: 'btn primary', text: 'Save', onclick: () => {
      DB.config.widgets = order; DB.config.widgetsOff = off;
      DB.config._v = now(); SYNC.dirty.add('config'); touch('config'); closeAll(); render();
      toast('Dashboard saved', 'ok'); } })
  ]);
}

/* ======================================================== PIPELINE */
/* ---------------------------------------------- overdue close dates
   An open deal whose close date has passed is the single most corrosive thing
   in a pipeline: it is silently wrong, and it drags every forecast down with
   it. Surface it wherever the rep is, and make fixing it one click. */
function overdueDeals(rep, o) {
  const t = dnum(TODAY());
  const who = rep === undefined ? VIEW.rep : rep;
  const match = (o && o.ownedOnly) ? ownedBy : worksOn;
  return live('deals').filter(d =>
    isOpen(d) && d.closeDate && dnum(d.closeDate) < t && match(d, who))
    .sort((a, b) => dnum(a.closeDate) - dnum(b.closeDate));
}
function overdueBanner() {
  const od = overdueDeals();
  if (!od.length) return null;
  const val = sum(od, d => d.amount);
  const worst = days(TODAY(), od[0].closeDate);
  const n = el('div', { class: 'alert' });
  n.appendChild(el('span', { class: 'ic', html: ico('warn',18) }));
  n.appendChild(el('div', { style: 'flex:1;min-width:0;line-height:1.5', html:
    `<b>${od.length} open deals have a close date in the past</b> —
     ${CFG.currency} ${money(val, { dash: false })} sitting on dates that have already gone.
     The oldest is <b>${worst} days</b> overdue.
     <div style="color:var(--ink-3);margin-top:3px">Push the date, or mark it won or lost — until then the forecast is counting a date nobody believes.</div>` }));
  n.appendChild(el('button', { class: 'btn primary', text: 'Review them', onclick: () => overdueQueue() }));
  return n;
}
/* The fix-it queue: every overdue deal, with the three things you can do to it */
function overdueQueue() {
  const body = el('div');
  const paint = () => {
    body.innerHTML = '';
    const od = overdueDeals();
    if (!od.length) {
      body.appendChild(el('div', { class: 'empty', html: ico('check',32) +
        '<h4>Nothing overdue</h4><p>Every open deal has a close date in the future.</p>' }));
      return;

/* Minimised stages are a per-person view preference, so they live in this

const MINKEY = CFG.cacheKey + '.minStages';
function minStages() {
  try { return JSON.parse(localStorage.getItem(MINKEY) || '[]'); } catch (e) { return []; }
}
function toggleStageMin(id) {
  const cur = minStages();
  const next = cur.includes(id) ? cur.filter(x => x !== id) : cur.concat([id]);
  try { localStorage.setItem(MINKEY, JSON.stringify(next)); } catch (e) {}
  render();
}
function expandAllStages() {

}

function moveStage(d, toId) {
  const from = stage(d.stageId), to = stage(toId);
  if (to.kind === 'lost') return askLoss(d, toId);
  if (to.kind === 'won')  return askWin(d, toId);
  d.stageId = toId;
  if (!d.closeDate) d.closeDate = addDays(TODAY(), 30);
  upsert('deals', d);
  logAct({ dealId: d.id, ownerId: d.ownerId, kind: 'stage',
    html: `Moved <b>${esc(d.name)}</b> from ${esc(from.label)} to <b>${esc(to.label)}</b>` });
  toast(`${d.name} → ${to.label}`, 'ok');
  render();
}
/* ================================================================
   TABLES — one sortable / filterable / paged builder, three views
   ================================================================ */
function dataTable(host, o) {
  const key = o.key;
  const sort = VIEW.sort[key] || (VIEW.sort[key] = { col: o.defaultSort || 0, dir: o.defaultDir || -1 });
  const page = VIEW.page[key] || (VIEW.page[key] = 0);
  const per  = o.per || 50;

  let rows = o.rows.slice();
  const col = o.cols[sort.col] || o.cols[0];
  rows.sort((a, b) => {
    const x = col.sv ? col.sv(a) : col.v(a), y = col.sv ? col.sv(b) : col.v(b);
    const nx = typeof x === 'number', ny = typeof y === 'number';
    if (nx && ny) return (x - y) * sort.dir;
    return String(x == null ? '' : x).localeCompare(String(y == null ? '' : y)) * sort.dir;
  });
  const total = rows.length;
  const pages = Math.max(1, Math.ceil(total / per));
  const p = Math.min(page, pages - 1);
  VIEW.page[key] = p;
  const slice = rows.slice(p * per, p * per + per);

  const wrap = el('div', { class: 'tw' });
  const t = el('table', { class: 'dt' });
  const thead = el('thead'), tr = el('tr');
  o.cols.forEach((c, i) => {
    const th = el('th', { class: (c.num ? 'num ' : '') + (c.sortable === false ? '' : 'sortable') + (sort.col === i ? ' sorted' : ''),
      html: esc(c.h) + (c.sortable === false ? '' : `<span class="ind">${sort.col === i ? (sort.dir > 0 ? '▲' : '▼') : '⇅'}</span>`) });
    if (c.sortable !== false) th.addEventListener('click', () => {
      if (sort.col === i) sort.dir *= -1; else { sort.col = i; sort.dir = c.num ? -1 : 1; }
      render();
    });
    tr.appendChild(th);
  });
  thead.appendChild(tr); t.appendChild(thead);
  const tb = el('tbody');
  if (!slice.length) {
    tb.appendChild(el('tr', {}, [ el('td', { colspan: o.cols.length, style: 'padding:36px;text-align:center;color:var(--ink-3)',
      text: o.emptyText || 'Nothing matches these filters.' }) ]));
  }
  slice.forEach(r => {
    const row = el('tr');
    o.cols.forEach(c => row.appendChild(el('td', { class: c.num ? 'num' : '', html: c.r ? c.r(r) : esc(c.v(r)) })));
    if (o.onRow) row.addEventListener('click', e => { if (!e.target.closest('button,a,input')) o.onRow(r); });
    tb.appendChild(row);
  });
  t.appendChild(tb); wrap.appendChild(t);
  const f = el('div', { class: 'tfoot' });
  f.appendChild(el('span', { text: `${total.toLocaleString()} ${o.noun || 'rows'}` + (o.footNote ? ' · ' + o.footNote : '') }));
  f.appendChild(el('div', { style: 'flex:1' }));
  if (pages > 1) {
    f.appendChild(el('button', { class: 'btn sm', text: '‹ Prev', disabled: p === 0 || null,
      onclick: () => { VIEW.page[key] = p - 1; render(); } }));
    f.appendChild(el('span', { class: 'mono', text: `${p+1} / ${pages}` }));
    f.appendChild(el('button', { class: 'btn sm', text: 'Next ›', disabled: p >= pages - 1 || null,
      onclick: () => { VIEW.page[key] = p + 1; render(); } }));
  }
  wrap.appendChild(f);
  host.appendChild(wrap);
}

/* ---- staging board: drag a contact through the four stages ---- */
const CMINKEY = CFG.cacheKey + '.minLeadStages';
function minLeadStages() {
  try { return JSON.parse(localStorage.getItem(CMINKEY) || '[]'); } catch (e) { return []; }
}
function toggleLeadMin(id) {
  const cur = minLeadStages();
  const next = cur.includes(id) ? cur.filter(x => x !== id) : cur.concat([id]);
  try { localStorage.setItem(CMINKEY, JSON.stringify(next)); } catch (e) {}
  render();
}
function expandAllLeadStages() {
  try { localStorage.removeItem(CMINKEY); } catch (e) {}
  render();
}
function contactBoard(root, scoped) {
  const board = el('div', { class: 'cboard' });
  const cols = leadStages().concat([{ id: '__none', label: 'Not staged', hint: 'No status set yet' }]);
  const mins = minLeadStages();
  if (mins.length) root.appendChild(el('div', { style: 'margin-bottom:var(--sp-3)' }, [
    el('button', { class: 'btn sm', html: ico('board',13) + ` Expand ${mins.length} stage${mins.length > 1 ? 's' : ''}`,
      onclick: expandAllLeadStages }) ]));
  cols.forEach(st => {
    const list = st.id === '__none'
      ? scoped.filter(c => !c.leadStatus)
      : scoped.filter(c => c.leadStatus === st.id);
    const isMin = mins.includes(st.id);
    const col = el('div', { class: 'ccol' + (isMin ? ' min' : ''),
      style: `--st:${st.id === '__none' ? 'var(--ink-3)' : leadColor(st.id)}` });
    col.appendChild(el('header', {}, [
      el('div', { class: 'ct' }, [
        el('span', { class: 'bar' }),
        el('span', { class: 'lbl', text: st.label, title: st.label }),
        el('span', { class: 'n', text: list.length }),
        el('button', { class: 'kmin', title: 'Minimise this stage', 'aria-label': 'Minimise ' + st.label,
          html: `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M14 5l-6 7 6 7"/></svg>`,
          onclick: e => { e.stopPropagation(); toggleLeadMin(st.id); } })
      ]),
      el('div', { class: 'ch', text: st.hint || '' })
    ]));
    if (isMin) {
      col.title = `${st.label} — ${list.length} contacts. Click to expand.`;
      col.addEventListener('click', e => { if (!e.target.closest('.ccard')) toggleLeadMin(st.id); });
    }
    const inner = el('div', { class: 'clist' });
    if (!list.length) inner.appendChild(el('div', { style: 'text-align:center;color:var(--ink-3);font-size:var(--fs-sm);padding:14px 4px',
      text: 'Drop a contact here' }));
    list.slice(0, 80).forEach(c => inner.appendChild(contactCard(c)));
    if (list.length > 80) inner.appendChild(el('div', { style: 'text-align:center;padding:8px' }, [
      el('button', { class: 'btn sm ghost', text: `+${list.length - 80} more — open list`,
        onclick: () => { VIEW.tableFilter.lead = st.id; VIEW.contactView = 'list'; render(); } })
    ]));
    col.appendChild(inner);
    col.addEventListener('dragover', e => { e.preventDefault(); col.classList.add('drop'); });
    col.addEventListener('dragleave', () => col.classList.remove('drop'));
    col.addEventListener('drop', e => {
      e.preventDefault(); col.classList.remove('drop');
      const c = getCt(e.dataTransfer.getData('text/plain'));
      if (!c) return;
      const next = st.id === '__none' ? null : st.id;
      if ((c.leadStatus || null) === next) return;
      setLeadStatus(c, next);
    });
    board.appendChild(col);
  });
  root.appendChild(board);
}
function contactCard(c) {

function setLeadStatus(c, next) {

/* ----------------------------------------------------------- TASKS */
function viewTasks(root) {
  const mine = VIEW.rep === 'all' ? live('tasks') : live('tasks').filter(t => String(t.ownerId) === VIEW.rep);
  const showDone = VIEW.tableFilter.done;
  const t0 = TODAY();
  const bucket = t => {
    if (t.status === 'done') return 'done';
    if (!t.dueDate) return 'someday';
    const n = dnum(t.dueDate);
    if (n < dnum(t0)) return 'overdue';
    if (n === dnum(t0)) return 'today';
    if (n <= dnum(addDays(t0, 7))) return 'week';
    return 'later';
  };
  const groups = [
    ['overdue', 'Overdue',        'critical'],
    ['today',   'Due today',      'warning'],
    ['week',    'Next 7 days',    ''],
    ['later',   'Later',          ''],
    ['someday', 'No due date',    ''],
    ['done',    'Completed',      'good']
  ];
  const by = groupBy(mine, bucket);
  root.appendChild(viewHead(null, [
    el('button', { class: 'btn' + (showDone ? ' primary' : ''),
      text: showDone ? 'Hide completed' : 'Show completed',
      onclick: () => { VIEW.tableFilter.done = !showDone; render(); } }),
    el('button', { class: 'btn primary', html: ico('plus',14) + ' New task', onclick: () => editTask(null) })
  ]));
  const tl = el('div', { class: 'tiles' });
  tl.appendChild(tile('Overdue', (by.get('overdue') || []).length, { icon: 'warn' }));
  tl.appendChild(tile('Due today', (by.get('today') || []).length, { icon: 'cal' }));
  tl.appendChild(tile('Next 7 days', (by.get('week') || []).length, { icon: 'clip' }));
  tl.appendChild(tile('Open in total', mine.filter(t => t.status !== 'done').length, { icon: 'check' }));
  root.appendChild(tl);

  let any = false;
  groups.forEach(([k, label, sev]) => {
    if (k === 'done' && !showDone) return;
    const list = (by.get(k) || []).sort((a, b) =>
      (dnum(a.dueDate) || 99999999) - (dnum(b.dueDate) || 99999999));
    if (!list.length) return;
    any = true;

/* A labelled, non-shrinking header fact: "VALUE  AED 260,000".

function mfact(label, value, o) {

    class: 'mfact' + (o.num ? ' num' : ''),
    title: o.title || (label ? label + ': ' + value : value),
    href: o.onclick ? 'javascript:void 0' : null
  });
  if (label) n.appendChild(el('em', { text: label }));
  n.appendChild(el('b', { text: String(value) }));
  if (o.onclick) n.addEventListener('click', e => { e.preventDefault(); o.onclick(); });
  return n;
}
function drawerHead(title, metaNodes, actions) {

  left.appendChild(m);

  (actions || []).forEach(a => h.appendChild(a));

}
function tabbed(tabs, initialLabel, onSwitch) {
  const bar = el('div', { class: 'tabs' });

  let cur = Math.max(0, tabs.findIndex(t => t.label === initialLabel));
  function paint() {
    Array.from(bar.children).forEach((b, i) => b.className = i === cur ? 'on' : '');
    body.innerHTML = '';

    body.scrollTop = 0;
  }
  tabs.forEach((t, i) => bar.appendChild(el('button', { text: t.label + (t.count != null ? ` (${t.count})` : ''),
    onclick: () => { cur = i; if (onSwitch) onSwitch(t.label); paint(); } })));
  paint();
  return [bar, body];
}

                          : `Remove “${a.name}” from this deal and delete the file from OneDrive?`,

async function doUpload(d, files) {
  if (!files.length) return;
  const t = toast(`Uploading ${files.length} file${files.length > 1 ? 's' : ''}…`);
  let ok = 0;
  for (const f of files) {
    try { await uploadAttachment(d.id, f); ok++; }
    catch (e) { toast(String(e.message || e), 'err'); }
  }
  if (ok) {
    logAct({ dealId: d.id, ownerId: d.ownerId, kind: 'note',
      html: `Attached ${ok} file${ok > 1 ? 's' : ''}: ${esc(files.slice(0, 3).map(f => f.name).join(', '))}` });
    toast(`${ok} file${ok > 1 ? 's' : ''} attached`, 'ok');
    openDeal(d.id);
  }
}

  const amt = el('input', { class: 'inp', type: 'number', value: d.amount || '', placeholder: '0' });
  const dt  = el('input', { class: 'inp', type: 'date', value: d.closeDate || TODAY() });

  const body = el('div');
  body.appendChild(el('div', { class: 'field-row' }, [
    el('div', { class: 'field' }, [ el('label', { class: 'fl', text: `Final value (${CFG.currency})` }), amt ]),
    el('div', { class: 'field' }, [ el('label', { class: 'fl', text: 'Close date' }), dt ])
  ]));
  body.appendChild(el('div', { class: 'field' }, [ el('label', { class: 'fl', text: 'Why we won (optional)' }), note ]));

    el('button', { class: 'btn', text: 'Cancel', onclick: closeAll }),
    el('button', { class: 'btn primary', text: 'Mark won', onclick: () => {
      d.stageId = wonId; d.amount = Number(amt.value) || d.amount || 0;
      d.closeDate = dt.value || TODAY(); d.lossReason = null;
      if (note.value.trim()) d.notes = (d.notes || []).concat([{ at: new Date().toISOString(),
        by: (AUTH.user && AUTH.user.username) || 'local', text: 'Won because: ' + note.value.trim() }]);
      upsert('deals', d);
      logAct({ dealId: d.id, ownerId: d.ownerId, kind: 'won',
        html: `Marked <b>${esc(d.name)}</b> <b style="color:var(--good-ink)">won</b> at ${CFG.currency} ${money(d.amount)}` });
      closeAll(); render(); toast('Won — ' + CFG.currency + ' ' + money(d.amount), 'ok');
    } })
  ]);
}
function askLoss(d, lostId) {
  const reasons = DB.lossReasons && DB.lossReasons.length ? DB.lossReasons : ['Price too high','Lost to competitor','No budget','No response','Timing / postponed','Not a fit','Other'];
  const sel = el('select', { class: 'inp' });

    text: 'The reason is what makes the loss analysis worth reading in the weekly review, so it is required.' }));

  ]));

/* Fills only what is blank. A domain gives a readable name and, through the
   country-code TLD, a country. It cannot give a city — that needs a paid
   data provider — so the city is left alone rather than guessed. */
function enrichCompany(c, o) {
  o = o || {};
  const d = cleanDomain(c.domain);
  if (!d) { if (o.loud) toast('Add a domain first', 'err'); return 0; }
  const filled = [];
  const nm = domainToName(d);
  if (nm && (!c.name || !c.name.trim())) { c.name = nm; filled.push('name'); }
  const ctry = domainCountry(d);
  if (ctry && !c.country) { c.country = ctry; filled.push('country'); }
  if (c.domain !== d) { c.domain = d; }
  if (filled.length) {
    upsert('companies', c);
    if (o.loud) { toast('Filled ' + filled.join(' and ') + ' from the domain', 'ok'); openCompany(c.id); }
  } else if (o.loud) {
    const why = !nm && !ctry ? 'nothing could be derived from that domain'
      : 'name and country are already set';
    toast('Nothing to fill — ' + why);
  }
  return filled.length;
}

function fld(label, node, hint) {
  const w = el('div', { class: 'field' });
  w.appendChild(el('label', { class: 'fl', text: label }));
  w.appendChild(node);
  if (hint) w.appendChild(el('div', { style: 'font-size:var(--fs-xs);color:var(--ink-3);margin-top:4px;line-height:1.5', text: hint }));

/* Multi-select for collaborators: a chip per person, plus an add control. */
function ownerMulti(values, excludeId) {
  let chosen = (values || []).map(String).filter(v => v && v !== String(excludeId));
  const node = el('div', { class: 'multi' });
  const paint = () => {
    node.innerHTML = '';
    chosen.forEach(id => {
      const o = DB.owners.find(x => x.id === id);
      node.appendChild(el('span', { class: 'chip' }, [
        el('span', { class: 'avatar', style: `background:${ownerColor(id)};width:18px;height:18px;font-size:8px`,
          text: initials(ownerName(id)) }),
        el('span', { text: ownerName(id) + (o && !o.active ? ' (inactive)' : '') }),
        el('button', { html: ico('x',11), 'aria-label': 'Remove ' + ownerName(id),
          onclick: () => { chosen = chosen.filter(x => x !== id); paint(); } })
      ]));
    });
    const left = activeOwners().filter(o => !chosen.includes(o.id) && o.id !== String(excludeId));
    if (left.length) {
      const add = el('select', { class: 'inp', style: 'width:auto;min-width:150px',
        'aria-label': 'Add a collaborator',
        onchange: e => { if (!e.target.value) return; chosen = chosen.concat([e.target.value]); paint(); } });
      add.appendChild(el('option', { value: '', text: chosen.length ? '+ Add another…' : '+ Add a collaborator…' }));
      left.forEach(o => add.appendChild(el('option', { value: o.id, text: o.name })));
      node.appendChild(add);
    } else if (!chosen.length) {
      node.appendChild(el('span', { style: 'color:var(--ink-3);font-size:var(--fs-sm)', text: 'No one else available' }));
    }
  };
  paint();
  return { node, get: () => chosen.slice(), set: v => { chosen = (v || []).map(String); paint(); } };
}

/* Assignment picker. Only active people can be chosen. A record that already
   belongs to someone who has since left keeps that owner — it is shown as the
   current value so saving does not silently reassign it — but no *other*
   inactive person can be picked, so work never lands on a leaver. */
function ownerSelect(value, o) {
  o = o || {};
  const s = el('select', { class: 'inp' });
  if (o.onchange) s.addEventListener('change', o.onchange);
  s.appendChild(el('option', { value: '', text: o.emptyLabel || 'Unassigned' }));
  activeOwners().forEach(p => {
    if (o.exclude && String(o.exclude) === p.id) return;
    s.appendChild(el('option', { value: p.id, text: p.name, selected: String(value) === p.id || null }));
  });
  const cur = DB.owners.find(p => p.id === String(value));
  if (cur && !cur.active) {
    const g = el('optgroup', { label: 'No longer active — reassign' });
    g.appendChild(el('option', { value: cur.id, text: cur.name + ' (inactive)', selected: true }));
    s.appendChild(g);
  }
  return s;
}
/* Deal types: the three CoreV sells against, plus any legacy value already on
   a record so an import never loses what it came in with. */
function dealTypes() {
  const base = (DB.config && DB.config.dealTypes && DB.config.dealTypes.length)
    ? DB.config.dealTypes.slice() : ['Consumer', 'Commercial', 'International'];
  const found = Array.from(new Set(live('deals').map(d => d.dealType).filter(Boolean)));
  found.forEach(t => { if (!base.includes(t)) base.push(t); });
  return base;
}
/* type-ahead picker over an entity list */
function picker(opts) {
  const o = opts || {};
  const wrap = el('div', { style: 'position:relative' });
  const inp = el('input', { class: 'inp', placeholder: o.placeholder || 'Type to search…', autocomplete: 'off',
    value: o.initialLabel || '' });
  const res = el('div', { class: 'search-res' });
  let chosen = o.initialValue || null;
  wrap.appendChild(inp); wrap.appendChild(res);
  const paint = () => {
    const q = inp.value.trim().toLowerCase();
    res.innerHTML = '';
    let list = o.items();
    if (q) list = list.filter(x => o.match(x, q));
    list = list.slice(0, 40);
    if (o.allowNew && q) {
      res.appendChild(el('button', { html: `${ico('plus',13)} <b>Create “${esc(inp.value.trim())}”</b>`,
        onclick: () => { res.classList.remove('on'); o.onNew(inp.value.trim(), lbl => { inp.value = lbl; }); } }));
    }
    if (!list.length && !o.allowNew) res.appendChild(el('div', { class: 'sec', text: 'No match' }));
    list.forEach(x => res.appendChild(el('button', { html: o.render(x), onclick: () => {
      chosen = o.value(x); inp.value = o.label(x); res.classList.remove('on');
      if (o.onPick) o.onPick(x);
    } })));
    res.classList.add('on');
  };
  inp.addEventListener('focus', paint);
  inp.addEventListener('input', () => { chosen = null; paint(); });
  inp.addEventListener('blur', () => setTimeout(() => res.classList.remove('on'), 180));
  return { node: wrap, get: () => chosen, getText: () => inp.value.trim(), clear: () => { chosen = null; inp.value = ''; } };
}
const coPicker = (value) => picker({
  placeholder: 'Search companies…',
  initialValue: value, initialLabel: value ? (getCo(value) || {}).name || '' : '',
  items: () => live('companies').sort((a,b) => (a.name||'').localeCompare(b.name||'')),
  match: (c, q) => (c.name || '').toLowerCase().includes(q) || (c.domain || '').toLowerCase().includes(q),

  allowNew: true,
  onNew: (name, setLabel) => {
    const c = upsert('companies', { name, createdAt: TODAY(), ownerId: currentOwnerId() });
    setLabel(name); toast('Company created', 'ok');
    pendingCo = c.id;
  }
});
let pendingCo = null;
function currentOwnerId() {
  if (!AUTH.user) return (DB.owners[0] || {}).id || '';
  const mail = String(AUTH.user.username || '').toLowerCase();
  const byMail = DB.owners.find(o => (o.email || '').toLowerCase() === mail);
  if (byMail) return byMail.id;
  const nm = String(AUTH.user.name || '').toLowerCase();
  const byName = DB.owners.find(o => o.name.toLowerCase() === nm);
  return byName ? byName.id : ((DB.owners.find(o => o.role === 'admin') || {}).id || '');
}

function linkContact(d) {
  const co = getCo(d.companyId);
  const p = picker({
    placeholder: 'Search people…',
    items: () => {
      const all = live('contacts').filter(c => !(d.contactIds || []).includes(c.id));
      if (!co) return all.slice(0, 400);
      const same = all.filter(c => c.companyId === co.id);
      return same.concat(all.filter(c => c.companyId !== co.id)).slice(0, 400);
    },
    match: (c, q) => (c.fullName || '').toLowerCase().includes(q) || (c.email || '').toLowerCase().includes(q) ||
      ((getCo(c.companyId) || {}).name || '').toLowerCase().includes(q),
    label: c => c.fullName || c.email, value: c => c.id,
    render: c => `<span>${esc(c.fullName || c.email || '—')}</span><span class="sub">${esc((getCo(c.companyId)||{}).name || c.jobTitle || '')}</span>`,
    allowNew: true,
    onNew: (name, setLabel) => {
      const parts = name.split(/\s+/);
      const c = upsert('contacts', { firstName: parts[0], lastName: parts.slice(1).join(' ') || null,
        fullName: name, companyId: d.companyId || null, ownerId: d.ownerId, createdAt: TODAY(), dealIds: [d.id] });
      d.contactIds = (d.contactIds || []).concat([c.id]); d.contactInferred = false; upsert('deals', d);
      closeAll(); openDeal(d.id); toast('Contact created and linked', 'ok');
    }
  });
  modal('Link a contact to ' + d.name, el('div', {}, [
    el('p', { style: 'margin:0 0 var(--sp-4);color:var(--ink-2);line-height:1.6',
      text: co ? `People at ${co.name} are listed first.` : 'Search anyone on file, or type a new name to create them.' }),
    fld('Contact', p.node)
  ]), [
    el('button', { class: 'btn', text: 'Cancel', onclick: closeAll }),

/* Names taken from the deal and contact records already in the CRM. Prices are
   deliberately blank — I am not going to invent your price list. */
function starterCatalogue() {
  const seed = [
    ['XS1-PEAK',      'XS1 PEAK',            'Hardware',     'once'],
    ['XS1-PEAKPLUS',  'XS1 PEAK PLUS',       'Hardware',     'once'],
    ['XS1-FLOWPLUS',  'XS1 FLOW PLUS',       'Hardware',     'once'],
    ['XP1-APEX',      'XP1 APEX',            'Hardware',     'once'],
    ['OXEAI-BASIC',   'OxeAI Basic',         'Subscription', 'monthly'],
    ['OXEAI-PREM',    'OxeAI Premium',       'Subscription', 'monthly'],
    ['INSTALL',       'Delivery & installation', 'Installation', 'once'],
    ['TRAINING',      'Onboarding & training',   'Service',      'once']
  ];
  let n = 0;
  batch(() => seed.forEach(([sku, name, category, billing]) => {
    if (live('products').some(p => p.sku === sku)) return;
    upsert('products', { sku, name, category, billing, listPrice: null, active: true, currency: CFG.currency });
    n++;
  }));
  toast(`${n} products added — set their prices in the catalogue`, 'ok');
}
function importProductsCSV(after) {
  const file = el('input', { type: 'file', accept: '.csv,text/csv', class: 'inp' });
  modal('Import products', el('div', {}, [
    el('p', { style: 'margin:0 0 var(--sp-4);color:var(--ink-2);line-height:1.6',
      html: 'Columns matched loosely: <b>SKU</b>, <b>Name</b>, <b>Category</b>, <b>List price</b>, <b>Billing</b> (once / monthly / annual), <b>Active</b>, <b>Notes</b>. Rows match on SKU, so re-importing updates rather than duplicates.' }),
    fld('File', file)
  ]), [
    el('button', { class: 'btn', text: 'Cancel', onclick: () => { closeAll(); productManager(); } }),
    el('button', { class: 'btn primary', text: 'Import', onclick: () => {
      const fl = file.files[0]; if (!fl) return toast('Choose a file first', 'err');
      const rd = new FileReader();
      rd.onload = () => {
        try {
          const rows = parseCSV(rd.result);
          if (rows.length < 2) throw new Error('no data rows');
          const hdr = rows[0].map(NORM);
          let added = 0, updated = 0;
          batch(() => rows.slice(1).forEach(r => {
            const sku = pick(r, hdr, ['sku','code','product code']);
            const name = pick(r, hdr, ['name','product','product name','description']);
            if (!sku && !name) return;
            const bRaw = (pick(r, hdr, ['billing','billing frequency','recurrence']) || 'once').toLowerCase();
            const billing = /month/.test(bRaw) ? 'monthly' : /year|annual/.test(bRaw) ? 'annual' : 'once';
            const priceRaw = pick(r, hdr, ['list price','price','unit price','amount']);
            const activeRaw = (pick(r, hdr, ['active','status']) || 'yes').toLowerCase();
            let p = sku ? live('products').find(x => x.sku === sku) : live('products').find(x => NORM(x.name) === NORM(name));
            const patch = {
              sku: sku || (p && p.sku) || null, name: name || (p && p.name) || sku,
              category: pick(r, hdr, ['category','type','group']) || (p && p.category) || null,
              listPrice: priceRaw == null ? (p ? p.listPrice : null) : Number(String(priceRaw).replace(/[^0-9.\-]/g, '')) || null,
              billing, active: !/^(no|false|0|inactive)$/.test(activeRaw),
              notes: pick(r, hdr, ['notes','note','comment']) || (p && p.notes) || null,
              currency: CFG.currency
            };
            if (p) { upsert('products', Object.assign(p, patch)); updated++; }
            else { upsert('products', patch); added++; }
          }));
          closeAll(); productManager(); render();
          toast(`${added} added, ${updated} updated`, 'ok');
        } catch (e) { toast('Import failed: ' + e.message, 'err'); }
      };
      rd.readAsText(fl);
    } })
  ]);
}

function addLineItem(d, custom) {
  const prods = activeProducts();
  if (!custom && !prods.length) return toast('No products in the catalogue yet', 'err');
  const nameIn = el('input', { class: 'inp', placeholder: 'e.g. Custom bundle discount' });
  const qty = el('input', { class: 'inp', type: 'number', min: '1', step: '1', value: '1' });
  const price = el('input', { class: 'inp', type: 'number', min: '0', step: '100', value: '' });
  const disc = el('input', { class: 'inp', type: 'number', min: '0', max: '100', step: '5', value: '0' });
  const bill = el('select', { class: 'inp' });
  BILLING.forEach(b => bill.appendChild(el('option', { value: b.id, text: b.label })));
  let chosen = null;

  const body = el('div');
  if (!custom) {
    const sel = el('select', { class: 'inp', onchange: e => {
      chosen = prods.find(p => p.id === e.target.value) || null;
      if (!chosen) return;
      price.value = chosen.listPrice == null ? '' : chosen.listPrice;
      bill.value = chosen.billing || 'once';
      nameIn.value = chosen.name;
    } });
    sel.appendChild(el('option', { value: '', text: 'Choose a product…' }));
    Array.from(groupBy(prods, p => p.category || 'Uncategorised')).forEach(([cat, list]) => {
      const g = el('optgroup', { label: cat });
      list.forEach(p => g.appendChild(el('option', { value: p.id,
        text: p.name + (p.listPrice ? ` — ${CFG.currency} ${money(p.listPrice)}` : ' — price not set') })));
      sel.appendChild(g);
    });
    body.appendChild(fld('Product *', sel));
  }
  body.appendChild(fld(custom ? 'Description *' : 'Shown as', nameIn));
  body.appendChild(el('div', { class: 'field-row' }, [
    fld('Quantity', qty), fld(`Unit price (${CFG.currency})`, price) ]));

  modal(custom ? 'Add a custom line' : 'Add a product', body, [

    el('button', { class: 'btn primary', text: 'Add to estimate', onclick: () => {
      if (!custom && !chosen) return toast('Pick a product first', 'err');
      const nm = nameIn.value.trim() || (chosen && chosen.name);
      if (!nm) { nameIn.focus(); return toast('This line needs a description', 'err'); }
      const it = {
        id: uid('L'), productId: chosen ? chosen.id : null, sku: chosen ? chosen.sku : null,
        name: nm, qty: Math.max(1, Number(qty.value) || 1),
        unitPrice: price.value === '' ? 0 : Number(price.value),
        discountPct: Math.max(0, Math.min(100, Number(disc.value) || 0)),
        billing: bill.value
      };
      d.items = (d.items || []).concat([it]);
      if (d.amountMode == null) d.amountMode = 'auto';
      upsert('deals', d); syncDealAmount(d);
      logAct({ dealId: d.id, ownerId: d.ownerId, kind: 'note',
        html: `Added <b>${esc(nm)}</b> ×${it.qty} to the estimate` });
      closeAll(); openDealTab(d, 'Products'); toast('Added to estimate', 'ok');
    } })
  ]);
}
/* ================================================================
   WEEKLY REVIEW — the meeting view: commitments, what landed,

function reviewFor(week, ownerId) {

  if (!r) r = { id: uid('R'), week, ownerId: String(ownerId), problems: [], solutions: [], notes: [], target: null };
  return r;
}
function saveReview(r) { upsert('reviews', r); }

function viewReview(root) {

  const closedWon  = allDeals.filter(d => isWon(d)  && inPeriod(d.closeDate, b));

      el('button', { html: '›', onclick: () => { VIEW.week = weekShift(wk, 1); render(); }, title: 'Next week' })
    ]),
    wk !== weekKey() ? el('button', { class: 'btn', text: 'This week', onclick: () => { VIEW.week = weekKey(); render(); } }) : null,
    el('button', { class: 'btn', html: ico('dl',14) + ' Export agenda', onclick: () => exportReview(wk) }),
    el('button', { class: 'btn primary', html: ico('flag',14) + ' Add commitment', onclick: () => addCommitment(wk) })
  ]));

  // ---- team summary
  const committed = sum(commits, c => c.amount);
  const landed = sum(commits.filter(c => { const d = getDl(c.dealId); return d && isWon(d); }), c => c.amount);
  const t = el('div', { class: 'tiles' });
  t.appendChild(tile('Committed this week', money(committed), { cur: true, icon: 'flag',
    foot: `${commits.length} deals committed` }));
  t.appendChild(tile('Of that, landed', money(landed), { cur: true, icon: 'check',
    foot: committed ? pct(landed, committed) + '% of commitment kept' : 'nothing committed',
    meter: committed ? pct(landed, committed) : null }));
  t.appendChild(tile('Closed won in week', money(sum(closedWon, d => d.amount)), { cur: true, icon: 'up',
    foot: `${closedWon.length} deals` }));
  t.appendChild(tile('Closed lost in week', money(sum(closedLost, d => d.amount)), { cur: true, icon: 'down',
    foot: `${closedLost.length} deals` }));
  t.appendChild(tile('Win rate in week', (closedWon.length + closedLost.length)
    ? pct(closedWon.length, closedWon.length + closedLost.length) + '%' : '—', { icon: 'bolt',
    foot: `${closedWon.length} won · ${closedLost.length} lost` }));
  root.appendChild(t);

  // ---- movement this week, from the activity log
  const moved = DB.activities.filter(a => !a._del && a.kind === 'stage' && a.at &&
    a.at.slice(0,10) >= rng.from && a.at.slice(0,10) <= rng.to);
  const mv = card('Stage movement this week', `${moved.length} stage changes logged between ${fdate(rng.from)} and ${fdate(rng.to)}`);
  if (!moved.length) mv.body.appendChild(el('p', { class: 'sub', style: 'margin:0',
    text: 'No stage changes were logged in this week. Movement is recorded automatically when a deal is dragged on the board.' }));
  else {
    const tl = el('div', { class: 'tl' });
    moved.slice(0, 14).forEach(a => tl.appendChild(el('div', { class: 'it stage', html:
      `<div class="w">${esc(fdate(a.at))} · ${esc(ownerName(a.ownerId))}</div><div class="t">${a.html || esc(a.text || '')}</div>` })));
    mv.body.appendChild(tl);
  }
  root.appendChild(el('div', { style: 'margin-bottom:var(--sp-3)' }, [mv.node]));

  // ---- per-rep cards
  const reps = VIEW.rep === 'all' ? activeOwners() : DB.owners.filter(o => o.id === VIEW.rep);

    '<h4>No active reps</h4><p>Add your sales team in Settings and their weekly cards appear here.</p>' }));

function exportReview(wk) {
  const rng = weekRange(wk), b = { from: rng.from, to: rng.to };
  const L = [`# CoreV weekly sales review — ${weekLabel(wk)}`, ''];
  const commits = live('commitments').filter(c => c.week === wk);
  const won  = live('deals').filter(d => isWon(d)  && inPeriod(d.closeDate, b));
  const lost = live('deals').filter(d => isLost(d) && inPeriod(d.closeDate, b));
  L.push(`Committed: ${CFG.currency} ${money(sum(commits, c => c.amount), {dash:false})} across ${commits.length} deals`);
  L.push(`Closed won: ${CFG.currency} ${money(sum(won, d => d.amount), {dash:false})} (${won.length} deals)`);
  L.push(`Closed lost: ${CFG.currency} ${money(sum(lost, d => d.amount), {dash:false})} (${lost.length} deals)`, '');
  activeOwners().forEach(o => {
    const mine = ownedDeals(o.id);
    const oc = commits.filter(c => String(c.ownerId) === o.id);
    const ow = mine.filter(d => isWon(d) && inPeriod(d.closeDate, b));
    const ol = mine.filter(d => isLost(d) && inPeriod(d.closeDate, b));
    const r = reviewFor(wk, o.id);
    L.push(`## ${o.name}`);
    L.push(`- Open pipeline: ${CFG.currency} ${money(sum(mine.filter(isOpen), d => d.amount), {dash:false})} · weighted ${CFG.currency} ${money(sum(mine.filter(isOpen), weighted), {dash:false})}`);
    L.push(`- Committed: ${CFG.currency} ${money(sum(oc, c => c.amount), {dash:false})} · Won: ${CFG.currency} ${money(sum(ow, d=>d.amount), {dash:false})} · Lost: ${CFG.currency} ${money(sum(ol, d=>d.amount), {dash:false})}`);
    if (oc.length) { L.push('', '**Commitments**');
      oc.forEach(c => { const d = getDl(c.dealId);
        L.push(`- ${d ? d.name : (c.note || 'commitment')} — ${CFG.currency} ${money(c.amount, {dash:false})}${d ? ` — now ${stage(d.stageId).label}` : ''}${c.note && d ? ` — ${c.note}` : ''}`); }); }
    if (ol.length) { L.push('', '**Lost, and why**');
      ol.forEach(d => L.push(`- ${d.name} — ${CFG.currency} ${money(d.amount, {dash:false})} — ${d.lossReason || 'reason not recorded'}${d.lostTo ? ` (to ${d.lostTo})` : ''}`)); }
    ['problems','solutions','notes'].forEach(k => {
      const items = (r[k] || []); if (!items.length) return;
      L.push('', '**' + (k === 'problems' ? 'Problems' : k === 'solutions' ? 'Solutions agreed' : 'Coaching notes') + '**');
      items.forEach(i => L.push(`- ${i.text}${i.done ? ' _(resolved)_' : ''}`));
    });
    L.push('');
  });
  download(`corev-weekly-review-${wk}.md`, L.join('\n'), 'text/markdown');
  toast('Agenda exported', 'ok');
}

/* ================================================================
   FORECAST & ANALYTICS
   ================================================================ */
function viewForecast(root) {
  const b = periodBounds();
  const deals = scopedDeals();
  const openD = deals.filter(isOpen);
  const won  = deals.filter(d => isWon(d)  && inPeriod(d.closeDate, b));
  const lost = deals.filter(d => isLost(d) && inPeriod(d.closeDate, b));
  root.appendChild(viewHead(null, [ periodSeg() ]));

  const t = el('div', { class: 'tiles' });
  const commitStages = openD.filter(d => stage(d.stageId).probability >= .9);
  const bestCase = openD.filter(d => stage(d.stageId).probability >= .4 && inPeriod(d.closeDate, b));
  const target = repTarget(VIEW.rep, b);
  t.appendChild(tile('Commit', money(sum(commitStages, d => d.amount)), { cur: true, icon: 'flag',
    foot: `${commitStages.length} deals at 90%+` }));
  t.appendChild(tile('Best case', money(sum(bestCase, d => d.amount)), { cur: true, icon: 'up',
    foot: `qualified and above, closing in ${b.label}` }));
  t.appendChild(tile('Weighted', money(sum(openD.filter(d => inPeriod(d.closeDate, b)), weighted)), { cur: true, icon: 'chart',
    foot: 'open value × stage probability' }));
  t.appendChild(tile('Closed won', money(sum(won, d => d.amount)), { cur: true, icon: 'check',
    foot: target ? `${pct(sum(won, d => d.amount), target)}% of ${CFG.currency} ${money(target, {compact:true})}` : `${won.length} deals`,
    meter: target ? pct(sum(won, d => d.amount), target) : null }));
  const gap = target - sum(won, d => d.amount);
  t.appendChild(tile('Gap to target', target ? money(Math.max(0, gap)) : '—', { cur: !!target, icon: 'bolt',
    foot: target ? (gap <= 0 ? 'target met' : `coverage ${(sum(openD.filter(d => inPeriod(d.closeDate,b)), d=>d.amount) / Math.max(gap,1)).toFixed(1)}×`) : 'set a target in Settings' }));
  root.appendChild(t);

  const g = el('div', { class: 'grid2' });

  // monthly won vs lost vs weighted forecast — three separate series, one axis
  const c1 = card('Closed won and lost by month', 'Actual closed value — one axis, no mixed scales');
  const months = [];
  for (let i = 11; i >= 0; i--) { const d = new Date(); d.setUTCDate(1); d.setUTCMonth(d.getUTCMonth() - i); months.push(d.toISOString().slice(0,7)); }
  // Diverging blue<->red, not green/red: green vs red measures CVD dE 4.1 and a
  // deuteranope cannot separate the two lines. Lost is also dashed.
  chartLine(c1.body, [
    { name: 'Won',  color: 'var(--s1)', data: months.map(m => sum(deals.filter(d => isWon(d)  && String(d.closeDate||'').slice(0,7) === m), d => d.amount)) },
    { name: 'Lost', color: 'var(--s8)', dash: '5 4',
      data: months.map(m => sum(deals.filter(d => isLost(d) && String(d.closeDate||'').slice(0,7) === m), d => d.amount)) }
  ], months.map(m => MON[+m.slice(5,7)-1]), { xLabel: 'Month', height: 300 });
  c1.node.classList.add('span2'); g.appendChild(c1.node);

  const c2 = card('Open pipeline by stage', `${openD.length} open deals`);
  chartFunnel(c2.body, openStages().map(s => {
    const ds = openD.filter(d => d.stageId === s.id);
    return { id: s.id, label: s.label, count: ds.length, value: sum(ds, d => d.amount) };
  }));
  g.appendChild(c2.node);

  const c3 = card('Reasons for losing', `${lost.length} deals lost in ${b.label}`);
  const lr = Array.from(groupBy(lost, d => (d.lossReason || '').trim() || 'Not recorded'),
    ([k, v]) => ({ label: k, value: sum(v, d => d.amount) })).sort((x,y) => y.value - x.value).slice(0, 8);
  chartDonut(c3.body, lr, { centerLbl: 'lost value', xLabel: 'Loss reason' });
  const unrec = lost.filter(d => !d.lossReason).length;
  if (unrec) c3.body.appendChild(el('p', { style: 'margin:12px 0 0;font-size:var(--fs-sm);color:var(--ink-3);line-height:1.55',
    html: `${unrec} of ${lost.length} lost deals carry no reason. Nothing was recorded in HubSpot, so this chart only becomes useful once reps pick a reason at the point of losing — the Mark lost dialog now requires one.` }));
  g.appendChild(c3.node);

  const c4 = card('Weighted forecast by close month', 'Open deals only');
  const fm = [];
  for (let i = 0; i <= 8; i++) { const d = new Date(); d.setUTCDate(1); d.setUTCMonth(d.getUTCMonth() + i); fm.push(d.toISOString().slice(0,7)); }
  chartBar(c4.body, fm.map(m => {
    const ds = openD.filter(d => String(d.closeDate||'').slice(0,7) === m);
    return { label: fdate(m + '-01','month'), short: MON[+m.slice(5,7)-1], value: Math.round(sum(ds, weighted)),
             note: `${ds.length} deals` };
  }), { yLabel: 'Weighted ' + CFG.currency, xLabel: 'Month' });
  g.appendChild(c4.node);

  const c5 = card('Deal value distribution', 'Where the pipeline value actually sits');
  const bands = [[0,25000,'< 25k'],[25000,100000,'25k–100k'],[100000,250000,'100k–250k'],
                 [250000,1000000,'250k–1M'],[1000000,Infinity,'1M+']];
  chartBar(c5.body, bands.map(([lo, hi, lbl]) => {
    const ds = openD.filter(d => (d.amount || 0) >= lo && (d.amount || 0) < hi);
    return { label: lbl, value: ds.length, note: `${CFG.currency} ${money(sum(ds, d => d.amount), {compact:true})} of pipeline` };
  }), { fmt: v => String(v), yLabel: 'Deals', xLabel: 'Value band', color: 'var(--s1)' });
  g.appendChild(c5.node);
  root.appendChild(g);

  // rep comparison table
  const rc = el('div', { class: 'card', style: 'margin-top:var(--sp-3)' });
  rc.appendChild(el('h3', { text: 'Rep comparison' }));
  rc.appendChild(el('p', { class: 'sub', text: `Closed in ${b.label}; pipeline is current` }));
  const rows = activeOwners().map(o => {
    const mine = ownedDeals(o.id);
    const op = mine.filter(isOpen);
    const w = mine.filter(d => isWon(d) && inPeriod(d.closeDate, b));
    const l = mine.filter(d => isLost(d) && inPeriod(d.closeDate, b));
    const tg = repTarget(o.id, b);
    const cycles = w.filter(d => d.createdAt && d.closeDate).map(d => days(d.closeDate, d.createdAt)).filter(x => x > 0);
    return { o, open: op.length, pipe: sum(op, d => d.amount), wt: sum(op, weighted),
      won: sum(w, d => d.amount), wonN: w.length, lostN: l.length, target: tg,
      cycle: cycles.length ? Math.round(sum(cycles) / cycles.length) : null };
  });
  const host = el('div'); rc.appendChild(host);
  dataTable(host, {
    key: 'repcmp', noun: 'reps', rows, per: 30, defaultSort: 4, defaultDir: -1,
    cols: [
      { h: 'Rep', v: r => r.o.name, r: r => ownerCell(r.o.id) },
      { h: 'Open', num: true, v: r => r.open },
      { h: 'Pipeline', num: true, v: r => r.pipe, r: r => `<span class="mono">${money(r.pipe)}</span>` },
      { h: 'Weighted', num: true, v: r => r.wt, r: r => `<span class="mono" style="color:var(--ink-2)">${money(r.wt)}</span>` },
      { h: 'Won', num: true, v: r => r.won, r: r => `<span class="mono" style="color:var(--good-ink)">${money(r.won)}</span><div class="cellsub">${r.wonN} deals</div>` },
      { h: 'Win rate', num: true, v: r => (r.wonN + r.lostN) ? r.wonN / (r.wonN + r.lostN) : 0,
        r: r => (r.wonN + r.lostN) ? pct(r.wonN, r.wonN + r.lostN) + '%' : '—' },
      { h: 'vs target', num: true, v: r => r.target ? r.won / r.target : 0, r: r => {
          if (!r.target) return '<span class="cellsub">no target</span>';
          const p = pct(r.won, r.target);
          return `<span class="tag ${p >= 100 ? 'good' : p >= 60 ? 'warn' : 'bad'}">${p}%</span>`;
        } },
      { h: 'Avg cycle', num: true, v: r => r.cycle || 0, r: r => r.cycle ? r.cycle + ' d' : '<span class="cellsub">—</span>' }
    ],
    onRow: r => { VIEW.rep = r.o.id; renderTopControls(); go('dashboard'); }
  });
  root.appendChild(rc);
}

/* What a person still holds, so removing them is an informed decision. */
function ownerHoldings(id) {
  const sid = String(id);
  return {
    deals:     live('deals').filter(d => String(d.ownerId) === sid),
    collabs:   live('deals').filter(d => collabsOf(d).some(x => String(x) === sid)),
    contacts:  live('contacts').filter(c => String(c.ownerId) === sid),
    companies: live('companies').filter(c => String(c.ownerId) === sid),
    tasks:     live('tasks').filter(t => String(t.ownerId) === sid && t.status !== 'done')
  };
}
function reassignFrom(ids, toId) {
  const set = new Set(ids.map(String));
  let n = 0;
  batch(() => {
  live('deals').forEach(d => {
    let touched = false;
    if (set.has(String(d.ownerId))) { d.ownerId = toId; touched = true; }
    const cs = collabsOf(d).filter(x => !set.has(String(x)));
    if (cs.length !== collabsOf(d).length) { d.collaboratorIds = cs; d.collaboratorId = null; touched = true; }
    if (touched) { upsert('deals', d); n++; }
  });
  ['contacts','companies','tasks'].forEach(shard => {
    live(shard).forEach(r => {
      if (!set.has(String(r.ownerId))) return;
      r.ownerId = toId; upsert(shard, r); n++;
    });
  });
  });
  return n;
}

const NORM = s => String(s || '').toLowerCase().replace(/[^a-z0-9]/g, '');
function pick(row, hdr, names) {
  for (const n of names) {
    const i = hdr.indexOf(NORM(n));
    if (i >= 0 && String(row[i]).trim() !== '') return String(row[i]).trim();
  }
  return null;
}
function importCSV(kind, rows) {
  if (rows.length < 2) throw new Error('that file has no data rows');
  const hdr = rows[0].map(NORM);
  const data = rows.slice(1);
  let added = 0, updated = 0;
  const numOf = v => { if (v == null) return null; const n = Number(String(v).replace(/[^0-9.\-]/g,'')); return isNaN(n) ? null : n; };
  const dateOf = v => {
    if (!v) return null;
    const s = String(v).trim();
    if (/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0,10);
    const d = new Date(s);
    return isNaN(d) ? null : d.toISOString().slice(0,10);
  };
  const ownerOf = v => {
    if (!v) return null;
    const s = String(v).trim().toLowerCase();
    const o = DB.owners.find(x => x.id === s || (x.email || '').toLowerCase() === s || x.name.toLowerCase() === s);
    return o ? o.id : null;
  };
  data.forEach(r => {
    if (kind === 'companies') {
      const hsid = pick(r, hdr, ['record id','hubspot id','companyid','id']);
      const name = pick(r, hdr, ['company name','name','company']);
      if (!name && !hsid) return;
      let c = (hsid && live('companies').find(x => x.hubspotId === hsid)) ||
              live('companies').find(x => NORM(x.name) === NORM(name));
      const patch = {
        name: name || (c && c.name), hubspotId: hsid || (c && c.hubspotId) || null,
        domain: pick(r, hdr, ['company domain name','domain','website']) || (c && c.domain) || null,
        phone: pick(r, hdr, ['phone number','phone']) || (c && c.phone) || null,
        city: pick(r, hdr, ['city']) || (c && c.city) || null,
        country: pick(r, hdr, ['country/region','country']) || (c && c.country) || null,
        industry: pick(r, hdr, ['industry']) || (c && c.industry) || null,
        lifecycleStage: pick(r, hdr, ['lifecycle stage','lifecyclestage']) || (c && c.lifecycleStage) || null,
        ownerId: ownerOf(pick(r, hdr, ['company owner','owner','hubspot owner id'])) || (c && c.ownerId) || null,
        createdAt: dateOf(pick(r, hdr, ['create date','created'])) || (c && c.createdAt) || TODAY()
      };
      if (c) { upsert('companies', Object.assign(c, patch)); updated++; }
      else { upsert('companies', patch); added++; }
    }
    if (kind === 'contacts') {
      const hsid = pick(r, hdr, ['record id','hubspot id','contactid','id']);
      const email = pick(r, hdr, ['email','email address']);
      const fn = pick(r, hdr, ['first name','firstname']);
      const ln = pick(r, hdr, ['last name','lastname']);
      const full = pick(r, hdr, ['name','full name','contact']) || [fn, ln].filter(Boolean).join(' ');
      if (!email && !full && !hsid) return;
      let c = (hsid && live('contacts').find(x => x.hubspotId === hsid)) ||
              (email && live('contacts').find(x => (x.email || '').toLowerCase() === email.toLowerCase()));
      const coName = pick(r, hdr, ['company name','associated company','company']);
      const co = coName ? live('companies').find(x => NORM(x.name) === NORM(coName)) : null;
      const patch = {
        hubspotId: hsid || (c && c.hubspotId) || null,
        firstName: fn || (c && c.firstName) || null, lastName: ln || (c && c.lastName) || null,
        fullName: full || (c && c.fullName) || email,
        email: email || (c && c.email) || null,
        phone: pick(r, hdr, ['phone number','phone','mobile phone number']) || (c && c.phone) || null,
        jobTitle: pick(r, hdr, ['job title','jobtitle','title']) || (c && c.jobTitle) || null,
        city: pick(r, hdr, ['city']) || (c && c.city) || null,
        country: pick(r, hdr, ['country/region','country']) || (c && c.country) || null,
        lifecycleStage: pick(r, hdr, ['lifecycle stage','lifecyclestage']) || (c && c.lifecycleStage) || null,
        leadStatus: pick(r, hdr, ['lead status','hs lead status']) || (c && c.leadStatus) || null,
        ownerId: ownerOf(pick(r, hdr, ['contact owner','owner','hubspot owner id'])) || (c && c.ownerId) || null,
        companyId: (co && co.id) || (c && c.companyId) || null,
        createdAt: dateOf(pick(r, hdr, ['create date','created'])) || (c && c.createdAt) || TODAY(),
        dealIds: (c && c.dealIds) || []
      };
      if (c) { upsert('contacts', Object.assign(c, patch)); updated++; }
      else { upsert('contacts', patch); added++; }
    }
    if (kind === 'deals') {
      const hsid = pick(r, hdr, ['record id','hubspot id','dealid','id']);
      const name = pick(r, hdr, ['deal name','name','deal']);
      if (!name && !hsid) return;
      let d = (hsid && live('deals').find(x => x.hubspotId === hsid)) ||
              live('deals').find(x => NORM(x.name) === NORM(name));
      const stLbl = pick(r, hdr, ['deal stage','stage','dealstage']);
      const st = stLbl ? (DB.stages.find(s => NORM(s.label) === NORM(stLbl)) ||
                          DB.stages.find(s => NORM(s.id) === NORM(stLbl))) : null;
      const coName = pick(r, hdr, ['associated company','company name','company']);
      const co = coName ? live('companies').find(x => NORM(x.name) === NORM(coName)) : null;
      const patch = {
        hubspotId: hsid || (d && d.hubspotId) || null,
        name: name || (d && d.name),
        stageId: (st && st.id) || (d && d.stageId) || (openStages()[0] || {}).id,
        amount: numOf(pick(r, hdr, ['amount','amount in company currency','deal amount','value'])) ?? (d ? d.amount : null),
        currency: CFG.currency,
        closeDate: dateOf(pick(r, hdr, ['close date','closedate'])) || (d && d.closeDate) || null,
        createdAt: dateOf(pick(r, hdr, ['create date','created'])) || (d && d.createdAt) || TODAY(),
        ownerId: ownerOf(pick(r, hdr, ['deal owner','owner','hubspot owner id'])) || (d && d.ownerId) || null,
        dealType: pick(r, hdr, ['deal type','dealtype','type']) || (d && d.dealType) || null,
        priority: (pick(r, hdr, ['priority']) || (d && d.priority) || '').toLowerCase() || null,
        lossReason: pick(r, hdr, ['closed lost reason','loss reason']) || (d && d.lossReason) || null,
        nextStep: pick(r, hdr, ['next step','next activity']) || (d && d.nextStep) || null,
        companyId: (co && co.id) || (d && d.companyId) || null,
        contactIds: (d && d.contactIds) || [], notes: (d && d.notes) || []
      };
      if (d) { upsert('deals', Object.assign(d, patch)); updated++; }
      else { upsert('deals', patch); added++; }
    }
  });
  reindex();
  return { added, updated };
}

  } finally { rendering = false; }
}

/* ---------------------------------------------------------- theme */
function setTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  DB.config.theme = t;
  try { localStorage.setItem(CFG.cacheKey + '.theme', t); } catch (e) {}
  if ($('#app').classList.contains('on')) render();
}

/* ------------------------------------------------------------ boot */
async function boot() {
  $('#gate').style.display = 'none';
  $('#app').classList.add('on');

  const cached = loadLocal();
  if (SYNC.mode === 'onedrive') {
    await syncNow({ quiet: true });
  }
  // nothing anywhere yet → try the seed file shipped beside this page
  if (!live('deals').length && !live('companies').length && !live('contacts').length) {
    const ok = await trySeedFile();
    if (!ok) firstRun();
  }
  if (!DB.stages.length) { DB.stages = DEFAULT_STAGES.slice(); rebuildStages(); }
  if (!DB.lossReasons || !DB.lossReasons.length) DB.lossReasons = DEFAULT_LOSS.slice();
  if (!DB.owners.length && AUTH.user) {
    DB.owners = [{ id: uid('O'), name: AUTH.user.name || AUTH.user.username, email: AUTH.user.username,
      active: true, role: 'admin', initials: initials(AUTH.user.name || AUTH.user.username) }];
    touch('config');
  }
  reindex(); rebuildStages();
  runMigrations();
  VIEW.name = (location.hash.replace('#','') || 'dashboard');
  render();
  if (SYNC.mode === 'onedrive' && SYNC.dirty.size) scheduleSync();
}
/* One-shot data migrations, safe to run on every load. */
function runMigrations() {
  return batch(() => runMigrationsInner());
}
function runMigrationsInner() {
  // single collaborator -> list
  let c = 0;
  DB.deals.forEach(d => {
    if (d._del) return;
    if (!Array.isArray(d.collaboratorIds)) {
      d.collaboratorIds = d.collaboratorId ? [String(d.collaboratorId)] : [];
      if (d.collaboratorId) { d.collaboratorId = null; c++; }
    }
  });
  if (c) SYNC.dirty.add('deals');
  // HubSpot lead statuses -> the four stages
  const lead = migrateLeadStatus();
  if (lead.changed) {
    console.log(`Lead status migrated on ${lead.changed} contacts` +
      (lead.unmapped ? `, ${lead.unmapped} left unmapped for review` : ''));
  }
  if (c || lead.changed) { saveLocal(); scheduleSync(); }
}
const DEFAULT_STAGES = [
  { id: 'bd',       label: 'Business Development',       probability: .10, kind: 'open', order: 1 },
  { id: 'cold',     label: 'Cold Lead',                  probability: .05, kind: 'open', order: 2 },
  { id: 'referral', label: 'Channels & Referrals',       probability: .05, kind: 'open', order: 3 },
  { id: 'discover', label: 'Discovery & Identify',       probability: .20, kind: 'open', order: 4 },
  { id: 'demo',     label: 'Qualified & Demo Completed', probability: .40, kind: 'open', order: 5 },
  { id: 'proposal', label: 'Proposal Submitted',         probability: .60, kind: 'open', order: 6 },
  { id: 'commit',   label: 'Committed',                  probability: .90, kind: 'open', order: 7 },
  { id: 'won',      label: 'Closed Won',                 probability: 1,   kind: 'won',  order: 8 },
  { id: 'lost',     label: 'Closed Lost',                probability: 0,   kind: 'lost', order: 9 }
];
const DEFAULT_LOSS = ['Price too high','No budget','Lost to competitor','No response',
  'Timing / postponed','Not a fit','Chose alternative solution','Project cancelled','Unqualified','Other'];

async function trySeedFile() {
  try {
    const r = await fetch('corev-crm-seed.json', { cache: 'no-store' });
    if (!r.ok) return false;
    const seed = await r.json();
    if (!seed || !Array.isArray(seed.deals)) return false;
    applySeed(seed);
    toast(`Loaded ${seed.deals.length} deals, ${(seed.companies||[]).length} companies and ${(seed.contacts||[]).length} contacts from the migration file`, 'ok');
    return true;
  } catch (e) { return false; }
}
function firstRun() {
  DB.stages = DEFAULT_STAGES.slice();
  DB.lossReasons = DEFAULT_LOSS.slice();
  rebuildStages();
  setTimeout(() => {
    modal('Welcome to CoreV CRM', el('div', {}, [
      el('p', { style: 'margin:0 0 var(--sp-4);line-height:1.65;color:var(--ink-2)',
        html: 'There is no data here yet. You can bring your HubSpot records in, or start from scratch — the CoreV sales stages are already set up.' }),
      el('div', { class: 'card' }, [
        el('h3', { text: 'Bring data in' }),
        el('p', { class: 'sub', style: 'margin:6px 0 12px',
          text: 'Import the migration backup, or a HubSpot CSV export of companies, contacts and deals.' }),
        el('button', { class: 'btn primary', text: 'Open import', onclick: () => { closeAll(); importDialog(); } })
      ]),
      el('div', { class: 'card', style: 'margin-top:var(--sp-3)' }, [
        el('h3', { text: 'Start clean' }),
        el('p', { class: 'sub', style: 'margin:6px 0 12px',
          text: 'Add your team in Settings, then create your first deal.' }),
        el('button', { class: 'btn', text: 'Go to Settings', onclick: () => { closeAll(); go('settings'); } })
      ])
    ]));
  }, 400);
}

/* --------------------------------------------------------- wiring */
$('#signin').addEventListener('click', signIn);
$('#demo-mode').addEventListener('click', () => { SYNC.mode = 'local'; boot(); });
$('#hamb').addEventListener('click', () => $('#nav').classList.toggle('open'));
$('#newbtn').addEventListener('click', newMenu);
$('#themebtn').addEventListener('click', () =>
  setTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'));
$('#repfilter').addEventListener('change', e => { VIEW.rep = e.target.value; VIEW.page = {}; render(); });
$('#q').addEventListener('input', doSearch);
$('#q').addEventListener('focus', doSearch);
$('#q').addEventListener('blur', () => setTimeout(() => $('#qres').classList.remove('on'), 200));
document.addEventListener('click', e => {
  const a = e.target.closest('nav.side a');
  if (a) { e.preventDefault(); go(a.getAttribute('href').replace('#','')); }
});

/* version stamp: gate card, console, and the tab title */
(function stampVersion() {
  const g = $('#gate-ver');
  if (g) g.textContent = `CoreV CRM v${CFG.version} · ${fdate(CFG.released, 'long')}`;
  console.log(`%cCoreV CRM v${CFG.version}`, 'font-weight:700', '· released ' + CFG.released);
})();

/* restore theme before anything paints */
try {
  const t = localStorage.getItem(CFG.cacheKey + '.theme');
  if (t) document.documentElement.setAttribute('data-theme', t);
} catch (e) {}

/* an existing MSAL session signs in silently */
(async () => {
  try {
    if (!localStorage.getItem('msal.account.keys')) return;
    if (!(await loadMsal())) return;
    AUTH.msal = new msal.PublicClientApplication({
      auth: { clientId: CFG.clientId, authority: CFG.authority, redirectUri: location.href.split('#')[0].split('?')[0] },
      cache: { cacheLocation: 'localStorage' }
    });
    await AUTH.msal.initialize();
    const acct = AUTH.msal.getAllAccounts()[0];
    if (!acct) return;
    AUTH.msal.setActiveAccount(acct);
    AUTH.user = acct;
    await getToken();
    SYNC.mode = 'onedrive';
    boot();
  } catch (e) { /* fall through to the sign-in gate */ }
})();
</script>
